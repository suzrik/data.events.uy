name: Salidas grupales Bici Club Uruguayo
sport: road
city: Montevideo
venue: Pista de patinaje El Cuadrado, Parque Rodó
days: [thu]
time: "18:00"
links:
  site: https://bicicluburuguayo.com/
  instagram: https://www.instagram.com/bicicluburuguayo/
description:
  es: Salida grupal de todos los jueves que organiza Bici Club Uruguayo, un alquiler de bicicletas de Montevideo. Es gratuita y abierta a todos, con nivel de actividad física bajo, pensada para pedalear acompañado y conocer gente. Quien no tiene bici puede alquilar una al club. Con lluvia puede pasar a otro día. El club publica la información de cada salida en el canal de difusión de su Instagram, así que conviene confirmar ahí antes de ir.
  en: Group ride held every Thursday by Bici Club Uruguayo, a bike rental business in Montevideo. It is free and open to everyone, with a low level of physical effort, meant for riding in company and meeting people. If you have no bike you can rent one from the club. In rain it may move to another day. The club posts the details of each ride in the broadcast channel of its Instagram, so confirm there before going.
