description:
  es: Grupo de ciclismo de la Asociación Española, parte de sus actividades deportivas abiertas y gratuitas para socios y no socios, guiadas por profesores de Educación Física de la institución. Sale los sábados a las 9:00. El Sofitel Carrasco es un punto de encuentro temporal, hasta nuevo aviso, así que conviene confirmar el lugar en la página de la Asociación antes de ir.
  en: Cycling group of Asociación Española, part of its sports activities that are open and free for members and non-members, led by the institution's physical education teachers. It rides on Saturdays at 9:00. Sofitel Carrasco is a temporary meeting point, until further notice, so confirm the place on the Asociación's page before going.
