description:
  es: Salida grupal de ruta que parte todos los sábados a las 7:30 de la tienda Trek Punta Carretas. El ritmo es tranquilo para un grupo de ruta, de unos 28-30 km/h de promedio. Hace falta bicicleta de ruta, porque con una de montaña o una urbana cuesta seguir al grupo. Participan muchos principiantes y el grupo espera a quienes se quedan atrás.
  en: Road group ride that leaves every Saturday at 7:30 from the Trek Punta Carretas shop. The pace is easy for a road group, about 28-30 km/h on average. A road bike is needed, as the group is hard to follow on a mountain bike or a city bike. Many beginners take part and the group waits for riders who fall behind.
