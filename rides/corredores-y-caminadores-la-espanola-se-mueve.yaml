description:
  es: Grupo de corredores y caminadores de la Asociación Española, parte de sus actividades deportivas abiertas y gratuitas para socios y no socios, guiadas por profesores de Educación Física de la institución. Se reúne lunes, martes y jueves a las 18:30 en Parque Batlle, en el cantero de Ricaldoni y Soca. La página de la Asociación publica los horarios y lugares vigentes.
  en: Runners and walkers group of Asociación Española, part of its sports activities that are open and free for members and non-members, led by the institution's physical education teachers. It meets on Mondays, Tuesdays and Thursdays at 18:30 in Parque Batlle, on the median at Ricaldoni and Soca. The Asociación's page publishes the current times and places.
