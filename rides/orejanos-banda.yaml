description:
  es: Grupo de ciclistas aficionados de Montevideo. Salidas recreativas de ruta los lunes y jueves a las 18:45 desde la tienda de bicicletas KØM. Sus publicaciones de 2026 muestran salidas sociales nocturnas, con luces, hacia Salinas o Marindia, con el pelotón rodando parejo y sin dejar a nadie atrás. El grupo tiene un club en Strava, al que se entra con solicitud. Conviene mirar su Instagram antes de ir.
  en: Group of amateur cyclists from Montevideo. Recreational road rides on Mondays and Thursdays at 18:45 from the KØM bike shop. Their 2026 posts show social night rides, with lights, towards Salinas or Marindia, with the bunch riding at an even pace and nobody left behind. The group has a Strava club, which you join by request. It is worth checking their Instagram before going.
