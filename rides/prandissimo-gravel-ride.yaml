name: Prandissimo Gravel Ride
sport: gravel
city: La Barra
venue: Prandissimo Café Ciclista, Av. del Cerro Eguzquiza y Ruta 10
days: [sun]
week: 3
time: "08:30"
links:
  site: https://www.prandissimo.com/salidas
  instagram: https://www.instagram.com/prandissimo/
description:
  es: Salida de gravel que Prandissimo Café Ciclista, bicicletería y cafetería de La Barra, organiza el tercer domingo de cada mes con el apoyo de Specialized. Sale a las 8:30 en punto y está prevista hasta las 12:30. La inscripción es gratuita y se hace en el sitio, que tiene una página por fecha. Quien no tiene bici de gravel puede alquilar una en el local.
  en: Gravel ride that Prandissimo Café Ciclista, a bike shop and café in La Barra, holds on the third Sunday of every month with the support of Specialized. It leaves at 8:30 sharp and is scheduled until 12:30. Registration is free and is done on the site, which has a page for each date. If you have no gravel bike you can rent one at the shop.
