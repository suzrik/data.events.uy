description:
  es: "Edición 18 de la Vuelta al Iporá, carrera de mountain bike en Tacuarembó, corrida el domingo 17 de mayo de 2026 con largada a las 9:00 desde la Chacra Flaco Fierro. Hubo 65 km para elite y máster A, B y C de caballeros y 40 km para menores, promocionales, máster D y las categorías de damas, con categorías del Fronterón y duplas; la inscripción costaba $850. Crono MTB, que cronometró, publicó los resultados."
  en: "18th edition of the Vuelta al Iporá, a mountain bike race in Tacuarembó, held on Sunday 17 May 2026, starting at 9:00 from Chacra Flaco Fierro. There were 65 km for men's elite and masters A, B and C, and 40 km for youth, promotional, masters D and the women's categories, with Fronterón categories and pairs; entry cost $850. Crono MTB, which did the timing, published the results."
