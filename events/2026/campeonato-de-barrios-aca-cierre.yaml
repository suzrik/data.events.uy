description:
  es: Última fecha del Campeonato de Barrios de la Agrupación de Corredores de Artigas, que tuvo 11 fechas en 2026. Según la publicación de ACA del 12 de octubre, es una 3K participativa el domingo 8 de noviembre a las 9:00, en la sede de ACA en el Cerro Mirador; la inscripción cuesta $200. Ese día se entregan los premios del campeonato.
  en: Final date of the Campeonato de Barrios of the Agrupación de Corredores de Artigas, which had 11 rounds in 2026. According to ACA's post of 12 October, it is a non-competitive 3K on Sunday 8 November at 9:00, at the ACA headquarters on Cerro Mirador; registration costs $200. The championship prizes are handed out that day.
