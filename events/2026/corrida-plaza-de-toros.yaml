description:
  es: Carrera de calle por la rambla de Colonia del Sacramento, junto a la Plaza de Toros del Real de San Carlos, corrida el sábado 14 de marzo de 2026. La 5K fue participativa y la 10K, la quinta fecha del campeonato de la CAU, con premios en efectivo del 1.º al 3.º puesto. Encarrera tuvo la inscripción y publicó los resultados.
  en: Road race along the Colonia del Sacramento waterfront, by the Real de San Carlos bullring, held on Saturday 14 March 2026. The 5K was participative and the 10K was the fifth round of the CAU championship, with cash prizes for the top three. Encarrera handled registration and published the results.
