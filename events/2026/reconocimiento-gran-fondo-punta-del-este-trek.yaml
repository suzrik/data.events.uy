  es: Salida de reconocimiento del recorrido del Tour Uruguay Gran Fondo Punta del Este del 6 de diciembre, que organiza la tienda Trek Punta del Este. Totalmente gratuita, con guías para diferentes niveles, apoyo vehicular mecánico y descuentos exclusivos para la carrera. El encuentro es a las 8:00 en la tienda. El recorrido no está publicado.
  en: Reconnaissance ride of the course of the Tour Uruguay Gran Fondo Punta del Este of 6 December, run by the Trek Punta del Este shop. Free of charge, with guides for different levels, mechanical support vehicle and exclusive discounts for the race. The meeting point is the shop at 8:00. The route is not published.
