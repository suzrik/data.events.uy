name: Reconocimiento Gran Fondo Punta del Este
date: 2026-11-08
sport: road
city: Punta del Este
organizer: Trek Punta del Este
links:
  instagram: https://www.instagram.com/trekpuntadeleste/
description:
  es: Salida de reconocimiento de cara al Tour Uruguay Gran Fondo Punta del Este del 6 de diciembre, que organiza la tienda Trek Punta del Este. Según su historia de Instagram del 21 de octubre, es el domingo 8 de noviembre, sin costo, con descuentos exclusivos para la carrera. Punto de salida, horario, recorrido y forma de anotarse sin publicar.
  en: Course reconnaissance ride ahead of the Tour Uruguay Gran Fondo Punta del Este of 6 December, run by the Trek Punta del Este shop. According to its Instagram story of 21 October, it is on Sunday 8 November, free of charge, with exclusive discounts for the race. Start point, time, route and how to sign up not published.
