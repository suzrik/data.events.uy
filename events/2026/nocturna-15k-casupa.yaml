description:
  es: Carrera nocturna en Casupá, Florida, el sábado 12 de diciembre, con largada a las 21:00. Hay 15K y 5K; la inscripción cuesta $950 y $550 y se hace en lolograste.uy. Organiza Legión Entrena, que no tiene página propia. El mapa de la plataforma ubica la largada en la plaza de Casupá, y la remera del evento lleva el logo del Municipio de Casupá.
  en: Night race in Casupá, Florida, on Saturday 12 December, starting at 21:00. There are 15K and 5K; registration costs $950 and $550 and is on lolograste.uy. It is organized by Legión Entrena, which has no page of its own. The platform's map places the start at the Casupá town square, and the event shirt carries the logo of the Municipio de Casupá.
