description:
  es: "Segunda edición del Trail Running Iporá, corrida el domingo 15 de febrero de 2026 en el Balneario Iporá, Tacuarembó, con largada a las 9:00. Hubo 10K y 5K por categorías, premio al mejor disfraz y participación gratuita para los niños; la inscripción costaba $600. Crono MTB, que cronometró, publicó los resultados."
  en: "Second edition of the Trail Running Iporá, held on Sunday 15 February 2026 at Balneario Iporá, Tacuarembó, starting at 9:00. There were 10K and 5K by category, a prize for the best costume and free entry for children; entry cost $600. Crono MTB, which did the timing, published the results."
