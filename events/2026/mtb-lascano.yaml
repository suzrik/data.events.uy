description:
  es: Cuarta edición de esta carrera de MTB en Lascano, Rocha, el domingo 25 de octubre, anunciada con trillos nuevos. Hay 50 km (élite, damas A y B y máster A a C), 30 km (promocionales, damas C y máster D y E) y una participativa de 15 km. La inscripción se hace en la web de Cronometra Mauá. La hora de largada y el costo todavía no están publicados.
  en: Fourth edition of this MTB race in Lascano, Rocha, on Sunday 25 October, announced with new trails. There are 50 km (elite, women A and B and Master A to C), 30 km (promotional, women C and Master D and E) and a 15 km participatory ride. Registration is on the Cronometra Mauá website. The start time and the price are not published yet.
