name: Correcaminata del Municipio de Barros Blancos
date: 2026-10-11
sport: run
city: Barros Blancos
venue: Polideportivo Las Palmas
links:
  instagram: https://www.instagram.com/municipio_barrosblancos/
description:
  es: Correcaminata organizada por el Municipio de Barros Blancos, en Canelones, el domingo 11 de octubre a las 10:15, desde el Polideportivo Las Palmas hasta la Plaza Obdulio Varela (Plaza República). Según la publicación del municipio del 16 de setiembre, la inscripción fue por formulario web del 28 de setiembre al 2 de octubre; la distancia no está publicada. Consultas al 098 662 442.
  en: Run and walk organized by the Municipio de Barros Blancos, in Canelones, on Sunday 11 October at 10:15, from the Polideportivo Las Palmas to Plaza Obdulio Varela (Plaza República). According to the municipality's post of 16 September, registration was by web form from 28 September to 2 October; the distance is not published. Enquiries at 098 662 442.
