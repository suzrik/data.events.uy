description:
  es: Duatlón rural en Pueblo Cufré, Colonia, el domingo 6 de diciembre con largada a las 9:00. Combina 7 km de trail running y 25 km de MTB. Se corre de forma individual o en duplas femeninas, masculinas o mixtas, con categorías por edad; en duplas la categoría sale de la suma de las edades. Organizan Valdense Deportivos y Tarariras Sports. Algunas páginas todavía muestran el 22 de noviembre; el portal de inscripciones y su formulario indican el 6 de diciembre.
  en: Off-road duathlon in Pueblo Cufré, Colonia, on Sunday 6 December, starting at 9:00. It combines 7 km of trail running and 25 km of MTB. You can race solo or in women's, men's or mixed pairs, with age categories; for pairs the category comes from the sum of both ages. Organized by Valdense Deportivos and Tarariras Sports. Some pages still show 22 November; the registration portal and its form say 6 December.
