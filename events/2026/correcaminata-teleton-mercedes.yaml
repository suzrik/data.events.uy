description:
  es: Cuarta edición de la correcaminata a beneficio de Teletón en Mercedes, el domingo 8 de noviembre de 2026 a las 9:30 desde la Plaza de Deportes de la Rambla. 5 km para adultos y 500 m para niños. La inscripción cuesta $500 con remera y se paga en Abitab, colectivo 141219 («Caminata Teletón Mercedes 2026»); la remera se retira en Klüver Transporte y Logística, Tomás Gómez 481, con el comprobante. Habrá animación, castillos inflables y cierre musical.
  en: Fourth edition of the fun run for Teletón in Mercedes, on Sunday 8 November 2026 at 9:30 from the Plaza de Deportes on the Rambla. 5 km for adults and 500 m for children. Entry costs $500 with a shirt and is paid at Abitab, collection 141219 ("Caminata Teletón Mercedes 2026"); shirts are collected at Klüver Transporte y Logística, Tomás Gómez 481, with the receipt. Entertainment, bouncy castles and live music at the end.
