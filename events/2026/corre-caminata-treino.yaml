  en: A 3K and 5K run-walk by the Treino training centre in Parque Rodó, Montevideo, on Saturday 5 December. The warm-up is at 8:30 and the start at 9:00. Registration includes a personalised T-shirt and a medal and is done by phone on 098 951 591; the price is not published.
