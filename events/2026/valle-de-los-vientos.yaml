description:
  es: Quinta edición de Valle de los Vientos, trail de Toros Eventos Deportivos en la Sierra de los Caracoles, cerca de San Carlos (Maldonado), corrida el domingo 12 de abril de 2026. Hubo 8, 15 y 25 km, con unos 1.050 metros de desnivel positivo en la distancia mayor, por sierras, empedrados y molinos. La página de la carrera da la edición y el lugar; Encarrera publicó los resultados con esa fecha.
  en: Fifth edition of Valle de los Vientos, a trail race by Toros Eventos Deportivos in the Sierra de los Caracoles, near San Carlos (Maldonado), held on Sunday 12 April 2026. There were 8, 15 and 25 km, with about 1,050 m of climbing on the longest, over hills, stone tracks and windmills. The race page gives the edition and the place; Encarrera published the results under that date.
