description:
  es: Tercera edición de Rural Bike Libertad, carrera de MTB anunciada para el domingo 20 de setiembre de 2026 en la Sociedad Criolla El Cencerro, Libertad, San José, con largada a las 10:00 y kits de 8:00 a 9:45. Recorridos de 48 km y 24 km, categorías competitivas (élite, máster A a D, damas A a C) y promocionales, y premios del 1.º al 5.º puesto por categoría. No encontramos resultados publicados, así que no consta que se haya corrido.
  en: Third edition of Rural Bike Libertad, an MTB race announced for Sunday 20 September 2026 at the Sociedad Criolla El Cencerro, Libertad, San José, starting at 10:00 with kit pickup from 8:00 to 9:45. Courses of 48 km and 24 km, competitive categories (elite, Master A to D, women's A to C) and promotional ones, and prizes for 1st to 5th place in each category. We found no published results, so there is no record that it was held.
