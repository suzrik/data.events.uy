description:
  es: Cuarta edición de esta carrera de MTB en Durazno, con largada a las 9:00 en el Parque de la Hispanidad (ruta 5). Hay una competitiva de 56 km y una promocional de 25 km, con premiación del 1.º al 5.º puesto por categoría. Organiza Zorros del Camino y cronometra Encarrera.uy.
  en: Fourth edition of this MTB race in Durazno, starting at 9:00 at Parque de la Hispanidad (Route 5). There is a 56 km competitive course and a 25 km promotional one, with prizes for 1st to 5th place in each category. Organized by Zorros del Camino and timed by Encarrera.uy.
