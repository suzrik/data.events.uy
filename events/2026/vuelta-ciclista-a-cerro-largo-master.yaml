description:
  es: Cancelado; la Federación Ciclista Uruguaya retiró la carrera de su calendario y su página ya no existe, sin comunicado. En las mismas fechas se corre en Melo el Campeonato Nacional Máster. Era una carrera por etapas de tres días en Melo para las categorías Máster A a E (hombres), anunciada como primera edición.
  en: Cancelled; the Uruguayan Cycling Federation removed the race from its calendar and its page no longer exists, with no statement. The Campeonato Nacional Máster is held in Melo on the same dates. It was a three-day stage race in Melo for the men's Master A to E categories, announced as the first edition.
