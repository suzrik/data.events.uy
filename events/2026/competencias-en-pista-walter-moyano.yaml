description:
  es: Carreras en la Pista Walter Moyano del calendario regional de la Federación Ciclista Uruguaya, el sábado 12 y el domingo 13 de setiembre en Maldonado, organizadas por la Federación Ciclista de Maldonado. Para ciclistas con licencia, con clasificaciones de junior, sub-23 y élite masculino, femenina, máster A y B, máster C y máster D y E. La FCU las da por finalizadas y publicó la clasificación.
  en: Races at the Pista Walter Moyano on the regional calendar of the Uruguayan Cycling Federation, on Saturday 12 and Sunday 13 September in Maldonado, organized by the Federación Ciclista de Maldonado. For licensed riders, with classifications for men's junior, under-23 and elite, women, master A and B, master C and master D and E. The FCU lists them as finished and published the classification.
