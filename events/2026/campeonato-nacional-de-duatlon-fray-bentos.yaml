description:
  es: Fecha del Campeonato Nacional de Duatlón 2026 de la Unión de Triatlón del Uruguay, anunciada para el domingo 16 de agosto de 2026 en Fray Bentos (Rambla Doctor Ángel Cuervo), con categorías Sprint, Promocional y Postas. Los no federados corrían con licencia por el día, sin sumar puntos. La temporada tuvo fechas en Mercedes, Atlántida, Florida, Durazno, Fray Bentos y Carmelo. No encontramos resultados publicados, así que no consta que se haya corrido.
  en: A date of the 2026 Campeonato Nacional de Duatlón of the Unión de Triatlón del Uruguay, announced for Sunday 16 August 2026 in Fray Bentos (Rambla Doctor Ángel Cuervo), with Sprint, Promocional and relay (Postas) categories. Non-federated athletes could race on a one-day licence without scoring ranking points. The season calendar had dates in Mercedes, Atlántida, Florida, Durazno, Fray Bentos and Carmelo. We found no published results, so there is no record that it was held.
