name: Uniendo los Pueblos de Rivera, etapa 2
date: 2026-05-31
sport: mtb
city: Minas de Corrales
links:
  instagram: https://www.instagram.com/uniendopueblosmtb/
description:
  es: Segunda etapa de Uniendo los Pueblos de Rivera, carrera de MTB por etapas en el departamento; se corrió el domingo 31 de mayo de 2026 en Minas de Corrales («Corrales» en el afiche de la cuarta etapa, que la marca como cumplida). La primera fue en Tranqueras (7 de febrero); después vinieron Vichadero (6 de setiembre) y la final en la ciudad de Rivera (13 de diciembre). La hora, el lugar de largada y las distancias de esta etapa no figuran en lo que publicó el organizador.
  en: Second stage of Uniendo los Pueblos de Rivera, a stage MTB race around the department; it was held on Sunday 31 May 2026 in Minas de Corrales ("Corrales" on the poster of the fourth stage, which marks it as done). The first was in Tranqueras (7 February); Vichadero (6 September) and the final in the city of Rivera (13 December) followed. The start time, start place and distances of this stage are not in what the organizer published.
