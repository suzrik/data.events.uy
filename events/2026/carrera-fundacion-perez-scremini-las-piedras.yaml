description:
  es: Primera edición en Las Piedras de la carrera solidaria de la Fundación Pérez Scremini, que atiende a niños y adolescentes con cáncer. Se corre o se camina 5K o 10K el sábado 10 de octubre de 2026, con largada a las 16 hs desde Las Piedras Shopping y recorrido hacia el Mástil y el Hipódromo de Las Piedras. La inscripción incluye remera oficial y medalla finisher; para retirar el kit hay que presentar la cédula y firmar el deslinde.
  en: First edition in Las Piedras of the charity race of the Pérez Scremini Foundation, which treats children and adolescents with cancer. You can run or walk 5K or 10K on Saturday 10 October 2026, starting at 4 pm from Las Piedras Shopping, with a course towards the Mástil and the Las Piedras racecourse. Registration includes the official shirt and a finisher medal; to collect the kit you must show your ID and sign the waiver.
