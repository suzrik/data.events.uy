description:
  es: "Quinta edición de La Pérgola, carrera de 8 km en Cerro Chato, Treinta y Tres, corrida el sábado 2 de mayo de 2026 con largada a las 16:00 desde la Junta Local. Hubo categorías de edad para damas y caballeros, participación gratuita para los niños y la inscripción costaba $600. Crono MTB, que cronometró, publicó los resultados."
  en: "Fifth edition of La Pérgola, an 8 km race in Cerro Chato, Treinta y Tres, held on Saturday 2 May 2026, starting at 16:00 from the Junta Local. There were age categories for women and men, free entry for children, and entry cost $600. Crono MTB, which did the timing, published the results."
