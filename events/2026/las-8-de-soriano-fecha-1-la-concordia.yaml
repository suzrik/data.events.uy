description:
  es: "Primera fecha de Las 8 de Soriano 2026, campeonato departamental de running, el sábado 24 de enero de 2026 en el balneario La Concordia, Soriano, con largada a las 18:30 desde el Parador Municipal y 10K y 5K por categorías. La inscripción costaba $1000 con remera y $1200 el día de la carrera. Crono MTB, que cronometró, publicó los resultados."
  en: "First round of Las 8 de Soriano 2026, a departmental running championship, on Saturday 24 January 2026 at the La Concordia resort, Soriano, starting at 18:30 from the Parador Municipal, with 10K and 5K by category. Entry cost $1000 with a T-shirt and $1200 on race day. Crono MTB, which did the timing, published the results."
