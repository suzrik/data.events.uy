description:
  es: 9ª edición de esta carrera de formato backyard en Guazuvirá, Canelones, de Ti Len Eventos Deportivos. Cada hora se larga una vuelta de unos 6,7 km, a completar dentro de esa hora, sin límite de vueltas; gana quien queda último en carrera. Es el sábado 17 de octubre de 2026 en el Complejo ATSS, con acreditación desde las 7:30 y largada a las 9:30. Después del 9 de octubre no se toman inscripciones. Ese día el equipo uruguayo compite además en el campeonato satélite por equipos de Big Dog's.
  en: 9th edition of this backyard-format race in Guazuvirá, Canelones, organized by Ti Len Eventos Deportivos. Every hour a lap of about 6.7 km starts and must be completed within that hour, with no lap limit; the last runner still going wins. It is on Saturday 17 October 2026 at Complejo ATSS, with check-in from 7:30 and the start at 9:30. No registrations are taken after 9 October. On that day the Uruguayan team also competes in the Big Dog's satellite team championship.
