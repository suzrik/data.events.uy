name: Uruguay Backyard Ultra
date: 2026-10-17
sport: trail
city: Guazuvirá
venue: Complejo ATSS
distances: ["6,7 km por vuelta"]
links:
  site: https://tileneventosdeportivos.com/uruguay-backyard-ultra/
  instagram: https://www.instagram.com/tileneventosdeportivos/
