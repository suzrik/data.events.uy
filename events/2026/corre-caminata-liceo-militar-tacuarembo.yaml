description:
  es: Correcaminata del Liceo Militar General Artigas, Anexo Norte, por el 215.º aniversario del Ejército Nacional, corrida el sábado 16 de mayo de 2026 en la Laguna de las Lavanderas, Tacuarembó, con largada a las 10:30. Se anunciaron 2 km participativos, 5 y 10 km; Encarrera publicó los resultados de 5 y 10 km.
  en: Run-walk of the Liceo Militar General Artigas, Anexo Norte, for the 215th anniversary of the national army, held on Saturday 16 May 2026 at Laguna de las Lavanderas, Tacuarembó, starting at 10:30. A participative 2 km, 5 km and 10 km were announced; Encarrera published the 5 and 10 km results.
