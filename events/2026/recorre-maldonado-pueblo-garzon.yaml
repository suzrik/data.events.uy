description:
  es: Etapa 7 de las 9 de la serie Recorre Maldonado, organizada por SUCA Sports. Largada a las 16 hs en la plaza de Pueblo Garzón, con recorrido por las calles de balastro de los alrededores. Hay una prueba participativa de 5K para juveniles, corredores y caminantes y una competitiva de 10K. La inscripción es única para toda la serie y se paga al retirar el kit.
  en: Stage 7 of the 9 in the Recorre Maldonado series, organized by SUCA Sports. It starts at 4 pm in the main square of Pueblo Garzón and follows the gravel streets around the village. There is a 5K participatory race for youth, runners and walkers, and a competitive 10K. Registration is a single one for the whole series and is paid when picking up the kit.
