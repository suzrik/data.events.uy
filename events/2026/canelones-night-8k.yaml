description:
  es: Carrera nocturna de 8 km en Canelones, corrida el sábado 25 de abril de 2026 con largada a las 18:30 desde el Club Liverpool (L. A. de Herrera y Tolentino González). Se recomendaba llevar linterna; hubo medallas para todos y trofeos del 1.º al 3.º en la general. Encarrera tuvo la inscripción y publicó los resultados.
  en: An 8 km night race in Canelones, held on Saturday 25 April 2026, starting at 18:30 from Club Liverpool (L. A. de Herrera and Tolentino González). A head torch was recommended; everyone got a medal and the top three overall got trophies. Encarrera handled registration and published the results.
