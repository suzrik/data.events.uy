name: Jornada Saludable 3K CASMER
date: 2026-10-17
sport: run
city: Rivera
venue: Ciclovía Ruta 5
distances: [3K]
links:
  site: https://www.casmer.com.uy/
  instagram: https://www.instagram.com/casmeruy/
description:
  es: Undécima edición de la jornada saludable de 3 km de CASMER, la mutualista de Rivera, pensada para toda la familia. Según la publicación del organizador del 2 de octubre, es el sábado 17 de octubre a las 15:00 en la ciclovía de la Ruta 5. La inscripción se hace en el sitio de CASMER, del lunes 5 al martes 13 de octubre. Evento premiado por la Comisión Honoraria para la Salud Cardiovascular.
  en: Eleventh edition of the 3 km health day of CASMER, the Rivera health cooperative, meant for the whole family. According to the organizer's post of 2 October, it is on Saturday 17 October at 15:00 on the Ruta 5 cycle path. Registration is on the CASMER website, from Monday 5 to Tuesday 13 October. The event has an award from the Comisión Honoraria para la Salud Cardiovascular.
