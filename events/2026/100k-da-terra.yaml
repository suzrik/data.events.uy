description:
  es: Tercera edición del 100K da Terra, desafío binacional de 100 km por caminos de tierra entre Rivera y Santana do Livramento, con modalidades de cicloturismo y competencia. El 24 de octubre de 2026 el organizador publicó la previa en el Autódromo Eduardo P. Cabrera de Rivera y anunció la largada para el día siguiente, el domingo 25; después publicó al campeón general.
  en: Third edition of the 100K da Terra, a binational 100 km challenge on dirt roads between Rivera and Santana do Livramento, with cycle touring and racing modes. On 24 October 2026 the organizer posted the build-up at the Autódromo Eduardo P. Cabrera in Rivera and announced the start for the next day, Sunday 25; it later posted the overall winner.
