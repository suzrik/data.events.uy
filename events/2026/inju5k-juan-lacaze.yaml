description:
  es: Carrera de 5 km del Instituto Nacional de la Juventud (INJU) en Juan Lacaze, el miércoles 28 de octubre con largada en La Rambla (Vachelli, between Reconquista and Puerto Sauce). Actividad desde las 15:00 y largada a las 17:00. Para mayores de 13 años; los menores de 18 necesitan permiso firmado y todos un certificado médico. Hay inscripción en línea y también el día de la carrera. Las fechas pueden cambiar.
  en: 5 km race of the Instituto Nacional de la Juventud (INJU) in Juan Lacaze, on Wednesday 28 October, starting at La Rambla (Vachelli, between Reconquista and Puerto Sauce). Activities from 15:00 and the race starts at 17:00. For people over 13; under-18s need a signed permission and everyone a medical certificate. Registration is online and also on race day. Dates may change.
