description:
  es: Carrera de MTB por etapas de tres días en La Paloma y Rocha, de la organizadora brasileña Threerace Sports junto a Azimut Extremo. Viernes 30, XCC de una sola vuelta de 5,3 km desde Casa Bahia, en La Paloma, con salidas por categoría desde las 13:30. Sábado 31, etapa reina de 81,1 km desde el Centro Polideportivo de Rocha, a las 8:00. Domingo 1, 64 km desde el Mirador de La Pedrera, a las 8:30. Se corre individual o en duplas. La inscripción es por Windfit.
  en: Three-day MTB stage race in La Paloma and Rocha, by the Brazilian organizer Threerace Sports together with Azimut Extremo. Friday 30, a single-lap 5.3 km XCC from Casa Bahia in La Paloma, with starts by category from 13:30. Saturday 31, the 81.1 km queen stage from the Centro Polideportivo in Rocha, at 8:00. Sunday 1, 64 km from the Mirador de La Pedrera, at 8:30. You race solo or in pairs. Registration is on Windfit.
