name: Threerace Bike Ultramarathon Uruguay
date: 2026-10-30
end_date: 2026-11-01
sport: bike
city: La Paloma
venue: Arena Threerace
links:
  site: https://www.threerace.com/es/threerace-uruguay
  register: https://event.windfit.app/threerace-uruguay-2026
description:
  es: Carrera de MTB por etapas de tres días con base en La Paloma, Rocha, de la organizadora brasileña Threerace Sports junto a Azimut Extremo. Viernes 30, XCC de 3 vueltas a un circuito de unos 2 km en La Paloma. Sábado 31, etapa reina de unos 82 km con largada en la ciudad de Rocha. Domingo 1, unos 63 km con salida y llegada en La Pedrera. Se corre individual o en duplas y la edad mínima es 19 años. La inscripción es por Windfit y el último lote cierra el 20 de octubre.
  en: Three-day MTB stage race based in La Paloma, Rocha, by the Brazilian organizer Threerace Sports together with Azimut Extremo. Friday 30, an XCC of 3 laps of a circuit of about 2 km in La Paloma. Saturday 31, the queen stage of about 82 km starting in the city of Rocha. Sunday 1, about 63 km starting and finishing in La Pedrera. You race solo or in pairs and the minimum age is 19. Registration is on Windfit and the last price tier closes on 20 October.
