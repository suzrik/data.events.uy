description:
  es: Primera edición de esta carrera de MTB por caminos rurales de Flores, con largada a las 10:00 en el ex Hogar Rural (camino la Aviación, Trinidad). Hay 55K competitiva y 28K promocional, con cronometraje con chip y medalla finisher. El cupo máximo es de 350 corredores.
  en: First edition of this MTB race on rural roads of Flores, starting at 10:00 at the former Hogar Rural (Camino la Aviación, Trinidad). It has a 55K competitive course and a 28K promotional one, with chip timing and a finisher medal. The limit is 350 riders.
