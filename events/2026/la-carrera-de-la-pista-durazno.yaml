description:
  es: Carrera de 5 y 10 km, más 800 m, corrida el sábado 6 de junio de 2026 a las 9:30, con largada y llegada en la Pista de Atletismo Héctor Merklen Budelli de Durazno. Según el reglamento, la organizaron la Pista de Atletismo de la Secretaría Nacional del Deporte en Durazno y la división Deportes de la Intendencia, con chip e hidratación cada 2,5 km. Kronos Sports publicó los resultados.
  en: A 5 and 10 km race, plus 800 m, held on Saturday 6 June 2026 at 9:30, starting and finishing at the Héctor Merklen Budelli athletics track in Durazno. According to the rules, it was organized by the track of the National Sports Secretariat in Durazno and the sports division of the city government, with chip timing and water every 2.5 km. Kronos Sports published the results.
