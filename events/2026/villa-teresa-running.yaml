  es: Tercera edición de la carrera Villa Teresa Running, el domingo 12 de julio de 2026 a las 9:00, con largada en el Club Atlético Villa Teresa, Montevideo, con 10K y 5K. La inscripción costaba $500, en el Mercado Agrícola (sede de la AAU) y en la sede del club. Contó con el apoyo de la Agrupación de Atletas del Uruguay (AAU), que publicó los resultados.
  en: Third edition of the Villa Teresa Running race, on Sunday 12 July 2026 at 9:00, starting at Club Atlético Villa Teresa, Montevideo, over 10K and 5K. Entry cost $500, at the Mercado Agrícola (the AAU base) and at the club. It was supported by the Agrupación de Atletas del Uruguay (AAU), which published the results.
