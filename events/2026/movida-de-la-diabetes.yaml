description:
  es: Actividad anual de la Fundación Diabetes Uruguay por el Día Mundial de la Diabetes, que recauda fondos para campamentos educativos de niños y jóvenes con diabetes. La edición de los 17 años es el domingo 6 de diciembre en un circuito en el Dique Mauá; el 1 km larga a las 9:00 y los 3,5 y 8 km, con caminata nórdica, a las 9:05. La inscripción con chip y camiseta cuesta $870 hasta el 29 de noviembre en RedTickets; medalla para los inscriptos con chip. Se pide carné de salud o certificado médico.
  en: Annual activity of Fundación Diabetes Uruguay for World Diabetes Day, raising funds for educational camps for children and young people with diabetes. The 17th-anniversary edition is on Sunday 6 December on a circuit at Dique Mauá; the 1 km starts at 9:00 and the 3.5 and 8 km, with Nordic walking, at 9:05. Entry with chip and shirt costs $870 until 29 November on RedTickets; medal for chip entrants. A health card or medical certificate is required.
