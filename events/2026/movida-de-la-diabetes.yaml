name: Movida de la Diabetes
date: 2026-12-06
status: tentative
sport: run
city: Montevideo
links:
  site: https://www.fundaciondiabetes.org.uy/actividades/movida-de-la-diabetes/
  instagram: https://www.instagram.com/fundaciondiabetesuruguay/
  facebook: https://www.facebook.com/fundaciondiabetes.uruguay/
description:
  es: Actividad anual de la Fundación Diabetes Uruguay en el marco del Día Mundial de la Diabetes, para promover la actividad física y recaudar fondos para campamentos educativos gratuitos para niños y jóvenes con diabetes. La fundación todavía no anunció la edición 2026; la agenda deportiva de la Intendencia de Montevideo la ubica el domingo 6 de diciembre. La 15ª edición fue el 7 de diciembre de 2024 en la rambla de Montevideo, con recorridos de 1, 3,5 y 8 km.
  en: Annual activity of Fundación Diabetes Uruguay held around World Diabetes Day to promote physical activity and raise funds for free educational camps for children and young people with diabetes. The foundation has not announced the 2026 edition yet; the sports calendar of the Montevideo city government lists it on Sunday 6 December. The 15th edition was on 7 December 2024 on the Montevideo waterfront, with 1, 3.5 and 8 km routes.
