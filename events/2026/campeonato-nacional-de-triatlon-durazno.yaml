description:
  es: Segunda fecha del Campeonato Nacional de Triatlón 2026-2027 de la Unión de Triatlón del Uruguay, el domingo 15 de noviembre, con punto de encuentro en el Parador del Camping 33 Orientales de Durazno; la organiza la Escuela de Triatlón de Durazno. Promocional a las 8:30, con 400 m de natación, 10 km de ciclismo y 2,5 km de carrera; Sprint a las 9:30, con 750 m, 20 km y 5 km. La inscripción también tiene AG Grup, Postas y MTB, con precios para federados y no federados.
  en: Second date of the 2026-2027 Campeonato Nacional de Triatlón of the Unión de Triatlón del Uruguay, on Sunday 15 November, meeting at the Parador del Camping 33 Orientales in Durazno; it is organized by the Escuela de Triatlón de Durazno. Promocional at 8:30, a 400 m swim, 10 km bike and 2.5 km run; Sprint at 9:30, 750 m, 20 km and 5 km. Registration also has AG Grup, relay (Postas) and MTB, with prices for federated and non-federated athletes.
