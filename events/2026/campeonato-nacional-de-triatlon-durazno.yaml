description:
  es: Fecha del Campeonato Nacional de Triatlón 2026-2027 de la Unión de Triatlón del Uruguay, el domingo 15 de noviembre en la Sociedad Rural de Durazno, en Santa Bernardina. Modalidades Sprint y Promocional; la inscripción también tiene categorías AG Grup, Postas y MTB. Los no federados pueden correr con un permiso por el día, pero solo los federados suman puntos para el ranking. La página no da horarios ni distancias y la Unión remite a sus redes sociales.
  en: A date of the 2026-2027 Campeonato Nacional de Triatlón of the Unión de Triatlón del Uruguay, on Sunday 15 November at the Sociedad Rural de Durazno, in Santa Bernardina. Sprint and Promocional formats; registration also has AG Grup, relay (Postas) and MTB categories. Non-federated athletes may race on a one-day permit, but only federated ones score ranking points. The page gives no start times or distances, and the union refers to its social media.
