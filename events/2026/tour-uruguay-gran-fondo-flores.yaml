description:
  es: Etapa de Flores del Tour Uruguay, circuito nacional de ciclismo de ruta de eSport. Hay Gran Fondo de 117 km y Medio Fondo de 60 km, este también en bici de montaña, abiertos a quienes se inscriban, con chip. Según el sitio del Tour, la largada es a las 9:30 en el Parque Centenario de Trinidad (la plataforma de inscripción todavía dice 8:00), y los kits se entregan ahí el sábado 31 de octubre de 12 a 19 h. Los cupos son limitados.
  en: Flores stage of the Tour Uruguay, a national road cycling circuit run by eSport. It offers a 117 km Gran Fondo and a 60 km Medio Fondo, the latter also on a mountain bike, open to anyone who registers, with chip timing. According to the Tour's site, the start is at 9:30 at Parque Centenario in Trinidad (the registration platform still says 8:00), and kits are handed out there on Saturday 31 October, 12:00 to 19:00. Places are limited.
