description:
  es: Etapa de Flores del Tour Uruguay, circuito nacional de ciclismo de ruta de eSport. Hay Gran Fondo de 117 km y Medio Fondo de 60 km, abiertos a quienes se inscriban, con cronometraje por chip y una Expo Feria. Los cupos son limitados y no hay inscripción el día de la carrera.
  en: Flores stage of the Tour Uruguay, a national road cycling circuit run by eSport. It offers a 117 km Gran Fondo and a 60 km Medio Fondo, open to anyone who registers, with chip timing and an expo fair. Places are limited and there is no registration on race day.
