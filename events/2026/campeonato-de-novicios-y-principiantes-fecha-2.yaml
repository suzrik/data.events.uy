description:
  es: Segunda fecha del Campeonato de Novicios y Principiantes sin licencia, el sábado 31 de octubre de 14:00 a 15:00 en la Pista Walter Moyano de Maldonado. Serie amateur cuyos afiches circulan en el grupo de Facebook «Ciclistas de Ruta & MTB (Uruguay)»; el afiche no nombra al organizador. Inscripción 400 pesos y seguro del Banco de Seguros del Estado; auspician Garmin y Medialunas Calentitas.
  en: Second round of the Campeonato de Novicios y Principiantes for riders without a license, on Saturday 31 October from 14:00 to 15:00 at the Pista Walter Moyano in Maldonado. An amateur series whose posters circulate in the Facebook group «Ciclistas de Ruta & MTB (Uruguay)»; the poster does not name the organizer. Entry 400 pesos and insurance by the Banco de Seguros del Estado; sponsored by Garmin and Medialunas Calentitas.
