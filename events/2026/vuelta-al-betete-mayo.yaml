description:
  es: "Vuelta al Betete de mayo, carrera de mountain bike en Solís de Mataojo, Lavalleja, corrida el domingo 24 de mayo de 2026 con largada a las 9:00 desde el Parque OSE. Hubo 56 km para elite y máster, con premio de montaña, y 26 km para junior y promocionales; la inscripción costaba $1000 por la web y $1200 el día de la carrera. Crono MTB, que cronometró, publicó los resultados."
  en: "The May Vuelta al Betete, a mountain bike race in Solís de Mataojo, Lavalleja, held on Sunday 24 May 2026, starting at 9:00 from Parque OSE. There were 56 km for elite and masters, with a climb prize, and 26 km for juniors and promotional riders; entry cost $1000 online and $1200 on race day. Crono MTB, which did the timing, published the results."
