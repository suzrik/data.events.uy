  register: https://docs.google.com/forms/d/e/1FAIpQLSdG8GQiGPbf8QaiPLDn5JoFgFqy3FflLTH9JY0bOjJ5N_HZTg/viewform
description:
  es: Etapa nocturna del Campeonato 2026 de la Agrupación de Atletas del Uruguay (AAU) en Santa Lucía, Canelones, el sábado 24 de octubre a las 19:30, con 5K y 10K, en el marco de los festejos de la ciudad y con la colaboración del Municipio. La inscripción, por formulario de la AAU, cuesta $500 sin remera; el kit se retira de martes a viernes en la sede de la AAU (José L. Terra 2220, Montevideo) o el sábado en la largada de 16 a 19.
  en: Night stage of the 2026 championship of the Agrupación de Atletas del Uruguay (AAU) in Santa Lucía, Canelones, on Saturday 24 October at 19:30, with 5K and 10K, as part of the town's festivities and with the support of the municipality. Registration, by AAU form, costs $500 without a shirt; kits are picked up Tuesday to Friday at the AAU base (José L. Terra 2220, Montevideo) or on Saturday at the start from 16:00 to 19:00.
