name: Campeonato AAU, etapa Santa Lucía Nocturna
date: 2026-10-24
time: "19:30"
sport: run
city: Santa Lucía
distances: [10K, 5K]
organizer: Agrupación de Atletas del Uruguay y Municipio de Santa Lucía
links:
