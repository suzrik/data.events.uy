description:
  es: Quinta y última etapa del Combo Colonia 2025/2026, campeonato de running por localidades de Colonia avalado por la Confederación Atlética del Uruguay, corrida el sábado 17 de enero de 2026 en Santa Ana con largada a las 18:30 en la avenida Los Cardenales. Hubo 5 y 10 km; la inscripción costaba $900 hasta el miércoles previo y $1.000 después. Las etapas anteriores fueron en Ombúes de Lavalle, La Paz, Carmelo y Valdense. Encarrera publicó los resultados.
  en: Fifth and final stage of Combo Colonia 2025/2026, a running championship through towns of Colonia sanctioned by the Uruguayan athletics confederation, held on Saturday 17 January 2026 in Santa Ana, starting at 18:30 on Avenida Los Cardenales. There were 5 and 10 km; entry cost $900 until the Wednesday before and $1,000 after. Earlier stages were in Ombúes de Lavalle, La Paz, Carmelo and Valdense. Encarrera published the results.
