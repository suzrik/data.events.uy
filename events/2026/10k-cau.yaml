description:
  es: Fecha de la Confederación Atlética del Uruguay en su calendario de ruta 2026, que la presenta como tentativa y la llama Fecha CAU y Fecha Clausura 10K, con el 17 de octubre; la agenda de la Intendencia de Montevideo la ubica el domingo 18. Lugar, hora y condiciones de participación no encontrados. Otra fecha CAU figura el 5 de diciembre.
  en: Round of the Confederación Atlética del Uruguay in its 2026 road calendar, which presents it as tentative and calls it Fecha CAU and Fecha Clausura 10K, dated 17 October; the Montevideo city agenda places it on Sunday 18. Venue, time and entry conditions not found. Another CAU round is listed on 5 December.
