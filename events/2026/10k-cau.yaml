description:
  es: Fecha de la Confederación Atlética del Uruguay en su calendario de ruta 2026, publicado en enero como tentativo, que la llamaba Fecha CAU y Fecha Clausura 10K, con el 17 de octubre; la agenda de la Intendencia de Montevideo la ubicaba el domingo 18. El calendario del Campeonato Clausura que la CAU publicó el 26 de octubre no tiene un 10K en Montevideo en octubre; ese mes figuran el Enfoque 5K de Bimbo, en Montevideo el 18, y el 10K del Grupo de Artillería N.º 4, en Lavalleja el 24.
  en: Round of the Confederación Atlética del Uruguay in its 2026 road calendar, published in January as tentative, which called it Fecha CAU and Fecha Clausura 10K, dated 17 October; the Montevideo city agenda placed it on Sunday 18. The Clausura championship calendar the CAU posted on 26 October has no 10K in Montevideo in October; that month it lists the Bimbo Enfoque 5K in Montevideo on the 18th and the Grupo de Artillería N.º 4 10K in Lavalleja on the 24th.
