description:
  es: Cancelado; no está en el calendario oficial. La Confederación Atlética del Uruguay la había anunciado en enero, en su calendario de ruta 2026 tentativo, como Fecha Clausura 10K del 17 de octubre (la agenda de Montevideo la ponía el domingo 18). El calendario del Campeonato Clausura que la CAU publicó el 26 de octubre no tiene un 10K en Montevideo en octubre; ese mes figuran el Enfoque 5K de Bimbo, en Montevideo el 18, y el 10K del Grupo de Artillería N.º 4, en Lavalleja el 24.
  en: Cancelled; not in the official calendar. The Confederación Atlética del Uruguay had announced it in January, in its tentative 2026 road calendar, as the Fecha Clausura 10K of 17 October (the Montevideo city agenda placed it on Sunday 18). The Clausura calendar the CAU posted on 26 October has no 10K in Montevideo in October; that month it lists the Bimbo Enfoque 5K in Montevideo on the 18th and the Grupo de Artillería N.º 4 10K in Lavalleja on the 24th.
