name: Caminos del Oro
date: 2026-07-26
time: "10:00"
sport: mtb
city: Minas de Corrales
distances: [60 km, 30 km]
links:
  site: https://cronomtb.uy/caminos-del-oro/
description:
  es: "Carrera de mountain bike en Minas de Corrales, Rivera, corrida el domingo 26 de julio de 2026 con largada a las 10:00. Hubo categorías competitivas y promocionales, incluida e-bike, y medallas para el cicloturismo; según los resultados, los competitivos hicieron 60 km y los promocionales 30 km. Crono MTB, que cronometró, publicó los resultados."
  en: "A mountain bike race in Minas de Corrales, Rivera, held on Sunday 26 July 2026, starting at 10:00. There were competitive and promotional categories, including e-bike, and medals for leisure riders; according to the results, the competitive riders did 60 km and the promotional ones 30 km. Crono MTB, which did the timing, published the results."
