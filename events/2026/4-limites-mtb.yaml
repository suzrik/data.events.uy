description:
  es: Segunda edición de esta carrera de MTB en Ismael Cortinas, Flores, el domingo 20 de diciembre de 2026, con entrega de kits desde las 7:30 y largada a las 9:00 en el Parque Municipal. Hay 50 km (élite, máster A a C y damas A a C) y 25 km (caballeros y damas por edad, junior y máster D), y carrera de niños. Cuesta $800 en noviembre, $1000 en diciembre y $1200 el día de la carrera, con pago en Abitab. Premios del 1.º al 5.º por categoría y medalla finisher.
  en: Second edition of this MTB race in Ismael Cortinas, Flores, on Sunday 20 December 2026, with kit pick-up from 7:30 and the start at 9:00 at the Parque Municipal. There are 50 km (elite, Master A to C and women A to C) and 25 km (men and women by age, junior and Master D), plus a kids' race. Entry is $800 in November, $1000 in December and $1200 on race day, paid at Abitab. Prizes for 1st to 5th in each category and a finisher medal.
