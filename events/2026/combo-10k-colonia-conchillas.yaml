description:
  es: Etapa 4 de Combo Colonia 2026/2027, campeonato de running de cinco etapas por localidades del departamento de Colonia, con 5K y 10K, categorías por edad y categoría de capacidades diferentes. Largada a las 16:00 en Casa Evans; el kit se retira allí desde las 14:00. Las etapas anteriores fueron en Nueva Helvecia, Miguelete y Juan Lacaze. La inscripción se hace en Ticketfácil y en la web de Cronometraje Instantáneo.
  en: Stage 4 of Combo Colonia 2026/2027, a five-stage running championship through towns of the Colonia department, with 5K and 10K, age categories and a differently-abled category. The start is at 16:00 at Casa Evans; kits are picked up there from 14:00. Earlier stages were in Nueva Helvecia, Miguelete and Juan Lacaze. Registration is on Ticketfácil and on the Cronometraje Instantáneo website.
