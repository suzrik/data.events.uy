description:
  es: Nueva edición de la corre caminata de la Obra Social Don Bosco de Salto, el domingo 15 de noviembre de 2026 a las 9:00 desde San Martín y Corrientes. 5K competitiva ($600) y 3K participativa ($450), con medalla finisher, mesa de hidratación y premios del 1.º al 5.º de cada categoría competitiva. Se paga en Abitab, colectivo 147655, y se completa el formulario; quien pagó hasta el 31 de octubre recibe remera.
  en: New edition of the run and walk of the Obra Social Don Bosco in Salto, on Sunday 15 November 2026 at 9:00 from San Martín and Corrientes streets. Competitive 5K ($600) and participatory 3K ($450), with finisher medal, water station and prizes for 1st to 5th in each competitive category. Pay at Abitab, collection 147655, and fill in the form; those who paid by 31 October get a shirt.
