description:
  es: Primera edición de la Maratón de Paysandú, el domingo 15 de noviembre a las 7:00. Organiza Punto de Control, con número y chip obligatorios, medalla finisher para todos y premios a los tres primeros puestos de damas y caballeros de cada categoría por distancia. Para acreditarse se pide documento y carné de salud o certificado médico.
  en: First edition of the Paysandú Marathon, on Sunday 15 November at 7:00. Organized by Punto de Control, with mandatory bib and chip, a finisher medal for everyone and prizes for the top three women and men of each category by distance. Accreditation requires ID and a health card or medical certificate.
