description:
  es: Primera edición de la Maratón de Paysandú, el domingo 15 de noviembre, con 42K, 21K, 10K y 5K. Las de 42K y 21K largan a las 7:00 y la de 10K a las 7:15. Organiza Punto de Control, con número y chip obligatorios, medalla finisher para todos y premios a los tres primeros puestos de damas y caballeros de cada categoría por distancia. Para acreditarse se pide documento y carné de salud o certificado médico.
  en: First edition of the Paysandú Marathon, on Sunday 15 November, with 42K, 21K, 10K and 5K. The 42K and 21K start at 7:00 and the 10K at 7:15. Organized by Punto de Control, with mandatory bib and chip, a finisher medal for everyone and prizes for the top three women and men of each category by distance. Accreditation requires ID and a health card or medical certificate.
