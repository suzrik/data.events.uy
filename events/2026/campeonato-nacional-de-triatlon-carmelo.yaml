description:
  es: Segunda fecha del Campeonato Nacional de Triatlón 2025-2026, organizada por la Unión de Triatlón del Uruguay y el Carmelo Rowing Club, corrida el sábado 14 de febrero de 2026 en Carmelo, Colonia, con natación en el arroyo de las Vacas y largada y llegada en el club. Hubo distancia olímpica (1500 m, 40 km y 10 km) individual y en postas, sprint y promocional. SUCA publicó los resultados de todas las categorías.
  en: Second date of the 2025-2026 Campeonato Nacional de Triatlón, organized by the Unión de Triatlón del Uruguay and Carmelo Rowing Club, held on Saturday 14 February 2026 in Carmelo, Colonia, with the swim in the Arroyo de las Vacas and the start and finish at the club. There was an Olympic distance (1500 m, 40 km and 10 km), individual and relay, plus sprint and promotional races. SUCA published the results of every category.
