description:
  es: Segunda edición de la corre caminata de 5 km de la Jefatura de Policía de Colonia, el sábado 19 de diciembre a las 18:30, por la Rambla Coloniense con paso por la Plaza de Toros; carrera de niños de 1 km a las 18:00. Cuesta $700 e incluye remera técnica, número con chip, medalla finisher, hidratación y resultados en vivo; premios del primero al quinto en damas y caballeros. La inscripción está en encarrera.uy y el kit se retira en la jefatura del 16 al 19 de diciembre.
  en: Second edition of the 5 km run and walk of the Colonia police headquarters, on Saturday 19 December at 18:30, along the Colonia waterfront passing the Plaza de Toros; a 1 km kids' race at 18:00. It costs $700 and includes a technical shirt, chip number, finisher medal, hydration and live results; prizes for the top five women and men. Registration is on encarrera.uy and the kit is picked up at the headquarters from 16 to 19 December.
