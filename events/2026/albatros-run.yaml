description:
  es: Carrera del Club Deportivo Albatros por los 5 años de Albatros Fitness, con 5K y 10K en el Circuito del Prado, Montevideo. Estaba anunciada para el sábado 3 de octubre y fue reprogramada por el pronóstico climático. El afiche que publica Kronos, la empresa de cronometraje, da la nueva fecha, sábado 10 de octubre de 2026 a las 10:00. La nota del club todavía muestra la fecha anterior; anuncia inscripciones abiertas, sin enlace de inscripción en línea.
  en: Race by Club Deportivo Albatros to celebrate 5 years of Albatros Fitness, with 5K and 10K on the Prado circuit, Montevideo. It was announced for Saturday 3 October and was rescheduled because of the weather forecast. The poster published by Kronos, the timing company, gives the new date, Saturday 10 October 2026 at 10:00. The club's note still shows the earlier date; it says registration is open but gives no online registration link.
