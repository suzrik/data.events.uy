description:
  es: Carrera solidaria «Juntos más lejos» de la Fundación Pérez Scremini, que atiende a niños y adolescentes con cáncer, el domingo 6 de setiembre de 2026 en Fray Bentos, con 5K y 10K y largada a las 10:00 desde el Teatro de Verano. Según la Intendencia de Río Negro, que la apoyó, la inscripción costaba $800 por Redtickets y la carrera reunió a un importante número de participantes.
  en: Charity race "Juntos más lejos" of the Pérez Scremini Foundation, which treats children and adolescents with cancer, on Sunday 6 September 2026 in Fray Bentos, with 5K and 10K, starting at 10:00 from the Teatro de Verano. According to the Intendencia de Río Negro, which supported it, entry cost $800 via Redtickets and the race drew a large number of participants.
