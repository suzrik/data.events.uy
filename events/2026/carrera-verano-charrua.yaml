name: Carrera Verano Charrúa
date: 2026-12-19
sport: run
city: Juan Lacaze
venue: Playa Charrúa (Senaqué y Tabobá)
distances: [20K, 10K, 5K]
organizer: Club Social, Deportivo y de Fomento del Barrio Charrúa
links:
