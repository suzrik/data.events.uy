description:
  es: Carrera de running de 5, 10 y 20 km el sábado 19 de diciembre en la Playa Charrúa de Juan Lacaze, en el lanzamiento de Verano Charrúa 2026–2027, la temporada de actividades gratuitas del Club Social, Deportivo y de Fomento del Barrio Charrúa con el Municipio de Juan Lacaze y la Intendencia de Colonia. La agenda de la Intendencia publica el cronograma con datos del organizador; la hora de largada y la inscripción no figuran.
  en: Running race over 5, 10 and 20 km on Saturday 19 December at Playa Charrúa in Juan Lacaze, at the launch of Verano Charrúa 2026–2027, the free programme of the Club Social, Deportivo y de Fomento del Barrio Charrúa with the Municipio de Juan Lacaze and the Intendencia de Colonia. The Intendencia agenda publishes the schedule with details supplied by the organizer; start time and registration are not given.
