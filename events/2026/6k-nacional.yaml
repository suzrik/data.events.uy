description:
  es: Carrera de 6 km del Club Nacional de Football, el domingo 31 de mayo de 2026 a las 9:00, con largada y llegada en el Gran Parque Central (calle General Urquiza) e ida y vuelta por 8 de Octubre y 18 de Julio hasta Arenal Grande. La inscripción, por la ticketera del club, costaba de $590 a $1.580 según fuera socio y con o sin remera; incluía chip y número. Los menores de 15 años corrían con un adulto. El club publicó un álbum de fotos de la carrera.
  en: 6 km race of Club Nacional de Football, on Sunday 31 May 2026 at 9:00, starting and finishing at Gran Parque Central (General Urquiza street) with an out-and-back along 8 de Octubre and 18 de Julio to Arenal Grande. Entry, through the club's ticket site, cost $590 to $1,580 depending on membership and whether a shirt was included; chip and bib included. Under-15s ran with an adult. The club published a photo album of the race.
