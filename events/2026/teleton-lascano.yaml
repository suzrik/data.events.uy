description:
  es: Correcaminata solidaria de 3K a beneficio de la Fundación Teletón, el viernes 13 de noviembre de 2026 a las 19:00 en Lascano, Rocha; a las 18:30 corren los niños el Correkids de 100 m. La inscripción para adultos cuesta 200 pesos, se hace por teléfono (092 443 494 o 098 669 397) y entra en el sorteo de una estadía en las Cabañas Municipales de La Paloma. Organizan el Municipio de Lascano, Deportes Lascano y Rotaract Club Lascano. El lugar de largada no está publicado.
  en: 3K charity walk-run for the Fundación Teletón, on Friday 13 November 2026 at 19:00 in Lascano, Rocha; at 18:30 children run the 100 m Correkids. Adult entry costs 200 pesos, is done by phone (092 443 494 or 098 669 397) and enters a draw for a stay at the municipal cabins in La Paloma. Organized by the Municipio de Lascano, Deportes Lascano and Rotaract Club Lascano. The start location is not published.
