name: Lascano se Mueve por Teletón
date: 2026-11-13
time: "19:00"
sport: run
city: Lascano
distances: [3K, 100 m]
organizer: Municipio de Lascano, Deportes Lascano y Rotaract Club Lascano
links:
  site: https://turismorocha.gub.uy/eventos/2026/11/13/teleton-lascano-5119
