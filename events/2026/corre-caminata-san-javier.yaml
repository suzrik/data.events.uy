description:
  es: Correcaminata de 6K y 12K en San Javier, Río Negro, el sábado 28 de noviembre, con largada a las 18:00 en la Plaza de Deportes. Organiza Tria-Iron Eventos Deportivos y cronometra Crono MTB. Las dos distancias son competitivas, con premios generales y por categorías de edad y medalla finisher para todos. Los kits se entregan el mismo día desde las 16:00. La inscripción es en línea, con dos franjas de precio hasta el 20 de noviembre; la remera es opcional.
  en: 6K and 12K run in San Javier, Río Negro, on Saturday 28 November, starting at 18:00 at the Plaza de Deportes. Organized by Tria-Iron Eventos Deportivos and timed by Crono MTB. Both distances are competitive, with overall and age-group prizes and a finisher medal for everyone. Kits are handed out on the day from 16:00. Registration is online, in two price bands until 20 November; the shirt is optional.
