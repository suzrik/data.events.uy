name: Uniendo los Pueblos de Rivera, etapa 3
date: 2026-09-06
time: "10:00"
sport: mtb
city: Vichadero
venue: Plaza de Deportes
links:
  instagram: https://www.instagram.com/uniendopueblosmtb/
description:
  es: Tercera etapa de Uniendo los Pueblos de Rivera, carrera de MTB por etapas en el departamento, el domingo 6 de setiembre de 2026 en Vichadero. La concentración fue en la Plaza de Deportes, con entrega de kits desde las 8:00 y largada a las 10:00; hubo baños, duchas y cantina, y se podía inscribir el mismo día al mismo precio. Antes fueron Tranqueras (7 de febrero) y Corrales (31 de mayo); la final, en Rivera el 13 de diciembre. Las distancias no figuran en lo que publicó el organizador.
  en: Third stage of Uniendo los Pueblos de Rivera, a stage MTB race around the department, on Sunday 6 September 2026 in Vichadero. Riders gathered at the Plaza de Deportes, with kit pickup from 8:00 and the start at 10:00; there were toilets, showers and a canteen, and on-the-day registration was possible at the same price. Tranqueras (7 February) and Corrales (31 May) came before; the final is in Rivera on 13 December. The distances are not in what the organizer published.
