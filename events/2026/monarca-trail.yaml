description:
  es: Trail de Mil Horizontes anunciado para el domingo 20 de setiembre de 2026 a las 9:00 en el Establecimiento La Serena, un predio privado en la Sierra de Carapé, Maldonado, con 12K y 6K por senderos, vados y cruces de arroyo. La inscripción incluía dorsal con chip, hidratación, fruta y medalla finisher. No encontramos resultados publicados, así que no consta que se haya corrido.
  en: Mil Horizontes trail race announced for Sunday 20 September 2026 at 9:00 at Establecimiento La Serena, a private estate in the Sierra de Carapé, Maldonado, with 12K and 6K over trails, fords and stream crossings. Entry included a chip bib, water, fruit and a finisher medal. We found no published results, so there is no record that it was held.
