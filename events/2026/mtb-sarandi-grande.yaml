description:
  es: "Cuarta edición de esta carrera de mountain bike en Sarandí Grande, Florida, corrida el domingo 19 de abril de 2026 con largada a las 10:00 desde el Centro de Equinoterapia. Hubo 48 km para elite y máster y 24 km para junior y las categorías promocionales; la inscripción costaba $400 anticipada y $600 el día de la carrera. Crono MTB, que cronometró, publicó los resultados."
  en: "Fourth edition of this mountain bike race in Sarandí Grande, Florida, held on Sunday 19 April 2026, starting at 10:00 from the Centro de Equinoterapia. There were 48 km for elite and masters and 24 km for juniors and the promotional categories; entry cost $400 in advance and $600 on race day. Crono MTB, which did the timing, published the results."
