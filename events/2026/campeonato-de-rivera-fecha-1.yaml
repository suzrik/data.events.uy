description:
  es: Primera fecha del Campeonato de Rivera 2026, carrera de ruta de la Liga de Ciclismo Departamental de Rivera en el calendario regional de la Federación Ciclista Uruguaya, corrida el domingo 4 de octubre en Rivera. Corrieron ciclistas con licencia en élite, sub-23, junior, máster A a D y damas. La FCU la da por finalizada y publicó la clasificación.
  en: First round of the 2026 Campeonato de Rivera, a road race of the Liga de Ciclismo Departamental de Rivera on the regional calendar of the Uruguayan Cycling Federation, held on Sunday 4 October in Rivera. Licensed riders raced in the elite, under-23, junior, master A to D and women's categories. The FCU lists it as finished and published the classification.
