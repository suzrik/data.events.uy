description:
  es: Corre caminata de Halloween por las calles de Lascano, Rocha, el sábado 31 de octubre, con 3K (una vuelta al circuito) y 6K (dos vueltas). Según las publicaciones del organizador del 8 de octubre, hay medallas para los participantes y las inscripciones están abiertas por el enlace del perfil de Instagram.
  en: Halloween run and walk through the streets of Lascano, Rocha, on Saturday 31 October, with 3K (one lap of the circuit) and 6K (two laps). According to the organizer's posts of 8 October, there are medals for participants and registration is open through the link in the Instagram profile.
