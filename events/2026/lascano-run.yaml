name: Lascano Run – Edición Halloween
date: 2026-10-31
sport: run
city: Lascano
venue: Plaza Artigas
distances: [6K, 3K]
links:
  site: https://sites.google.com/view/lascanorun2026/p%C3%A1gina-principal
  instagram: https://www.instagram.com/lascano.run.official/
  register: https://docs.google.com/forms/d/e/1FAIpQLSckiNI6CSOM8BTmMiFgCys67l1kxb55IQb7ZVPUfBW8tTfNMw/viewform
description:
  es: Corre caminata de Halloween por las calles de Lascano, Rocha, el sábado 31 de octubre, con 3K (una vuelta al circuito) y 6K (dos vueltas), con centro en la Plaza Artigas. Según las publicaciones del organizador, hay medallas para los participantes, las inscripciones están abiertas por el enlace del perfil de Instagram y, al terminar la carrera, desfila la comparsa Gozadera del Este.
  en: Halloween run and walk through the streets of Lascano, Rocha, on Saturday 31 October, with 3K (one lap of the circuit) and 6K (two laps), based at Plaza Artigas. According to the organizer's posts, there are medals for participants, registration is open through the link in the Instagram profile and, after the race, the Gozadera del Este comparsa parades.
