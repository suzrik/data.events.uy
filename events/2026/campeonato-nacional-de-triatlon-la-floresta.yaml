description:
  es: Tercera fecha sprint del Campeonato Nacional de Triatlón 2026-2027 de la Unión de Triatlón del Uruguay, el domingo 6 de diciembre. Distancias Sprint y Promocional; la inscripción también tiene AG Grup, Postas y MTB. Los no federados corren con permiso por el día; solo los federados suman para el ranking. La Unión llama «Flores» a esta fecha en el título, la tabla y el reglamento, pero el lugar y el mapa de la inscripción indican La Floresta, Canelones. Horario y lugar exacto, pendientes.
  en: Third sprint date of the 2026-2027 Campeonato Nacional de Triatlón of the Unión de Triatlón del Uruguay, on Sunday 6 December. Sprint and Promocional distances; registration also has AG Grup, relay and MTB categories. Non-federated athletes race on a one-day permit; only federated ones score ranking points. The union calls this date «Flores» in the title, the table and the rulebook, but the place and map of the registration page point to La Floresta, Canelones. Start time and venue pending.
