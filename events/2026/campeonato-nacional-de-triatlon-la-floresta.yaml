description:
  es: Tercera fecha sprint del Campeonato Nacional de Triatlón 2026-2027 de la Unión de Triatlón del Uruguay, el domingo 6 de diciembre. Distancias Sprint y Promocional; la inscripción también tiene AG Grup, Postas y MTB. Los no federados corren con permiso por el día y no suman para el ranking. La Unión llama «Flores» a esta fecha y la agenda de la Intendencia de Flores pone un triatlón ese día en Trinidad; el campo de lugar de la inscripción dice La Floresta. Horario y lugar exacto, pendientes.
  en: Third sprint date of the 2026-2027 Campeonato Nacional de Triatlón of the Unión de Triatlón del Uruguay, on Sunday 6 December. Sprint and Promocional distances; registration also has AG Grup, relay and MTB categories. Non-federated athletes race on a one-day permit and score no ranking points. The union calls this date «Flores» and the Flores city government agenda lists a triathlon in Trinidad that day; the place field of the registration page says La Floresta. Start time and venue pending.
