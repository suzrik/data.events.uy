description:
  es: Etapa del Campeonato de la Agrupación de Atletas del Uruguay (AAU) en Progreso, Canelones, el domingo 18 de octubre de 2026. La 5K largó a las 10:00 y la 10K a las 10:10, frente al Municipio, con carrera de niños; el recorrido salía por la avenida Wilson Ferreira Aldunate hacia la ruta 5. Los no socios pagaban $500 por número y chip; la inscripción era por formulario, en el MAM y el día de la carrera. La AAU publicó los resultados.
  en: Stage of the Agrupación de Atletas del Uruguay (AAU) championship in Progreso, Canelones, on Sunday 18 October 2026. The 5K started at 10:00 and the 10K at 10:10, in front of the municipal building, with a kids' race; the course left along Avenida Wilson Ferreira Aldunate towards Route 5. Non-members paid $500 for bib and chip; registration was by form, at the MAM and on race day. The AAU published the results.
