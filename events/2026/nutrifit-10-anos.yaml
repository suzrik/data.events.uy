description:
  es: Carrera de 10K y 5K con largada a las 9:30 en el Parque Artigas de Sauce, Canelones, para celebrar los 10 años de NutriFit Centro de Entrenamiento. Incluye una carrera de niños de 500 m. Lo recaudado va al Centro Delfines de Sauce. Hay medalla para todos y trofeos para los primeros puestos.
  en: 10K and 5K race starting at 9:30 at Parque Artigas in Sauce, Canelones, celebrating 10 years of NutriFit training centre. It includes a 500 m children's race. Proceeds go to the Centro Delfines de Sauce. Everyone gets a medal and the top finishers receive trophies.
