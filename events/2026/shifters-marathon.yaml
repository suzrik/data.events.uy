  es: Maratón de patín con distancias de 6K, 12K, 21K y 42K, el domingo 1 de noviembre a las 8:00, con largada en Ruta Perimetral y General Líber Seregni, Maldonado. Es la segunda edición, según el Instagram del organizador. Al consultar la página de inscripción, las inscripciones figuraban cerradas.
  en: Skating marathon over 6K, 12K, 21K and 42K on Sunday 1 November at 8:00, starting at Ruta Perimetral and General Líber Seregni, Maldonado. It is the second edition, according to the organizer's Instagram. When the registration page was checked, registration was shown as closed.
