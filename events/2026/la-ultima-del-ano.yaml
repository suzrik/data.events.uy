name: La Última del Año
date: 2026-12-13
sport: mtb
city: Sarandí del Yí
venue: Parque Elías Regules
distances: [45 km, 25 km]
links:
  site: https://cronomtb.uy/6o-edicion-la-ultima-del-ano/
  register: https://cronomtb.uy/6o-edicion-la-ultima-del-ano/
description:
  es: Sexta edición de esta carrera de MTB en Sarandí del Yí, Durazno, el domingo 13 de diciembre, con largada a las 09:00 en el Parque Elías Regules; los kits se entregan desde las 07:15. Hay 45 km, con categorías por edad para damas y caballeros desde junior hasta mayores de 60, y 25 km con cuatro franjas de edad. Premios del 1.º al 5.º por categoría, medalla finisher y premio al grupo más numeroso. Cuesta $800, con descuentos por grupos. Inscripción en Crono MTB; el organizador no figura.
  en: Sixth edition of this MTB race in Sarandí del Yí, Durazno, on Sunday 13 December, starting at 09:00 at Parque Elías Regules; kits are handed out from 07:15. There are 45 km, with age categories for women and men from junior to over 60, and 25 km with four age groups. Prizes for 1st to 5th in each category, a finisher medal and a prize for the largest group. It costs $800, with group discounts. Registration is on the Crono MTB website. The organizer is not named on the page.
