description:
  es: Primera fecha del campeonato departamental de ruta de la Federación Ciclista de Tacuarembó, el domingo 13 de setiembre de 2026, en el circuito del bulevar Rodríguez Correa frente a la Residencia Universitaria. Inscripción desde las 8:30; a las 9:00 largaron máster, damas, novicios y montaña, y a las 10:15 la élite. Fiscalizada por la Federación Ciclista Uruguaya, que publicó los participantes y la clasificación.
  en: First round of the departmental road championship of the Federación Ciclista de Tacuarembó, on Sunday 13 September 2026, on the Rodríguez Correa boulevard circuit opposite the Residencia Universitaria. Registration from 8:30; masters, women, novices and MTB riders started at 9:00 and the elite at 10:15. Supervised by the Uruguayan Cycling Federation, which published the entry list and the classification.
