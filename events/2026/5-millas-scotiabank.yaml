description:
  es: Carrera de verano de 5 millas (8 km) de SUCA Sports, corrida el domingo 1 de febrero de 2026 a las 9:00, una fecha nueva respecto de la anunciada antes. Largó en la desembocadura de La Barra, parada 36½ de Playa Brava, con 4 km por asfalto hacia Punta del Este y 4 km de vuelta por la arena de la playa, para damas y caballeros desde 15 años. SUCA publicó los resultados.
  en: SUCA Sports' summer 5-mile (8 km) race, held on Sunday 1 February 2026 at 9:00, on a new date after an earlier announcement. It started at the mouth of La Barra, stop 36½ of Playa Brava, with 4 km on asphalt towards Punta del Este and 4 km back on the beach sand, for women and men aged 15 and over. SUCA published the results.
