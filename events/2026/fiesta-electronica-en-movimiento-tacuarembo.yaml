description:
  es: Correcaminata y paseo en bici con música electrónica de Grupo Conecta Tacuarembó, el sábado 28 de noviembre a las 20:00, con salida y llegada en el Gimnasio StrongBike. El recorrido de unos 5,8 km va por el bulevar Rodríguez Correa, 25 de Mayo y 18 de Julio, con vuelta al Parque, y cierra con fiesta en la calle con DJ, comidas y bebidas. Las entradas se venden en RedTickets.
  en: A run-walk and bike ride to electronic music by Grupo Conecta Tacuarembó, on Saturday 28 November at 20:00, starting and finishing at the StrongBike gym. The roughly 5.8 km route follows Bulevar Rodríguez Correa, 25 de Mayo and 18 de Julio, with a loop of the Parque, and ends with a street party with a DJ, food and drinks. Tickets are sold on RedTickets.
