description:
  es: Segunda edición de la correcaminata del Groot Training Center, el domingo 25 de octubre a las 10:30 en el Prado de Montevideo, con largada en Av. Delmira Agustini y Av. León Ribeiro. Un 5K para correr o caminar, apto para todos los niveles, que en esta edición se suma al Octubre Rosa como correcaminata solidaria. La inscripción cuesta $800 con kit incluido y se hace en RedTickets hasta el 18 de octubre.
  en: Second edition of the run-and-walk by Groot Training Center, on Sunday 25 October at 10:30 in Montevideo's Prado, starting at Av. Delmira Agustini and Av. León Ribeiro. A 5K to run or walk, open to all levels, which this year joins Octubre Rosa as a charity event. Registration costs $800 with the kit included and is on RedTickets until 18 October.
