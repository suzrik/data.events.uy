name: Desafío MTB Los Médanos del Sauce
date: 2026-12-20
sport: mtb
city: Juan Lacaze
venue: Playa Charrúa (Senaqué y Tabobá)
organizer: Club Social, Deportivo y de Fomento del Barrio Charrúa
links:
  site: https://colonia.gub.uy/turismo/unEvento.php?x=6e60bad310fd781e60a3eb3a02a69db71ffca8d6&q=eventos
  facebook: https://www.facebook.com/profile.php?id=61560966119417
description:
  es: Desafío de mountain bike «Los Médanos del Sauce», con diferentes kilometrajes y tres categorías, el domingo 20 de diciembre en la Playa Charrúa de Juan Lacaze, en el lanzamiento de Verano Charrúa 2026–2027, la temporada gratuita del Club Social, Deportivo y de Fomento del Barrio Charrúa. La agenda de la Intendencia de Colonia publica el cronograma con datos del organizador; distancias, hora e inscripción no figuran.
  en: Mountain bike challenge "Los Médanos del Sauce", with several distances and three categories, on Sunday 20 December at Playa Charrúa in Juan Lacaze, at the launch of Verano Charrúa 2026–2027, the free summer programme of the Club Social, Deportivo y de Fomento del Barrio Charrúa. The Intendencia de Colonia agenda publishes the schedule with details supplied by the organizer; distances, start time and registration are not given.
