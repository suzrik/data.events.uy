description:
  es: Segunda edición de un social run de Fisio Runner, el 5 de diciembre de 2026 a las 19:00, desde el RestoBar 1880 de Durazno, a beneficio del Hospital Departamental de Durazno Dr. Emilio Penza. Hay calentamiento y recorridos de 3 y 5 km para correr, caminar, ir en bici o en patines; la pulsera cuesta $250 y entra en los sorteos del after con DJ. Información al 098 515 341.
  en: Second edition of a social run by Fisio Runner, on 5 December 2026 at 19:00, from RestoBar 1880 in Durazno, in aid of the Hospital Departamental de Durazno Dr. Emilio Penza. There is a warm-up and 3 and 5 km routes to run, walk, cycle or skate; the $250 wristband also enters the prize draws at the after-party, which has a DJ. Information on 098 515 341.
