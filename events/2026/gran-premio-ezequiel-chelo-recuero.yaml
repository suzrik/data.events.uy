name: Gran Premio Ezequiel Chelo Recuero
date: 2026-10-11
sport: bike
city: Trinidad
venue: Pista José Asconeguy
entry: license
links:
  site: https://federacionciclista.com.uy/ruta/5M8EGPE37P/
description:
  es: Carrera de ruta de un día en Trinidad, Flores, por los 98 años del Club Atlético Independiente, que la organiza; figura en el calendario regional de la Federación Ciclista Uruguaya. Se corre en la Pista José Asconeguy. Según el afiche, la concentración es a las 8:00; a las 8:30 largan Máster C, D, E y Damas, a las 9:30 Máster A y B, y a las 10:45 Élite, Sub-23 y Junior. Es para ciclistas con licencia de la federación. Las distancias no están publicadas.
  en: One-day road race in Trinidad, Flores, marking 98 years of Club Atlético Independiente, which organizes it; it is on the regional calendar of the Uruguayan Cycling Federation. It is held at Pista José Asconeguy. According to the poster, riders gather at 8:00; Master C, D, E and women start at 8:30, Master A and B at 9:30, and Elite, Under-23 and Junior at 10:45. It is for riders holding a federation licence. Distances are not published.
