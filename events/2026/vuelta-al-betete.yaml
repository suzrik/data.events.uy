name: Vuelta al Betete
date: 2026-12-13
sport: mtb
city: Solís de Mataojo
venue: Parque Mataojo
distances: [56 km, 27 km]
links:
  site: https://www.puntodecontrol.com.uy/vuelta-al-betete/
  register: https://www.puntodecontrol.com.uy/vuelta-al-betete/
description:
  es: Segunda edición de esta carrera de mountain bike en Solís de Mataojo, Lavalleja, con largada a las 9:00 en el Parque Mataojo. Hay 56 km para las categorías competitivas y 27 km para las promocionales. Según el afiche, se hace a beneficio de los ciclistas del C.C. Sauce y premia hasta el quinto puesto. La inscripción es por Punto de Control; la anticipada cierra el jueves 10 de diciembre y también se puede anotar el día de la carrera.
  en: Second edition of this mountain bike race in Solís de Mataojo, Lavalleja, starting at 9:00 from Parque Mataojo. There are 56 km for the competitive categories and 27 km for the promotional ones. According to the poster, it is held for the benefit of the riders of C.C. Sauce, with prizes down to fifth place. Registration is through Punto de Control; advance entry closes on Thursday 10 December and you can also sign up on race day.
