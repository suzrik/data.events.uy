description:
  es: Edición 2026 del trail de SUCA Sports en Punta Ballena, Maldonado, corrida el domingo 18 de enero de 2026 con dos distancias, 18K y 10K. SUCA Timing publicó los resultados de las dos. La página del organizador ya anuncia la edición siguiente, para enero de 2027.
  en: The 2026 edition of SUCA Sports' trail race in Punta Ballena, Maldonado, held on Sunday 18 January 2026 over two distances, 18K and 10K. SUCA Timing published the results of both. The organizer's page already announces the next edition, for January 2027.
