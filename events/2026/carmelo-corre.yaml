description:
  es: Carrera de 5 y 10 km en Carmelo, corrida el domingo 3 de mayo de 2026 con largada a las 11:00 desde el anfiteatro de Playa Seré. La 10K tuvo premios por categorías de edad y la 5K, premios para menores de 12 a 15 años; la inscripción costaba $850. Encarrera tuvo la inscripción y publicó los resultados.
  en: A 5 and 10 km race in Carmelo, held on Sunday 3 May 2026, starting at 11:00 from the Playa Seré amphitheatre. The 10K had age-group prizes and the 5K had prizes for ages 12 to 15; entry cost $850. Encarrera handled registration and published the results.
