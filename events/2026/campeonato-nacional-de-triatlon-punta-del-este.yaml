description:
  es: Primera fecha del Campeonato Nacional de Triatlón 2026-2027 de la Unión de Triatlón del Uruguay, el domingo 1 de noviembre en el Puente de la Barra, Punta del Este. Modalidades Sprint y Promocional; la inscripción también tiene categorías AG Grup, Postas y MTB. Los no federados pueden correr con un permiso por el día, pero solo los federados suman puntos para el ranking. La página no da horarios ni distancias y la Unión remite a sus redes sociales.
  en: First date of the 2026-2027 Campeonato Nacional de Triatlón of the Unión de Triatlón del Uruguay, on Sunday 1 November at Puente de la Barra, Punta del Este. Sprint and Promocional formats; registration also has AG Grup, relay (Postas) and MTB categories. Non-federated athletes may race on a one-day permit, but only federated ones score ranking points. The page gives no start times or distances, and the union refers to its social media.
