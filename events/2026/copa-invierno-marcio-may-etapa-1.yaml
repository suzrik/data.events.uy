name: Copa Invierno Marcio May, etapa 1
date: 2026-05-31
sport: mtb
city: Puntas de Valdez
organizer: La Sierra Eventos Deportivos
links:
  site: https://lasierra.uy/copa-invierno-marcio-may/
  instagram: https://www.instagram.com/la_sierra_eventos_deportivos/
description:
  es: Primera de las tres etapas de la Copa Invierno Marcio May 2026, campeonato de mountain bike de La Sierra Eventos Deportivos, corrida el domingo 31 de mayo de 2026 en Puntas de Valdez, San José. La página de la copa en el sitio del organizador da la fecha, el lugar y 270 competidores, con fotos; la clasificación final de la copa en Encarrera incluye esta fecha.
  en: First of the three stages of the 2026 Copa Invierno Marcio May, a mountain bike championship by La Sierra Eventos Deportivos, held on Sunday 31 May 2026 in Puntas de Valdez, San José. The cup page on the organizer's site gives the date, the place and 270 competitors, with photos; the final cup standings on Encarrera include this round.
