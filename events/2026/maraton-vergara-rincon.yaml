description:
  es: Carrera en Vergara, Treinta y Tres, el domingo 15 de noviembre, con largada a las 16:30 en la Plaza Central. Hay 18 km y 5 km, con cuatro categorías por edad (16 a 29, 30 a 45, 46 a 59 y más de 60). La inscripción cuesta $450 en 18K y $350 en 5K. Inscripción y cronometraje en Cronometra Mauá; el organizador no figura en la página.
  en: A race in Vergara, Treinta y Tres, on Sunday 15 November, starting at 16:30 at the main square. There are 18 km and 5 km, with four age categories (16–29, 30–45, 46–59 and over 60). Entry costs $450 for the 18K and $350 for the 5K. Registration and timing by Cronometra Mauá; the page does not name the organizer.
