description:
  es: Fecha de la Night Trail en el balneario Kiyú, San José, corrida el sábado 28 de febrero de 2026 sobre 7 km. Según la página de la edición en el sitio de La Sierra Eventos Deportivos, que organizó, largaron 730 competidores; Encarrera publicó los resultados con esa fecha.
  en: The Kiyú round of the Night Trail, held on Saturday 28 February 2026 at the Kiyú beach resort, San José, over 7 km. According to the edition page on the site of organizer La Sierra Eventos Deportivos, 730 runners started; Encarrera published the results under that date.
