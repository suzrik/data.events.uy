name: Backyard Navidad
date: 2026-12-19
time: "07:00"
sport: run
city: Montevideo
venue: Plaza de Deportes N.º 12
organizer: Legión Athletic
links:
  instagram: https://www.instagram.com/legion.tysson/
description:
  es: Carrera backyard de Legión Athletic, el sábado 19 de diciembre de 2026 en Montevideo, con largada a las 7:00 en la Plaza de Deportes N.º 12; es la última backyard del año de Legión. Hay trofeo y medalla finisher, premio a la vuelta más rápida, al mejor disfraz navideño y trofeos a los últimos de pie. La inscripción es por WhatsApp, al 094 010 859, según el anuncio de Legión del 25 de noviembre.
  en: Backyard race by Legión Athletic, on Saturday 19 December 2026 in Montevideo, starting at 7:00 at Plaza de Deportes No. 12; it is Legión's last backyard of the year. There are a finisher trophy and medal and prizes for the fastest lap, the best Christmas costume and trophies for the last ones standing. Registration is by WhatsApp, at 094 010 859, according to Legión's announcement of 25 November.
