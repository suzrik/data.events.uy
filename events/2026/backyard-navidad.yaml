description:
  es: Carrera backyard de Legión Athletic, el sábado 19 de diciembre de 2026 en Montevideo, fecha 4 de su Campeonato 2026, con el lema «¿quién será el último de pie?». La fecha sale del afiche con el logo de Legión que publicó un participante; el organizador todavía no la publicó en su propia cuenta. La hora, el lugar y la inscripción no figuran.
  en: Backyard race by Legión Athletic, on Saturday 19 December 2026 in Montevideo, round 4 of its 2026 Championship, with the slogan "who will be the last one standing?". The date comes from a poster with the Legión logo posted by a participant; the organizer has not published it on its own account yet. Time, venue and registration are not given.
