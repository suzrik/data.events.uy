description:
  es: Carrera backyard de Legión Athletic, el sábado 19 de diciembre de 2026 en Montevideo, con largada a las 6:00 en el patio de su templo, «La 12»; es la fecha 4 de su Campeonato 2026. Hay trofeo y medalla finisher, premio a la vuelta más rápida, al mejor disfraz navideño y a los tres últimos de pie. La inscripción es por WhatsApp, al 094 010 859, según el anuncio de Legión del 5 de noviembre.
  en: Backyard race by Legión Athletic, on Saturday 19 December 2026 in Montevideo, starting at 6:00 in the yard of its gym, "La 12"; it is round 4 of its 2026 Championship. There are a finisher trophy and medal and prizes for the fastest lap, the best Christmas costume and the last three standing. Registration is by WhatsApp, at 094 010 859, according to Legión's announcement of 5 November.
