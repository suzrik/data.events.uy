description:
  es: Triple Desafío del Lago, final del Campeonato Salteño de MTB 2026 (4.ª y 5.ª fecha), en el Parque del Lago de Salto. El sábado 28 de noviembre hay 40 km con largada a las 9:00 y una contrarreloj individual de 10 km a las 14:00; el domingo 29, 70 km a las 9:00. Hay categorías promocional, damas, open elite, máster y e-bike. La inscripción se hace en Punto de Control y cuesta $1500 los dos días o $1000 solo el domingo.
  en: Triple Desafío del Lago, the final of the 2026 Salto MTB championship (rounds 4 and 5), at Parque del Lago in Salto. On Saturday 28 November there is a 40 km race starting at 9:00 and a 10 km individual time trial at 14:00; on Sunday 29, 70 km at 9:00. There are promotional, women's, open elite, master and e-bike categories. Registration is on Punto de Control and costs $1,500 for both days or $1,000 for Sunday only.
