description:
  es: "Carrera por etapas para élite y sub-23 masculinos del calendario regional de la Federación Ciclista Uruguaya (FCU), corrida del miércoles 1 al domingo 5 de abril de 2026 en Artigas, con ciclistas de Uruguay, Argentina y Brasil. Fueron cinco etapas, una de ellas una contrarreloj individual de 16 km. La FCU la da por finalizada y publicó los primeros puestos de cada etapa."
  en: "Stage race for men's elite and under-23 riders on the regional calendar of the Uruguayan Cycling Federation (FCU), held from Wednesday 1 to Sunday 5 April 2026 in Artigas, with riders from Uruguay, Argentina and Brazil. There were five stages, one of them a 16 km individual time trial. The FCU lists it as finished and published the top places of each stage."
