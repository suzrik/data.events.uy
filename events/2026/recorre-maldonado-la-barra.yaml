description:
  es: Segunda etapa de la serie Recorre Maldonado 2026, organizada por SUCA Sports, corrida el sábado 11 de abril de 2026 a las 15 hs en La Barra, Maldonado, con subidas y bajadas y el cruce del puente sobre el arroyo Maldonado. Hubo 10K y 5K; SUCA publicó los resultados de las dos distancias.
  en: Second stage of the 2026 Recorre Maldonado series, organized by SUCA Sports, held on Saturday 11 April 2026 at 3 pm in La Barra, Maldonado, a rolling course that crosses the bridge over the Maldonado stream. There were 10K and 5K races; SUCA published the results of both.
