description:
  es: "2.ª Vuelta Máster y Femenina de Durazno, carrera por etapas de la Federación Ciclista Uruguaya (FCU), corrida el sábado 28 y el domingo 29 de marzo de 2026 en Durazno. Tuvo un prólogo de 3 km y dos etapas más, para ciclistas con licencia máster y damas. La FCU la da por finalizada y publicó la clasificación general de máster A y B, máster C, D y E y femenina."
  en: "The 2nd Vuelta Máster y Femenina de Durazno, a stage race of the Uruguayan Cycling Federation (FCU), held on Saturday 28 and Sunday 29 March 2026 in Durazno. It had a 3 km prologue and two more stages, for licensed master riders and women. The FCU lists it as finished and published the overall classification for master A and B, master C, D and E, and women."
