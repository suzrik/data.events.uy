description:
  es: Trail nocturno de Mil Horizontes en el Balneario Las Flores, Maldonado, el sábado 24 de enero de 2026, con largada a las 20:00 y distancias de 13 y 7 km. Hubo premiación a los cinco primeros de la general y por categorías de edad, y musculosa oficial opcional.
