description:
  es: Trail en San Ramón, Canelones, el domingo 25 de octubre, con largada a las 10:00 desde la Escuela 53 Casildo Larrañaga y entrega de kits desde las 8:00. Hay 4,5 km con categoría única y 9 y 12,5 km con categorías por edad; premios del primero al tercero por categoría, medalla finisher para todos y premio al grupo más numeroso. Cuesta $600 en los 4,5 km y $800 en las otras distancias, y se paga en la escuela. La inscripción se hace en la web de Crono MTB. Consultas al 098 968 163.
  en: Trail race in San Ramón, Canelones, on Sunday 25 October, starting at 10:00 from Escuela 53 Casildo Larrañaga, with kit pick-up from 8:00. There is a 4.5 km with a single category and 9 and 12.5 km with age groups; prizes for the top three per category, a finisher medal for all and a prize for the largest group. It costs $600 for the 4.5 km and $800 for the other distances, paid at the school. Registration is on the Crono MTB website. Enquiries at 098 968 163.
