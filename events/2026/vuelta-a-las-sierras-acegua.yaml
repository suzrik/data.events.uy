name: Vuelta de las Sierras, 4ª fecha del Campeonato Departamental de Cerro Largo
date: 2026-09-13
time: "10:00"
sport: mtb
city: Aceguá
venue: Cantero central de Aceguá
distances: [47 km, 32 km]
organizer: Aceguá Ciclismo
links:
  instagram: https://www.instagram.com/comisiondemtbcerrolargo/
description:
  es: 12.ª Vuelta de las Sierras, carrera de MTB en Aceguá, Cerro Largo, en la frontera con Brasil, el domingo 13 de setiembre de 2026, cuarta fecha del Campeonato Departamental de MTB de Cerro Largo, en homenaje a Alejandro Lucas. Largó a las 10:00 desde el cantero central; la inscripción fue en el lugar y costó $500 o R$ 60. Los afiches anunciaron 35 km y una distancia larga de 42 o de 54 km según la versión; los resultados publicados por la Comisión de MTB figuran en 47 y 32 km.
  en: 12th Vuelta de las Sierras, an MTB race in Aceguá, Cerro Largo, on the border with Brazil, on Sunday 13 September 2026, the fourth round of the Cerro Largo departmental MTB championship, in tribute to Alejandro Lucas. It started at 10:00 from the central median; registration was on site and cost $500 or R$ 60. The posters announced 35 km and a long course of 42 or 54 km depending on the version; the results published by the MTB commission list 47 and 32 km.
