description:
  es: Etapa 8 de las 9 de la serie Recorre Maldonado, organizada por SUCA Sports. Largada a las 17 hs desde el Rosedal, detrás del Argentino Hotel, con recorrido por la rambla y las calles del centro de Piriápolis. Hay una prueba participativa de 5K para juveniles, corredores y caminantes y una competitiva de 10K. La inscripción es única para toda la serie y se paga al retirar el kit.
  en: Stage 8 of the 9 in the Recorre Maldonado series, organized by SUCA Sports. It starts at 5 pm at the Rosedal, behind the Argentino Hotel, and runs along the waterfront and the downtown streets of Piriápolis. There is a 5K participatory race for youth, runners and walkers, and a competitive 10K. Registration is a single one for the whole series and is paid when picking up the kit.
