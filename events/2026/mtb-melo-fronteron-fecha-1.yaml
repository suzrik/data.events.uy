name: MTB Melo, 1ª fecha del Campeonato Fronterón y 3ª del Departamental de Cerro Largo
date: 2026-04-12
time: "09:00"
sport: mtb
city: Melo
venue: Autódromo de AVA
distances: [68 km, 34 km]
links:
  instagram: https://www.instagram.com/comisiondemtbcerrolargo/
  register: https://www.puntodecontrol.com.uy/inscripcion-primer-fecha-fronteron-2026/
description:
  es: Carrera de MTB en Melo, Cerro Largo, el domingo 12 de abril de 2026, primera fecha del Campeonato Fronterón 2026 (20.ª edición) y tercera del Campeonato Departamental de MTB de Cerro Largo. Largó a las 9:00 en el Autódromo de AVA, con 68 km y 34 km. La inscripción fue por Punto de Control y costó $950 hasta el 31 de marzo y $1150 del 1 al 11 de abril. Hubo premios en efectivo al podio general de damas y caballeros; la Comisión de MTB publicó los resultados.
  en: MTB race in Melo, Cerro Largo, on Sunday 12 April 2026, the first round of the 2026 Fronterón championship (20th edition) and the third of the Cerro Largo departmental MTB championship. It started at 9:00 at the AVA race track, with 68 km and 34 km courses. Registration was through Punto de Control and cost $950 until 31 March and $1150 from 1 to 11 April. There were cash prizes for the overall women's and men's podium; the MTB commission published the results.
