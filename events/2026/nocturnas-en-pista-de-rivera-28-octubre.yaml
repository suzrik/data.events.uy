description:
  es: Carrera nocturna de ciclismo, disciplina ruta según la FCU, en una pista de Rivera el miércoles 28 de octubre, organizada por la Liga de Ciclismo Departamental de Rivera y fiscalizada por la Federación Ciclista Uruguaya en su calendario regional. Es otra fecha de las nocturnas, tras la del 21 de octubre. Según la página de la FCU admite las categorías Élite, Sub-23, Junior, Máster A a E, Promocional y damas Élite, Sub-23 y Junior. La hora, el lugar exacto y las distancias no están publicados.
  en: Night cycling race, listed as road by the FCU, on a track in Rivera on Wednesday 28 October, organized by the Liga de Ciclismo Departamental de Rivera and supervised by the Uruguayan Cycling Federation on its regional calendar. It is another round of the night races, after the one on 21 October. According to the FCU page it admits the Elite, Under-23, Junior, Máster A to E, Promocional and women's Elite, Under-23 and Junior categories. The time, exact place and distances are not published.
