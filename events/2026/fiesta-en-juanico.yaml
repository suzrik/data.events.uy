description:
  es: Carrera de ruta de un día en Juanicó, Canelones, el sábado 5 de diciembre, de la Federación Canaria de Ciclismo y el Club Ciclista Juanicó; figura en el calendario regional de la Federación Ciclista Uruguaya. Es para las categorías Máster A a E de hombres y élite y sub-23 de mujeres, con licencia de la federación; no hay categoría élite masculina. El recorrido, las distancias y la inscripción todavía no están publicados.
  en: One-day road race in Juanicó, Canelones, on Saturday 5 December, run by the Federación Canaria de Ciclismo and Club Ciclista Juanicó; it is on the regional calendar of the Uruguayan Cycling Federation. It is for the men's Master A to E and the women's elite and under-23 categories, with a federation licence; there is no men's elite category. The course, distances and registration are not published yet.
