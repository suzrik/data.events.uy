name: Fiesta en Juanicó
date: 2026-12-05
sport: road
city: Juanicó
entry: license
organizer: Federación Canaria de Ciclismo y Club Ciclista Juanicó
links:
  site: https://federacionciclista.com.uy/calendario/
description:
  es: Cancelado; la Federación Ciclista Uruguaya retiró la carrera de su calendario y borró su página, sin comunicado. Iba a ser una carrera de ruta de un día en Juanicó, Canelones, el sábado 5 de diciembre, de la Federación Canaria de Ciclismo y el Club Ciclista Juanicó, para las categorías Máster A a E de hombres y élite y sub-23 de mujeres, con licencia de la federación.
  en: Cancelled; the Uruguayan Cycling Federation removed the race from its calendar and deleted its page, with no notice. It was to be a one-day road race in Juanicó, Canelones, on Saturday 5 December, run by the Federación Canaria de Ciclismo and Club Ciclista Juanicó, for the men's Master A to E and the women's elite and under-23 categories, with a federation licence.
