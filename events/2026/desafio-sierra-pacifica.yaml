description:
  es: Nueva edición del trail de Sierra Pacífica, un complejo de domos a 10 km de Minas, Lavalleja, el domingo 15 de noviembre, con recorridos de 7 y 12 km entre senderos, agua y sierras. Según las publicaciones del organizador del 30 de setiembre y el 9 de octubre, la inscripción cuesta $600 y la remera oficial $750; se sortean dos estadías entre los participantes y el grupo más numeroso gana un descuento en alojamiento. Inscripciones y consultas al 093 301 388 o 094 165 222.
  en: New edition of the trail race at Sierra Pacífica, a dome lodging 10 km from Minas, Lavalleja, on Sunday 15 November, with 7 and 12 km courses over trails, water and hills. According to the organizer's posts of 30 September and 9 October, entry costs $600 and the official shirt $750; two stays are raffled among participants and the largest group wins a lodging discount. Registration and enquiries at 093 301 388 or 094 165 222.
