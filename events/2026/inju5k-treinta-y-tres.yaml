description:
  es: Carrera de 5 km del Instituto Nacional de la Juventud (INJU) en Treinta y Tres, el viernes 13 de noviembre. Largada a las 18:00 en el Polideportivo. Para mayores de 13 años; los menores de 18 necesitan permiso firmado y todos un certificado médico. Hay inscripción en línea y también el día de la carrera. Las fechas pueden cambiar.
  en: 5 km race of the Instituto Nacional de la Juventud (INJU) in Treinta y Tres, on Friday 13 November. Start at 18:00 at the Polideportivo. For people over 13; under-18s need a signed permission and everyone a medical certificate. Registration is online and also on race day. Dates may change.
