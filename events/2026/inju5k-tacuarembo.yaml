  es: Carrera de 5 km del Instituto Nacional de la Juventud (INJU) en Tacuarembó, el jueves 22 de octubre con largada en Polideportivo. Hora de largada a confirmar. Para mayores de 13 años; los menores de 18 necesitan permiso firmado y todos un certificado médico. Hay inscripción en línea y también el día de la carrera. Las fechas pueden cambiar.
  en: 5 km race of the Instituto Nacional de la Juventud (INJU) in Tacuarembó, on Thursday 22 October, starting at Polideportivo. Start time to be confirmed. For people over 13; under-18s need a signed permission and everyone a medical certificate. Registration is online and also on race day. Dates may change.
