description:
  es: Campeonato nacional de cross country olímpico (XCO) de la Federación Ciclista Uruguaya, en Rocha. Es la prueba pendiente del Campeonato Nacional de XCC y XCO de julio; el XCO se suspendió por mal tiempo, se pasó al 9 de agosto y se volvió a suspender. El calendario de la FCU lo tiene ahora el sábado 17 de octubre, con categorías élite, sub-23 y junior de hombres y mujeres y máster A a E de hombres. La FCU todavía no publicó horario, circuito ni inscripción para esta fecha.
  en: National Olympic cross-country (XCO) championship of the Uruguayan Cycling Federation, in Rocha. It is the race left pending from the national XCC and XCO championship in July; the XCO was suspended because of the weather, moved to 9 August and suspended again. The FCU calendar now has it on Saturday 17 October, with men's and women's elite, under-23 and junior categories and men's Master A to E. The FCU has not yet published the start time, the course or registration for this date.
