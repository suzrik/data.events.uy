description:
  es: Etapa 5 de Rocha Corre, el sábado 5 de diciembre a las 17:00 en Punta del Diablo, desde el Mirador El Pez (Playa El Rivero). Es el campeonato de running de la Intendencia de Rocha y su Dirección de Deportes, con siete etapas por el departamento entre agosto de 2026 y febrero de 2027. La 5K es participativa y la 10K competitiva, con cronometraje oficial con chip y medalla finisher. Cada distancia cuesta $400 en lolograste. Se puede correr una etapa suelta o el campeonato completo.
  en: Stage 5 of Rocha Corre, on Saturday 5 December at 17:00 in Punta del Diablo, from the Mirador El Pez (Playa El Rivero). It is a running championship run by the Rocha city government and its Sports Directorate, with seven stages across the department between August 2026 and February 2027. The 5K is participatory and the 10K competitive, with official chip timing and a finisher medal. Each distance costs $400 on lolograste. You can run a single stage or the whole championship.
