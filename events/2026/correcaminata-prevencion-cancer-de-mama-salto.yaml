name: Correcaminata por la Prevención del Cáncer de Mama
date: 2026-10-23
time: "18:00"
sport: run
city: Salto
venue: Unidad Básica Asistencial 5, Chile y Grito de Asencio
distances: [5K]
organizer: Red de Atención Primaria de Salto (ASSE)
links:
  site: https://www.salto.gub.uy/noticias/este-viernes-23-de-octubre-se-realizara-la-quinta-correcaminata-por-la-prevencion-del
description:
  es: Quinta correcaminata por la prevención del cáncer de mama de la Red de Atención Primaria de ASSE en Salto, con apoyo del área de Deportes del Gobierno de Salto, el viernes 23 de octubre de 2026 a las 18:00, con salida y llegada en la UBA 5. Fue gratuita y sin inscripción, con medalla para quienes terminaron y la consigna de ir de rosado; según El Pueblo, el recorrido fue de 5 km y hubo gran participación.
  en: Fifth run-walk for breast cancer prevention by ASSE's primary care network in Salto, supported by the Gobierno de Salto's sports department, on Friday 23 October 2026 at 18:00, starting and finishing at UBA 5. It was free with no registration, with a medal for finishers and pink as the dress code; according to El Pueblo, the course was 5 km and turnout was large.
