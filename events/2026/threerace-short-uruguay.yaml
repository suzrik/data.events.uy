description:
  es: Carrera de MTB de un día, de 63 km y 630 m de desnivel positivo, con salida a las 8:30 en La Pedrera, Rocha. Usa el recorrido de la tercera y última etapa de la Threerace Bike Ultramarathon Uruguay y se corre el mismo domingo. Organizan Threerace Sports y Azimut Extremo. Las inscripciones, en Lolograste, están abiertas hasta el 15 de octubre. Los kits se entregan el sábado 31 de 16:00 a 19:00 en la Arena Threerace de La Paloma y el domingo de 7:00 a 7:45 en la salida.
  en: One-day MTB race of 63 km and 630 m of climbing, starting at 8:30 in La Pedrera, Rocha. It uses the course of the third and last stage of the Threerace Bike Ultramarathon Uruguay and is held on the same Sunday. Organized by Threerace Sports and Azimut Extremo. Registration, on Lolograste, is open until 15 October. Kits are handed out on Saturday 31 from 16:00 to 19:00 at the Arena Threerace in La Paloma and on Sunday from 7:00 to 7:45 at the start.
