description:
  es: Rodada solidaria del grupo MTB Contra Viento y Marea a beneficio de la Fundación Teletón, el domingo 13 de diciembre hacia las 17:00 en Ciudad del Plata, San José. Sale del Km 26; los adultos van por la vieja Ruta 1 hasta la rotonda de Playa Pascual y vuelven, y hay un circuito para niños. Cuesta $200 adultos y $50 niños, con medalla para todos. La inscripción es en donaronline, según el anuncio del Municipio de Ciudad del Plata.
  en: Charity ride by the MTB Contra Viento y Marea group in aid of the Fundación Teletón, on Sunday 13 December at about 17:00 in Ciudad del Plata, San José. It leaves from Km 26; adults ride the old Ruta 1 to the Playa Pascual roundabout and back, and there is a kids' circuit. It costs $200 for adults and $50 for children, with a medal for everyone. Registration is on donaronline, according to the Municipio de Ciudad del Plata announcement.
