description:
  es: "Cross country de 8 y 4 km en Colonia Cosmopolita, Colonia, corrido el sábado 30 de mayo de 2026 con largada a las 15:00 desde el Club Cosmopolita. Hubo premios generales en 8K y por categorías de edad en ambas distancias, gratis para los niños; la inscripción con remera costaba $800. Crono MTB, que cronometró, publicó los resultados."
  en: "A cross-country run of 8 and 4 km in Colonia Cosmopolita, Colonia, held on Saturday 30 May 2026, starting at 15:00 from Club Cosmopolita. There were overall prizes in the 8K and age-group prizes in both distances, free for children; entry with a T-shirt cost $800. Crono MTB, which did the timing, published the results."
