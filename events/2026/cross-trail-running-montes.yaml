description:
  es: 3ª edición de este trail en Montes, Canelones, el domingo 18 de octubre de 2026 a las 10 hs, con recorridos de 8K (desde 15 años) y 18K (desde 18 años). Incluye kit, chip de cronometraje, puestos de hidratación y medalla finisher. Las inscripciones cierran el 10 de octubre o antes si se agotan los cupos.
  en: 3rd edition of this trail race in Montes, Canelones, on Sunday 18 October 2026 at 10:00, with 8K (from age 15) and 18K (from age 18) courses. It includes a kit, timing chip, aid stations and a finisher medal. Registration closes on 10 October, or earlier if places run out.
