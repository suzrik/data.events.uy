description:
  es: Trail run de Halloween en el Hipódromo Real de San Carlos, Colonia del Sacramento, el domingo 1 de noviembre de 2026, de 15 a 20 hs. Hay circuitos de 4K y 8K y se puede correr disfrazado. Organiza Colonia Aventura Corre. Incluye hidratación, frutas, mesa de carbohidratos en la llegada y medalla para todos. Se premia la general de hombres y mujeres en las dos distancias, y también los mejores disfraces individuales y grupales.
  en: Halloween trail run at the Real de San Carlos racecourse, Colonia del Sacramento, on Sunday 1 November 2026, from 3 to 8 pm. There are 4K and 8K courses and you can run in costume. Organized by Colonia Aventura Corre. It includes hydration, fruit, a carbohydrate table at the finish and a medal for everyone. Awards go to the overall men and women in both distances, and also to the best individual and group costumes.
