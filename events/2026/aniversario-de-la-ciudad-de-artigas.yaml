description:
  es: Carrera de ruta por el aniversario de la ciudad de Artigas, el domingo 6 de setiembre de 2026, organizada por la Federación Ciclista Departamental de Artigas dentro del calendario regional de la Federación Ciclista Uruguaya. Hubo categorías élite, sub-23, junior y máster, con corredores de Artigas, Tacuarembó, Rivera y otros departamentos. La federación publicó los participantes y la clasificación general y de máster.
  en: Road race for the anniversary of the city of Artigas, on Sunday 6 September 2026, organized by the Federación Ciclista Departamental de Artigas on the regional calendar of the Uruguayan Cycling Federation. There were elite, under-23, junior and master categories, with riders from Artigas, Tacuarembó, Rivera and other departments. The federation published the entry list and the overall and master classifications.
