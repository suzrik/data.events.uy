description:
  es: Campeonato nacional de ruta para las categorías Máster A a E (hombres), el sábado 14 y el domingo 15 de noviembre en Melo, Cerro Largo, organizado por la Federación Ciclista de Cerro Largo; figura en el calendario de la Federación Ciclista Uruguaya. El programa, las distancias y la inscripción todavía no están publicados. En 2025, en Maldonado, el sábado se corrió la contrarreloj individual y el domingo la prueba de ruta. Es para ciclistas con licencia de la federación en categoría máster.
  en: National road championships for the men's Master A to E categories, on Saturday 14 and Sunday 15 November in Melo, Cerro Largo, organized by the Federación Ciclista de Cerro Largo; it is on the calendar of the Uruguayan Cycling Federation. The programme, distances and registration are not published yet. In 2025, in Maldonado, the individual time trial was held on Saturday and the road race on Sunday. It is for riders holding a federation licence in a masters category.
