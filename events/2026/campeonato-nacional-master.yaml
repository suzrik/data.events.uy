description:
  es: Campeonato nacional de ruta para las categorías Máster A a E (hombres), el sábado 5 y el domingo 6 de diciembre en Melo (la FCU lo pasó del 14 y 15 de noviembre), Cerro Largo, organizado por la Federación Ciclista de Cerro Largo; figura en el calendario de la Federación Ciclista Uruguaya. El programa, las distancias y la inscripción todavía no están publicados. Es para ciclistas con licencia de la federación en categoría máster.
  en: National road championships for the men's Master A to E categories, on Saturday 5 and Sunday 6 December in Melo (the FCU moved it from 14 and 15 November), Cerro Largo, organized by the Federación Ciclista de Cerro Largo; it is on the calendar of the Uruguayan Cycling Federation. The programme, distances and registration are not published yet. It is for riders holding a federation licence in a masters category.
