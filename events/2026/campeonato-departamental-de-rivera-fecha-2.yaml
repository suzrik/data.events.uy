name: Campeonato Departamental de Rivera, fecha 2
date: 2026-10-18
sport: road
city: Rivera
venue: Pista del Parque Batlle
entry: license
links:
  site: https://federacionciclista.com.uy/ruta/FY98E6YLU3/
description:
  es: Segunda fecha del campeonato departamental de ruta de la Liga de Ciclismo de Rivera (LICIDERI), fiscalizada por la FCU y organizada por el Club Sarandí Universitario por su 79.º aniversario. Según el afiche del club se corre el domingo 18 de octubre en la pista del Parque Batlle, inscripción a las 08:30 y largada a las 09:00 para Máster C y D, Damas y Junior. La página de la FCU la lista el miércoles 21 de octubre. Distancias sin publicar.
  en: Second round of the departmental road championship of the Liga de Ciclismo de Rivera (LICIDERI), supervised by the FCU and organized by Club Sarandí Universitario for its 79th anniversary. According to the club's poster it is held on Sunday 18 October at the Parque Batlle track, registration at 08:30 and start at 09:00 for Máster C and D, Women and Junior. The FCU page lists it on Wednesday 21 October. Distances not published.
