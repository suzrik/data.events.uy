description:
  es: "Carrera de dos etapas del Campeonato Uruguayo de la Federación Ciclista Uruguaya (FCU), corrida el sábado 7 y el domingo 8 de marzo de 2026 en Canelones. Hubo clasificación general de élite y sub-23 masculinos, de junior masculinos y de élite y sub-23 femeninas. La FCU la da por finalizada y publicó la clasificación."
  en: "Two-stage race of the Campeonato Uruguayo of the Uruguayan Cycling Federation (FCU), held on Saturday 7 and Sunday 8 March 2026 in Canelones. There were overall classifications for men's elite and under-23, men's junior, and women's elite and under-23. The FCU lists it as finished and published the classification."
