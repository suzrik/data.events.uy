description:
  es: 4ª edición de esta carrera en Villa Soriano, departamento de Soriano, el sábado 17 de octubre de 2026. La largada es a las 19:30 y la llegada en el mismo punto, el Parque Ciudad de Dolores. Hay 10K, 5K y una correcaminata infantil gratuita de 200 m. Organizan Tria Iron Eventos Deportivos y Manos a la Obra. El kit se entrega ese día de 15:30 a 18:30 y la inscripción cierra el 12 de octubre. La 10K premia además por categorías de edad y hay medalla finisher para todos.
  en: 4th edition of this race in Villa Soriano, Soriano department, on Saturday 17 October 2026. The start is at 7:30 pm and the finish at the same point, Parque Ciudad de Dolores. There are 10K and 5K races and a free 200 m kids' run. Organized by Tria Iron Eventos Deportivos and Manos a la Obra. Kits are handed out that day from 3:30 to 6:30 pm and registration closes on 12 October. The 10K also has age-group awards and everyone gets a finisher medal.
