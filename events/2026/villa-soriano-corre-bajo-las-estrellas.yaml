description:
  es: Se suspendió por no llegar al mínimo de inscriptos, según el afiche de Tria Iron del 10 de octubre. Iba a ser la 4ª edición de esta carrera en Villa Soriano, Soriano, el sábado 17 de octubre de 2026, con largada a las 19:30 en el Parque Ciudad de Dolores. Tenía 10K, 5K y una correcaminata infantil gratuita de 200 m, organizadas por Tria Iron Eventos Deportivos y Manos a la Obra.
  en: Called off for lack of the minimum number of entrants, according to Tria Iron's poster of 10 October. It was to be the 4th edition of this race in Villa Soriano, Soriano, on Saturday 17 October 2026, starting at 7:30 pm at Parque Ciudad de Dolores, with 10K and 5K races and a free 200 m kids' run, organized by Tria Iron Eventos Deportivos and Manos a la Obra.
