description:
  es: 5K y caminata por los barrios de la cuenca de Casavalle, del Complejo SACUDE, bajo el lema «Ni una infancia utilizada, ni una madre silenciada». Es el sábado 5 de diciembre de 9:00 a 12:30, con salida desde el Centro Cívico Luisa Cuesta y tres recorridos de 700 m, 1700 m y 5K. Es gratuita; la inscripción se hace con el formulario del perfil de SACUDE o en persona en SACUDE, el Centro Cívico y el CEA Casavalle. El calendario de la Intendencia la ubicaba el 7 de noviembre.
  en: A 5K and walk through the neighbourhoods of the Casavalle basin, by the SACUDE complex, under the motto "Ni una infancia utilizada, ni una madre silenciada". It is on Saturday 5 December from 9:00 to 12:30, starting from the Centro Cívico Luisa Cuesta, with three courses of 700 m, 1,700 m and 5K. It is free; sign up with the form on SACUDE's profile or in person at SACUDE, the Centro Cívico and CEA Casavalle. The city sports calendar had placed it on 7 November.
