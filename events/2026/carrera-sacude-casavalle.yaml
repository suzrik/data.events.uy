description:
  es: Cancelado; no consta que se haya corrido. El calendario de eventos deportivos de la Intendencia de Montevideo ubicaba esta carrera del Complejo SACUDE, en Casavalle, el sábado 7 de noviembre de 2026, pero el complejo nunca la anunció y en sus publicaciones del 30 de octubre al 8 de noviembre no hay ninguna mención a una carrera.
  en: Cancelled; there is no record that it was held. The Montevideo city sports calendar placed this race of the SACUDE complex, in Casavalle, on Saturday 7 November 2026, but the complex never announced it and its posts from 30 October to 8 November make no mention of a race.
