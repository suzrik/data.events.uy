name: Fondo Specialized Punta del Este
date: 2026-10-18
sport: road
city: Punta del Este
organizer: Specialized Uruguay
links:
  instagram: https://www.instagram.com/specializeduy/
description:
  es: Salida de ruta en grupo («fondo») de Specialized Uruguay, no competitiva, el domingo 18 de octubre de 2026 en Punta del Este. Según la publicación del organizador del 20 de octubre, con fotos rotuladas «Fondo Specialized 18/10/2026 Punta del Este», fue una mañana de ciclismo; el siguiente fondo quedó para el 8 de noviembre en Punta del Este. Punto de salida, horario y recorrido no figuran en esa publicación.
  en: Non-competitive group road ride ("fondo") by Specialized Uruguay on Sunday 18 October 2026 in Punta del Este. According to the organizer's post of 20 October, with photos labelled "Fondo Specialized 18/10/2026 Punta del Este", it was a morning of cycling; the next fondo was set for 8 November in Punta del Este. Start point, time and route are not in that post.
