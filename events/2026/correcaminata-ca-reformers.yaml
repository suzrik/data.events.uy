description:
  es: Correcaminata del Club Atlético Reformers en Juan Lacaze, corrida el sábado 25 de abril de 2026 con largada a las 16:00 desde el parque Marino Rivero, sede del club. Hubo 5 y 11,2 km, medalla finisher y premios en todas las categorías; la inscripción costaba $600. Encarrera tuvo la inscripción y publicó los resultados.
  en: Run-walk of Club Atlético Reformers in Juan Lacaze, held on Saturday 25 April 2026, starting at 16:00 from Parque Marino Rivero, the club's ground. There were 5 and 11.2 km, a finisher medal and prizes in every category; entry cost $600. Encarrera handled registration and published the results.
