description:
  es: Fecha de ruta del campeonato departamental de la Federación Ciclista Departamental de Tacuarembó, fiscalizada por la Federación Ciclista Uruguaya, el sábado 24 de octubre en Tacuarembó. El calendario de la FCU la lista como «Fecha 2», con categorías Élite, Junior, Sub-23, Máster A a E y damas Élite y Sub-23. El lugar, la hora y las distancias no están confirmados.
  en: Road round of the departmental championship of the Federación Ciclista Departamental de Tacuarembó, supervised by the Uruguayan Cycling Federation, on Saturday 24 October in Tacuarembó. The FCU calendar lists it as «Fecha 2», with the Elite, Junior, Under-23, Máster A to E and women's Elite and Under-23 categories. The place, time and distances are not confirmed.
