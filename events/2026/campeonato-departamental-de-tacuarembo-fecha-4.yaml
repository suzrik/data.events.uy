description:
  es: Fecha de ruta del campeonato departamental de la Federación Ciclista Departamental de Tacuarembó, fiscalizada por la Federación Ciclista Uruguaya, el domingo 1 de noviembre en Tacuarembó. Estaba prevista para el 24 de octubre. El calendario de la FCU la lista como «Fecha 2», con categorías masculinas Élite, Junior, Sub-23 y Máster A a E, y ya designó a los comisarios. El lugar, la hora y las distancias no están confirmados.
  en: Road round of the departmental championship of the Federación Ciclista Departamental de Tacuarembó, supervised by the Uruguayan Cycling Federation, on Sunday 1 November in Tacuarembó. It was planned for 24 October. The FCU calendar lists it as «Fecha 2», with the men's Elite, Junior, Under-23 and Máster A to E categories, and has already named the commissaires. The place, time and distances are not confirmed.
