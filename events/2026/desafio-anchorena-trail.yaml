description:
  es: Carrera de trail por senderos, dunas y costa dentro del Parque Nacional Aarón de Anchorena, con largada y llegada en el parque. Según el organizador, Colonia Aventura Corre y Solo Carreras son las únicas organizaciones autorizadas a correr allí. El organizador anuncia la edición 2026 con fecha a confirmar; el mes que mostramos es solo una referencia.
  en: Trail race on paths, dunes and shore inside Parque Nacional Aarón de Anchorena, starting and finishing in the park. According to the organizer, Colonia Aventura Corre and Solo Carreras are the only organizations authorized to hold races there. The organizer announces the 2026 edition with the date to be confirmed; the month shown is only a placeholder.
