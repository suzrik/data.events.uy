description:
  es: Carrera de trail por senderos, dunas y costa dentro del Parque Nacional Aarón de Anchorena, con largada y llegada en el parque. Según el organizador, Colonia Aventura Corre y Solo Carreras son las únicas organizaciones autorizadas a correr allí. La fecha 2026 figura como a confirmar; el mes es una estimación a partir de la edición de octubre de 2025.
  en: Trail race on paths, dunes and shore inside Parque Nacional Aarón de Anchorena, starting and finishing in the park. According to the organizer, Colonia Aventura Corre and Solo Carreras are the only organizations authorized to hold races there. The 2026 date is listed as to be confirmed; the month is an estimate based on the October 2025 edition.
