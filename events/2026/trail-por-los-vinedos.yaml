description:
  es: 2ª edición de este trail entre viñedos, el domingo 18 de octubre de 2026 con largada a las 9:30 en Bodega Rovere, San José. Hay 7K y 15K, con medalla finisher para todos, puestos de hidratación y comida, sorteos y degustación de vinos al final. La remera estaba incluida hasta el 30 de setiembre.
  en: 2nd edition of this vineyard trail race, on Sunday 18 October 2026 with a 9:30 start at Bodega Rovere, San José. There are 7K and 15K courses, with a finisher medal for everyone, aid stations, food, prize draws and wine tasting at the end. The shirt was included until 30 September.
