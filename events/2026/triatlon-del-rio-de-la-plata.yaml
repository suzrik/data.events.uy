  es: Edición 2026 del Triatlón del Río de la Plata, corrida el domingo 1 de febrero en el balneario Boca del Cufré, San José. La página de la edición en el sitio de La Sierra Eventos Deportivos, que organizó, da la fecha y 220 competidores, con fotos.
