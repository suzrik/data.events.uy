description:
  es: Penúltima fecha del campeonato departamental de ruta de la Federación Ciclista Departamental de Tacuarembó, fiscalizada por la Federación Ciclista Uruguaya, el viernes 11 de diciembre de noche en el circuito de la Residencia. Según el afiche, la inscripción es a las 20:00 y cuesta $300; largan a las 20:30 máster, montaña, damas y novicios, y a las 22:00 élite, junior y sub-23.
  en: Second-to-last round of the departmental road championship of the Federación Ciclista Departamental de Tacuarembó, supervised by the Uruguayan Cycling Federation, on the night of Friday 11 December on the Residencia circuit. According to the poster, sign-up is at 20:00 and costs $300; master, mountain, women and novice riders start at 20:30, and elite, junior and under-23 at 22:00.
