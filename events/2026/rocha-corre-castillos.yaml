description:
  es: Etapa 1 de Rocha Corre 2026/2027, campeonato de running de la Intendencia de Rocha y su Dirección de Deportes, corrida el sábado 29 de agosto de 2026 en Castillos con largada a las 16:00. Hubo una 5K y una 10K; la inscripción costaba $400 la etapa. La fecha y el lugar figuran en el calendario de rochacorre.uy y en la página de inscripción; Encarrera publicó los resultados.
  en: Stage 1 of Rocha Corre 2026/2027, a running championship run by the Rocha city government and its Sports Directorate, held on Saturday 29 August 2026 in Castillos, starting at 16:00. There was a 5K and a 10K; entry cost $400 per stage. The date and place are on the rochacorre.uy calendar and the registration page; Encarrera published the results.
