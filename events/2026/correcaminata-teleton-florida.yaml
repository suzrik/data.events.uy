name: Correcaminata Teletón Florida
date: 2026-11-14
sport: run
city: Florida
venue: Frente a Florida Cowork, Gallinal casi Rivera
links:
  site: https://www.gub.uy/intendencia-florida/comunicacion/noticias/correcaminata-sorteos-actividades-solidarias-teleton-florida
description:
  es: Correcaminata solidaria por la Teletón en Florida, el sábado 14 de noviembre de 2026, frente a Florida Cowork, en calle Gallinal casi Rivera, durante la jornada de la Fundación Teletón. Según la Intendencia de Florida, la acompañaron ventas de hamburguesas, sorteos y remates de camisetas. La hora, la distancia y el organizador no se publicaron.
  en: A charity run-walk for the Teletón in Florida, on Saturday 14 November 2026, in front of Florida Cowork on Gallinal near Rivera, during the Teletón Foundation's fundraising day. According to the Intendencia de Florida, it came with burger sales, raffles and auctions of football shirts. The time, distance and organizer were not published.
