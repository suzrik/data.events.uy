description:
  es: Cuarta y última etapa del campeonato La Heroica Corre 2026, con largada a las 8:00 en Termas de Guaviyú, Paysandú. Hay 5K y 10K, en modalidad competitiva o recreativa, por senderos y monte nativo con agua y barro, con cronometraje con chip. La inscripción incluye el ingreso gratis al predio termal. Organizan Supérate Total Training y La Heroica Corre.
  en: Fourth and final stage of the La Heroica Corre 2026 championship, starting at 8:00 at Termas de Guaviyú, Paysandú. It offers 5K and 10K, competitive or recreational, over trails and native woodland with water and mud, with chip timing. Registration includes free entry to the thermal grounds. Organized by Supérate Total Training and La Heroica Corre.
