description:
  es: Trail en el Aeroclub de Paso de los Toros, dentro del Festival de las Cometas, el domingo 20 de setiembre de 2026. Las distancias de 6K y 12K largaron juntas a las 11:30 y a las 13:00 hubo una Kids Run de 500 metros. La inscripción costaba $1000 para cualquier distancia; la Kids Run se pagaba con alimento para el Refugio Paso de los Toros. Los resultados están publicados en Encarrera.
  en: Trail race at the Paso de los Toros aeroclub, as part of the kite festival, on Sunday 20 September 2026. The 6K and 12K started together at 11:30 and a 500-metre Kids Run followed at 13:00. Entry was $1000 for any distance; the Kids Run was paid with food for the Paso de los Toros animal shelter. Results are published on Encarrera.
