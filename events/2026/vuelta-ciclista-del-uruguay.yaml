name: Vuelta Ciclista del Uruguay
date: 2026-03-26
end_date: 2026-04-05
sport: road
city: Montevideo
entry: elite
organizer: Federación Ciclista Uruguaya
links:
  site: https://federacionciclista.com.uy/ruta/4XJXAVA74A/
description:
  es: "81.ª edición, carrera por etapas de la Federación Ciclista Uruguaya (FCU) para élite y sub-23 masculinos, corrida del jueves 26 de marzo al domingo 5 de abril de 2026, con largada y llegada en Montevideo. Fueron 11 etapas y unos 1785 km, con llegadas en San José, Paso de los Toros, Mercedes, Salto, Paysandú, Tacuarembó, Río Branco, Rocha, Minas y Durazno y una contrarreloj de 19 km en Lago Merín. La FCU la da por finalizada y publicó la clasificación."
  en: "The 81st edition, a stage race of the Uruguayan Cycling Federation (FCU) for men's elite and under-23 riders, held from Thursday 26 March to Sunday 5 April 2026, starting and finishing in Montevideo. It had 11 stages and about 1,785 km, with finishes in San José, Paso de los Toros, Mercedes, Salto, Paysandú, Tacuarembó, Río Branco, Rocha, Minas and Durazno and a 19 km time trial at Lago Merín. The FCU lists it as finished and published the classification."
