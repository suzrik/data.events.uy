name: Recorre Maldonado, etapa San Carlos
date: 2026-09-12
time: "16:00"
sport: run
city: San Carlos
venue: CEDEMCAR
distances: [10K, 5K]
organizer: Suca Sports
links:
  site: https://recorremaldonado.com/las-etapas/
  instagram: https://www.instagram.com/sucasports/
description:
  es: Sexta etapa de la serie Recorre Maldonado 2026, organizada por SUCA Sports, corrida el sábado 12 de setiembre de 2026 a las 16 hs en San Carlos. Largó y llegó en la pista de atletismo del CEDEMCAR, el complejo deportivo de la Intendencia, y recorrió La Alameda junto a los arroyos Maldonado y San Carlos. Hubo 10K y 5K; SUCA publicó los resultados de las dos distancias.
  en: Sixth stage of the 2026 Recorre Maldonado series, organized by SUCA Sports, held on Saturday 12 September 2026 at 4 pm in San Carlos. It started and finished on the athletics track of CEDEMCAR, the city government's sports complex, and ran along La Alameda by the Maldonado and San Carlos streams. There were 10K and 5K races; SUCA published the results of both.
