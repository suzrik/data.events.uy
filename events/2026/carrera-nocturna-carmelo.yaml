  es: Cuarta edición de la carrera nocturna de Carmelo, el sábado 12 de diciembre a las 20:30 en el Teatro de Verano de la Playa Seré, con 2K, 4K y 8K. La organizan Funcional Cross y el gimnasio Zena. Según el anuncio del 3 de noviembre, las inscripciones abren próximamente.
