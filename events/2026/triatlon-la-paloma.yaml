  es: Triatlón en La Paloma, Rocha, con distancias olímpica (1.500 m, 40 km, 10 km) y half (1.900 m, 90 km, 21 km), individual o por postas, con drafting legal. Organiza Ti Len Eventos Deportivos. La página de inscripción da dos fechas distintas, el 22 y el 28 de noviembre, así que solo se indica el mes.
