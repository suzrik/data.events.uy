description:
  es: Triatlón en La Paloma, Rocha, el sábado 28 de noviembre, con largada a las 8:00 en el Puerto de La Paloma. Hay distancia olímpica (1.500 m, 40 km, 10 km) y half (1.900 m, 90 km, 21 km), individual o por postas. Organiza Ti Len Eventos Deportivos, con jueces de la Unión de Triatlón. El reglamento 2026-2027 de la Unión la fija el 28 de noviembre; la fecha se movió del domingo 22, día de las elecciones del BPS, según anunció la Unión el 6 de octubre. La inscripción ya lleva la fecha nueva.
  en: Triathlon in La Paloma, Rocha, on Saturday 28 November, starting at 8:00 at the Puerto de La Paloma. It has Olympic (1,500 m, 40 km, 10 km) and Half (1,900 m, 90 km, 21 km) distances, individual or relay. Organized by Ti Len Eventos Deportivos, with judges from the Unión de Triatlón. The union's 2026-2027 rulebook sets it on 28 November; the date was moved from Sunday 22, the day of the BPS elections, as the union announced on 6 October. Registration already carries the new date.
