description:
  es: Triatlón en La Paloma, Rocha, el sábado 28 de noviembre, con largada a las 8:00 en el Puerto de La Paloma. Hay distancia olímpica (1.500 m, 40 km, 10 km) y half (1.900 m, 90 km, 21 km), individual o por postas. Organiza Ti Len Eventos Deportivos, con jueces de la Unión de Triatlón. El reglamento 2026-2027 de la Unión también la fija el 28 de noviembre; el texto de la página de inscripción todavía muestra otra fecha, el domingo 22 de noviembre.
  en: Triathlon in La Paloma, Rocha, on Saturday 28 November, starting at 8:00 at the Puerto de La Paloma. It has Olympic (1,500 m, 40 km, 10 km) and Half (1,900 m, 90 km, 21 km) distances, individual or relay. Organized by Ti Len Eventos Deportivos, with judges from the Unión de Triatlón. The union's 2026-2027 rulebook also sets it on 28 November; the text of the registration page still shows another date, Sunday 22 November.
