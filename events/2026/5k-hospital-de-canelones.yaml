description:
  es: Carrera solidaria de 5 km del Hospital de Canelones por su 98.º aniversario, corrida el 4 de octubre de 2026 en el Parque Artigas de Canelones, en el Mes de Sensibilización sobre el Cáncer de Mama. Participaron corredores y caminantes; lo recaudado se destina al equipamiento y a la asistencia de los pacientes del hospital. El hospital agradeció a su Comisión de Apoyo y a su Dirección por hacerla posible.
  en: Charity 5 km race of the Hospital de Canelones for its 98th anniversary, held on 4 October 2026 at Parque Artigas in Canelones, during Breast Cancer Awareness Month. Runners and walkers took part; the money raised goes to equipment and patient care at the hospital. The hospital thanked its support committee and its management for making it happen.
