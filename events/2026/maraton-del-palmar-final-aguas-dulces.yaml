description:
  es: Final y cuarta fecha del circuito de carreras solidarias Maratón del Palmar 2026, en el Balneario Aguas Dulces, Rocha. Organizan el Municipio de Castillos y Running Juventud. Las distancias varían entre fechas (5K, 10K, trail, entre otras) y todavía no figuran para esta. Se premia también la clasificación por puntos del circuito.
  en: Final and fourth round of the 2026 Maratón del Palmar charity race circuit, at Balneario Aguas Dulces, Rocha. Organized by the Municipio de Castillos and Running Juventud. Distances vary between rounds (5K, 10K, trail and others) and are not listed for this one yet. The circuit points classification is also awarded.
