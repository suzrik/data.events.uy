description:
  es: Carrera de MTB por cerros y senderos serranos, el domingo 11 de octubre en el Camping Aguas Blancas, Lavalleja; RedTickets indica las 9:00. Hay una competitiva de 60 km, con categorías por edad desde juveniles hasta máster E, y una promocional de 30 km para quienes empiezan, que premia a las tres primeras damas y a los tres primeros caballeros. La inscripción se hace en RedTickets.
  en: MTB race over hills and trails of the sierras, on Sunday 11 October at Camping Aguas Blancas, Lavalleja; RedTickets gives 9:00 as the time. There is a 60 km competitive race, with age categories from juniors to Master E, and a 30 km promotional one for beginners, with prizes for the first three women and the first three men. Registration is on RedTickets.
