  en: Trail race at Playa Seré, Carmelo (Colonia), on Sunday 11 October 2026 at 9:00, with 5K and 10K distances. Organized by Carmelo Eventos Deportivos. There are 150 places and registration is on the PinAr platform, which requires logging in. The start time comes from the organizer's poster on Instagram.
