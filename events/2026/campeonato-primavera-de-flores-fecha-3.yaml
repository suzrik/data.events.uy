entry: license
organizer: Federación Ciclista Trinitaria Departamental de Flores
links:
  site: https://federacionciclista.com.uy/ruta/DGALNPSSNF/
description:
  es: Fecha 3 de 9 del Campeonato Primavera de Flores en la página de la federación; el afiche de la Federación Ciclista de Flores, con apoyo de la Intendencia, la anuncia como 2.ª fecha (la del 8 de octubre se suspendió). Carrera nocturna para ciclistas con licencia en la pista José Asconeguy de Trinidad, el jueves 22 de octubre; preliminar a las 19:30 y «vale todo» a las 20:30. Se transmite en vivo por Noche de Juernes en Facebook y YouTube.
  en: Round 3 of 9 of the Campeonato Primavera de Flores on the federation's page; the poster of the Flores cycling federation, backed by the departmental government, calls it the 2nd round (the one of 8 October was called off). A night race for licensed riders on the José Asconeguy track in Trinidad, on Thursday 22 October; preliminary race at 19:30 and the "vale todo" race at 20:30. Streamed live by Noche de Juernes on Facebook and YouTube.
