name: Carrera Benéfica en Villa María
date: 2026-06-07
time: "10:00"
sport: run
city: Villa María
venue: Ruta 3 km 72
distances: [7K, 3K]
links:
  site: https://cronomtb.uy/carrera-benefica-en-villa-maria/
description:
  es: "Carrera benéfica de 7 y 3 km en Villa María, San José, corrida el domingo 7 de junio de 2026 con largada a las 10:00 sobre la ruta 3, km 72. Se hizo para juntar fondos para el viaje de Héctor Gómez al Spartathlon, en Grecia; la inscripción costaba $500 y los niños corrían gratis. Crono MTB, que cronometró, publicó los resultados."
  en: "A charity race of 7 and 3 km in Villa María, San José, held on Sunday 7 June 2026, starting at 10:00 on Route 3 at km 72. It raised money for Héctor Gómez's trip to the Spartathlon in Greece; entry cost $500 and children ran for free. Crono MTB, which did the timing, published the results."
