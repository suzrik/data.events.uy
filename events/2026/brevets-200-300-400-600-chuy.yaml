description:
  es: Brevets de 200, 300, 400 y 600 km de Randonneurs Uruguay en Chuy, Rocha, el sábado 14 de noviembre. Son salidas de larga distancia no competitivas, homologables por el Audax Club Parisien; la organización anuncia que valen para el título Super Randonneur 2026 y que clasifican para la París-Brest-París 2027. Por ahora solo se publicaron la fecha y las distancias; faltan el punto de partida, los horarios y la apertura de inscripciones.
  en: 200, 300, 400 and 600 km brevets by Randonneurs Uruguay in Chuy, Rocha, on Saturday 14 November. These are non-competitive long-distance rides, eligible for homologation by the Audax Club Parisien; the organizer says they count towards the Super Randonneur 2026 title and qualify for Paris-Brest-Paris 2027. So far only the date and the distances are published; the start point, the times and the opening of registration are still to come.
