description:
  es: Brevets de 200, 300, 400 y 600 km de Randonneurs Uruguay en Chuy, Rocha, el sábado 14 de noviembre. Son salidas de larga distancia no competitivas y de autosuficiencia, homologables por el Audax Club Parisien. Las cuatro largan juntas a las 7:00 desde el Marco de la Frontera; los kits se entregan desde las 6:00 en el Hotel Bertelli, en Chuí (Brasil). Cuestan US$ 40, 50, 60 y 70 según la distancia, y la inscripción cierra el 9 de noviembre.
  en: 200, 300, 400 and 600 km brevets by Randonneurs Uruguay in Chuy, Rocha, on Saturday 14 November. These are non-competitive, self-supported long-distance rides, eligible for homologation by the Audax Club Parisien. All four start together at 7:00 from the Marco de la Frontera; kits are handed out from 6:00 at Hotel Bertelli in Chuí (Brazil). They cost US$ 40, 50, 60 and 70 depending on the distance, and registration closes on 9 November.
