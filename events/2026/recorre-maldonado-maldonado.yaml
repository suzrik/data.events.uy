description:
  es: Etapa 9 y final de la serie Recorre Maldonado, organizada por SUCA Sports. Se corre a las 18 hs en la ciudad de Maldonado. Hay una prueba participativa de 5K para juveniles, corredores y caminantes y una competitiva de 10K. Quienes completen las 9 etapas reciben la inscripción gratuita a la carrera San Fernando, y se conocen los ganadores del ranking anual.
  en: Ninth and final stage of the Recorre Maldonado series, organized by SUCA Sports. It is run at 6 pm in the city of Maldonado. There is a 5K participatory race for youth, runners and walkers, and a competitive 10K. Those who complete all 9 stages get free registration to the San Fernando race, and the annual ranking winners are announced.
