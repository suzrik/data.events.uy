description:
  es: Novena edición de esta carrera de MTB en Cardal, Florida, el sábado 7 de noviembre, dentro de la Fiesta de la Leche. La largada es a las 15:00 y los kits se entregan desde las 13:00. Hay 25 km (junior y promocionales) y 50 km (élite, máster A a D y damas A a C), con premiación del 1.º al 5.º puesto por categoría y medalla finisher. La inscripción se hace en Crono MTB y también el día de la carrera.
  en: Ninth edition of this MTB race in Cardal, Florida, on Saturday 7 November, as part of the Fiesta de la Leche. The start is at 15:00 and kits are handed out from 13:00. There are 25 km (junior and promotional) and 50 km (elite, Master A to D and women A to C), with prizes for 1st to 5th place in each category and a finisher medal. Registration is on Crono MTB and also on race day.
