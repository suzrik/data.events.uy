description:
  es: Carrera de 5K en la Escuela N.º 13 de Paysandú, el domingo 13 de setiembre de 2026, con largada a las 9:00 desde la escuela y entrega de kits de 7:30 a 8:45. No había inscripción el día de la carrera; la inscripción costaba $800 con remera o $600 sin ella. Hubo premios a los tres primeros de la general y de cada categoría de edad, y medalla finisher para todos. Crono MTB publicó los resultados.
  en: 5K race at School No. 13 in Paysandú, on Sunday 13 September 2026, starting at 9:00 from the school, with kit pickup from 7:30 to 8:45. There was no race-day registration; entry cost $800 with a shirt or $600 without. The top three overall and in each age category got prizes, and every finisher got a medal. Crono MTB published the results.
