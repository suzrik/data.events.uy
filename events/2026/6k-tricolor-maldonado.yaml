description:
  es: Segunda edición en Maldonado de la carrera de 6 km del Club Nacional de Football, el sábado 19 de setiembre de 2026 a las 10:00, con largada y llegada en la Parada 1 de Punta del Este (3 km de ida y 3 de vuelta). Abierta a socios, hinchas y público en general, con apoyo de la Intendencia de Maldonado. Según el club, participaron unas 500 personas.
  en: Second Maldonado edition of the 6 km race of Club Nacional de Football, on Saturday 19 September 2026 at 10:00, starting and finishing at Parada 1 in Punta del Este (3 km out and 3 km back). Open to members, fans and the general public, supported by the Intendencia de Maldonado. According to the club, about 500 people took part.
