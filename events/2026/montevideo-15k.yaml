description:
  es: Décima edición de la carrera de Prodeporte en la rambla de Montevideo, en el Dique Mauá, con salida simultánea de 15K y 5K el 29 de noviembre. El sitio del organizador da el horario como a confirmar; la página de inscripción indica las 9:00. Forma parte del Campeonato Oficial de Larga Distancia de la Confederación Atlética del Uruguay.
  en: Tenth edition of the Prodeporte race on the Montevideo waterfront, at Dique Mauá, with a simultaneous start for the 15K and 5K on 29 November. The organizer site lists the start time as to be confirmed; the registration page says 9:00. It is part of the Official Long Distance Championship of the Uruguayan Athletics Confederation.
