description:
  es: Segunda fecha del Campeonato Nacional de Duatlón 2026 de la Unión de Triatlón del Uruguay, anunciada para el domingo 7 de junio de 2026 en la Prefectura de Atlántida, con categorías Sprint, Promocional y Postas. Los no federados corrían con licencia por el día, sin sumar puntos. La temporada tuvo fechas en Mercedes, Atlántida, Florida, Durazno, Fray Bentos y Carmelo. No encontramos resultados publicados, así que no consta que se haya corrido.
  en: Second date of the 2026 Campeonato Nacional de Duatlón of the Unión de Triatlón del Uruguay, announced for Sunday 7 June 2026 at the Prefectura in Atlántida, with Sprint, Promocional and relay (Postas) categories. Non-federated athletes could race on a one-day licence without scoring points. The season had dates in Mercedes, Atlántida, Florida, Durazno, Fray Bentos and Carmelo. We found no published results, so there is no record that it was held.
