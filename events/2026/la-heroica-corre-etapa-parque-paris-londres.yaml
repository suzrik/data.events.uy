description:
  es: Segunda fecha de cuatro del campeonato La Heroica Corre 2026, corrida el domingo 14 de junio de 2026 en el Parque Paris Londres de Paysandú. Según la página de inscripción de Encarrera, las dos distancias, 5K y 10K competitivas, largaron juntas a las 9:30 con salida y llegada en el parque, con medalla rompecabezas para los finishers. Organizó Supérate Total Training; Encarrera, que cronometró, publicó los resultados.
  en: Second of four rounds of the La Heroica Corre 2026 championship, held on Sunday 14 June 2026 at Parque Paris Londres in Paysandú. According to the Encarrera registration page, both distances, competitive 5K and 10K, started together at 9:30 with start and finish in the park, and finishers got a puzzle-piece medal. Organized by Supérate Total Training; Encarrera, which did the timing, published the results.
