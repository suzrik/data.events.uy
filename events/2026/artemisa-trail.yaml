description:
  es: Primera edición de un trail de 9K en el Camping Aguas Blancas, Lavalleja, con largada a las 10:00 y cupo de 300 corredores. Organiza Running Minas. Incluye medalla finisher, hidratación, fruta y cronometraje, con premio para las primeras 5 mujeres en llegar. La remera es un extra hasta el 10 de octubre.
  en: First edition of a 9K trail race at Camping Aguas Blancas, Lavalleja, starting at 10:00 with 300 places. Organized by Running Minas. It includes a finisher medal, hydration, fruit and timing, with a prize for the first 5 women across the line. The shirt is an extra until 10 October.
