description:
  es: "63.ª edición de la Fiesta del Pueblo, Gran Premio Gobierno de Treinta y Tres, que abrió el Campeonato Uruguayo Apertura de la Federación Ciclista Uruguaya (FCU) el sábado 10 y el domingo 11 de enero de 2026 en Treinta y Tres. El sábado hubo pruebas en la pista del Polo Deportivo, también para máster, y una etapa en circuito; el domingo, una etapa de ruta de 170 km para élite, sub-23 y junior. La FCU la da por finalizada y publicó las clasificaciones de hombres y mujeres."
  en: "The 63rd Fiesta del Pueblo, Gran Premio Gobierno de Treinta y Tres, opened the Campeonato Uruguayo Apertura of the Uruguayan Cycling Federation (FCU) on Saturday 10 and Sunday 11 January 2026 in Treinta y Tres. On Saturday there were races at the Polo Deportivo track, masters included, and a circuit stage; on Sunday, a 170 km road stage for elite, under-23 and junior. The FCU lists it as finished and published the men's and women's classifications."
