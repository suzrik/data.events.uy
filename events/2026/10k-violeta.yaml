description:
  es: Carrera por el 83.º aniversario del Club Defensor de Paso de los Toros, corrida el sábado 7 de marzo de 2026 con largada a las 19:30 desde el club. Hubo una 5K participativa y una 10K competitiva, con cronometraje con chip, medalla finisher y show en vivo. La fecha figura en la página de inscripción de Ticketfácil; Encarrera publicó los resultados.
  en: Race for the 83rd anniversary of Club Defensor in Paso de los Toros, held on Saturday 7 March 2026, starting at 19:30 from the club. There was a participative 5K and a competitive 10K, with chip timing, a finisher medal and a live show. The date is on the Ticketfácil registration page; Encarrera published the results.
