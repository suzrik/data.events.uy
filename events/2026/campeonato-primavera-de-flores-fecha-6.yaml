description:
  es: Fecha 6 de 9 del Campeonato Primavera de Flores, serie de ciclismo de ruta que la Federación Ciclista Trinitaria Departamental de Flores corre los jueves en Trinidad, del 8 de octubre al 3 de diciembre. Para ciclistas con licencia federativa; además de élite, sub-23 y junior admite las categorías Máster y Promocional. El lugar y la hora de largada y las distancias no figuran en la página de la federación.
  en: Round 6 of 9 of the Campeonato Primavera de Flores, a road cycling series that the Federación Ciclista Trinitaria Departamental de Flores holds on Thursdays in Trinidad, from 8 October to 3 December. For riders with a federation licence; besides elite, under-23 and junior it admits the Máster and Promocional categories. The start place, start time and distances are not on the federation's page.
