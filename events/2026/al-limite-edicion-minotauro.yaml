description:
  es: Carrera de trail de RS Eventos Deportivos en el Cerro del Toro, Piriápolis, corrida el domingo 5 de julio de 2026 con el tema del Minotauro y su laberinto. Hubo un vertical y recorridos de 7 y 15 km. Encarrera publicó los resultados de las tres pruebas y el organizador muestra las fotos de la edición 2026.
  en: Trail race by RS Eventos Deportivos at Cerro del Toro, Piriápolis, held on Sunday 5 July 2026 under the theme of the Minotaur and his labyrinth. There was a vertical and 7 and 15 km courses. Encarrera published the results of all three, and the organizer shows the photos of the 2026 edition.
