description:
  es: Fecha de ruta del campeonato departamental de la Federación Ciclista Departamental de Tacuarembó, fiscalizada por la Federación Ciclista Uruguaya, el domingo 22 de noviembre en Tacuarembó. Según la página de la FCU admite las categorías Élite, Junior, Sub-23, Máster A a E y damas Élite. El lugar, la hora y las distancias no están publicados.
  en: Road round of the departmental championship of the Federación Ciclista Departamental de Tacuarembó, supervised by the Uruguayan Cycling Federation, on Sunday 22 November in Tacuarembó. According to the FCU page it admits the Elite, Junior, Under-23, Máster A to E and women's Elite categories. The place, time and distances are not published.
