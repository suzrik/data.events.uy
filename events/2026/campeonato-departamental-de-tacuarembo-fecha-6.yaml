name: Campeonato Departamental de Tacuarembó, fecha 6
date: 2026-11-22
sport: road
city: Tacuarembó
entry: license
organizer: Federación Ciclista Departamental de Tacuarembó
links:
  site: https://federacionciclista.com.uy/calendario/
description:
  es: Cancelado; la Federación Ciclista Uruguaya retiró esta fecha de su calendario y borró su página, sin comunicado; el calendario de la FCU pasa a tener fechas de Tacuarembó el 11 y el 27 de diciembre. Iba a ser una fecha de ruta del campeonato departamental de la Federación Ciclista Departamental de Tacuarembó el domingo 22 de noviembre, para las categorías Élite, Junior, Sub-23, Máster A a E y damas Élite.
  en: Cancelled; the Uruguayan Cycling Federation removed this round from its calendar and deleted its page, with no notice; the FCU calendar now has Tacuarembó rounds on 11 and 27 December. It was to be a road round of the departmental championship of the Federación Ciclista Departamental de Tacuarembó on Sunday 22 November, for the Elite, Junior, Under-23, Máster A to E and women's Elite categories.
