name: Duatlón Rústico Chamizo Chico
date: 2026-11-01
sport: tri
city: Chamizo
venue: Escuela Rural N.º 59, ruta 94 km 93
distances: ["4,5 km carrera", 26 km MTB]
links:
  site: https://cronomtb.uy/duatlon-chamizo-chico/
  register: https://cronomtb.uy/duatlon-chamizo-chico/
description:
  es: Segunda edición de este duatlón rústico a beneficio de la Escuela Rural N.º 59 de Chamizo Chico, en la ruta 94 km 93, entre Chamizo y Fray Marcos (Florida), el domingo 1 de noviembre. Largada a las 10:00; números de 08:00 a 09:45. Combina 4,5 km de carrera y 26 km en MTB (el afiche redondea a 5 y 27 km), individual con categorías por edad o en duplas masculinas, femeninas o mixtas. Cuesta $800 individual y $1300 la dupla, por Abitab. Organiza San Ramón MTB; inscripción en Crono MTB.
  en: Second edition of this off-road duathlon for the benefit of Escuela Rural No. 59 in Chamizo Chico, on Route 94 km 93 between Chamizo and Fray Marcos (Florida), on Sunday 1 November. Start at 10:00; numbers from 08:00 to 09:45. It combines 4.5 km of running and 26 km on a mountain bike (the poster rounds it to 5 and 27 km), solo with age categories or in men's, women's or mixed pairs. It costs $800 solo and $1,300 per pair, through Abitab. Organized by San Ramón MTB; registration on Crono MTB.
