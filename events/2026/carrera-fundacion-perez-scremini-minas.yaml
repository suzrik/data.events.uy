description:
  es: Carrera solidaria de la Fundación Pérez Scremini, que atiende a niños y adolescentes con cáncer, en la ciudad de Minas. Se corre o se camina 5K o 10K el sábado 21 de noviembre de 2026, con largada a las 15 hs desde la Estación AFE. La inscripción incluye remera oficial y medalla finisher; los kits se retiran en Creditel (25 de Mayo 555) del 16 al 20 de noviembre, de 14 a 17 hs, con cédula y firmando el deslinde. Forma parte de las carreras que la fundación organiza en los 19 departamentos.
  en: Charity race of the Pérez Scremini Foundation, which treats children and adolescents with cancer, in the city of Minas. You can run or walk 5K or 10K on Saturday 21 November 2026, starting at 3 pm from the AFE railway station. Registration includes the official shirt and a finisher medal; kits are collected at Creditel (25 de Mayo 555) from 16 to 20 November, 2 to 5 pm, with your ID and a signed waiver. It is one of the races the foundation holds in all 19 departments.
