description:
  es: Sexta fecha de Las 8 de Soriano, campeonato departamental de running, el sábado 15 de agosto de 2026 en Santa Catalina, Soriano, con largada a las 16:00 y 10K y 5K por categorías. La inscripción costaba $1000 con remera y $1200 el día de la carrera. Crono MTB, que cronometró, publicó los resultados.
  en: Sixth round of Las 8 de Soriano, a departmental running championship, on Saturday 15 August 2026 in Santa Catalina, Soriano, starting at 16:00, with 10K and 5K by category. Entry cost $1000 with a T-shirt and $1200 on race day. Crono MTB, which did the timing, published the results.
