  es: Tercera edición de Corre Caraguatá, carrera del Municipio de Caraguatá, Tacuarembó, el domingo 8 de noviembre, con salida frente a la Plaza del Municipio. El afiche muestra 5K y 10K. La inscripción es gratis y abierta a toda la comunidad. La hora no es segura, porque el texto de la publicación dice 8:00 y el afiche, 8:30.
  en: Third edition of Corre Caraguatá, a race by the Municipio de Caraguatá, Tacuarembó, on Sunday 8 November, starting in front of the Plaza del Municipio. The poster shows 5K and 10K. Entry is free and open to the whole community. The time is not certain, as the post text says 8:00 and the poster 8:30.
