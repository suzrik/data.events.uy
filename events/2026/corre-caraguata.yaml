description:
  es: Tercera edición de Corre Caraguatá, carrera del Municipio de Caraguatá, Tacuarembó, el domingo 8 de noviembre, con salida a las 8:30 frente a la Plaza del Municipio. Hay 5K y 10K. La inscripción es gratis y abierta a toda la comunidad, por un formulario de Google. Hay 100 camisetas a $300 y lo recaudado se dona a la comisión Prosalud.
  en: Third edition of Corre Caraguatá, a race by the Municipio de Caraguatá, Tacuarembó, on Sunday 8 November, starting at 8:30 in front of the Plaza del Municipio. There are 5K and 10K. Entry is free and open to the whole community, through a Google form. There are 100 shirts at $300, and the money goes to the Prosalud committee.
