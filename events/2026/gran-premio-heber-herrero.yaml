description:
  es: Cancelado; la FCU lo marca «Cancelado» en su página (consultada el 25 de octubre). Era una carrera de ruta de un día en Trinidad, Flores, el domingo 15 de noviembre, que organizaba el Centro Recreativo Porongos Fútbol Club; figuraba en el calendario regional de la Federación Ciclista Uruguaya. Admitía las categorías élite, sub-23 y junior de hombres y mujeres y Máster A a E de hombres, todas con licencia de la federación.
  en: Cancelled; the FCU marks it «Cancelado» on its page (checked on 25 October). It was a one-day road race in Trinidad, Flores, on Sunday 15 November, to be organized by Centro Recreativo Porongos Fútbol Club; it was on the regional calendar of the Uruguayan Cycling Federation. It admitted the men's and women's elite, under-23 and junior categories and the men's Master A to E, all with a federation licence.
