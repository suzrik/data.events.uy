description:
  es: Carrera de ruta de un día en Trinidad, Flores, el domingo 15 de noviembre, organizada por el Centro Recreativo Porongos Fútbol Club; figura en el calendario regional de la Federación Ciclista Uruguaya. Admite las categorías élite, sub-23 y junior de hombres y mujeres y Máster A a E de hombres, todas con licencia de la federación. El recorrido, las distancias y la inscripción todavía no están publicados.
  en: One-day road race in Trinidad, Flores, on Sunday 15 November, organized by Centro Recreativo Porongos Fútbol Club; it is on the regional calendar of the Uruguayan Cycling Federation. It admits the men's and women's elite, under-23 and junior categories and the men's Master A to E, all with a federation licence. The course, distances and registration are not published yet.
