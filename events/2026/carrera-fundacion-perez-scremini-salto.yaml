description:
  es: Carrera solidaria de la Fundación Pérez Scremini, que atiende a niños y adolescentes con cáncer, en la ciudad de Salto. Se corre o se camina 5K o 10K el domingo 1 de noviembre de 2026, con largada a las 9 hs desde Diagonal Puerto. La inscripción incluye remera oficial y medalla finisher; para retirar el kit hay que presentar la cédula y firmar el deslinde. Forma parte de las carreras que la fundación organiza en los 19 departamentos.
  en: Charity race of the Pérez Scremini Foundation, which treats children and adolescents with cancer, in the city of Salto. You can run or walk 5K or 10K on Sunday 1 November 2026, starting at 9 am from Diagonal Puerto. Registration includes the official shirt and a finisher medal; to collect the kit you must show your ID and sign the waiver. It is one of the races the foundation holds in all 19 departments.
