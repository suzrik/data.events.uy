description:
  es: Carrera de 5 km del Instituto Nacional de la Juventud (INJU) en Flores, el viernes 23 de octubre con largada en Parque Centenario. Inicio de actividad a las 17:30 y largada a las 18:30. Para mayores de 13 años; los menores de 18 necesitan permiso firmado y todos un certificado médico. Hay inscripción en línea y también el día de la carrera. Las fechas pueden cambiar.
  en: 5 km race of the Instituto Nacional de la Juventud (INJU) in Flores, on Friday 23 October, starting at Parque Centenario. Activity starts at 17:30 and the race starts at 18:30. For people over 13; under-18s need a signed permission and everyone a medical certificate. Registration is online and also on race day. Dates may change.
