description:
  es: "Segunda fecha de Las 8 de Soriano 2026, campeonato departamental de running, el sábado 21 de marzo de 2026 en el Rosedal de Mercedes, Soriano, con largada a las 17:00 y 10K y 5K por categorías. La inscripción costaba $1000 con remera, $1200 el día de la carrera y $600 la reinscripción. Crono MTB, que cronometró, publicó los resultados."
  en: "Second round of Las 8 de Soriano 2026, a departmental running championship, on Saturday 21 March 2026 at the Rosedal in Mercedes, Soriano, starting at 17:00, with 10K and 5K by category. Entry cost $1000 with a T-shirt, $1200 on race day and $600 to re-register. Crono MTB, which did the timing, published the results."
