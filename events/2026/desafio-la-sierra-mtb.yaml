description:
  es: Carrera de MTB por la Sierra de Mahoma, en San José, con largada a las 10:00. Hay una competitiva de 50 km y una promocional de 25 km, con cronometraje por chip, kit y medalla finisher. Organiza La Sierra Eventos. El precio sube el 16 de octubre y los cupos son limitados.
  en: MTB race through the Sierra de Mahoma, in San José, starting at 10:00. There is a 50 km competitive course and a 25 km promotional one, with chip timing, a kit and a finisher medal. Organized by La Sierra Eventos. The price goes up on 16 October and places are limited.
