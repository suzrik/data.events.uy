description:
  es: Ultra por tiempo en la pista de San Carlos, Maldonado, el viernes 10 y el sábado 11 de abril de 2026. Las de 24 y 12 horas largaron el viernes a las 20:00 y la de 6 horas el sábado a las 10:00; además hubo participativas de 1 y 3 horas y duplas. Organizó AUDU. Encarrera publicó los resultados; el ganador de las 24 horas hizo 231,2 km.
  en: Timed ultra on the San Carlos track, Maldonado, on Friday 10 and Saturday 11 April 2026. The 24 and 12 hour races started on Friday at 20:00 and the 6 hour race on Saturday at 10:00; there were also 1 and 3 hour participation races and pairs. Organized by AUDU. Encarrera published the results; the 24 hour winner covered 231.2 km.
