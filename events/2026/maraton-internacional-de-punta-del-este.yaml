description:
  es: Maratón Internacional de Punta del Este 2026, corrida el domingo 6 de setiembre de 2026 con largada y llegada en la Rambla Circunvalación José Artigas y Las Focas, cerca de la parada 1 de Playa Mansa. El maratón largó a las 8:00 y el medio maratón, el 10K y el 5K a las 8:15. Hubo premios en efectivo y pacers. SUCA Timing publicó los resultados de las cuatro distancias.
  en: The 2026 Punta del Este International Marathon, held on Sunday 6 September 2026, starting and finishing on Rambla Circunvalación José Artigas at Las Focas, near stop 1 of Playa Mansa. The marathon started at 8:00 and the half marathon, 10K and 5K at 8:15. There was cash prize money and pacers. SUCA Timing published the results of all four distances.
