name: Corremos por Sarandí Grande
date: 2026-10-25
sport: run
city: Sarandí Grande
distances: [6K, 3K]
links:
  instagram: https://www.instagram.com/corremosporsarandi/
description:
  es: Segunda edición de Corremos por Sarandí Grande, con 3 km y 6 km, una jornada para correr y colaborar con instituciones de la localidad. Según las publicaciones del organizador, se corre el domingo 25 de octubre; la inscripción cuesta $500 y se hace en el Centro Auxiliar de Sarandí Grande, de lunes a viernes de 9 a 16 h, o a distancia por el 099 426 453, y el kit se retira el mismo día de la carrera.
  en: Second edition of Corremos por Sarandí Grande, with 3 km and 6 km, a day of running to support local institutions. According to the organizer's posts, it is on Sunday 25 October; registration costs $500 at the Centro Auxiliar de Sarandí Grande, Monday to Friday 9:00 to 16:00, or remotely via 099 426 453, and the kit is collected on race day.
