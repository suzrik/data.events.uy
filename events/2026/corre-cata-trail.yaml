description:
  es: Carrera a beneficio de la Escuela Superior Catalina Harriague de Castaños, en el Parque del Lago de Salto, con concentración a las 8:00 y largada a las 9:00. Hay 10K y 5K competitivas y 2,5K participativa, con chip de cronometraje y medalla finisher. Fue declarada de Interés Departamental.
  en: Race in support of the Escuela Superior Catalina Harriague de Castaños, held at Parque del Lago in Salto, with gathering at 8:00 and start at 9:00. It offers competitive 10K and 5K and a participatory 2.5K, with chip timing and a finisher medal. It was declared of Departmental Interest.
