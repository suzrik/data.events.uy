name: Campeonato Nacional de MTB (XCC y XCO)
date: 2026-07-18
sport: mtb
city: Rocha
venue: Predio La Encantada, ruta 9 km 220
entry: elite
organizer: Federación Ciclista Uruguaya
links:
  site: https://federacionciclista.com.uy/mountain-bike/WHNSWSCQND/
description:
  es: "Campeonato nacional de mountain bike de la Federación Ciclista Uruguaya (FCU) en el predio La Encantada, Rocha. El sábado 18 de julio de 2026 se corrió el short track (XCC) de élite de hombres y mujeres, y la FCU publicó su clasificación. El cross country olímpico (XCO) previsto para el domingo 19 se suspendió por mal tiempo; la FCU lo pasó al 9 de agosto y quedó pendiente."
  en: "National mountain bike championship of the Uruguayan Cycling Federation (FCU) at La Encantada, Rocha. On Saturday 18 July 2026 the men's and women's elite short track (XCC) was raced, and the FCU published its classification. The Olympic cross-country (XCO) planned for Sunday 19 was suspended because of the weather; the FCU moved it to 9 August and it stayed pending."
