name: Corre Colonia
date: 2026-10-10
sport: run
city: Colonia del Sacramento
venue: Calle Sudamtex, detrás de Colonia Shopping
distances: [10K, 5K]
links:
  site: https://encarrera.uy/corre-colonia/
description:
  es: Carrera de 5K y 10K en Colonia del Sacramento, con largada a las 17:00 detrás de Colonia Shopping (calle Sudamtex) y carrera de niños a las 16:00. Organiza PepsiCo. La inscripción es a beneficio del Banco de Alimentos, con donación de alimentos o artículos de limpieza. Según la página, los cupos están agotados.
  en: 5K and 10K race in Colonia del Sacramento, starting at 17:00 behind Colonia Shopping (Sudamtex street), with a children's race at 16:00. Organized by PepsiCo. Entry is a donation of food or cleaning items for the Banco de Alimentos. According to the page, places are sold out.
