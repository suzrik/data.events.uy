description:
  es: Ultra en la pista del Estadio Silvestre Octavio Landoni de Durazno, corrida el 23 y 24 de mayo de 2026, con modalidades de 1, 3, 6, 12 y 24 horas. Las de 12 y 24 horas largaron el sábado a las 12:00 y la de 6 horas el domingo a las 6:00. Encarrera publicó los resultados por vueltas y kilómetros; el ganador de las 24 horas superó los 210 km.
  en: A track ultra at the Estadio Silvestre Octavio Landoni in Durazno, held on 23 and 24 May 2026, with 1, 3, 6, 12 and 24 hour formats. The 12 and 24 hour races started on Saturday at 12:00 and the 6 hour race on Sunday at 6:00. Encarrera published the results by laps and kilometres; the 24 hour winner covered more than 210 km.
