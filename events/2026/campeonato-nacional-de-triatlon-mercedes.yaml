description:
  es: Fecha del Campeonato Nacional de Triatlón 2026-2027 de la Unión de Triatlón del Uruguay, el domingo 13 de diciembre en el Club Remeros Mercedes, sobre la rambla. Según el calendario de la Unión tiene modalidades Sprint, Promocional y Olímpico. Los no federados pueden correr con un permiso por el día, pero solo los federados suman puntos para el ranking. La página no da horarios ni distancias y la Unión remite a sus redes sociales.
  en: A date of the 2026-2027 Campeonato Nacional de Triatlón of the Unión de Triatlón del Uruguay, on Sunday 13 December at Club Remeros Mercedes, on the riverfront. According to the union's calendar it has Sprint, Promocional and Olympic formats. Non-federated athletes may race on a one-day permit, but only federated ones score ranking points. The page gives no start times or distances, and the union refers to its social media.
