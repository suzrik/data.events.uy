description:
  es: Backyard ultra en el Parque Roosevelt, Ciudad de la Costa, el sábado 15 y el domingo 16 de agosto de 2026, de Legión Athletic con apoyo de la Intendencia de Canelones. Se corre una vuelta por hora hasta que queda uno solo. Según la estadística de la DUV figuran 30 corredores y la carrera duró 20 horas; el ganador hizo 134,1 km. El afiche que circuló antes indicaba el 14 de febrero.
  en: Backyard ultra at Parque Roosevelt, Ciudad de la Costa, on Saturday 15 and Sunday 16 August 2026, by Legión Athletic with support from the Intendencia de Canelones. Runners cover one loop per hour until only one is left. According to the DUV statistics 30 runners are listed and the race lasted 20 hours; the winner covered 134.1 km. The poster circulated earlier said 14 February.
