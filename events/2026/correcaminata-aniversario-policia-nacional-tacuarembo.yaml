name: Correcaminata Aniversario de la Policía Nacional
date: 2026-12-20
sport: run
city: Tacuarembó
venue: Jefatura de Policía de Tacuarembó
distances: [8K, 4K]
links:
  site: https://cronometramaua.uy/correcaminata-policial/
  register: https://cronometramaua.uy/correcaminata-policial/
description:
  es: Correcaminata de 4K y 8K por el aniversario de la Policía Nacional, el domingo 20 de diciembre a las 9:00, con largada en la Jefatura de Policía de Tacuarembó, que la convoca. Es abierta al público, con clasificaciones separadas para policías y para público general. Hay trofeos para los cinco primeros de cada grupo en las dos distancias y medallas por categorías de edad en los 8K. La inscripción se hace en la web de Cronometra Mauá, donde figura como Correcaminata Policial.
  en: 4K and 8K run for the anniversary of the Policía Nacional, on Sunday 20 December at 9:00, starting at the Tacuarembó police headquarters, which calls the event. It is open to the public, with separate classifications for police officers and for the general public. There are trophies for the top five of each group in both distances and age-group medals in the 8K. Registration is on the Cronometra Mauá website, where it is listed as Correcaminata Policial.
