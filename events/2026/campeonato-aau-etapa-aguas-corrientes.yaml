name: Campeonato AAU, etapa Aguas Corrientes
date: 2026-12-06
sport: run
city: Aguas Corrientes
organizer: Agrupación de Atletas del Uruguay
links:
  site: https://atletas.uy/
  facebook: https://www.facebook.com/agrupaciondeatletasdeluruguay
description:
  es: Etapa del Campeonato 2026 de la Agrupación de Atletas del Uruguay (AAU) en Aguas Corrientes, Canelones, el domingo 6 de diciembre; es la última fecha del calendario oficial de la temporada. La AAU avisó que, si hay cambios en el calendario, serán de sede y no de fecha. La hora, las distancias y la inscripción de esta etapa todavía no fueron anunciadas.
  en: Stage of the 2026 championship of the Agrupación de Atletas del Uruguay (AAU) in Aguas Corrientes, Canelones, on Sunday 6 December; it is the last date of the official season calendar. The AAU said that any changes to the calendar would be of venue, not of date. Start time, distances and registration for this stage have not been announced yet.
