description:
  es: Carrera «Fiesta del Agua» de 5K y 10K, el domingo 6 de diciembre en Aguas Corrientes, Canelones, con largada en el museo Usina a Vapor. Es la última etapa del Campeonato 2026 de la Agrupación de Atletas del Uruguay (AAU), con apoyo del Municipio de Aguas Corrientes, el Gobierno de Canelones y OSE. La hora y el precio de la inscripción todavía no fueron publicados.
  en: «Fiesta del Agua» 5K and 10K race, on Sunday 6 December in Aguas Corrientes, Canelones, starting at the Usina a Vapor museum. It is the last stage of the 2026 championship of the Agrupación de Atletas del Uruguay (AAU), supported by the Municipio de Aguas Corrientes, the Gobierno de Canelones and OSE. Start time and entry price are not published yet.
