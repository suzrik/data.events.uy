description:
  es: Trail con largada a las 9:00 en el Castillo Pittamiglio, Las Flores, Maldonado, con circuitos nuevos de 8K, 14K y 20K. Es la tercera y última fecha del campeonato Solís Grande. Hay kit opcional con remera, medalla y buff, y carrera de niños gratis a las 8:45; el kit se entrega el domingo desde las 6:30. La inscripción en línea ya cerró. Organiza Mil Horizontes.
  en: Trail race starting at 9:00 at Castillo Pittamiglio, Las Flores, Maldonado, with new 8K, 14K and 20K courses. It is the third and final round of the Solís Grande championship. An optional kit includes a shirt, medal and buff, and there is a free children's race at 8:45; kits are handed out on Sunday from 6:30. Online registration has closed. Organized by Mil Horizontes.
