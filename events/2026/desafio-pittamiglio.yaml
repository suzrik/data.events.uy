description:
  es: Trail con largada a las 9:00 en el Castillo Pittamiglio, Las Flores, Maldonado, con circuitos nuevos de 8K, 14K y 20K. Es la tercera y última fecha del campeonato Solís Grande. Hay kit opcional con remera, medalla y buff, y carrera de niños gratis. Organiza Mil Horizontes.
  en: Trail race starting at 9:00 at Castillo Pittamiglio, Las Flores, Maldonado, with new 8K, 14K and 20K courses. It is the third and final round of the Solís Grande championship. An optional kit includes a shirt, medal and buff, and there is a free children's race. Organized by Mil Horizontes.
