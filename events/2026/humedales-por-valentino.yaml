description:
  es: Carrera solidaria de 4K y 8K a beneficio de Valentino Biaño, el domingo 6 de diciembre a las 9:30, con largada en la Escuela de Policía de Maldonado (Aparicio Saravia casi San Pablo). Hay premios del 1.º al 3.º por categorías. El afiche lleva los logos de la Intendencia de Maldonado, la Jefatura de Policía de Maldonado, Unipolma y Almaelite Entrenamientos; cronometra Punto de Control, donde se hace la inscripción.
  en: Charity race of 4K and 8K in aid of Valentino Biaño, on Sunday 6 December at 9:30, starting at the Maldonado police school (Aparicio Saravia near San Pablo). There are prizes for the top three by category. The poster carries the logos of the Maldonado departmental government, the Maldonado police headquarters, Unipolma and Almaelite Entrenamientos; timing by Punto de Control, where registration is done.
