description:
  es: Última etapa de Corre Cerro Largo, serie de carreras de 5K y 10K por localidades del departamento, el sábado 28 de noviembre en Melo. El lugar, la hora y la inscripción se publican en el Instagram y el sitio de Cronometra Mauá, la empresa que cronometra la serie y gestiona sus inscripciones.
  en: Last stage of Corre Cerro Largo, a series of 5K and 10K races in towns of the department, on Saturday 28 November in Melo. The place, time and registration are published on the Instagram and site of Cronometra Mauá, the company that times the series and handles its registration.
