description:
  es: Última etapa de Corre Cerro Largo, serie de carreras de 5K y 10K por localidades del departamento. Según listados de terceros se correría el 28 de noviembre, pero no pudimos confirmarlo en una página del organizador; el día exacto y la inscripción se consultan en el Instagram de Cronometra Mauá, la empresa de cronometraje que figura como organizadora.
  en: Last stage of Corre Cerro Largo, a series of 5K and 10K races in towns of the department. Third-party listings give 28 November, but we could not confirm it on an organizer page; check the exact day and registration on the Instagram of Cronometra Mauá, the timing company listed as organizer.
