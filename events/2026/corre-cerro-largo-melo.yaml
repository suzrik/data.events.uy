description:
  es: Gran final de Corre Cerro Largo, serie de carreras por localidades del departamento. Es la 6.ª fecha, en la que se define el campeonato, el domingo 29 de noviembre a las 8:00 en Melo, frente al gimnasio Tacuarí. Hay 5K y 10K y un recorrido de 2 km para niños de 7 a 11 años. Inscripción en el sitio de Cronometra Mauá, la empresa que cronometra la serie, con pago por Prex o Abitab.
  en: Grand final of Corre Cerro Largo, a series of races in towns of the department. It is the 6th round, which decides the championship, on Sunday 29 November at 8:00 in Melo, in front of the Tacuarí gym. There are 5K and 10K races and a 2 km course for children aged 7 to 11. Registration on the site of Cronometra Mauá, the company that times the series, with payment through Prex or Abitab.
