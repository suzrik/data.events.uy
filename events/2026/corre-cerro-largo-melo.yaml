description:
  es: Última etapa de Corre Cerro Largo, serie de carreras de 5K y 10K por localidades del departamento. Según listados de terceros se correría el 28 de noviembre, pero no pudimos confirmarlo en una página del organizador; el día exacto y la inscripción se publican en el Instagram de Cronometra Mauá, la empresa que cronometra la serie y gestiona sus inscripciones.
  en: Last stage of Corre Cerro Largo, a series of 5K and 10K races in towns of the department. Third-party listings give 28 November, but we could not confirm it on an organizer page; the exact day and registration are published on the Instagram of Cronometra Mauá, the company that times the series and handles its registration.
