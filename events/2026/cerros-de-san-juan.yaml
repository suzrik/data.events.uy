  es: Carrera de trail en los Cerros de San Juan, Colonia, que se corrió el domingo 7 de junio de 2026 como primera fecha, «El despertar», de la Triple Corona de Colonia Aventura Corre (CAC), con 21K, 12K y 6K. Los resultados, con el puntaje de la Triple Corona, están publicados en Cronometraje Instantáneo.
  en: Trail race in the Cerros de San Juan, Colonia, held on Sunday 7 June 2026 as the first round, "El despertar", of the Triple Corona of Colonia Aventura Corre (CAC), over 21K, 12K and 6K. The results, with Triple Corona points, are published on Cronometraje Instantáneo.
