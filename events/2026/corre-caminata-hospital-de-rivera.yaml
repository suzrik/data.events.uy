name: Corre Caminata Solidaria Hospital de Rivera
date: 2026-11-08
time: "08:00"
sport: run
city: Rivera
venue: 33 Orientales y Agraciada
distances: [6K, 3K]
organizer: Asociación de Funcionarios de Aduana, Grupo Correr por Placer y Hospital Departamental de Rivera
links:
  instagram: https://www.instagram.com/correr.por.placer/
description:
  es: Corre caminata solidaria de 3K y 6K a beneficio del Hospital Departamental de Rivera, por su 189º aniversario, el domingo 8 de noviembre a las 8:00, con largada en 33 Orientales y Agraciada. La organiza la Asociación de Funcionarios de Aduana (AFA) con el Grupo Correr por Placer y el hospital, bajo el lema «Cuidando fronteras, apoyando vidas y multiplicando esperanzas». Inscripciones por WhatsApp con David Ferreira, de Correr por Placer, según su afiche del 2 de noviembre.
  en: Charity run and walk of 3K and 6K in aid of the Rivera departmental hospital, for its 189th anniversary, on Sunday 8 November at 8:00, starting at 33 Orientales and Agraciada. It is organized by the customs staff association (AFA) with Grupo Correr por Placer and the hospital. Registration by WhatsApp with David Ferreira, of Correr por Placer, according to his poster of 2 November.
