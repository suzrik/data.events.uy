name: Corre Caminata Solidaria Hospital de Rivera
date: 2026-11-08
sport: run
city: Rivera
distances: [6K, 3K]
links:
  instagram: https://www.instagram.com/correr.por.placer/
description:
  es: Corre caminata solidaria de 3K y 6K a beneficio del Hospital Departamental de Rivera, por su 189º aniversario, el domingo 8 de noviembre. La convoca el Grupo Correr por Placer, según su publicación del 2 de setiembre, junto con el hospital, cuyo afiche anuncia las dos distancias. La convocatoria del hospital, reproducida por la prensa local, pone la largada a las 8:00 frente a la sede de la Aduana, con una segunda vuelta para los 6K; hora y lugar sin confirmar en una página del organizador.
  en: Charity run and walk of 3K and 6K in aid of the Rivera departmental hospital, for its 189th anniversary, on Sunday 8 November. It is called by Grupo Correr por Placer, according to its post of 2 September, together with the hospital, whose poster announces the two distances. The hospital's announcement, reproduced by the local press, puts the start at 8:00 in front of the Aduana building, with a second lap for the 6K; time and venue not confirmed on an organizer page.
