name: La Cruz MTB
date: 2026-10-11
sport: mtb
city: La Cruz
venue: Policlínica de La Cruz
distances: [50 km, 25 km]
links:
  site: https://www.gub.uy/intendencia-florida/comunicacion/calendario-actividades/2a-edicion-cruz-mtb
  register: https://cronomtb.uy/2o-edicion-la-cruz-mtb-2026/
description:
  es: Segunda edición de esta carrera de MTB en La Cruz, Florida, el domingo 11 de octubre, en homenaje a Gonzalo Rodríguez. La largada es a las 10:00 en la Policlínica de La Cruz y los kits se entregan de 8:00 a 9:45. Hay 50 km y 25 km, con categorías promocionales y competitivas, premios del 1.º al 5.º puesto por categoría y medalla finisher. Es a beneficio de instituciones locales. La inscripción se hace en Crono MTB y también el día de la carrera.
  en: Second edition of this MTB race in La Cruz, Florida, on Sunday 11 October, held in tribute to Gonzalo Rodríguez. The start is at 10:00 at the Policlínica de La Cruz and kits are handed out from 8:00 to 9:45. There are 50 km and 25 km courses, with promotional and competitive categories, prizes for 1st to 5th place in each category and a finisher medal. It benefits local institutions. Registration is on Crono MTB and also on race day.
