description:
  es: Segunda edición de esta carrera de MTB en La Cruz, Florida, el sábado 21 de noviembre, en homenaje a Gonzalo Rodríguez; se postergó desde el 11 de octubre. La largada es a las 16:00 en la Policlínica de La Cruz y los kits se entregan de 15:00 a 15:45. Hay 50 km y 25 km, con categorías promocionales y competitivas, premios del 1.º al 5.º puesto por categoría y medalla finisher. Es a beneficio de instituciones locales. La inscripción se hace en Crono MTB y también el día de la carrera.
  en: Second edition of this MTB race in La Cruz, Florida, on Saturday 21 November, held in tribute to Gonzalo Rodríguez; it was planned for 11 October and was postponed. The start is at 16:00 at the Policlínica de La Cruz and kits are handed out from 15:00 to 15:45. There are 50 km and 25 km courses, with promotional and competitive categories, prizes for 1st to 5th place in each category and a finisher medal. It benefits local institutions. Registration is on Crono MTB and also on race day.
