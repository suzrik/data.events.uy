description:
  es: Carrera solidaria «Juntos más lejos» de la Fundación Pérez Scremini, que atiende a niños y adolescentes con cáncer, el domingo 20 de setiembre de 2026 en Maldonado, con 5K y 10K. Según la Intendencia de Maldonado, que la apoyó, se largó desde Punta Shopping y se recorrió la zona costera de Punta del Este, con cientos de participantes.
  en: Charity race "Juntos más lejos" of the Pérez Scremini Foundation, which treats children and adolescents with cancer, on Sunday 20 September 2026 in Maldonado, with 5K and 10K. According to the Intendencia de Maldonado, which supported it, it started from Punta Shopping and ran along the Punta del Este coast, with hundreds of participants.
