description:
  es: Cuarta edición de esta carrera de gravel, el sábado 21 de noviembre, con largada a las 7:00 en Laguna del Sauce, Punta del Este. Hay dos distancias, 100 y 50 millas (unos 160 y 80 km). Después de la carrera hay un tercer tiempo con premios. La inscripción es por RedTickets, con precio por franjas; la última franja publicada llega hasta el 1 de noviembre. El reglamento está en el Linktree del organizador.
  en: Fourth edition of this gravel race, on Saturday 21 November, starting at 7:00 at Laguna del Sauce, Punta del Este. There are two distances, 100 and 50 miles (about 160 and 80 km). After the race there is a social gathering with prizes. Registration is on RedTickets, with tiered prices; the last published tier runs until 1 November. The rules are on the organizer's Linktree.
