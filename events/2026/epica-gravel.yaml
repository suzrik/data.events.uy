description:
  es: Cuarta edición de esta carrera de gravel, el sábado 21 de noviembre, con largada a las 7:00 en Laguna del Sauce, Punta del Este, y cierre del circuito a las 17:00. Hay 100 y 50 millas (unos 160 y 80 km). El viernes 20 se entregan los kits de 14 a 22 h, con feria, salida social a las 18 y charla técnica a las 20; el tercer tiempo con premios es el sábado de 18 a 21 h. Inscripción en RedTickets; recorridos y reglamento en el Linktree del organizador.
  en: Fourth edition of this gravel race, on Saturday 21 November, starting at 7:00 at Laguna del Sauce, Punta del Este; the course closes at 17:00. There are 100 and 50 miles (about 160 and 80 km). On Friday 20 kits are handed out from 14:00 to 22:00, with a fair, a social ride at 18:00 and a technical briefing at 20:00; the prize-giving social gathering is on Saturday from 18:00 to 21:00. Registration on RedTickets; courses and rules on the organizer's Linktree.
