description:
  es: Carrera de 6K para mujeres en La Barra, el domingo 11 de octubre a las 10 hs. Sale del Shopping Oh La Barra y llega al Parque El Placer, con charlas y motivaciones y un cierre cultural. La edad mínima es 16 años. Las personas con discapacidad participan sin cargo, previa acreditación. En RedTickets la primera tanda figura agotada y la segunda, a $1.100, sigue a la venta.
  en: A 6K race for women in La Barra, on Sunday 11 October at 10:00. It starts at the Oh La Barra shopping centre and finishes at Parque El Placer, with talks and motivation and a cultural closing. The minimum age is 16. People with disabilities take part free of charge after accreditation. On RedTickets the first batch is shown as sold out and the second, at $1,100, is still on sale.
