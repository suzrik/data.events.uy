name: Pasos contra la polio
date: 2026-11-08
time: "09:30"
sport: run
city: Colonia del Sacramento
venue: Parque Ferrando
distances: [10K, 5K]
organizer: Interact Club Colonia
links:
  instagram: https://www.instagram.com/interactclubcolonia/
description:
  es: Correcaminata familiar solidaria de 5K y 10K en el Parque Ferrando de Colonia del Sacramento, el domingo 8 de noviembre a las 9:30, en el marco de la campaña por la erradicación de la polio. La organizan los jóvenes del Interact Club Colonia y lo recaudado se dona al hospital de Colonia. La entrada incluye remera personalizada. El organizador anunció la inscripción por RedTickets, pero el 3 de noviembre la página del evento ya no estaba disponible.
  en: Family charity run and walk of 5K and 10K at Parque Ferrando in Colonia del Sacramento, on Sunday 8 November at 9:30, as part of the campaign to eradicate polio. It is organized by the young members of Interact Club Colonia and the proceeds are donated to the Colonia hospital. The entry includes a custom T-shirt. The organizer announced registration on RedTickets, but on 3 November the event page was no longer available.
