description:
  es: Correcaminata familiar solidaria de 5K y 10K en el Parque Ferrando de Colonia del Sacramento, el domingo 8 de noviembre a las 9:00, en el marco de la campaña por la erradicación de la polio. La organiza el Interact Club Colonia y lo recaudado se dona al Hospital ASSE de Colonia. La inscripción es por RedTickets; los niños de hasta 10 años no pagan.
  en: Family charity run and walk of 5K and 10K at Parque Ferrando in Colonia del Sacramento, on Sunday 8 November at 9:00, as part of the campaign to eradicate polio. It is organized by Interact Club Colonia and the proceeds are donated to the ASSE hospital in Colonia. Registration is through RedTickets; children aged 10 and under do not pay.
