description:
  es: Tercera edición de Sportivo Yí MTB, el sábado 19 de setiembre de 2026 en el Parque de la Hispanidad, Durazno. El kit se entregó de 13:00 a 14:45 y la largada fue a las 15:00, con 44 km y 22 km, categorías competitivas (élite, A a D, damas A y B) y promocionales (junior y promo). Hubo hidratación, frutas en la llegada, medalla finisher y premios a los tres primeros de cada categoría. Crono MTB publicó los resultados ese mismo día.
  en: Third edition of Sportivo Yí MTB, on Saturday 19 September 2026 at Parque de la Hispanidad, Durazno. Kits were handed out from 13:00 to 14:45 and the start was at 15:00, over 44 km and 22 km, with competitive categories (elite, A to D, women's A and B) and promotional ones (junior and promo). There was water on course, fruit at the finish, a finisher medal and prizes for the top three in each category. Crono MTB published the results the same day.
