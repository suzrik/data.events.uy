description:
  es: Correcaminata comunitaria de 3,5 km en Libertad, San José, el miércoles 14 de octubre de 2026 a las 8:00 en el Parque Carlos Clauzolles. La organizan los estudiantes del Bachillerato de Deporte y Recreación de la Escuela Técnica (UTU) de Libertad. Es gratuita y abierta a todas las personas, con puestos de hidratación y frutas, premios para los tres primeros de cada categoría y medallas para los primeros cien en llegar. La inscripción es por formulario, con el código QR del afiche.
  en: Community run/walk of 3.5 km in Libertad, San José, on Wednesday 14 October 2026 at 8:00 in Parque Carlos Clauzolles. It is organized by the students of the sports and recreation baccalaureate of the Libertad technical school (UTU). Free and open to everyone, with hydration and fruit stations, prizes for the top three in each category and medals for the first hundred to finish. Registration is by form, through the QR code on the poster.
