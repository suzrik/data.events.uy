description:
  es: Carrera por las playas entre los arroyos Carrasco y Pando, organizada por el grupo de corredores Halcones Uruguay, corrida el domingo 22 de febrero de 2026. Hubo tres largadas en distintos puntos y una sola llegada, en la playa del parador Burdeos; 19K a las 6:45 junto al arroyo Carrasco, 10K a las 7:30 en Solymar y 5K a las 8:00 en la bajada 33. Encarrera publicó los resultados.
  en: A beach race between the Carrasco and Pando streams, organized by the runners' group Halcones Uruguay, held on Sunday 22 February 2026. There were three starts at different points and a single finish, at the Burdeos beach bar; 19K at 6:45 by the Carrasco stream, 10K at 7:30 in Solymar and 5K at 8:00 at access 33. Encarrera published the results.
