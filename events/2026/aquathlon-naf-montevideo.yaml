name: Aquathlon NAF Montevideo
date: 2026-11-28
time: "10:00"
sport: tri
city: Montevideo
venue: Estacionamiento de la Playa del Cerro
distances: ["2,5 km carrera", 1000 m natación, "2,5 km carrera"]
organizer: NAF Montevideo, Nadadores de Aguas Frías
links:
  site: https://nafmontevideo.com/aquathlon.html
  instagram: https://www.instagram.com/naf_montevideo/
description:
  es: Acuatlón de NAF Montevideo, el sábado 28 de noviembre de 2026 en el estacionamiento de la Playa del Cerro. Son tres tramos seguidos, 2,5 km de carrera, 1000 m de natación en aguas abiertas y 2,5 km de carrera, en individual o en dupla (un corredor y un nadador), competitiva o participativa. Larga a las 10:00 y es a beneficio de Salvando Ángeles Callejeros. Inscripción en el sitio, $500 individual y $1000 la dupla; el 11 de noviembre NAF anunció cupos agotados.
  en: Aquathlon by NAF Montevideo on Saturday 28 November 2026 at the Playa del Cerro car park. It has three back-to-back legs, a 2.5 km run, a 1,000 m open-water swim and a 2.5 km run, raced solo or in pairs (one runner and one swimmer), competitive or recreational. It starts at 10:00 and raises money for Salvando Ángeles Callejeros. Entry through the form on the site, $500 solo and $1,000 per pair; on 11 November NAF announced it was sold out.
