name: Casabó Corre
date: 2026-10-10
sport: run
city: Montevideo
venue: Parque 7 Hectáreas, Casabó
distances: [5K, 2.5K]
links:
  instagram: https://www.instagram.com/parque7hectareas/
description:
  es: Cuarta edición de la corre caminata del Parque Deportivo y Recreativo 7 Hectáreas, en Casabó, con distancias de 2,5K y 5K. Según la publicación del parque del 29 de agosto, es el sábado 10 de octubre a las 16:00, con largada y llegada en el parque e inscripción por formulario (código QR del afiche). Organizan el parque, que depende del Municipio A de Montevideo, y el grupo Corredores GG.
  en: Fourth edition of the run and walk of the Parque Deportivo y Recreativo 7 Hectáreas, in Casabó, with 2.5K and 5K distances. According to the park's post of 29 August, it is on Saturday 10 October at 16:00, starting and finishing at the park, with registration by form (QR code on the poster). Organized by the park, which belongs to Municipio A of Montevideo, and the Corredores GG group.
