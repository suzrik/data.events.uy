description:
  es: Segunda edición de la 5K Azul y Oro del club Estudiantil Sanducero, en Paysandú, el domingo 6 de diciembre. La acreditación es a las 9:00 y la largada a las 9:30 en el Estudiantil Baby Fútbol (Dr. Roldán y Meriggi); se puede correr o caminar. La inscripción cuesta $700 con remera y $350 sin remera. Apoyan la Secretaría Nacional del Deporte y la Intendencia de Paysandú.
  en: Second edition of the 5K Azul y Oro of the Estudiantil Sanducero club, in Paysandú, on Sunday 6 December. Check-in is at 9:00 and the start at 9:30 at the Estudiantil Baby Fútbol ground (Dr. Roldán y Meriggi); you can run or walk. Entry costs $700 with a shirt and $350 without. Supported by the National Sports Secretariat and the Intendencia de Paysandú.
