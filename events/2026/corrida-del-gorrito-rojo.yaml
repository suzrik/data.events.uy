name: Corrida del Gorrito Rojo
date: 2026-12-25
time: "18:00"
sport: run
city: Montevideo
venue: Letras corpóreas de Montevideo (Colina de Kibón)
organizer: Corrida del Gorrito Rojo
links:
  instagram: https://www.instagram.com/p/Df3mGV6M3AX/
description:
  es: Corrida navideña y solidaria que reúne a corredores todos los 25 de diciembre desde 2012, el viernes 25 de diciembre a las 18:00 en las letras de Montevideo de la Colina de Kibón. Se corre con gorrito navideño y se colabora con alimentos no perecederos para EPI (Espacio para la Integración) y alimento de perro o gato para RASCA y Ayudando Animales Nueva Helvecia; cierra con un brindis. La distancia no está publicada; las novedades van por un grupo de WhatsApp.
  en: A Christmas charity run that has brought runners together every 25 December since 2012, on Friday 25 December at 18:00 at the Montevideo sign on the Colina de Kibón. Runners wear a Santa hat and bring non-perishable food for EPI (Espacio para la Integración) and dog or cat food for RASCA and Ayudando Animales Nueva Helvecia; it ends with a toast. The distance is not published; updates go through a WhatsApp group.
