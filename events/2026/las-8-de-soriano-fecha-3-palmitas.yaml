description:
  es: "Tercera fecha de Las 8 de Soriano 2026, campeonato departamental de running, el sábado 25 de abril de 2026 en Palmitas, Soriano, con largada a las 16:30 desde el municipio y 10K y 5K por categorías. La inscripción costaba $1000 con remera, $1200 el día de la carrera y $600 la reinscripción. Crono MTB, que cronometró, publicó los resultados."
  en: "Third round of Las 8 de Soriano 2026, a departmental running championship, on Saturday 25 April 2026 in Palmitas, Soriano, starting at 16:30 from the municipal building, with 10K and 5K by category. Entry cost $1000 with a T-shirt, $1200 on race day and $600 to re-register. Crono MTB, which did the timing, published the results."
