  es: Segunda edición de la carrera solidaria de Médicos Sin Fronteras, el domingo 25 de octubre a las 8:00 en la Rambla de Carrasco (Rambla República de México y Avenida A. Arocena). Hay distancias de 5 km y 10 km, para correr o caminar, con categorías femenina, masculina y para personas con discapacidad. Inscripción por RedTickets.
  en: Second edition of the Médicos Sin Fronteras charity race, on Sunday 25 October at 8:00 on the Rambla de Carrasco (Rambla República de México and Avenida A. Arocena). It has 5 km and 10 km distances, to run or walk, with women's, men's and disability categories. Registration through RedTickets.
