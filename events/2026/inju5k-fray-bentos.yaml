description:
  es: Carrera de 5 km del Instituto Nacional de la Juventud (INJU) en Fray Bentos, el viernes 20 de noviembre con largada en el C.D.C. Canteras. Inicio de actividad a las 17:00 y largada a las 19:00. Para mayores de 13 años; los menores de 18 necesitan permiso firmado y todos un certificado médico. Hay inscripción en línea y también el día de la carrera. Las fechas pueden cambiar.
  en: 5 km race of the Instituto Nacional de la Juventud (INJU) in Fray Bentos, on Friday 20 November, starting at the C.D.C. Canteras. Activity starts at 17:00 and the race starts at 19:00. For people over 13; under-18s need a signed permission and everyone a medical certificate. Registration is online and also on race day. Dates may change.
