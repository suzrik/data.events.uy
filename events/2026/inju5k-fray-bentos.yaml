description:
  es: Carrera de 5 km del Instituto Nacional de la Juventud (INJU) en Fray Bentos, el viernes 20 de noviembre en el Centro de Barrio Las Canteras. La jornada empieza a las 17:00, la entrada en calor es a las 19:15 y la largada a las 19:30; a la misma hora larga un 1K para niños. El 5K es para mayores de 14 años; los menores de 18 necesitan permiso firmado y todos un certificado médico. La inscripción en línea es gratuita y cierra el 17 de noviembre.
  en: 5 km race of the Instituto Nacional de la Juventud (INJU) in Fray Bentos, on Friday 20 November at the Centro de Barrio Las Canteras. The day starts at 17:00, the warm-up is at 19:15 and the start at 19:30; a 1K for children starts at the same time. The 5K is for people over 14; under-18s need a signed permission and everyone a medical certificate. Online registration is free and closes on 17 November.
