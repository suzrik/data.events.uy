description:
  es: Quinta edición de esta carrera de MTB en Florida, el sábado 5 de diciembre, a total beneficio de la Escuela N.º 108, que es el punto de encuentro. Kits desde las 14:30 y largada a las 16:00. Competitiva de 50 km con categorías por edad, damas y gravel; promocional de 25 km, categorías de 12 km y carrera de niños. Cuesta $700 por Abitab y $800 el día de la carrera. Trofeos del 1.º al 5.º por categoría y medalla finisher para todos. Inscripción en Crono MTB.
  en: Fifth edition of this MTB race in Florida on Saturday 5 December, entirely for the benefit of School No. 108, which is the meeting point. Kits from 14:30, start at 16:00. A 50 km competitive race with age, women's and gravel categories; a 25 km promotional race, 12 km categories and a kids' race. Entry is $700 through Abitab or $800 on race day. Trophies for 1st to 5th per category and a finisher medal for everyone. Registration on Crono MTB.
