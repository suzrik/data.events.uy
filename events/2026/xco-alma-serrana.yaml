description:
  es: Carrera de cross country olímpico (XCO) del calendario regional de mountain bike de la Federación Ciclista Uruguaya, que la ubica en San Carlos, Maldonado. Organiza Ciclistas Carolinos. La FCU lista las categorías élite, sub-23 y junior de hombres y mujeres y máster A a E de hombres. La página de la FCU no publica horario, circuito ni forma de inscripción; hay que consultarlos con el club organizador.
  en: Olympic cross-country (XCO) race on the regional mountain bike calendar of the Uruguayan Cycling Federation, which places it in San Carlos, Maldonado. Organized by Ciclistas Carolinos. The FCU lists men's and women's elite, under-23 and junior categories and men's Master A to E. The FCU page does not publish the start time, the course or how to register; ask the organizing club.
