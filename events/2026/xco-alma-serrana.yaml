description:
  es: Carrera de cross country olímpico (XCO) del calendario regional de la Federación Ciclista Uruguaya, que la ubica en San Carlos, Maldonado. Es la «despedida» del circuito de Alma Serrana, de 3,5 km por vuelta. Organizan el Club Ciclistas Carolinos, Fernando Larrosa y la familia Gelpes. Largada a las 10:30. Categorías élite, sub-23, junior, cadetes, máster A a D y promocionales; corren federados y no federados (con seguro). Inscripción por WhatsApp (094 392 796) hasta el jueves 22 de octubre.
  en: Olympic cross-country (XCO) race on the regional calendar of the Uruguayan Cycling Federation, which places it in San Carlos, Maldonado. It is the «farewell» of the Alma Serrana course, 3.5 km laps. Organized by Club Ciclistas Carolinos, Fernando Larrosa and the Gelpes family. Start at 10:30. Elite, under-23, junior, cadet, Master A to D and promotional categories; licensed and unlicensed riders race (the latter with insurance). Registration by WhatsApp (094 392 796) until Thursday 22 October.
