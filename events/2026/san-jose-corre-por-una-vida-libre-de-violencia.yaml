description:
  es: Corre-caminata por una vida libre de violencia, de la Intendencia de San José, el viernes 20 de noviembre desde las 18:30 en la ex Estación de AFE de San José de Mayo. Se corre 2 o 5 km; la inscripción se hace con un formulario en línea. La jornada incluye una feria de emprendedoras y cierra con un coro.
  en: Run-walk for a life free of violence, by the Intendencia de San José, on Friday 20 November from 18:30 at the former AFE railway station in San José de Mayo. You can run 2 or 5 km; registration is through an online form. The day includes a fair of women entrepreneurs and closes with a choir.
