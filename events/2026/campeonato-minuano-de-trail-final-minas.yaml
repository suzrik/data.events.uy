description:
  es: Final del Campeonato Minuano de Trail, organizado por Minas Todo Terreno, el domingo 11 de octubre de 2026 a las 10 hs en Minas, Lavalleja. Hay categorías de damas y caballeros hasta 34 años, de 35 a 49 y de 50 en adelante. La inscripción es por formulario; la distancia y el lugar de largada no figuran en él, así que conviene consultarlos en el Instagram del organizador.
  en: Final of the Campeonato Minuano de Trail, organized by Minas Todo Terreno, on Sunday 11 October 2026 at 10:00 in Minas, Lavalleja. There are women's and men's categories up to 34, 35 to 49, and 50 and over. Registration is by form; the distance and the start place are not shown on it, so check them on the organizer's Instagram.
