description:
  es: Final del Campeonato Minuano de Trail, organizado por Minas Todo Terreno, el domingo 11 de octubre de 2026 a las 10 hs en el Parque Minas, Lavalleja, con entrega de kits desde las 8:30 y premiación a las 12:30. Hay categorías de damas y caballeros hasta 34 años, de 35 a 49 y de 50 en adelante. La inscripción era por formulario y cerró el 9 de octubre; la distancia no fue publicada.
  en: Final of the Campeonato Minuano de Trail, organized by Minas Todo Terreno, on Sunday 11 October 2026 at 10:00 at Parque Minas, Lavalleja, with kit pickup from 8:30 and prizes at 12:30. There are women's and men's categories up to 34, 35 to 49, and 50 and over. Registration was by form and closed on 9 October; the distance was not published.
