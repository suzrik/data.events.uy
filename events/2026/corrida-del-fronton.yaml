description:
  es: Correcaminata gratuita de la Intendencia de Colonia el sábado 17 de octubre de 2026 a las 10 hs, con largada y llegada en el Frontón del Real de San Carlos, en Colonia del Sacramento. El recorrido va por la calle Mihanovich y la rambla hasta las letras de Colonia y vuelve por el mismo camino, unos 5 km. La inscripción es por formulario en la página de la Intendencia; las primeras 300 personas inscriptas reciben remera, que se entrega el mismo día desde las 9 hs.
  en: Free run/walk organized by the Intendencia de Colonia on Saturday 17 October 2026 at 10:00, starting and finishing at the Frontón del Real de San Carlos in Colonia del Sacramento. The course goes along Mihanovich street and the waterfront to the Colonia letters and back the same way, about 5 km. Registration is by form on the Intendencia's website; the first 300 entrants get a shirt, handed out on race day from 9:00.
