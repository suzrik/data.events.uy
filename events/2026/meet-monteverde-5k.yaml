description:
  es: Primera edición de un encuentro de 5 km para caminar, trotar o correr en la Chacra Monteverde, San Carlos, Maldonado, el domingo 13 de diciembre a las 9:00, seguido de un after con almuerzo y DJ. Organiza MEET Running & Outdoor Uruguay; hay medalla finisher, cobertura médica y precio especial para grupos de seis o más. Inscripción por el formulario del perfil de Instagram; según la publicación del 20 de octubre, el precio bonificado rige hasta el 31 de octubre.
  en: First edition of a 5 km gathering to walk, jog or run at Chacra Monteverde, San Carlos, Maldonado, on Sunday 13 December at 9:00, followed by an after party with lunch and a DJ. Organized by MEET Running & Outdoor Uruguay; there is a finisher medal, medical cover and a special price for groups of six or more. Registration through the form linked in the Instagram profile; according to the 20 October post, the discounted price applies until 31 October.
