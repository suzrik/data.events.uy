description:
  es: Primera edición de un encuentro de 5 km para caminar, trotar o correr en la Chacra Monteverde, San Carlos, Maldonado, el domingo 13 de diciembre a las 9:00, seguido de un after con almuerzo. Organiza MEET Running & Outdoor Uruguay, según sus publicaciones del 16 de setiembre y el 8 de octubre; hay medalla finisher, cobertura médica y beneficios para grupos de seis o más. Inscripciones por WhatsApp al 099 419 650.
  en: First edition of a 5 km gathering to walk, jog or run at Chacra Monteverde, San Carlos, Maldonado, on Sunday 13 December at 9:00, followed by an after party with lunch. Organized by MEET Running & Outdoor Uruguay, according to its posts of 16 September and 8 October; there is a finisher medal, medical cover and benefits for groups of six or more. Registration by WhatsApp at 099 419 650.
