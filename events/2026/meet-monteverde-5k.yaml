description:
  es: Primera edición de un trail de 5 km no competitivo y de dificultad baja, para caminar, trotar o correr, en la Chacra Monteverde, San Carlos, Maldonado, el domingo 13 de diciembre a las 9:00, seguido de un after con almuerzo, DJ y sorteos. Organiza MEET Running & Outdoor Uruguay; hay medalla finisher, cobertura médica y precio especial para grupos de seis o más. Inscripción por el formulario del perfil de Instagram; el 31 de octubre el organizador anunció los últimos cupos.
  en: First edition of a non-competitive, easy 5 km trail to walk, jog or run at Chacra Monteverde, San Carlos, Maldonado, on Sunday 13 December at 9:00, followed by an after party with lunch, a DJ and prize draws. Organized by MEET Running & Outdoor Uruguay; there is a finisher medal, medical cover and a special price for groups of six or more. Registration through the form linked in the Instagram profile; on 31 October the organizer announced the last places.
