description:
  es: "Fecha del Campeonato Uruguayo de Mountain Bike de la Federación Ciclista Uruguaya (FCU), corrida el domingo 12 de abril de 2026 en el departamento de Maldonado. Hubo inscritos con licencia de élite, junior, máster A a E, damas élite y cadetes. La FCU la da por finalizada y publicó la clasificación de élite de hombres y de mujeres."
  en: "A round of the Uruguayan Mountain Bike Championship of the Uruguayan Cycling Federation (FCU), held on Sunday 12 April 2026 in the department of Maldonado. Licensed riders entered in elite, junior, master A to E, women's elite and cadet categories. The FCU lists it as finished and published the men's and women's elite classification."
