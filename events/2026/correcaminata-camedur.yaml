description:
  es: Correcaminata gratuita de CAMEDUR contra el cáncer de mama, el jueves 29 de octubre en Durazno. Sale de la Policlínica CAMEDUR (19 de Abril 972) y llega a la Plaza Independencia. Circuito corto de 3 km y largo de 5 km. Entrega de remeras 17:45, entrada en calor 18:15 y largada 18:30. Este año se puede participar también por equipos. Inscripción con formulario.
  en: Free run-walk by CAMEDUR against breast cancer on Thursday 29 October in Durazno. It starts at the CAMEDUR clinic (19 de Abril 972) and finishes at Plaza Independencia. Short loop of 3 km and long loop of 5 km. T-shirt pickup 17:45, warm-up 18:15, start 18:30. This year people can also take part as teams. Registration with a form.
