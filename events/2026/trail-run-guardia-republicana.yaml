description:
  es: Primera edición de un trail por el 16.º aniversario de la Guardia Republicana, el sábado 5 de diciembre de 2026 a las 8:00, con salida desde el destacamento de Gregorio Aznárez (Dirección III, Regional Este, Maldonado). Hay 3K, 5K y 10K, para corredores de todos los niveles, grupos y familias. La inscripción es en RedTickets; sin remera o con remera cuesta $700 o $1.000 el 3K, $800 o $1.300 el 5K y $900 o $1.500 el 10K.
  en: First edition of a trail race for the 16th anniversary of the Guardia Republicana, on Saturday 5 December 2026 at 8:00, starting from the Gregorio Aznárez post (Directorate III, East Region, Maldonado). There are 3K, 5K and 10K, for runners of all levels, groups and families. Registration is on RedTickets; without or with a shirt it costs $700 or $1,000 for the 3K, $800 or $1,300 for the 5K and $900 or $1,500 for the 10K.
