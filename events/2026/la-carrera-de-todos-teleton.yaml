name: La Carrera de Todos - Teletón
date: 2026-04-12
time: "09:00"
sport: run
city: Montevideo
venue: Prado
distances: [10K, 5K]
organizer: Fundación Teletón
links:
  site: https://www.teleton.org.uy/lacarreradetodos/
description:
  es: Carrera solidaria de Fundación Teletón, corrida el domingo 12 de abril de 2026 en el Prado de Montevideo, con 5K y 10K y largada a las 9:00. Kronos Sports, que cronometró, publicó los resultados por distancia y franja de edad, con categorías de discapacidad visual y especiales.
  en: Charity race by Fundación Teletón, held on Sunday 12 April 2026 at the Prado in Montevideo, with 5K and 10K and a 9:00 start. Kronos Sports, which did the timing, published the results by distance and age group, with visually impaired and special categories.
