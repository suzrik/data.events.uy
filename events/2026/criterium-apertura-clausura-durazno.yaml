description:
  es: Criterium que la Federación Ciclista Uruguaya clasifica como Campeonato Uruguayo, corrido el domingo 30 de agosto en Durazno y organizado por la Federación Ciclista Departamental de Durazno. Hubo pruebas separadas para hombres élite, sub-23 y junior, para mujeres, para máster A y B y para máster C y D, todas para ciclistas con licencia. La FCU lo da por finalizado y publicó la clasificación.
  en: A criterium that the Uruguayan Cycling Federation classes as Campeonato Uruguayo, held on Sunday 30 August in Durazno and organized by the Federación Ciclista Departamental de Durazno. There were separate races for men's elite, under-23 and junior, for women, for master A and B and for master C and D, all for licensed riders. The FCU lists it as finished and published the classification.
