name: Kilómetros que suman
date: 2026-11-14
sport: road
city: Cardona
distances: [185 km]
organizer: Kilómetros que suman
links:
  instagram: https://www.instagram.com/kilometros_que_suman/
description:
  es: Segunda edición del desafío solidario para la Teletón, el sábado 14 de noviembre de 2026. Unos 50 ciclistas pedalean 185 km sin parar desde Cardona y Florencio Sánchez hasta Montevideo, con parada en el Parque Lecocq; es sin fines de lucro y lo recaudado va a la Teletón. Según Rosario Ciclismo MTB la caravana pasa por Rosario hacia las 7:00, Colonia Valdense, Ecilda Paullier, Rafael Perazza y Libertad y llega al Parque Lecocq a las 14:20; se puede acompañar a unos 25 km/h.
  en: Second edition of the charity ride for the Teletón, on Saturday 14 November 2026. About 50 cyclists ride 185 km non-stop from Cardona and Florencio Sánchez to Montevideo, stopping at Parque Lecocq; it is non-profit and the money raised goes to the Teletón. According to Rosario Ciclismo MTB the caravan passes Rosario around 7:00, then Colonia Valdense, Ecilda Paullier, Rafael Perazza and Libertad, reaching Parque Lecocq at 14:20; riders can join at about 25 km/h.
