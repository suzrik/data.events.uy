description:
  es: Carrera de 5 km del Instituto Nacional de la Juventud (INJU) en Montevideo, el sábado 17 de octubre con largada en Parque Batlle. Se prevé el inicio de actividad a las 14:00 y la largada a las 16:00. Para mayores de 13 años; los menores de 18 necesitan permiso firmado y todos un certificado médico. Hay inscripción en línea y también el día de la carrera. Las fechas pueden cambiar.
  en: 5 km race of the Instituto Nacional de la Juventud (INJU) in Montevideo, on Saturday 17 October, starting at Parque Batlle. Activity starts at 14:00 and the race starts at 16:00. For people over 13; under-18s need a signed permission and everyone a medical certificate. Registration is online and also on race day. Dates may change.
