  en: A 5, 10 and 21 km race at Camping 33 Orientales in Durazno, held on Sunday 27 September 2026, starting at 9:00. Organized by Trillo Eventos; entry, on lolograste, cost $900 to $1,500 depending on distance, T-shirt and date. Encarrera published the results under that date.
