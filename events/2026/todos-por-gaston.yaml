description:
  es: Carrera solidaria por Gastón Rozza, que necesitaba una cirugía de alta complejidad, corrida el sábado 8 de agosto de 2026 a las 15:30 en el circuito aeróbico del Parque Rodó de San José. Hubo 3K familiar y 6K competitiva, con inscripción de $400 pagada en el lugar. Organizaron La Sierra Eventos Deportivos, la Intendencia de San José y Encarrera, que publicó los resultados.
  en: Charity race for Gastón Rozza, who needed complex surgery, held on Saturday 8 August 2026 at 15:30 on the Parque Rodó fitness circuit in San José. There was a family 3K and a competitive 6K, with a $400 entry paid on site. Organized by La Sierra Eventos Deportivos, the Intendencia de San José and Encarrera, which published the results.
