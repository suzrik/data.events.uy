description:
  es: "Tercera edición de MTB Capilla Corre, carrera de mountain bike en Capilla del Sauce, Florida, corrida el domingo 3 de mayo de 2026 con largada a las 10:00 desde la plaza. Hubo 50 km para elite y máster, 28 km para junior y promocionales y 16 km solo con medalla; la inscripción costaba $600 anticipada y $700 el día de la carrera. Crono MTB, que cronometró, publicó los resultados."
  en: "Third edition of MTB Capilla Corre, a mountain bike race in Capilla del Sauce, Florida, held on Sunday 3 May 2026, starting at 10:00 from the square. There were 50 km for elite and masters, 28 km for juniors and promotional riders and 16 km with medals only; entry cost $600 in advance and $700 on race day. Crono MTB, which did the timing, published the results."
