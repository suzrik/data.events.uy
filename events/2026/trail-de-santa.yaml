description:
  es: Primera edición de este trail en Santa Lucía del Este, Canelones, el sábado 19 de diciembre de 2026 a las 19:00, con dos distancias, 10 y 17 km. Lo organiza NF Entrenamientos. La inscripción, en Kronos, abrió el 6 de noviembre. En preventa (100 cupos) 1.000 pesos la promocional de 10 km y 1.300 la competitiva de 17 km; hasta el 30 de noviembre 1.200 y 1.500; en diciembre 1.400 y 1.700. El lugar de largada todavía no está publicado.
  en: First edition of this trail race in Santa Lucía del Este, Canelones, on Saturday 19 December 2026 at 19:00, with two distances, 10 and 17 km. It is organized by NF Entrenamientos. Registration, on Kronos, opened on 6 November. Early bird (100 places) 1,000 pesos for the 10 km promotional race and 1,300 for the 17 km competitive race; until 30 November 1,200 and 1,500; in December 1,400 and 1,700. The start venue is not published yet.
