description:
  es: Primera edición de este trail en Santa Lucía del Este, Canelones, el sábado 19 de diciembre de 2026 a las 19:00, con dos distancias, 10 y 17 km. Lo organiza NF Entrenamientos, según el perfil del evento, que lo presenta como el evento para cerrar el año. Lugar de largada, precios e inscripción todavía no publicados.
  en: First edition of this trail race in Santa Lucía del Este, Canelones, on Saturday 19 December 2026 at 19:00, with two distances, 10 and 17 km. It is organized by NF Entrenamientos, according to the event's profile, which presents it as a race to close the year. Start venue, prices and registration not published yet.
