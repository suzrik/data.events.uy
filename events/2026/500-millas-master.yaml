description:
  es: Cuarta edición de esta carrera de ruta por etapas en la ciudad de Artigas, de la Federación Ciclista Departamental de Artigas. El afiche la anuncia para juveniles de 14 a 17 años, damas y máster; la Federación Ciclista Uruguaya lista cadetes, Máster A a E de hombres y junior de mujeres. Cuatro etapas según el afiche, viernes 30 a las 14:00 (Ruta 30); sábado 31 a las 8:00 (circuito By Pass) y a las 16:00 (contrarreloj); domingo 1.º a las 8:00 (Ruta 30). Inscripción el viernes 30 de 8:30 a 11:00.
  en: Fourth edition of this road stage race in the city of Artigas, run by the Federación Ciclista Departamental de Artigas. The poster announces it for youth riders aged 14 to 17, women and masters; the Uruguayan Cycling Federation lists cadets, the men's Master A to E and junior women. Four stages according to the poster, Friday 30 at 14:00 (Route 30); Saturday 31 at 8:00 (By Pass circuit) and at 16:00 (time trial); Sunday 1 at 8:00 (Route 30). Registration is on Friday 30 from 8:30 to 11:00.
