description:
  es: Trail en La Manchega, sobre la Ruta 95 km 18,5, en Soriano, el domingo 29 de noviembre. Hay 7K participativo y 15K competitivo; los kits se entregan a las 7:00 y se larga a las 9:00. Medalla finisher para todos, premios por categorías de edad en los 15K y a los cinco primeros de la general en los 7K. La preinscripción se hace en la plataforma de cronometraje, que ubica el evento en Mercedes; el cupo se confirma con el pago. La página no dice quién organiza.
  en: Trail race at La Manchega, on Ruta 95 km 18.5, in Soriano, on Sunday 29 November. There is a participatory 7K and a competitive 15K; kits are handed out at 7:00 and the start is at 9:00. Finisher medal for everyone, age-group prizes in the 15K and prizes for the overall top five in the 7K. Pre-registration is on the timing platform, which places the event in Mercedes; the place is confirmed on payment. The page does not say who organizes it.
