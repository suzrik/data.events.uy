description:
  es: Correcaminata nocturna de 5K por camino rural, ida y vuelta y sin iluminación, por los 50 años de la Sociedad de Fomento Rural Los Arenales, Canelones, el sábado 19 de diciembre. Las actividades empiezan a las 17:00, la carrera infantil es a las 19:00 y la largada general a las 19:30; hay que llevar linterna. Cuesta $500 con remera y $200 sin remera (niños $400 y $150), en efectivo el día o por transferencia.
  en: A 5K night run-walk on a country road, out and back and unlit, for the 50th anniversary of the Sociedad de Fomento Rural Los Arenales, Canelones, on Saturday 19 December. Activities start at 17:00, the kids' race is at 19:00 and the main start at 19:30; bring a torch. It costs $500 with a shirt and $200 without (children $400 and $150), in cash on the day or by transfer.
