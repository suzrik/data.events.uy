name: Fondo Specialized Punta del Este
date: 2026-11-08
sport: road
city: Punta del Este
organizer: Specialized Uruguay
links:
  instagram: https://www.instagram.com/specializeduy/
description:
  es: Salida de ruta en grupo («fondo») que organiza Specialized Uruguay, no competitiva. Según su publicación del 20 de octubre, el próximo fondo es el domingo 8 de noviembre en Punta del Este y las inscripciones ya están abiertas, a través del enlace en sus historias destacadas. Punto de salida, horario y recorridos sin publicar.
  en: Non-competitive group road ride («fondo») organized by Specialized Uruguay. According to its post of 20 October, the next fondo is on Sunday 8 November in Punta del Este and registration is already open, through the link in its story highlights. Start point, time and routes not published.
