description:
  es: Salida de ruta en grupo («fondo») que organiza Specialized Uruguay, no competitiva. Según su publicación del 20 de octubre, el próximo fondo es el domingo 8 de noviembre en Punta del Este y las inscripciones ya están abiertas. La inscripción es un formulario del organizador (el formulario dice «Maldonado») con deslinde de responsabilidad obligatorio. Punto de salida, horario y recorridos sin publicar.
  en: Non-competitive group road ride («fondo») organized by Specialized Uruguay. According to its post of 20 October, the next fondo is on Sunday 8 November in Punta del Este and registration is already open. Registration is the organizer's form (the form says «Maldonado») with a mandatory liability waiver. Start point, time and routes not published.
