description:
  es: Salida de ruta en grupo («fondo») que organiza Specialized Uruguay, no competitiva. Su publicación del 20 de octubre la anunciaba para el domingo 8 de noviembre en Punta del Este; el formulario de inscripción del organizador dice ahora «Usted se está inscribiendo al fondo del 15/11/2026 en Maldonado», y su Instagram tiene una historia destacada «Fondo 15/11». La inscripción lleva deslinde de responsabilidad obligatorio. Punto de salida, horario y recorridos sin publicar.
  en: Non-competitive group road ride («fondo») organized by Specialized Uruguay. Its post of 20 October announced it for Sunday 8 November in Punta del Este; the organizer's registration form now says «you are registering for the fondo of 15/11/2026 in Maldonado», and its Instagram has a «Fondo 15/11» story highlight. Registration includes a mandatory liability waiver. Start point, time and routes not published.
