description:
  es: Fecha 12 del Campeonato de Invierno Centro Sur 2026, carrera de ruta del calendario regional de la Federación Ciclista Uruguaya, corrida el domingo 9 de agosto en Trinidad y organizada por la Federación Ciclista Trinitaria Departamental de Flores. Corrieron ciclistas con licencia en élite, sub-23, junior, máster A y B y cadetes. La FCU la da por finalizada y publicó la clasificación.
  en: Round 12 of the 2026 Campeonato de Invierno Centro Sur, a road race on the regional calendar of the Uruguayan Cycling Federation, held on Sunday 9 August in Trinidad and organized by the Federación Ciclista Trinitaria Departamental de Flores. Licensed riders raced in the elite, under-23, junior, master A and B and cadet categories. The FCU lists it as finished and published the classification.
