description:
  es: Cancelado; la FCU la marca «Cancelado» en su página y la quitó de su calendario. Iba a ser una carrera de ruta de dos etapas en San José de Mayo, organizada por la Unión Ciclista Maragata y fiscalizada por la Federación Ciclista Uruguaya, en su calendario regional. El sábado 14 de noviembre iba la etapa 1, «Mario Hernández», de 90 km, y el domingo 15 la etapa 2, «Jorge Jukich», de 140 km, para las categorías Élite, Sub-23 y Junior, en varones y damas.
  en: Cancelled; the FCU marks it «Cancelado» on its page and took it off its calendar. It was to be a two-stage road race in San José de Mayo, organized by the Unión Ciclista Maragata and supervised by the Uruguayan Cycling Federation, on its regional calendar. Stage 1, «Mario Hernández», 90 km, was set for Saturday 14 November, and stage 2, «Jorge Jukich», 140 km, for Sunday 15, for the Elite, Under-23 and Junior categories, men and women.
