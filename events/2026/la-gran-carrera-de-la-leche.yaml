description:
  es: Carrera de ruta de dos etapas en San José de Mayo, organizada por la Unión Ciclista Maragata y fiscalizada por la Federación Ciclista Uruguaya, en su calendario regional. El sábado 14 de noviembre se corre la etapa 1, «Mario Hernández», de 90 km, y el domingo 15 la etapa 2, «Jorge Jukich», de 140 km. Según la página de la FCU es para las categorías Élite, Sub-23 y Junior, en varones y damas. El lugar y la hora de largada no están publicados.
  en: Two-stage road race in San José de Mayo, organized by the Unión Ciclista Maragata and supervised by the Uruguayan Cycling Federation, on its regional calendar. Stage 1, «Mario Hernández», 90 km, is raced on Saturday 14 November, and stage 2, «Jorge Jukich», 140 km, on Sunday 15. According to the FCU page it is for the Elite, Under-23 and Junior categories, men and women. The start place and start time are not published.
