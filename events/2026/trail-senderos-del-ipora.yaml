name: Trail Senderos del Iporá
date: 2026-12-06
sport: trail
city: Tacuarembó
venue: Balneario Iporá, Parador 1
distances: [12 km, 5 km]
links:
  instagram: https://instagram.com/tacuarunners
  register: https://encarrera.uy/trail-senderos-del-ipora/
description:
  es: Segunda edición de este trail en el Balneario Iporá, Tacuarembó, con largada a las 8:00 en el parador 1. Hay 12K competitivo y 5K recreativo (a las 8:10), más una carrera kids de 500 m. El cupo es de 400 corredores y las inscripciones cierran el 25 de noviembre. Organiza Tacua Runners.
  en: Second edition of this trail race at Balneario Iporá, Tacuarembó, starting at 8:00 at parador 1. There is a competitive 12K and a recreational 5K (at 8:10), plus a 500 m kids race. The limit is 400 runners and registration closes on 25 November. Organized by Tacua Runners.
