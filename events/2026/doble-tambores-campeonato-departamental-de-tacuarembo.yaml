description:
  es: Doble Tambores, prueba de ruta del campeonato departamental de la Federación Ciclista de Tacuarembó, el domingo 27 de setiembre de 2026, solo para ciclistas federados. La Intendencia anunció una largada a tren controlado desde la zona de la carnicería El Gringo; la llegada estaba por definirse por obras cerca de la rotonda. La Federación Ciclista Uruguaya la lista como «Fecha 2» y publicó los participantes y la clasificación.
  en: Doble Tambores, a road race of the departmental championship of the Federación Ciclista de Tacuarembó, on Sunday 27 September 2026, for federation riders only. The city government announced a neutralized start from the area of the El Gringo butcher's shop; the finish was still to be set because of roadworks near the roundabout. The Uruguayan Cycling Federation lists it as «Fecha 2» and published the entry list and the classification.
