description:
  es: Trail de Trail Running Uruguay el domingo 6 de diciembre en la Estancia Mi Refugio, camino al Soldado, pasando el camping Arequita. Hay tres recorridos aproximados. La larga es de 26,8 km con 1240 m de ascenso (largada 7:30), la media de 17,2 km con 820 m (8:00) y la corta de 9 km con 370 m (8:30). Inscripciones abiertas en la web, con certificado médico.
  en: Trail race by Trail Running Uruguay on Sunday 6 December at Estancia Mi Refugio, on the Camino al Soldado past the Arequita campsite. There are three approximate courses. The long one is 26.8 km with 1240 m of climbing (start 7:30), the medium one is 17.2 km with 820 m (8:00) and the short one is 9 km with 370 m (8:30). Registration is open on the website, with a medical certificate.
