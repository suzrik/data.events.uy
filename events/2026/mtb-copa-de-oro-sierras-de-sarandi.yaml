description:
  es: Segunda edición de esta carrera de MTB en Sarandí de Barceló, Cerro Largo, el domingo 1 de noviembre, con largada a las 9:30. El afiche la presenta como sexta fecha del Campeonato Departamental y ubica el lugar en el km 54. Hay 50 km (élite, máster A a C y damas) y 25 km (junior, promocionales, máster D y E y damas). La inscripción cuesta $450, se paga por depósito y se completa en la web de Cronometra Mauá.
  en: Second edition of this MTB race in Sarandí de Barceló, Cerro Largo, on Sunday 1 November, starting at 9:30. The poster presents it as the sixth round of the Campeonato Departamental and places it at km 54. There are 50 km (elite, Master A to C and women) and 25 km (junior, promotional, Master D and E and women). Entry costs $450, paid by bank deposit, and you register on the Cronometra Mauá website.
