description:
  es: Segunda edición de esta carrera de MTB en Sarandí de Barceló, Cerro Largo, el domingo 1 de noviembre, con largada a las 9:30; es la sexta fecha del Campeonato Departamental de Cerro Largo. El afiche ubica el lugar en el km 54; el día de la carrera hay señalización en las entradas desde la Ruta 26. Hay 50 km (élite, máster A a C y damas) y 25 km (junior, promocionales, máster D y E y damas). Cuesta $450 por depósito, con inscripción en la web de Cronometra Mauá o el mismo día de 7:30 a 9:00.
  en: Second edition of this MTB race in Sarandí de Barceló, Cerro Largo, on Sunday 1 November, starting at 9:30; it is the sixth round of the Cerro Largo departmental championship. The poster places it at km 54; on race day the entrances from Route 26 are signposted. There are 50 km (elite, Master A to C and women) and 25 km (junior, promotional, Master D and E and women). Entry is $450 by bank deposit, registering on the Cronometra Mauá website, or on the day from 7:30 to 9:00.
