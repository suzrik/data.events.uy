description:
  es: Segunda edición de esta carrera de MTB, corrida en Sarandí de Barceló, Cerro Largo, el domingo 1 de noviembre de 2026, con largada anunciada a las 9:30; fue la sexta fecha del Campeonato Departamental de Cerro Largo. El afiche la ubicaba en el km 54, con acceso señalizado desde la Ruta 26. Hubo 50 km (élite, máster A a C y damas) y 25 km (junior, promocionales, máster D y E y damas). Cronometra Mauá publicó los resultados el 2 de noviembre.
  en: Second edition of this MTB race, held in Sarandí de Barceló, Cerro Largo, on Sunday 1 November 2026, with the start announced for 9:30; it was the sixth round of the Cerro Largo departmental championship. The poster placed it at km 54, with signposted access from Route 26. There were 50 km (elite, Master A to C and women) and 25 km (junior, promotional, Master D and E and women). Cronometra Mauá published the results on 2 November.
