description:
  es: Segunda edición de esta carrera de MTB en Sarandí de Barceló, Cerro Largo, el domingo 1 de noviembre, con largada a las 9:30. Hay 50 km (élite, máster y damas A a C) y 25 km (junior, promocionales, máster y damas D y E). Tiene puestos de hidratación y de recuperación, asistencia médica y medalla finisher. La inscripción se hace en la web de Cronometra Mauá.
  en: Second edition of this MTB race in Sarandí de Barceló, Cerro Largo, on Sunday 1 November, starting at 9:30. There are 50 km (elite, Master and women A to C) and 25 km (junior, promotional, Master and women D and E). It has hydration and recovery points, medical assistance and a finisher medal. Registration is on the Cronometra Mauá website.
