description:
  es: Cuarta fecha del campeonato departamental de ruta de la Liga de Ciclismo Departamental de Rivera (LICIDERI), fiscalizada por la Federación Ciclista Uruguaya, el domingo 22 de noviembre en Rivera. El afiche de la temporada pone esta fecha a cargo del Club Artigas. El lugar y la hora de largada y las distancias no están publicados.
  en: Fourth round of the departmental road championship of the Liga de Ciclismo Departamental de Rivera (LICIDERI), supervised by the Uruguayan Cycling Federation, on Sunday 22 November in Rivera. The season poster assigns this round to Club Artigas. The start place, start time and distances are not published.
