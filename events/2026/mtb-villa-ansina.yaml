name: MTB Villa Ansina
date: 2026-02-08
time: "10:00"
sport: mtb
city: Ansina
venue: Camping Municipal
distances: [52 km, 42 km]
links:
  site: https://cronomtb.uy/10o-edicion-villa-ansina/
description:
  es: "Décima edición de esta carrera de mountain bike en Villa Ansina, Tacuarembó, corrida el domingo 8 de febrero de 2026 con largada a las 10:00 desde el Camping Municipal. Hubo 52 km para las categorías competitivas (elite y máster) y 42 km para las promocionales; la inscripción, de $800, se pagaba el día de la carrera. Crono MTB, que cronometró, publicó los resultados."
  en: "Tenth edition of this mountain bike race in Villa Ansina, Tacuarembó, held on Sunday 8 February 2026, starting at 10:00 from the municipal campsite. There were 52 km for the competitive categories (elite and masters) and 42 km for the promotional ones; the $800 entry was paid on race day. Crono MTB, which did the timing, published the results."
