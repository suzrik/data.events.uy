name: Carrera Fundación Pérez Scremini Florida
date: 2026-10-18
sport: run
city: Florida
venue: Plaza Canina, Saravia y Rambla
distances: [5K]
links:
  site: https://perezscremini.org/
  instagram: https://www.instagram.com/perezscremini/
  facebook: https://www.facebook.com/perezscremini/
