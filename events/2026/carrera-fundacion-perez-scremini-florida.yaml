description:
  es: Carrera solidaria de 5K de la Fundación Pérez Scremini, que atiende a niños y adolescentes con cáncer, en la ciudad de Florida, el domingo 18 de octubre de 2026. Se puede correr o caminar, con largada desde la Plaza Canina (Saravia y Rambla). Es de mañana, pero conviene confirmar la hora con la organización, porque la página de inscripción muestra dos horas distintas. La inscripción incluye remera oficial y medalla finisher; para retirar el kit hay que presentar la cédula y firmar el deslinde.
  en: 5K charity race of the Pérez Scremini Foundation, which treats children and adolescents with cancer, in the city of Florida, on Sunday 18 October 2026. You can run or walk, starting from Plaza Canina (Saravia and Rambla). It is held in the morning, but check the exact start time with the organizers, because the registration page shows two different times. Registration includes the official shirt and a finisher medal; to collect the kit you must show your ID and sign the waiver.
