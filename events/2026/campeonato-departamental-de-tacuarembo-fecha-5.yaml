description:
  es: Doble Curtina, quinta fecha de ruta del campeonato departamental de la Federación Ciclista Departamental de Tacuarembó, fiscalizada por la FCU, el domingo 15 de noviembre de 2026. Según el afiche de la federación, la inscripción abre a las 8:00 y la largada es a las 8:30, con salida y llegada en la Carnicería El Gringo; cuesta $400 y hay $18.000 en premios en efectivo. Categorías Élite, Junior, Sub-23, Máster A a E y damas Élite.
  en: Doble Curtina, the fifth road round of the departmental championship of the Federación Ciclista Departamental de Tacuarembó, supervised by the FCU, on Sunday 15 November 2026. According to the federation's poster, sign-up opens at 8:00 and the start is at 8:30, starting and finishing at the Carnicería El Gringo; entry is $400 and there are $18,000 in cash prizes. Elite, Junior, Under-23, Master A to E and women's Elite categories.
