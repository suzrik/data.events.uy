description:
  es: Carrera de ruta de un día en Santa Lucía, Canelones, fecha del Campeonato Uruguayo de la Federación Ciclista Uruguaya, para las categorías élite, sub-23 y junior masculinas. Para el público es una carrera para ir a ver.
  en: One-day road race in Santa Lucía, Canelones, a round of the Campeonato Uruguayo of the Uruguayan Cycling Federation, for the men's elite, under-23 and junior categories. For the public it is one to go and watch.
