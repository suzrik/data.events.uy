description:
  es: Carrera de ruta de un día en Santa Lucía, Canelones, organizada por el Club Ciclista Alas Rojas de Santa Lucía y el Club Vida Nueva y Deportivo San Jacinto, fecha del Campeonato Uruguayo de la Federación Ciclista Uruguaya, para las categorías élite, sub-23 y junior masculinas. Para el público es una carrera para ir a ver.
  en: One-day road race in Santa Lucía, Canelones, organized by Club Ciclista Alas Rojas de Santa Lucía and Club Vida Nueva y Deportivo San Jacinto, a round of the Campeonato Uruguayo of the Uruguayan Cycling Federation, for the men's elite, under-23 and junior categories. For the public it is one to go and watch.
