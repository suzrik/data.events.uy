name: Trail Chacras de Porongos
date: 2026-10-04
sport: trail
city: Trinidad
venue: S.F.R. Chacras de Porongos, Ruta 14 km 143,3
distances: [10K, 5K]
links:
  site: https://cronomtb.uy/trail-chacras-de-porongos/
  register: https://cronomtb.uy/trail-chacras-de-porongos/
description:
  es: Primera edición de este trail de 5 y 10 km en Trinidad, Flores, el domingo 4 de octubre de 2026, con largada a las 10:00 desde la S.F.R. Chacras de Porongos, en la Ruta 14 km 143,3. Entrega de kits de 8:00 a 9:45. Circuito marcado, hidratación, fruta a la llegada, medalla finisher para todos y remera para los 100 primeros en pagar. Inscripción en cronomtb.uy, con pago por depósito. Crono MTB publicó los resultados del «1er Trail Porongos». El organizador no se nombra en la página.
  en: First edition of this 5 and 10 km trail run in Trinidad, Flores, on Sunday 4 October 2026, starting at 10:00 from S.F.R. Chacras de Porongos, Route 14 km 143.3. Kit pickup from 8:00 to 9:45. Marked course, water, fruit at the finish, a finisher medal for everyone and a shirt for the first 100 to pay. Registration on cronomtb.uy, paid by bank deposit. Crono MTB has published the results of the "1er Trail Porongos". The page does not name the organizer.
