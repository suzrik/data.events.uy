description:
  es: Primera fecha del Campeonato Nacional de Triatlón 2026-2027 de la Unión de Triatlón del Uruguay, el domingo 1 de noviembre a las 8:00, con punto de encuentro en el Puente de la Barra. Sprint de 750 m de natación, 20 km de ciclismo y 5 km de carrera; Promocional de 400 m, 10 km y 2,5 km; la inscripción también tiene AG Grup, Postas y MTB. Los no federados corren con permiso por el día; solo los federados suman para el ranking. Horario y distancias según el afiche de la Unión del 6 de octubre.
  en: First date of the 2026-2027 Campeonato Nacional de Triatlón of the Unión de Triatlón del Uruguay, on Sunday 1 November at 8:00, meeting at Puente de la Barra. Sprint of 750 m swim, 20 km bike and 5 km run; Promocional of 400 m, 10 km and 2.5 km; registration also has AG Grup, relay and MTB categories. Non-federated athletes race on a one-day permit, but only federated ones score ranking points. Start time and distances are from the union's poster of 6 October.
