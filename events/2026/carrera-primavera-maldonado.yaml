description:
  es: Carrera de ruta de un día en Maldonado, el sábado 3 de octubre de 2026, organizada por la Federación Ciclista de Maldonado dentro del calendario regional de la Federación Ciclista Uruguaya, con categorías élite y máster A a E de hombres y élite, sub-23 y junior de mujeres. Fue para ciclistas con licencia de la federación; la FCU la da por finalizada.
  en: One-day road race in Maldonado on Saturday 3 October 2026, organized by the Federación Ciclista de Maldonado as part of the regional calendar of the Uruguayan Cycling Federation, with men's elite and Master A to E categories and women's elite, under-23 and junior categories. It was for riders with a federation licence; the FCU lists it as finished.
