description:
  es: Carrera de 5 km del Instituto Nacional de la Juventud (INJU) en Rocha, el sábado 14 de noviembre con largada en Polideportivo. Inicio de actividad a las 17:30 y largada a las 18:00. Para mayores de 13 años; los menores de 18 necesitan permiso firmado y todos un certificado médico. Hay inscripción en línea y también el día de la carrera. Las fechas pueden cambiar.
  en: 5 km race of the Instituto Nacional de la Juventud (INJU) in Rocha, on Saturday 14 November, starting at Polideportivo. Activity starts at 17:30 and the race starts at 18:00. For people over 13; under-18s need a signed permission and everyone a medical certificate. Registration is online and also on race day. Dates may change.
