description:
  es: Correcaminata navideña de 5 km en el pueblo San Félix, departamento de Paysandú, para cerrar el año. Según la publicación del organizador del 14 de setiembre, es el domingo 20 de diciembre de 2026; la inscripción cuesta $900 e incluye camiseta. Información e inscripciones por WhatsApp al 099 207 073.
  en: Christmas 5 km run and walk in the village of San Félix, Paysandú department, to close the year. According to the organizer's post of 14 September, it is on Sunday 20 December 2026; registration costs $900 and includes a shirt. Information and registration by WhatsApp at 099 207 073.
