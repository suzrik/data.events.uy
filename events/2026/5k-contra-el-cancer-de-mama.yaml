description:
  es: Carrera solidaria de 5K contra el cáncer de mama, el sábado 3 de octubre de 2026 a las 16:00 en las Canteras del Parque Rodó, Montevideo, con circuito por la rambla para correr, trotar o caminar. Se premió la categoría damas; la de caballeros fue participativa. Para mayores de 13 años, con remera oficial obligatoria. Lo recaudado fue para la Comisión Honoraria de Lucha Contra el Cáncer. Suca Sports publicó los resultados.
  en: 5K charity race against breast cancer, on Saturday 3 October 2026 at 16:00 at the Canteras del Parque Rodó, Montevideo, on a course along the rambla to run, jog or walk. Prizes went to the women's category; the men's category was non-competitive. For runners over 13, with the official shirt required. Funds went to the Comisión Honoraria de Lucha Contra el Cáncer. Suca Sports published the results.
