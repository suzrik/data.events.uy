  es: Carrera de trail en el Parque Nacional Aarón de Anchorena, Colonia, que se corrió el domingo 2 de agosto de 2026 como tercera y última fecha de la Triple Corona de Colonia Aventura Corre (CAC), con 21K, 12K y 6K. Los resultados, con el puntaje acumulado de la Triple Corona, están publicados en Cronometraje Instantáneo.
  en: Trail race in Parque Nacional Aarón de Anchorena, Colonia, held on Sunday 2 August 2026 as the third and last round of the Triple Corona of Colonia Aventura Corre (CAC), over 21K, 12K and 6K. The results, with the cumulative Triple Corona points, are published on Cronometraje Instantáneo.
