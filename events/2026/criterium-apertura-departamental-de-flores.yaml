description:
  es: Criterium del calendario regional de la Federación Ciclista Uruguaya, corrido el domingo 27 de setiembre en Trinidad y organizado por la Federación Ciclista Trinitaria Departamental de Flores. Corrieron ciclistas con licencia de las categorías élite, sub-23 y junior masculinas. La FCU lo da por finalizado y publicó la clasificación.
  en: A criterium on the regional calendar of the Uruguayan Cycling Federation, held on Sunday 27 September in Trinidad and organized by the Federación Ciclista Trinitaria Departamental de Flores. Licensed riders raced in the men's elite, under-23 and junior categories. The FCU lists it as finished and published the classification.
