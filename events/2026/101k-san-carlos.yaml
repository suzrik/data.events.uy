  es: Carrera de mountain bike de larga distancia en San Carlos, Maldonado, corrida el domingo 25 de enero de 2026. Hubo recorridos de 101, 77 y 47 km, una prueba de gravel de 111 km y una categoría de bicicletas eléctricas. SUCA Timing publicó los resultados de todas las pruebas.
  en: A long-distance mountain bike race in San Carlos, Maldonado, held on Sunday 25 January 2026. There were 101, 77 and 47 km courses, a 111 km gravel race and an e-bike category. SUCA Timing published the results of every race.
