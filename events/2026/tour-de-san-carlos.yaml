description:
  es: "Carrera por etapas del calendario regional de la Federación Ciclista Uruguaya (FCU), corrida del viernes 30 de enero al domingo 1 de febrero de 2026 en San Carlos, Maldonado. Fueron una contrarreloj individual de 10 km y dos etapas de ruta de 147 y 148 km, para élite, sub-23 y junior masculinos. La FCU la da por finalizada y publicó la clasificación."
  en: "Stage race on the regional calendar of the Uruguayan Cycling Federation (FCU), held from Friday 30 January to Sunday 1 February 2026 in San Carlos, Maldonado. It had a 10 km individual time trial and two road stages of 147 and 148 km, for men's elite, under-23 and junior riders. The FCU lists it as finished and published the classification."
