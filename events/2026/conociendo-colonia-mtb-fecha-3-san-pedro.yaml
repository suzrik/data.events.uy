name: Conociendo Colonia MTB, fecha 3 San Pedro
date: 2026-10-18
sport: bike
city: San Pedro
venue: Club Deportivo San Pedro, ruta 83
links:
  site: https://time-experience.vercel.app/conociendo-colonia-mtb
