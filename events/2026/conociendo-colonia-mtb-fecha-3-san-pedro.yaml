description:
  es: Tercera y última fecha del campeonato Conociendo Colonia MTB 2026, el domingo 18 de octubre en el Club Deportivo San Pedro, Colonia. Hay carrera competitiva, promocional y gravel, con categorías por edad; las distancias no están publicadas. La inscripción web cierra el 17 de octubre a las 20:00 y también se puede anotar el día de la carrera. Las fechas anteriores fueron el 6 de setiembre en Miguelete y el 27 en Antolín. La plataforma de entradas nombra como organizador a Colonia Aventura Corre.
  en: Third and last round of the Conociendo Colonia MTB 2026 championship, on Sunday 18 October at Club Deportivo San Pedro, Colonia. There are competitive, promotional and gravel races, with age categories; the distances are not published. Online registration closes on 17 October at 20:00 and you can also sign up on race day. The earlier rounds were on 6 September in Miguelete and on 27 September in Antolín. The ticket platform names Colonia Aventura Corre as the organizer.
