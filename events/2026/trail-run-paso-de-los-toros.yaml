description:
  es: Cuarta edición del trail de Al Límite Deportes en Rincón del Bonete, Paso de los Toros, el domingo 15 de noviembre, con 8K y 16K que largan juntos a las 8:00 y Corre Kids a las 11:00. Según la publicación del organizador del 29 de setiembre, se pasó del 22 al 15 de noviembre por las elecciones. Hay premios generales y por edad. La inscripción, en encarrera.uy, cuesta de $1.300 a $2.100 según distancia y remera; entrega de kit el sábado 14 en el Hotel Sayonara y el domingo desde las 6:00.
  en: Fourth edition of the Al Límite Deportes trail race at Rincón del Bonete, Paso de los Toros, on Sunday 15 November, with 8K and 16K starting together at 8:00 and a kids' run at 11:00. According to the organizer's post of 29 September, it was moved from 22 to 15 November because of the elections. There are overall and age-group prizes. Registration, on encarrera.uy, costs $1,300 to $2,100 depending on distance and shirt; kit pick-up on Saturday 14 at Hotel Sayonara and on Sunday from 6:00.
