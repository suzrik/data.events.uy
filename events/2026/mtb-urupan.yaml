description:
  es: Vuelve la carrera de MTB del Club Social y Deportivo Urupan, con circuitos nuevos, el sábado 10 de octubre en Pando, Canelones. La largada es a las 15:00 en el Club Urupan y los kits se entregan de 13:00 a 14:45. Hay 50 km competitiva y 30 km promocional, con categorías por edad y categorías gravel. Está en el calendario regional de la Federación Ciclista Uruguaya. La inscripción se hace en Crono MTB.
  en: The MTB race of Club Social y Deportivo Urupan is back, with new courses, on Saturday 10 October in Pando, Canelones. The start is at 15:00 at Club Urupan and kits are handed out from 13:00 to 14:45. There is a 50 km competitive race and a 30 km promotional one, with age categories and gravel categories. It is on the regional calendar of the Uruguayan Cycling Federation. Registration is on Crono MTB.
