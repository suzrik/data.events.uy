name: Campeonato AAU, etapa El Auto Gris
date: 2026-11-21
sport: run
city: Ciudad de la Costa
venue: El Auto Gris
organizer: Agrupación de Atletas del Uruguay
links:
  site: https://atletas.uy/
  facebook: https://www.facebook.com/agrupaciondeatletasdeluruguay
description:
  es: Etapa del Campeonato 2026 de la Agrupación de Atletas del Uruguay (AAU) en El Auto Gris, Ciudad de la Costa, el sábado 21 de noviembre, según el calendario oficial de la temporada. La AAU avisó que, si hay cambios en el calendario, serán de sede y no de fecha. La hora, las distancias y la inscripción de esta etapa todavía no fueron anunciadas.
  en: Stage of the 2026 championship of the Agrupación de Atletas del Uruguay (AAU) at El Auto Gris, Ciudad de la Costa, on Saturday 21 November, according to the official season calendar. The AAU said that any changes to the calendar would be of venue, not of date. Start time, distances and registration for this stage have not been announced yet.
