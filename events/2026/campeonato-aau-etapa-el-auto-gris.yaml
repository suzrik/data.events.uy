description:
  es: Penúltima etapa del Campeonato 2026 de la Agrupación de Atletas del Uruguay (AAU), «Santa Elena 2026», el sábado 21 de noviembre por la tarde en Lagomar, Ciudad de la Costa. Largada y llegada frente al Colegio Santa Elena, ida y vuelta por la Rambla Costanera. 5K a las 19:00 y 10K a las 19:10; carrera de niños gratuita a las 18:15. Inscripción 350 pesos sin remera y 950 con remera. Organizan la AAU, Auto Gris y el Instituto de Educación Santa Elena.
  en: Second-to-last stage of the 2026 championship of the Agrupación de Atletas del Uruguay (AAU), «Santa Elena 2026», on Saturday 21 November in the evening in Lagomar, Ciudad de la Costa. Start and finish in front of Colegio Santa Elena, out and back along the Rambla Costanera. 5K at 19:00 and 10K at 19:10; free children's race at 18:15. Entry 350 pesos without a shirt and 950 with a shirt. Organized by the AAU, Auto Gris and the Instituto de Educación Santa Elena.
