name: Campeonato AAU, etapa Santa Elena
date: 2026-11-21
time: "19:00"
sport: run
city: Ciudad de la Costa
venue: Frente al Colegio Santa Elena, Rambla Costanera (Lagomar)
distances: [10K, 5K]
organizer: Agrupación de Atletas del Uruguay, Auto Gris e Instituto de Educación Santa Elena
links:
