name: Vuelta a Los Puentes del Santa Lucía
date: 2026-10-25
sport: bike
city: Florida
entry: elite
links:
  site: https://federacionciclista.com.uy/calendario/
description:
  es: Carrera de ruta de un día en Florida, fecha del Campeonato Uruguayo de la Federación Ciclista Uruguaya, con categorías élite, sub-23 y junior de hombres y mujeres y categorías máster masculinas. Para el público es una carrera para ir a ver.
  en: One-day road race in Florida, a round of the Campeonato Uruguayo of the Uruguayan Cycling Federation, with men's and women's elite, under-23 and junior categories and men's master categories. For the public it is one to go and watch.
