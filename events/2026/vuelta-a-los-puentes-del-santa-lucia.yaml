description:
  es: Carrera de ruta de un día en Florida, organizada por el Club Ciclista San Antonio de Florida, fecha del Campeonato Uruguayo de la Federación Ciclista Uruguaya, con categorías élite, sub-23 y junior de hombres y mujeres y categorías máster masculinas. Es para ciclistas con licencia de la federación.
  en: One-day road race in Florida, organized by Club Ciclista San Antonio de Florida, a round of the Campeonato Uruguayo of the Uruguayan Cycling Federation, with men's and women's elite, under-23 and junior categories and men's master categories. It is for riders with a federation licence.
