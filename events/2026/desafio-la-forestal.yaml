description:
  es: Carrera de MTB el domingo 8 de noviembre, con largada a las 9:30 en la Fábrica de Alfajores Villa Serrana, en Minas, Lavalleja, que festeja los 4 años de su parque DColores. Hay un Desafío de 35 km, con categorías por edad, y un cicloturismo de 20 km. La inscripción está abierta en Punto de Control. La página no nombra al organizador.
  en: MTB race on Sunday 8 November, starting at 9:30 at the Fábrica de Alfajores Villa Serrana, in Minas, Lavalleja, which is celebrating 4 years of its DColores park. There is a 35 km Desafío, with age categories, and a 20 km leisure ride. Registration is open on Punto de Control. The page does not name the organizer.
