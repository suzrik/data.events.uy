description:
  es: Carrera al amanecer por Piriápolis y el cerro San Antonio, organizada por RS Eventos Deportivos, corrida el domingo 1 de febrero de 2026 con 8 y 15 km. Encarrera publicó los resultados con esa fecha, y la página del organizador enlaza las fotos de la edición 2026.
  en: A sunrise race around Piriápolis and Cerro San Antonio, organized by RS Eventos Deportivos, held on Sunday 1 February 2026 over 8 and 15 km. Encarrera published the results under that date, and the organizer's page links to photos of the 2026 edition.
