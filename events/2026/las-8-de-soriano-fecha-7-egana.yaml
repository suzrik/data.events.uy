description:
  es: Séptima fecha de Las 8 de Soriano, campeonato departamental de running, el sábado 12 de setiembre de 2026 en Egaña, Soriano, con largada a las 16:00 y 10K y 5K por categorías. La inscripción costaba $1000 con remera y $1200 el día de la carrera. Crono MTB, que cronometró, publicó los resultados.
  en: Seventh round of Las 8 de Soriano, a departmental running championship, on Saturday 12 September 2026 in Egaña, Soriano, starting at 16:00, with 10K and 5K by category. Entry cost $1000 with a T-shirt and $1200 on race day. Crono MTB, which did the timing, published the results.
