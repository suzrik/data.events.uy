entry: license
links:
  site: https://atletas.uy/
description:
  es: Etapa del Campeonato de la Agrupación de Atletas del Uruguay en Malvin, el domingo 1 de noviembre. La fecha surge del calendario de la Intendencia de Montevideo, no de la AAU. El reglamento da derecho a participar a todos los asociados de la AAU, y las etapas son los domingos de mañana o los sábados de tarde.
  en: Stage of the Agrupación de Atletas del Uruguay championship in Malvin, on Sunday 1 November. The date comes from the Montevideo city calendar, not from the AAU. The rules give all AAU members the right to take part, and stages are held on Sunday mornings or Saturday afternoons.
