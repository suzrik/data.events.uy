name: Campeonato AAU, etapa Malvin
date: 2026-11-01
sport: run
city: Montevideo
venue: Club Malvín, Av. Legrand esquina Rivera
distances: [10K, 5K]
links:
  site: https://clubmalvin.uy/carrera
  instagram: https://www.instagram.com/clubmalvin.uy/
  register: https://docs.google.com/forms/d/e/1FAIpQLSdOxY-zlhgtKEiqUWI3rauNczXEgmiDg_1A2O68PxaRSO-guQ/viewform
description:
  es: Etapa del Campeonato de la Agrupación de Atletas del Uruguay (AAU) en Malvín. Es la Malvín Run, que la AAU organiza junto al Club Malvín, el domingo 1 de noviembre. La carrera de niños larga a las 9:00, la 5K a las 9:10 y la 10K a las 9:20, con largada y llegada frente al Club Malvín. La inscripción es abierta, por formulario y con cupos limitados; no se aceptan inscripciones el día de la carrera. Cronometra la AAU y hay premios generales y para socios del club.
  en: Stage of the Agrupación de Atletas del Uruguay (AAU) championship in Malvín. It is the Malvín Run, which the AAU organizes together with Club Malvín, on Sunday 1 November. The kids' race starts at 9:00, the 5K at 9:10 and the 10K at 9:20, starting and finishing in front of Club Malvín. Registration is open to everyone, by form and with limited places; there is no registration on race day. The AAU does the timing and there are overall prizes and prizes for club members.
