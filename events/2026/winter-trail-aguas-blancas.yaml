description:
  es: Edición aniversario del trail de invierno de NCS, corrida el domingo 9 de agosto de 2026 a las 10:00 en el predio privado Qué Antojo, en Aguas Blancas, Lavalleja. Hubo 7 km de exigencia baja, 14 km con caída de agua y una carrera infantil gratis, con cupo de 350 corredores. Encarrera, en cuya página estaba la inscripción, publicó los resultados de 7K y 14K.
  en: Anniversary edition of the NCS winter trail race, held on Sunday 9 August 2026 at 10:00 at the private Qué Antojo grounds in Aguas Blancas, Lavalleja. There was an easier 7 km, a 14 km past a waterfall and a free kids race, capped at 350 runners. Encarrera, whose page carried the registration, published the 7K and 14K results.
