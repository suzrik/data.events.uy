  es: Ultra por tiempo en San Carlos, Maldonado, el sábado 3 y el domingo 4 de octubre de 2026, con modalidades de 1, 3, 6, 12 y 24 horas. El 3 de octubre largaban a las 9:00 las de 24 horas y 1 hora, a las 18:00 la de 6, a las 19:00 la de 3 y a las 21:00 la de 12. Inscripción en encarrera.uy con pago en Abitab; la remera se paga aparte. Organizó Legión Athletics. Lugar exacto y tipo de circuito no encontrados; encarrera.uy abrió una página de resultados, todavía vacía.
  en: Timed ultra in San Carlos, Maldonado, on Saturday 3 and Sunday 4 October 2026, with 1, 3, 6, 12 and 24 hour races. On 3 October the 24 hour and 1 hour races were to start at 9:00, the 6 hour at 18:00, the 3 hour at 19:00 and the 12 hour at 21:00. Registration on encarrera.uy with payment at Abitab; the shirt is paid separately. Organized by Legión Athletics. Exact venue and type of course not found; encarrera.uy has opened a results page, still empty.
