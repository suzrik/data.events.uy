description:
  es: Campeonato nacional de ciclismo de pista de la Federación Ciclista Uruguaya, el sábado 19 y el domingo 20 de diciembre en el Velódromo Milton Wynants de Paysandú. Compiten las categorías junior, sub-23 y élite de hombres y mujeres en kilómetro, velocidad, persecución individual, keirin, eliminación, scratch, prueba por puntos y ómnium, con puntos UCI. La FCU dice que los días y horarios de cada prueba se comunicarán más adelante. Para el público es una competencia para ir a ver.
  en: National track cycling championships of the Uruguayan Cycling Federation, on Saturday 19 and Sunday 20 December at the Velódromo Milton Wynants in Paysandú. The men's and women's junior, under-23 and elite categories race the kilometre, sprint, individual pursuit, keirin, elimination, scratch, points race and omnium, with UCI points. The FCU says the day and time of each event will be announced later. For the public it is one to go and watch.
