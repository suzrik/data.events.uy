description:
  es: Carrera de trail en los Médanos del Calabrés, Colonia, que se corrió el domingo 5 de julio de 2026 como segunda fecha, «La prueba de fuego», de la Triple Corona de Colonia Aventura Corre (CAC), con 21K, 12K y 6K. Los resultados, con el puntaje acumulado de la Triple Corona, están publicados en Cronometraje Instantáneo.
  en: Trail race on the Médanos del Calabrés dunes, Colonia, held on Sunday 5 July 2026 as the second round, "La prueba de fuego", of the Triple Corona of Colonia Aventura Corre (CAC), over 21K, 12K and 6K. The results, with cumulative Triple Corona points, are published on Cronometraje Instantáneo.
