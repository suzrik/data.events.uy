description:
  es: Carrera de ruta de dos días entre Treinta y Tres y Melo, organizada por el Club Unión Ciclista, fecha del Campeonato Uruguayo de la Federación Ciclista Uruguaya, con categorías élite, sub-23 y junior de hombres y mujeres. Para el público es una carrera para ir a ver.
  en: Two-day road race between Treinta y Tres and Melo, organized by Club Unión Ciclista, a round of the Campeonato Uruguayo of the Uruguayan Cycling Federation, with men's and women's elite, under-23 and junior categories. For the public it is one to go and watch.
