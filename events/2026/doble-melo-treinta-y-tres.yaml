description:
  es: 77.ª edición de la Doble Melo, carrera de ruta de dos días del Club Unión Ciclista de Treinta y Tres, 4.ª fecha del Campeonato Uruguayo de la Federación Ciclista Uruguaya (FCU). Iba a correrse el 28 y 29 de noviembre; se aplazó al 5 y 6 de diciembre por falta de Policía Caminera en el fin de semana de la final de la Libertadores. La etapa 1 va de Treinta y Tres a Melo (120 km) y la etapa 2 vuelve por la Ruta 12 (145 km). Inscripción de federados $500, hasta el 1 de diciembre a las 14:00.
  en: 77th edition of the Doble Melo, a two-day road race by Club Unión Ciclista of Treinta y Tres, round 4 of the Campeonato Uruguayo of the Uruguayan Cycling Federation (FCU). It was due on 28 and 29 November; it was postponed to 5 and 6 December for lack of highway police on the weekend of the Copa Libertadores final. Stage 1 runs from Treinta y Tres to Melo (120 km) and stage 2 returns via Ruta 12 (145 km). Entry for licensed riders costs $500, until 1 December at 14:00.
