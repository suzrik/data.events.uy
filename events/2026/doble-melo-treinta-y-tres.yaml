description:
  es: 77.ª edición de la Doble Melo, carrera de ruta de dos días del Club Unión Ciclista de Treinta y Tres, 4.ª fecha del Campeonato Uruguayo de la Federación Ciclista Uruguaya, el 28 y 29 de noviembre. La etapa 1 va de Treinta y Tres a Melo (120 km) y la etapa 2 vuelve de Melo a Treinta y Tres por el empalme de la Ruta 12 (145 km). Corren hombres y mujeres élite, sub-23 y junior; la inscripción de los federados cuesta $500. Para el público es una carrera para ir a ver.
  en: 77th edition of the Doble Melo, a two-day road race by Club Unión Ciclista of Treinta y Tres, round 4 of the Campeonato Uruguayo of the Uruguayan Cycling Federation, on 28 and 29 November. Stage 1 runs from Treinta y Tres to Melo (120 km) and stage 2 returns from Melo to Treinta y Tres via the Ruta 12 junction (145 km). Men's and women's elite, under-23 and junior riders take part; entry for licensed riders costs $500. For the public it is one to go and watch.
