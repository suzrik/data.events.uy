description:
  es: 77.ª edición de la Doble Melo, carrera de ruta de dos días del Club Unión Ciclista de Treinta y Tres, 4.ª fecha del Campeonato Uruguayo de la Federación Ciclista Uruguaya. Iba a correrse el 28 y 29 de noviembre; el club la aplazó al 5 y 6 de diciembre porque la Policía Caminera no tiene efectivos ese fin de semana por la final de la Copa Libertadores. La etapa 1 va de Treinta y Tres a Melo (120 km) y la etapa 2 vuelve por el empalme de la Ruta 12 (145 km). Inscripción de federados $500.
  en: 77th edition of the Doble Melo, a two-day road race by Club Unión Ciclista of Treinta y Tres, round 4 of the Campeonato Uruguayo of the Uruguayan Cycling Federation. It was due on 28 and 29 November; the club postponed it to 5 and 6 December because the highway police have no officers that weekend due to the Copa Libertadores final. Stage 1 runs from Treinta y Tres to Melo (120 km) and stage 2 returns via the Ruta 12 junction (145 km). Entry for licensed riders costs $500.
