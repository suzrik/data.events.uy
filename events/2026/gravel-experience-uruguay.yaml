description:
  es: Carrera de gravel de dos etapas en Rocha, el sábado 31 de octubre y el domingo 1 de noviembre, dentro del programa de la Threerace Bike Ultramarathon Uruguay. La etapa 1, de 101 km, larga a las 7:45 del Centro Polideportivo de Rocha; la etapa 2, de 73 km, larga a las 8:20 del Mirador de La Pedrera. Hay una categoría masculina y una femenina, por tiempo acumulado, y hasta 120 participantes. La organizan Threerace Sports y Azimut Extremo; la inscripción es por Windfit.
  en: Two-stage gravel race in Rocha, on Saturday 31 October and Sunday 1 November, part of the Threerace Bike Ultramarathon Uruguay programme. Stage 1, of 101 km, starts at 7:45 from the Centro Polideportivo in Rocha; stage 2, of 73 km, starts at 8:20 from the Mirador de La Pedrera. There is one men's and one women's category, on cumulative time, and up to 120 riders. Organized by Threerace Sports and Azimut Extremo; registration is on Windfit.
