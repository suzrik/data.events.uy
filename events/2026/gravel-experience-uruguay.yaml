description:
  es: Carrera de gravel de dos etapas, de 115 km y 68 km, en La Paloma y Rocha, el sábado 31 de octubre y el domingo 1 de noviembre. La organizan Threerace Sports y Azimut Extremo, el mismo fin de semana que la Threerace Bike Ultramarathon Uruguay. La inscripción se hace en la plataforma Windfit. Los lugares de largada, el programa y las categorías se consultan en el sitio del organizador.
  en: Two-stage gravel race, of 115 km and 68 km, in La Paloma and Rocha, on Saturday 31 October and Sunday 1 November. It is organized by Threerace Sports and Azimut Extremo, on the same weekend as the Threerace Bike Ultramarathon Uruguay. Registration is on the Windfit platform. See the organizer's site for the start places, the schedule and the categories.
