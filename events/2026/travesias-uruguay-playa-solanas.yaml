description:
  es: Fecha de la Travesías Uruguay Open Water Series 2027, temporada de aguas abiertas que va de diciembre a marzo, el sábado 19 de diciembre de 2026, en la Playa Solanas. La fecha también figura en el calendario de aguas abiertas de la Federación Uruguaya de Natación. La hora de largada, las distancias y la inscripción todavía no están publicadas.
  en: A date of the Travesías Uruguay Open Water Series 2027, an open-water season running from December to March, on Saturday 19 December 2026, at Playa Solanas. The date is also on the Uruguayan Swimming Federation's open-water calendar. The start time, distances and registration are not published yet.
