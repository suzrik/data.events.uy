name: Copa Invierno Marcio May, etapa 2
date: 2026-06-28
sport: mtb
city: Puntas de Valdez
venue: Cancha de Juincan
organizer: La Sierra Eventos Deportivos
links:
  site: https://lasierra.uy/copa-invierno-marcio-may/
