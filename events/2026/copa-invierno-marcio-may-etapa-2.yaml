description:
  es: Segunda de las tres etapas de la Copa Invierno Marcio May 2026, campeonato de mountain bike de La Sierra Eventos Deportivos, corrida el domingo 28 de junio de 2026 en la cancha de Juincan, Puntas de Valdez, San José. La página de la copa en el sitio del organizador da 254 competidores; Encarrera publicó los resultados de esta fecha.
  en: Second of the three stages of the 2026 Copa Invierno Marcio May, a mountain bike championship by La Sierra Eventos Deportivos, held on Sunday 28 June 2026 at the Juincan ground in Puntas de Valdez, San José. The cup page on the organizer's site gives 254 competitors; Encarrera published the results of this round.
