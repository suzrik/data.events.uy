description:
  es: Tercera etapa de la serie Recorre Maldonado 2026, organizada por SUCA Sports, corrida el sábado 23 de mayo de 2026 a las 15 hs en Aiguá, con centro en la Sociedad Fomento. Fue una etapa de cross country por trillos de pasto y cañadas en los alrededores de la ciudad, con 10K y 5K. SUCA publicó los resultados; su listado los fecha el 22 de mayo, pero la página de cada resultado y la del organizador dicen sábado 23.
  en: Third stage of the 2026 Recorre Maldonado series, organized by SUCA Sports, held on Saturday 23 May 2026 at 3 pm in Aiguá, based at the Sociedad Fomento. It was a cross-country stage on grass tracks and across streams around the town, with 10K and 5K. SUCA published the results; its index dates them 22 May, but each results page and the organizer's page say Saturday 23.
