name: La MATT Stage Trail
date: 2026-10-24
end_date: 2026-10-25
sport: trail
city: Punta Ballena
venue: Arboretum Lussich y Cerro Pan de Azúcar
links:
  instagram: https://www.instagram.com/mileuaventura/
description:
  es: Octava edición de la carrera por etapas de Mileu Aventura Todo Terreno. Son tres etapas en dos días, con una noche compartida, el sábado 24 y el domingo 25 de octubre, en Punta Ballena, el Arboretum Lussich y el Cerro Pan de Azúcar. Según la publicación del organizador del 17 de setiembre, se sumó una distancia participativa de 10 km con 320 m de ascenso, junto a la tercera etapa en el Arboretum Lussich. Las distancias de las etapas no están publicadas. Inscripciones por WhatsApp al 091 651 351.
  en: Eighth edition of the stage race by Mileu Aventura Todo Terreno. Three stages over two days, with a shared night, on Saturday 24 and Sunday 25 October, in Punta Ballena, the Arboretum Lussich and Cerro Pan de Azúcar. According to the organizer's post of 17 September, a participatory 10 km distance with 320 m of climbing was added, run alongside the third stage in the Arboretum Lussich. The stage distances are not published. Registration and enquiries by WhatsApp at 091 651 351.
