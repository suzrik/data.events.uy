description:
  es: Primera edición de este duatlón rústico a beneficio de la Escuela Rural N.º 53 Casildo Larrañaga, cerca de San Ramón, Canelones, el sábado 3 de octubre. Largada a las 15:00; números de 13:00 (13:30 en el afiche) a 14:45. Combinaba 4,5 km de carrera y 26 km en MTB, individual con categorías por edad o en duplas masculinas, femeninas o mixtas. Costaba $800 individual y $1300 la dupla, por Abitab. Organizó San Ramón MTB; inscripción en Crono MTB, donde no encontramos resultados publicados.
  en: First edition of this off-road duathlon for the benefit of Escuela Rural No. 53 Casildo Larrañaga near San Ramón, Canelones, on Saturday 3 October. Start at 15:00; numbers from 13:00 (13:30 on the poster) to 14:45. It combined 4.5 km of running and 26 km on a mountain bike, solo with age categories or in men's, women's or mixed pairs. It cost $800 solo and $1,300 per pair, through Abitab. Organized by San Ramón MTB; registration on Crono MTB, where we found no published results.
