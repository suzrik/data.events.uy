description:
  es: Segunda edición de Canelones Corre, organizada por el Club Guadalupe. Hay 4K y 8K, con largada a las 17:00 en Tolentino González y Batlle y Ordóñez. Incluye chip de cronometraje, medalla finisher para todos, hidratación y frutas. La remera es opcional y las inscripciones cierran al llenarse los cupos.
  en: Second edition of Canelones Corre, organized by Club Guadalupe. It offers 4K and 8K, starting at 17:00 at Tolentino González and Batlle y Ordóñez. It includes chip timing, a finisher medal for everyone, hydration and fruit. The shirt is optional and registration closes when places are full.
