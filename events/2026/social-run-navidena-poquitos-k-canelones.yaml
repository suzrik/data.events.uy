  es: Segunda Social Run de Poquitos K, edición navideña, el viernes 11 de diciembre a las 20:00 en el Parque Artigas de Canelones. Es una salida para correr o caminar, sin distancia anunciada; se invita a ir disfrazado y a llevar un juguete para donar a una institución. Organizan Poquitos K y Santiago Romero.
  en: Second Poquitos K Social Run, Christmas edition, on Friday 11 December at 20:00 in Parque Artigas, Canelones. It is a run or walk with no announced distance; people are invited to come in costume and bring a toy to donate to a charity. Organized by Poquitos K and Santiago Romero.
