description:
  es: Carrera de MTB de 35 km el domingo 29 de noviembre en el Establecimiento La Tipa, Rocha, con largada a las 9:30; los kits se entregan desde las 8:00. Hay categorías junior, elite, máster, damas y promocional, y un cicloturismo sin categorías. La inscripción cuesta $650 para competidores y $350 para cicloturismo, y se paga el día de la carrera.
  en: A 35 km MTB race on Sunday 29 November at Establecimiento La Tipa, Rocha, starting at 9:30; kits are handed out from 8:00. There are junior, elite, master, women's and promotional categories, plus a cycle tour with no categories or prizes. Entry costs $650 for racers and $350 for the cycle tour, paid on race day.
