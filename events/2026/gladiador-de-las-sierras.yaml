description:
  es: Carrera de 5K y 21K en Sarandí de Barceló, Cerro Largo (Ruta 26, km 54), el domingo 1 de noviembre de 2026, con largada a las 16 hs para las dos distancias. La 5K tiene categorías desde los 14 años y la 21K desde los 20. El afiche anuncia puestos de hidratación, asistencia médica y medalla finisher. La inscripción se hace en el sitio de Cronometra Mauá; la página no nombra a otro organizador ni describe el terreno.
  en: 5K and 21K race in Sarandí de Barceló, Cerro Largo (Ruta 26, km 54), on Sunday 1 November 2026, starting at 4 pm for both distances. The 5K has categories from age 14 and the 21K from age 20. The poster announces hydration points, medical assistance and a finisher medal. Registration is on the Cronometra Mauá site; the page names no other organizer and does not describe the terrain.
