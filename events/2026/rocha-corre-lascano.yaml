description:
  es: Etapa 2 de Rocha Corre 2026/2027, campeonato de running de la Intendencia de Rocha y su Dirección de Deportes, corrida el sábado 19 de setiembre de 2026 en Lascano, el año en que la ciudad cumplió 150 años, con largada a las 16:00 desde la Plaza de Deportes. Hubo una 5K y una 10K. La fecha figura en el calendario de rochacorre.uy y en la página de inscripción; Encarrera publicó los resultados.
  en: Stage 2 of Rocha Corre 2026/2027, a running championship run by the Rocha city government and its Sports Directorate, held on Saturday 19 September 2026 in Lascano, in the town's 150th year, starting at 16:00 from the Plaza de Deportes. There was a 5K and a 10K. The date is on the rochacorre.uy calendar and the registration page; Encarrera published the results.
