name: Carrera Aniversario del Grupo de Artillería N.º 4
date: 2026-10-24
sport: run
city: Minas
venue: Grupo de Artillería N.º 4, Ruta 8 y Ruta 12
distances: [10K, 5K]
links:
  instagram: https://www.instagram.com/grupo_artilleria_4_uy/
  register: https://www.passline.com/eventos/carrera-81-aniversario-del-grupo-de-artilleria-nro-4
description:
  es: Carrera por el 81.º aniversario del Grupo de Artillería N.º 4 del Ejército, en Minas, Lavalleja, el sábado 24 de octubre de 2026 a las 10 hs. Hay 5K y 10K con largada desde la sede de la unidad, en el cruce de Ruta 8 y Ruta 12. La inscripción incluye remera, medalla finisher, cronometraje e hidratación, y lo recaudado se dona a instituciones educativas. El calendario de ruta de la Confederación Atlética del Uruguay lista ese día el «10K Ejército» en Lavalleja, fecha del Clausura 10K.
  en: Race for the 81st anniversary of the Army's Grupo de Artillería N.º 4, in Minas, Lavalleja, on Saturday 24 October 2026 at 10:00. There are 5K and 10K races starting from the unit's base, at the junction of Ruta 8 and Ruta 12. Registration includes a shirt, finisher medal, timing and hydration, and the proceeds are donated to educational institutions. The road calendar of the Confederación Atlética del Uruguay lists the "10K Ejército" in Lavalleja on that day as a Clausura 10K round.
