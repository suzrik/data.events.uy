description:
  es: Segunda fecha del campeonato Conociendo Colonia MTB 2026, que se corrió el domingo 27 de setiembre en el Club Sudamérica de Paso Antolín, sobre la ruta 22, en Colonia. Hubo carrera competitiva, promocional y gravel, con categorías por edad; las distancias no están publicadas. La primera fecha fue el 6 de setiembre en Miguelete y la tercera, el 18 de octubre en San Pedro. La plataforma de entradas nombra como organizador a Colonia Aventura Corre; los resultados están en Cronometraje Instantáneo.
  en: Second round of the Conociendo Colonia MTB 2026 championship, held on Sunday 27 September at Club Sudamérica in Paso Antolín, on Route 22, Colonia. There were competitive, promotional and gravel races, with age categories; the distances are not published. The first round was on 6 September in Miguelete and the third on 18 October in San Pedro. The ticket platform names Colonia Aventura Corre as the organizer; results are on Cronometraje Instantáneo.
