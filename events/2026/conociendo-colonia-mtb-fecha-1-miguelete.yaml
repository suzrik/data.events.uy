description:
  es: Primera fecha del campeonato Conociendo Colonia MTB 2026, que se corrió el domingo 6 de setiembre en el Club Danubio de Miguelete, Colonia. Hubo carrera competitiva de 50 km, promocional de 25 km y gravel de 50 km, con categorías por edad. Las otras fechas fueron el 27 de setiembre en Antolín y el 18 de octubre en San Pedro. La plataforma de entradas nombra como organizador a Colonia Aventura Corre; los resultados están en Cronometraje Instantáneo.
  en: First round of the Conociendo Colonia MTB 2026 championship, held on Sunday 6 September at Club Danubio in Miguelete, Colonia. There was a 50 km competitive race, a 25 km promotional race and a 50 km gravel race, with age categories. The other rounds were on 27 September in Antolín and on 18 October in San Pedro. The ticket platform names Colonia Aventura Corre as the organizer; results are on Cronometraje Instantáneo.
