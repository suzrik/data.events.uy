name: Florida Corre con Vos, Fray Marcos
date: 2026-11-21
time: "16:00"
sport: run
city: Fray Marcos
distances: [5K, 3K]
organizer: Intendencia de Florida y Municipio de Fray Marcos
links:
  site: https://www.gub.uy/intendencia-florida/comunicacion/calendario-actividades/florida-corre-vos-llega-fray-marcos
description:
  es: Correcaminata del circuito Florida Corre con Vos de la Dirección de Deportes de la Intendencia de Florida, el sábado 21 de noviembre a las 16:00 en Fray Marcos, con el Municipio. Hay 3 y 5 km. La inscripción cuesta $500, incluye remera, número, hidratación y mapa del recorrido, y se hace en línea o en el Polideportivo por la tarde. Lo recaudado va al Club Atlético Fray Marcos y a La Coruña FC.
  en: A run-walk of the Florida Corre con Vos circuit of the Intendencia de Florida's sports department, on Saturday 21 November at 16:00 in Fray Marcos, together with the Municipio. There are 3 and 5 km courses. Registration costs $500, includes a T-shirt, bib, drinks and a course map, and is done online or at the Polideportivo in the afternoon. Proceeds go to Club Atlético Fray Marcos and La Coruña FC.
