description:
  es: 36.ª edición de la Travesía Interplaya, carrera de calle que une la ciudad de Fray Bentos con el balneario Las Cañas, Río Negro, corrida el sábado 31 de enero de 2026 con largada a las 18:30. Hubo 5K y 10K y la inscripción fue por RedTickets. Kronos Sports, que cronometró, publicó los resultados por distancia y franja de edad, con una categoría de discapacidad visual.
  en: The 36th Travesía Interplaya, a road race linking the city of Fray Bentos with the Las Cañas beach resort, Río Negro, held on Saturday 31 January 2026 with an 18:30 start. There were 5K and 10K races and registration was through RedTickets. Kronos Sports, which did the timing, published the results by distance and age group, with a visually impaired category.
