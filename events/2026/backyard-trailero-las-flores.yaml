description:
  es: Backyard ultra de trail con largada en la Estación Las Flores, Maldonado, el sábado 9 de mayo de 2026. Cada hora se corre una vuelta de 6,706 km hasta que queda un solo corredor; había 25 cupos. La organizó y dirigió Karen Goicoechea, del entorno de Legión. Según la estadística de la DUV terminaron 16 corredores y el ganador completó 16 vueltas, 107,3 km.
  en: Trail backyard ultra starting at Estación Las Flores, Maldonado, on Saturday 9 May 2026. Every hour runners cover a 6.706 km loop until only one is left; there were 25 places. Organized and directed by Karen Goicoechea, from the Legión circle. According to the DUV statistics 16 runners finished and the winner completed 16 loops, 107.3 km.
