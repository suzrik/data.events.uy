description:
  es: Carrera solidaria en el Parque Clauzolles de Libertad, San José, el 21 de noviembre a las 16:00, "para celebrar su vida, su fuerza y su solidaridad". Lo recaudado es a beneficio del Hospital de Libertad. Hay 3 km y 7 km, que se pueden correr o caminar; cuesta de $200 a $700 según distancia y si llevás remera, que se encarga hasta el 31 de octubre. Colaboran el Municipio de Libertad y la Intendencia de San José; cronometraje de Encarrera.uy.
  en: A charity race at Parque Clauzolles in Libertad, San José, on 21 November at 16:00, "to celebrate her life, her strength and her solidarity". Proceeds go to the Libertad Hospital. There are 3 km and 7 km, to run or walk; it costs $200 to $700 depending on distance and whether you take the T-shirt, which must be ordered by 31 October. Supported by the Libertad municipality and the San José departmental government; timing by Encarrera.uy.
