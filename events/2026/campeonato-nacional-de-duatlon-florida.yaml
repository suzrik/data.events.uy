description:
  es: Tercera fecha del Campeonato Nacional de Duatlón 2026 de la Unión de Triatlón del Uruguay, corrida el domingo 28 de junio de 2026 en Florida, según el calendario de la temporada que publicó la Unión. Hubo categorías Sprint, Promocional y Postas; los no federados corrían con licencia por el día y no sumaban puntos. SUCA publicó los resultados de las tres.
  en: Third round of the 2026 Campeonato Nacional de Duatlón of the Unión de Triatlón del Uruguay, held on Sunday 28 June 2026 in Florida, according to the season calendar published by the Unión. There were Sprint, Promocional and relay (Postas) categories; non-federated athletes raced on a one-day licence without scoring points. SUCA published the results of all three.
