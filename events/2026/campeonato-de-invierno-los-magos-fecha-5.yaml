description:
  es: Quinta fecha del Campeonato de Invierno Los Magos 2026, carrera de ruta del Club Ciclista Los Magos de Maldonado en el calendario regional de la Federación Ciclista Uruguaya, corrida el domingo 2 de agosto en Maldonado. Corrieron ciclistas con licencia en élite, máster A a D, promocional y damas, con una clasificación Vale Todo y otras por grupos de categorías. La FCU la da por finalizada y publicó la clasificación.
  en: Fifth round of the 2026 Campeonato de Invierno Los Magos, a road race of Club Ciclista Los Magos de Maldonado on the regional calendar of the Uruguayan Cycling Federation, held on Sunday 2 August in Maldonado. Licensed riders raced in the elite, master A to D, promotional and women's categories, with an open (Vale Todo) classification and others by category group. The FCU lists it as finished and published the classification.
