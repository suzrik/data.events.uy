name: Carrera del Viento
date: 2026-11-15
sport: run
city: Carapé
venue: Parque Eólico Carapé, junto al Cerro Catedral
distances: [21 K, 10 K, 5 K]
links:
  site: https://carreradelviento.com
  instagram: https://www.instagram.com/carreradelvientocubico/
  register: https://ticketfacil.uy/event/Carrera-del-Viento---a-beneficio-de-ENSEAURUGUAY-2026/registerToEvent
description:
  es: Segunda edición de una carrera a beneficio de Enseña Uruguay, en el Parque Eólico Carapé, junto al Cerro Catedral, en el departamento de Maldonado y a 140 km de Montevideo; no es en la ciudad de Maldonado. El parque solo abre al público para este evento. Hay media maratón de 21 K, intermedia de 10 K y familiar de 5 K, con cronometraje por chip, y un traslado opcional en ómnibus desde Montevideo. La página de inscripción indica inicio a las 10:00. Las inscripciones cierran el 1 de noviembre.
  en: Second edition of a race in aid of Enseña Uruguay, at the Carapé Wind Farm, next to Cerro Catedral, in the department of Maldonado and 140 km from Montevideo; it is not in the city of Maldonado. The park opens to the public only for this event. It offers a 21 K half marathon, a 10 K intermediate and a 5 K family race, with chip timing, and an optional bus from Montevideo. The registration page gives a 10:00 start. Registration closes on 1 November.
