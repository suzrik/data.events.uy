description:
  es: Segunda edición de una carrera a beneficio de Enseña Uruguay, en el Parque Eólico Carapé (Maldonado), de acceso exclusivo para este evento. Hay media maratón de 21 K, intermedia de 10 K y familiar de 5 K, con cronometraje por chip. Las inscripciones cierran el 1 de noviembre.
  en: Second edition of a race in aid of Enseña Uruguay, held at the Carapé Wind Farm (Maldonado), with access reserved for this event. It offers a 21 K half marathon, a 10 K intermediate and a 5 K family race, with chip timing. Registration closes on 1 November.
