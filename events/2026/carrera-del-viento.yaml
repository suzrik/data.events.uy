description:
  es: Segunda edición de una carrera a beneficio de Enseña Uruguay, en el Parque Eólico Carapé, junto al Cerro Catedral, en el departamento de Maldonado y a 140 km de Montevideo; no es en la ciudad de Maldonado. El parque solo abre al público para este evento. Hay media maratón de 21 K, intermedia de 10 K y familiar de 5 K, con chip, y un traslado opcional en ómnibus desde Montevideo. Según el sitio de la carrera, el 21 K larga a las 9:30, 10 K y 5 K a las 10:00.
  en: Second edition of a race in aid of Enseña Uruguay, at the Carapé Wind Farm, next to Cerro Catedral, in the department of Maldonado and 140 km from Montevideo; it is not in the city of Maldonado. The park opens to the public only for this event. It offers a 21 K half marathon, a 10 K intermediate and a 5 K family race, with chip timing, and an optional bus from Montevideo. Per the race site, the 21 K starts at 9:30, 10 K and 5 K at 10:00.
