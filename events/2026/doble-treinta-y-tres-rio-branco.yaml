description:
  es: "Carrera de dos etapas de la Federación Ciclista Uruguaya (FCU), corrida el sábado 28 de febrero y el domingo 1 de marzo de 2026 con sede en Treinta y Tres. Hubo clasificaciones de élite, sub-23, junior, máster A y B, máster C, máster D y damas, para ciclistas con licencia. La FCU la da por finalizada y publicó los resultados de cada etapa y la clasificación general."
  en: "Two-stage race of the Uruguayan Cycling Federation (FCU), held on Saturday 28 February and Sunday 1 March 2026, based in Treinta y Tres. There were classifications for elite, under-23, junior, master A and B, master C, master D and women, for licensed riders. The FCU lists it as finished and published the results of each stage and the overall classification."
