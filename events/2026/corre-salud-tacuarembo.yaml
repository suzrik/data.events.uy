description:
  es: Séptima edición de Corre Salud, corrida el domingo 2 de agosto de 2026 en la Laguna de las Lavanderas, Tacuarembó. Los 5, 10 y 21 km largaron a las 9:00 y la carrera kids, gratis, a las 11:00; el sábado hubo entrega de kits y feria deportiva en el Polideportivo. Encarrera, que tuvo la inscripción y cronometró, publicó los resultados.
  en: Seventh edition of Corre Salud, held on Sunday 2 August 2026 at Laguna de las Lavanderas, Tacuarembó. The 5, 10 and 21 km started at 9:00 and the free kids race at 11:00; on Saturday there was kit pickup and a sports fair at the Polideportivo. Encarrera, which handled registration and timing, published the results.
