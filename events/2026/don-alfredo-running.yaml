description:
  es: "Carrera de 21, 10 y 5 km en Trinidad, Flores, corrida el domingo 19 de julio de 2026 con largada a las 10:00 desde el Complejo La Gran 7. Hubo premios generales en todas las distancias y por categorías de edad en los 21K, y los niños corrían gratis. Crono MTB, que cronometró, publicó los resultados."
  en: "A 21, 10 and 5 km race in Trinidad, Flores, held on Sunday 19 July 2026, starting at 10:00 from Complejo La Gran 7. There were overall prizes in all distances and age-group prizes in the 21K, and children ran for free. Crono MTB, which did the timing, published the results."
