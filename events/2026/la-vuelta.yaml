description:
  es: Primera edición de La Vuelta, carrera de calle en el Parque Roosevelt, Ciudad de la Costa, Canelones, el domingo 30 de agosto de 2026 a las 9:00, con 10K, 5K y 3K. La organizó La Vuelta S.A.S., impulsada por Milgenial; la inscripción incluía kit, remera oficial y medalla finisher. Kronos Sports publicó los resultados por distancia.
  en: First edition of La Vuelta, a road race in Parque Roosevelt, Ciudad de la Costa, Canelones, on Sunday 30 August 2026 at 9:00, over 10K, 5K and 3K. It was organized by La Vuelta S.A.S., backed by Milgenial; entry included a kit, the official shirt and a finisher medal. Kronos Sports published the results by distance.
