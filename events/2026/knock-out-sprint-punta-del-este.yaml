description:
  es: Primera fecha de la Travesías Uruguay Open Water Series 2027, el domingo 6 de diciembre en la parada 3 de la Playa Mansa, Punta del Este, con el formato knock out sprint, por primera vez en el país. Hay tres carreras, 1500 m a las 9:30, 1000 m a las 10:15 y 500 m a las 10:45 (las mujeres diez minutos después), y se puede nadar una, dos o las tres; la clasificación suma puntos. El marcaje es de 8:15 a 9:15. Inscripción en ticketfacil.
  en: First date of the Travesías Uruguay Open Water Series 2027, on Sunday 6 December at stop 3 of Playa Mansa, Punta del Este, in the knock-out sprint format, a first in the country. There are three races, 1500 m at 9:30, 1000 m at 10:15 and 500 m at 10:45 (women ten minutes later), and you can swim one, two or all three; the standings add up points. Body marking is from 8:15 to 9:15. Registration on ticketfacil.
