name: Correcaminata Compartir nos Cuida
date: 2026-11-20
time: "19:00"
sport: run
city: Florida
venue: Centro Ni Silencio Ni Tabú, Av. Hipódromo
distances: [6K, 3K]
organizer: Centro Ni Silencio Ni Tabú e Intendencia de Florida
links:
  site: https://www.gub.uy/intendencia-florida/comunicacion/calendario-actividades/compartir-nos-cuida-jornada-para-fortalecer-vinculos-promover
description:
  es: Correcaminata de 3K y 6K a las 19:00 del viernes 20 de noviembre en el Centro Ni Silencio Ni Tabú, junto al Hipódromo Irineo Leguisamo de Florida, dentro de la jornada «Compartir nos Cuida» sobre salud mental, con la Intendencia de Florida y el MIDES. La jornada empieza a las 18:00 y sigue con feria, juegos y música. Es abierta a todo público.
  en: A 3K and 6K run-walk at 19:00 on Friday 20 November at the Centro Ni Silencio Ni Tabú, next to the Irineo Leguisamo racecourse in Florida, part of the "Compartir nos Cuida" mental-health day with the Intendencia de Florida and MIDES. The day starts at 18:00 and continues with a fair, games and music. It is open to everyone.
