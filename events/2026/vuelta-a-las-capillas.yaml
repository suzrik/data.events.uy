description:
  es: Primera edición de esta carrera de MTB, el domingo 22 de noviembre, con largada a las 9:30 en la Capilla de Cuchilla de Rocha, en la zona de Sauce, Canelones. Hay 50 km y 25 km, con categorías competitivas y promocionales y premiación hasta el 5.º puesto. El afiche lleva el logo del Club Ciclista Sauce y el aval de la Federación Canaria de Ciclismo. La inscripción se hace en Punto de Control e incluye un refresco y una hamburguesa.
  en: First edition of this MTB race, on Sunday 22 November, starting at 9:30 at the Capilla de Cuchilla de Rocha, in the Sauce area, Canelones. There are 50 km and 25 km courses, with competitive and promotional categories and prizes down to 5th place. The poster carries the logo of Club Ciclista Sauce and the endorsement of the Federación Canaria de Ciclismo. Registration is on Punto de Control and includes a soft drink and a hamburger.
