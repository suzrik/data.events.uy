name: Vuelta a las Capillas
date: 2026-11-22
sport: bike
city: Sauce
venue: Capilla de Cuchilla de Rocha
distances: [50 km, 25 km]
links:
  site: https://www.puntodecontrol.com.uy/vuelta-a-las-capillas/
