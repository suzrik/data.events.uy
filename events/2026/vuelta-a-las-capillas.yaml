name: Vuelta a las Capillas
date: 2026-11-22
time: "09:00"
sport: mtb
city: Sauce
venue: Capilla Nuestra Señora del Carmen, Cuchilla de Rocha
distances: [50 km, 25 km]
links:
  site: https://www.puntodecontrol.com.uy/vuelta-a-las-capillas/
description:
  es: Cancelado; el 16 de noviembre Punto de Control marcó la carrera como suspendida, sin nueva fecha ni explicación, y retiró el formulario de inscripción. Iba a ser una carrera de MTB el domingo 22 de noviembre, con largada a las 9:00 en la Capilla Nuestra Señora del Carmen de Cuchilla de Rocha, zona de Sauce, Canelones, con 50 km y 25 km. El afiche llevaba el logo del Club Ciclista Sauce y el aval de la Federación Canaria de Ciclismo.
  en: Cancelled; on 16 November Punto de Control marked the race as suspended, with no new date or explanation, and took down the entry form. It was to be an MTB race on Sunday 22 November, starting at 9:00 at the Capilla Nuestra Señora del Carmen in Cuchilla de Rocha, in the Sauce area, Canelones, with 50 km and 25 km courses. The poster carried the logo of Club Ciclista Sauce and the endorsement of the Federación Canaria de Ciclismo.
