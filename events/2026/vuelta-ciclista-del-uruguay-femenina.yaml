description:
  es: Primera Vuelta Ciclista del Uruguay Femenina, de la Federación Ciclista Uruguaya, UCI 2.2, con 66 corredoras en 12 equipos (7 uruguayos y 5 extranjeros). El jueves 29 de octubre, prólogo de 1,2 km en la Pista Walter Moyano de Maldonado; el viernes, Maldonado–Minas, unos 85 km; el sábado, contrarreloj de 7,4 km en Salto del Penitente, y el domingo 1 de noviembre, Minas–Maldonado, 97,7 km, con llegada frente a la Intendencia. Es una carrera para ir a ver.
  en: First Vuelta Ciclista del Uruguay Femenina, run by the Uruguayan Cycling Federation, UCI 2.2, with 66 riders in 12 teams (7 Uruguayan and 5 foreign). Thursday 29 October, a 1.2 km prologue at the Walter Moyano track in Maldonado; Friday, Maldonado–Minas, about 85 km; Saturday, a 7.4 km time trial at Salto del Penitente; and Sunday 1 November, Minas–Maldonado, 97.7 km, finishing in front of the city hall. It is a race to go and watch.
