description:
  es: Primera edición de la Vuelta Ciclista del Uruguay Femenina, carrera por etapas de la Federación Ciclista Uruguaya, categoría UCI 2.2. Según la federación, el jueves 29 de octubre hay un prólogo de 1,2 km en la Pista Walter Moyano de Maldonado; el viernes, Maldonado–Minas, unos 85 km; el sábado, contrarreloj individual de unos 7,4 km en Salto del Penitente, y el domingo 1 de noviembre, Minas–Maldonado, unos 104 km, con llegada frente a la Intendencia. Es una carrera para ir a ver.
  en: First edition of the Vuelta Ciclista del Uruguay Femenina, the Uruguayan Cycling Federation's stage race, UCI class 2.2. According to the federation, Thursday 29 October has a 1.2 km prologue at the Walter Moyano track in Maldonado; Friday, Maldonado–Minas, about 85 km; Saturday, an individual time trial of about 7.4 km at Salto del Penitente; and Sunday 1 November, Minas–Maldonado, about 104 km, finishing in front of the city hall. It is a race to go and watch.
