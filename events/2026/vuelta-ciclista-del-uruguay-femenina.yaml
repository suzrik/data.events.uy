description:
  es: Primera edición de la Vuelta Ciclista del Uruguay Femenina, carrera por etapas de la Federación Ciclista Uruguaya para equipos femeninos élite y sub-23, categoría UCI 2.2. Del jueves 29 de octubre al domingo 1 de noviembre, prólogo de 1,2 km en Maldonado, etapa Maldonado–Minas de 81 km, contrarreloj individual de 11 km en Salto del Penitente y etapa Minas–Maldonado de 100 km. Para el público es una carrera para ir a ver. Etapas según la cuenta oficial La Vuelta, 6 de octubre.
  en: First edition of the Vuelta Ciclista del Uruguay Femenina, the Uruguayan Cycling Federation's stage race for women's elite and under-23 teams, UCI class 2.2. From Thursday 29 October to Sunday 1 November, a 1.2 km prologue in Maldonado, a Maldonado–Minas stage of 81 km, an 11 km individual time trial at Salto del Penitente and a Minas–Maldonado stage of 100 km. For the public it is one to go and watch. Stages as published by the official La Vuelta account on 6 October.
