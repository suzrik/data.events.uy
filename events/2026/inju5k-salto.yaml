description:
  es: Carrera de 5 km del Instituto Nacional de la Juventud (INJU) en Salto, el sábado 24 de octubre con largada en Plaza Flores. Largada a las 17:00. Para mayores de 13 años; los menores de 18 necesitan permiso firmado y todos un certificado médico. Hay inscripción en línea y también el día de la carrera. Las fechas pueden cambiar.
  en: 5 km race of the Instituto Nacional de la Juventud (INJU) in Salto, on Saturday 24 October, starting at Plaza Flores. The race starts at 17:00. For people over 13; under-18s need a signed permission and everyone a medical certificate. Registration is online and also on race day. Dates may change.
