description:
  es: Carrera de 5 km del Instituto Nacional de la Juventud (INJU) en Salto, el sábado 31 de octubre con largada en Plaza Flores; estaba prevista para el 24 de octubre y el INJU anunció la nueva fecha. La actividad empieza a las 16:00 y la largada es a las 17:00. Para mayores de 13 años; los menores de 18 necesitan permiso firmado y todos un certificado médico. Hay inscripción en línea y también el día de la carrera.
  en: 5 km race of the Instituto Nacional de la Juventud (INJU) in Salto, on Saturday 31 October, starting at Plaza Flores; it was planned for 24 October and INJU announced the new date. The activity begins at 16:00 and the race starts at 17:00. For people over 13; under-18s need a signed permission and everyone a medical certificate. Registration is online and also on race day.
