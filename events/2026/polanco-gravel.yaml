description:
  es: Gravel de 85 km por las sierras de Polanco Norte, Lavalleja, el domingo 18 de octubre de 2026, con largada a las 9:00. Cuesta $1000 e incluye almuerzo y lugar para acampar la noche anterior; hay sorteo de regalos, fotos en el recorrido y trofeos para los tres más rápidos. Organizan Minas Todo Terreno y Epic Bike, que corrigieron en su afiche el día de la semana (decía sábado).
  en: 85 km gravel ride through the hills of Polanco Norte, Lavalleja, on Sunday 18 October 2026, starting at 9:00. It costs $1000, including lunch and a place to camp the night before; there is a gift draw, photos along the course and trophies for the three fastest. Organized by Minas Todo Terreno and Epic Bike, who corrected the weekday on their poster (it said Saturday).
