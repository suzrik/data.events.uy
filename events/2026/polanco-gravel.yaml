description:
  es: Salida de gravel de 85 km por las sierras de Polanco Norte, Lavalleja, el domingo 18 de octubre de 2026, organizada por Minas Todo Terreno. Se habló de una postergación a diciembre, pero la fecha del 18 de octubre está confirmada en el Instagram del organizador. Hora de largada, costo e inscripción se anuncian ahí.
  en: 85 km gravel ride through the hills of Polanco Norte, Lavalleja, on Sunday 18 October 2026, organized by Minas Todo Terreno. A postponement to December was reported, but the 18 October date is confirmed on the organizer's Instagram. Start time, fee and registration are announced there.
