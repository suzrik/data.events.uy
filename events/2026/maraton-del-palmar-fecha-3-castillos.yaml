description:
  es: Tercera fecha del circuito de carreras solidarias Maratón del Palmar 2026, en Castillos, Rocha. Organizan el Municipio de Castillos y Running Juventud. Las distancias varían entre fechas (5K, 10K, trail, entre otras) y todavía no figuran para esta. El circuito termina el 19 de diciembre en Aguas Dulces.
  en: Third round of the 2026 Maratón del Palmar charity race circuit, in Castillos, Rocha. Organized by the Municipio de Castillos and Running Juventud. Distances vary between rounds (5K, 10K, trail and others) and are not listed for this one yet. The circuit ends on 19 December at Aguas Dulces.
