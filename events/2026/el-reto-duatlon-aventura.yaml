description:
  es: Carrera de aventura en duplas (caballeros, damas o mixtas) el domingo 8 de noviembre de 2026, con largada a las 6:00 en el Camping Minuano, Juan Lacaze. Combina 50 km de mountain bike, 20 km de trekking, orientación básica y pruebas especiales, por secciones con áreas de transición. Inscripción $4000 por pareja en Ticketfácil; mínimo de 5 duplas por categoría. Al final hay almuerzo y premiación. La organiza Colonia Aventura Corre.
  en: Adventure race for pairs (men, women or mixed) on Sunday 8 November 2026, starting at 6:00 at Camping Minuano, Juan Lacaze. It combines 50 km of mountain biking, 20 km of trekking, basic orienteering and special tests, in sections with transition areas. Entry $4000 per pair on Ticketfácil; at least 5 pairs per category. Lunch and prize-giving at the end. Organized by Colonia Aventura Corre.
