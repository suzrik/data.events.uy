description:
  es: Carrera nocturna de SUCA Sports en Piriápolis, corrida el sábado 7 de febrero de 2026 con cupos agotados. Salió de la Rambla de los Argentinos, a 100 m del Hotel Argentino, en un ida y vuelta hasta la cima del cerro San Antonio. La 4K participativa, con categorías en silla de ruedas y para ciegos, largó a las 19:30 y la 8K competitiva a las 21:00; antes hubo carreras gratuitas para niños. SUCA publicó los resultados.
  en: SUCA Sports' night race in Piriápolis, held on Saturday 7 February 2026 with all places sold out. It left from Rambla de los Argentinos, 100 m from the Hotel Argentino, out and back to the top of Cerro San Antonio. The participatory 4K, with wheelchair and blind categories, started at 19:30 and the competitive 8K at 21:00; free children's races came first. SUCA published the results.
