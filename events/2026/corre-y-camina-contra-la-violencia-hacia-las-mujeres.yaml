name: Corré y caminá contra la violencia hacia las mujeres
date: 2026-11-21
time: "17:00"
sport: run
city: Montevideo
venue: Circuito aeróbico del Prado, Av. Eugenia Vaz Ferreira y Carlos Brussa
distances: [5K, 2K]
organizer: Municipio A de Montevideo
links:
