description:
  es: Decimotercera edición de la correcaminata del equipo de Equidad y Género del Municipio A, el sábado 21 de noviembre a las 17:00 en el circuito aeróbico del Prado, con encuentro en Av. Eugenia Vaz Ferreira y Carlos Brussa. Hay 2K y 5K. La inscripción es gratuita por formulario web hasta el 15 de noviembre; las primeras 3500 personas inscriptas reciben una botella térmica, que se retira en el Centro Comunal Zonal 14 del 18 al 20 de noviembre. Hay entrada en calor y espectáculo artístico.
  en: Thirteenth edition of the run and walk by the Equity and Gender team of Municipio A, on Saturday 21 November at 17:00 on the Prado aerobic circuit, meeting at Av. Eugenia Vaz Ferreira and Carlos Brussa. There are 2K and 5K courses. Registration is free through a web form until 15 November; the first 3,500 registrants get a thermal bottle, collected at Centro Comunal Zonal 14 from 18 to 20 November. There is a warm-up and a closing show.
