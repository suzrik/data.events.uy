description:
  es: Correcaminata del equipo de Equidad y Género del Municipio A. El calendario de eventos deportivos de la Intendencia la ubica el domingo 22 de noviembre de 2026; el Municipio todavía no publicó la edición 2026. En 2024 fue en el circuito aeróbico del Prado, con 2K y 5K e inscripción gratuita.
  en: Fun run by the Equity and Gender team of Municipio A. The city sports calendar places it on Sunday 22 November 2026; the Municipio has not yet published the 2026 edition. In 2024 it was held on the Prado aerobic circuit, with 2K and 5K courses and free registration.
