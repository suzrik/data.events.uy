description:
  es: Carrera de 5 km del Instituto Nacional de la Juventud (INJU) en José Batlle y Ordóñez, el sábado 7 de noviembre con largada en el Parque Municipal Cerro de Nico Pérez. Inicio de actividad a las 15:00 y largada a las 17:00. Para mayores de 13 años; los menores de 18 necesitan permiso firmado y todos un certificado médico. Hay inscripción en línea y también el día de la carrera. Las fechas pueden cambiar.
  en: 5 km race of the Instituto Nacional de la Juventud (INJU) in José Batlle y Ordóñez, on Saturday 7 November, starting at Parque Municipal Cerro de Nico Pérez. Activity starts at 15:00 and the race starts at 17:00. For people over 13; under-18s need a signed permission and everyone a medical certificate. Registration is online and also on race day. Dates may change.
