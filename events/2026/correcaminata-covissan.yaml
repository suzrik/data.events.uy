description:
  es: "Primera edición de la Correcaminata Covissan, corrida el sábado 14 de marzo de 2026 en San Jacinto, Canelones, con largada a las 16:00 desde la plaza. Fue un 5K por categorías de edad, gratis para los niños; la inscripción costaba $800, $1000 con remera y $1200 el día de la carrera. Crono MTB, que cronometró, publicó los resultados."
  en: "First edition of the Correcaminata Covissan, held on Saturday 14 March 2026 in San Jacinto, Canelones, starting at 16:00 from the square. It was a 5K with age categories, free for children; entry cost $800, $1000 with a T-shirt and $1200 on race day. Crono MTB, which did the timing, published the results."
