name: Correcaminata Encuentros que dejan huellas
date: 2026-11-07
time: "16:00"
sport: run
city: Carmelo
venue: Escuela N.º 5 «Héctor L. Noaín»
distances: [8K, 4K]
organizer: Gimnasio Zena
links:
  instagram: https://www.instagram.com/p/DeZmlNTPr24/
description:
  es: Segunda edición de una correcaminata solidaria de 4 y 8 km en Carmelo, el sábado 7 de noviembre a las 16:00, desde la Escuela N.º 5 «Héctor L. Noaín», que recibe lo recaudado. La organiza el gimnasio Zena e invita a ex alumnos y a toda la comunidad. El bono de colaboración es de $300. Hay hidratación, frutas y sorteos. Consultas e inscripciones por teléfono al 099 952 148 o al 098 354 236.
  en: Second edition of a 4 and 8 km charity run and walk in Carmelo, on Saturday 7 November at 16:00, from School No. 5 «Héctor L. Noaín», which receives all the money raised. It is organized by the Zena gym and open to former pupils and the whole community. The contribution is $300. Water, fruit and a prize draw. Enquiries and sign-up by phone at 099 952 148 or 098 354 236.
