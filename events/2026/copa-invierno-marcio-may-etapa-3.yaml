description:
  es: Tercera y última etapa de la Copa Invierno Marcio May 2026, campeonato de mountain bike de La Sierra Eventos Deportivos, corrida el domingo 26 de julio de 2026 en San José de Mayo. La página de la copa en el sitio del organizador da 283 competidores y los resultados finales; Encarrera publicó los resultados de esta fecha.
  en: Third and final stage of the 2026 Copa Invierno Marcio May, a mountain bike championship by La Sierra Eventos Deportivos, held on Sunday 26 July 2026 in San José de Mayo. The cup page on the organizer's site gives 283 competitors and the final standings; Encarrera published the results of this round.
