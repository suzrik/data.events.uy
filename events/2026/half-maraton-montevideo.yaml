description:
  es: 15.ª edición de la Half Maratón Montevideo, corrida el domingo 9 de agosto de 2026 por la rambla portuaria y la Rambla Gran Bretaña, con largada en la Rambla Norte cerca de la calle Treinta y Tres. Hubo 21K, que integró el Campeonato Nacional de la distancia, 10K y 5K. Protime publicó los resultados de la edición 2026.
  en: The 15th Half Maratón Montevideo, held on Sunday 9 August 2026 along the port waterfront and Rambla Gran Bretaña, starting on Rambla Norte near Treinta y Tres street. There were a 21K, part of the national championship over the distance, a 10K and a 5K. Protime published the results of the 2026 edition.
