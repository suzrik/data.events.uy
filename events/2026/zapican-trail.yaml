name: Zapicán Trail
date: 2026-11-22
sport: trail
city: Zapicán
venue: Plaza de Deportes de Zapicán
distances: [14K, 7K]
links:
  site: https://www.zapicantrail.com/
  instagram: https://www.instagram.com/zapicantrail/
description:
  es: Primera edición de un trail en las sierras de Zapicán, en el norte de Lavalleja (Ruta 14, km 347), el domingo 22 de noviembre, con largada y llegada en la plaza de deportes del pueblo. Hay 7 km participativos y 14 km competitivos, con cronometraje con chip, puestos de hidratación, medallas y premios a los tres primeros de cada distancia. La inscripción, por formulario en el sitio del organizador, cuesta de $750 a $1.200 según la fecha; equipos de cuatro o más pagan $700 por persona.
  en: First edition of a trail race in the hills of Zapicán, in northern Lavalleja (Route 14, km 347), on Sunday 22 November, starting and finishing at the town's sports square. There are a 7 km participatory and a 14 km competitive course, with chip timing, aid stations, medals and prizes for the top three in each distance. Registration, by form on the organizer's site, costs $750 to $1,200 depending on the date; teams of four or more pay $700 per person.
