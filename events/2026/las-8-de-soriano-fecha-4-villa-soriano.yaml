description:
  es: "Cuarta fecha de Las 8 de Soriano 2026, campeonato departamental de running, el sábado 23 de mayo de 2026 en Villa Soriano, con largada a las 16:00 junto a la capilla y 10K y 5K por categorías. La inscripción costaba $1000 con remera, $1200 el día de la carrera y $600 la reinscripción. Crono MTB, que cronometró, publicó los resultados."
  en: "Fourth round of Las 8 de Soriano 2026, a departmental running championship, on Saturday 23 May 2026 in Villa Soriano, starting at 16:00 by the chapel, with 10K and 5K by category. Entry cost $1000 with a T-shirt, $1200 on race day and $600 to re-register. Crono MTB, which did the timing, published the results."
