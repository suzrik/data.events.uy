name: Uniendo los Pueblos de Rivera, etapa 4
date: 2026-12-19
time: "17:00"
sport: mtb
city: Rivera
venue: Autódromo Eduardo P. Cabrera
links:
  instagram: https://www.instagram.com/uniendopueblosmtb/
description:
  es: Cuarta y última etapa de Uniendo los Pueblos de Rivera, carrera de MTB por etapas en el departamento, el sábado 19 de diciembre de 2026 a las 17:00, con concentración en el Autódromo Eduardo P. Cabrera. El organizador la pasó del 13 al 20 de diciembre y el 6 de noviembre al sábado 19, porque el domingo 20 hay otra competencia. Las etapas anteriores fueron Tranqueras, Corrales y Vichadero. Las distancias y la inscripción todavía no están publicadas.
  en: Fourth and final stage of Uniendo los Pueblos de Rivera, a stage MTB race around the department, on Saturday 19 December 2026 at 17:00, gathering at the Autódromo Eduardo P. Cabrera. The organizer moved it from 13 to 20 December and then, on 6 November, to Saturday 19, because another race is held on Sunday 20. The earlier stages were Tranqueras, Corrales and Vichadero. Distances and registration are not published yet.
