name: Uniendo los Pueblos de Rivera, etapa 4
date: 2026-12-13
sport: mtb
city: Rivera
links:
  instagram: https://www.instagram.com/uniendopueblosmtb/
description:
  es: Cuarta y última etapa de Uniendo los Pueblos de Rivera, carrera de MTB por etapas en el departamento, el domingo 13 de diciembre de 2026 en la ciudad de Rivera; el afiche la llama «la gran final». Las etapas anteriores fueron Tranqueras (7 de febrero), Corrales (31 de mayo) y Vichadero (6 de setiembre). La hora, el lugar de largada, las distancias y la forma de inscripción todavía no están publicados.
  en: Fourth and final stage of Uniendo los Pueblos de Rivera, a stage MTB race around the department, on Sunday 13 December 2026 in the city of Rivera; the poster calls it "the grand final". The earlier stages were Tranqueras (7 February), Corrales (31 May) and Vichadero (6 September). The start time, start place, distances and how to register are not published yet.
