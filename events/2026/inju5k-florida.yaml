description:
  es: Carrera de 5 km del Instituto Nacional de la Juventud (INJU) en Florida, el viernes 27 de noviembre en la Rambla de Florida, con punto de encuentro en la plaza canina. Estaba prevista para el 30 de octubre y se suspendió ese día. Entrega de kits a las 17:30, entrada en calor a las 19:00 y largada a las 19:30. Para mayores de 13 años; los menores de 18 necesitan permiso firmado y todos un certificado médico. Hay inscripción en línea y también el día de la carrera.
  en: 5 km race of the Instituto Nacional de la Juventud (INJU) in Florida, on Friday 27 November on the Rambla de Florida, meeting at the dog park. It was planned for 30 October and was called off that day. Kits from 17:30, warm-up at 19:00 and start at 19:30. For people over 13; under-18s need a signed permission and everyone a medical certificate. Registration is online and also on race day.
