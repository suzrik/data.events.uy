name: Correcaminata Maroñas en Flor
date: 2026-10-17
sport: run
city: Montevideo
venue: Complejo Cultural Crece, Manuel Acuña 3061
distances: [3K]
links:
  instagram: https://www.instagram.com/complejocrece/
  register: https://docs.google.com/forms/d/e/1FAIpQLSeKljmAScmuCET39UzwyX_2AJU6wIJTKiYOYYVF-qI_WBg71A/viewform
description:
  es: Primera correcaminata en el marco de la 21ª edición de Maroñas en Flor, el sábado 17 de octubre de 2026, con largada desde el Complejo Cultural Crece, en Montevideo. Las actividades empiezan a las 15 hs; a las 15:30 hay un circuito recreativo de 400 m para niños de hasta 12 años y a las 16 hs la correcaminata de 3K. Se participa entregando un alimento no perecedero. Los cupos son limitados; la inscripción es por formulario hasta el 13 de octubre, o el mismo día de 12 a 15 hs si quedan lugares.
  en: First run/walk held as part of the 21st Maroñas en Flor, on Saturday 17 October 2026, starting from Complejo Cultural Crece in Montevideo. Activities begin at 3 pm; at 3:30 pm there is a 400 m recreational circuit for children up to 12 and at 4 pm the 3K run/walk. Entry is by handing in one non-perishable food item. Places are limited; registration is by form until 13 October, or on the day from 12 to 3 pm if places remain.
