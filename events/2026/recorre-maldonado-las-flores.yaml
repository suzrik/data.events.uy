description:
  es: Cuarta etapa de la serie Recorre Maldonado 2026, organizada por SUCA Sports, corrida el sábado 13 de junio de 2026 a las 15 hs en el balneario Estación Las Flores, bajo la Sierra de las Ánimas, por los caminos del balneario. Hubo 10K y 5K; SUCA publicó los resultados de las dos distancias.
  en: Fourth stage of the 2026 Recorre Maldonado series, organized by SUCA Sports, held on Saturday 13 June 2026 at 3 pm in the resort of Estación Las Flores, below the Sierra de las Ánimas, on the resort's roads. There were 10K and 5K races; SUCA published the results of both.
