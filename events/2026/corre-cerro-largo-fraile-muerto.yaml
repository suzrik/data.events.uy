description:
  es: Quinta fecha del campeonato Corre Cerro Largo, anunciada para el sábado 26 de setiembre de 2026 en Fraile Muerto, con 10K y 5K por categorías de edad y una carrera para niños de 7 a 11 años (3 km según la página, 2 km en el formulario). La inscripción, en el sitio de Cronometra Mauá con pago por Abitab, costaba $550 en 5K y 10K con camiseta, $350 sin camiseta y $350 la de niños. No encontramos resultados publicados.
  en: Fifth round of the Corre Cerro Largo championship, announced for Saturday 26 September 2026 in Fraile Muerto, with 10K and 5K by age group and a race for children aged 7 to 11 (3 km on the page, 2 km on the form). Registration, on the Cronometra Mauá site with payment through Abitab, cost $550 for 5K and 10K with a T-shirt, $350 without, and $350 for the kids' race. We found no published results.
