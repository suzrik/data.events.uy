description:
  es: Sexta edición de Experiencia Polanco Trail, por monte nativo en las asperezas de Polanco, Lavalleja, corrida el domingo 17 de mayo de 2026 a las 10:00. Hubo 14 km competitivos y 7 km participativos, con premios por equipos en los 14 km y almuerzo; los cupos se agotaron. Encarrera, que cronometró, publicó los resultados.
  en: Sixth edition of Experiencia Polanco Trail, through native woodland in the rough hills of Polanco, Lavalleja, held on Sunday 17 May 2026 at 10:00. There were 14 km competitive and 7 km participative courses, with team prizes on the 14 km and lunch; places sold out. Encarrera, which did the timing, published the results.
