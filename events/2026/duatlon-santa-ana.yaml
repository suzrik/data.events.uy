description:
  es: Duatlón todoterreno en el balneario Santa Ana, Colonia, corrido el domingo 24 de mayo de 2026, con 7 km de trail running y 25 km de MTB, en forma individual o en posta de dos. La inscripción costaba $800 hasta el 30 de abril y $1000 después. Encarrera tuvo la inscripción y publicó los resultados.
  en: Off-road duathlon at the Santa Ana beach resort, Colonia, held on Sunday 24 May 2026, with 7 km of trail running and 25 km of MTB, solo or as a two-person relay. Entry cost $800 until 30 April and $1000 after. Encarrera handled registration and published the results.
