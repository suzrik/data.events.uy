description:
  es: Carrera nocturna de 7 km en Salto, el sábado 7 de noviembre, por el aniversario del traslado del Batallón de Infantería N.º 7 desde el actual Destacamento de Bomberos al Cuartel General Artigas. Larga a las 20:00 en el Destacamento de Bomberos (Rivera 499) y llega frente al batallón, en Av. Viera. Cupo de 200 corredores; cuesta $600 con remera y $200 sin remera. Premios por categoría y medalla finisher. Inscripción en Encarrera.uy; incluye número con chip de cronometraje.
  en: A 7 km night race in Salto on Saturday 7 November, marking the anniversary of Infantry Battalion No. 7 moving from today's fire station to the Artigas headquarters. It starts at 20:00 at the fire station (Rivera 499) and finishes in front of the battalion on Av. Viera. Limited to 200 runners; it costs $600 with a T-shirt and $200 without. Prizes by category and a finisher medal. Registration on Encarrera.uy; chip timing included.
