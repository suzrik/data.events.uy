description:
  es: "Segunda edición de 365 Run, carrera de 8 km en Mercedes, Soriano, corrida el domingo 14 de junio de 2026 con largada a las 9:00 desde la Plaza del Encuentro, en la rambla. Hubo premios generales y por categorías de edad; la inscripción costaba $1000 con remera y $800 sin ella. La anunció Crono MTB y los resultados están en la web de resultados de Encarrera."
  en: "Second edition of 365 Run, an 8 km race in Mercedes, Soriano, held on Sunday 14 June 2026, starting at 9:00 from Plaza del Encuentro on the riverside promenade. There were overall and age-group prizes; entry cost $1000 with a T-shirt and $800 without. Crono MTB announced it and the results are on the Encarrera results site."
