description:
  es: Etapa 1 de Combo Colonia 2026/2027, campeonato de running por localidades del departamento de Colonia, que se corrió el sábado 8 de agosto en Nueva Helvecia con 10K y 5K. El punto de encuentro fue el Árbol Cantonal, en bulevar Batlle y Ordóñez y Fray Vogel. Los resultados están publicados en Cronometraje Instantáneo.
  en: Stage 1 of Combo Colonia 2026/2027, a running championship through towns of the Colonia department, held on Saturday 8 August in Nueva Helvecia over 10K and 5K. The meeting point was the Árbol Cantonal, at Batlle y Ordóñez boulevard and Fray Vogel. Results are published on Cronometraje Instantáneo.
