description:
  es: Cancelado; el club no anunció la edición 2026 y la fecha pasó. Correcaminata de 3 km del Defensor Sporting Club a beneficio del Jardín de Infantes 216 y del atletismo del club. La agenda deportiva de la Intendencia de Montevideo, publicada en enero, la ubica el sábado 24 de octubre de 2026 como «Correcaminata Jardín 216 y Defensor Sporting Club». La de 2025, la segunda, fue en el Parque Rodó a las 9:00, con inscripción por RedTickets.
  en: Cancelled; the club did not announce the 2026 edition and the date passed. 3 km run/walk of Defensor Sporting Club in aid of Jardín de Infantes 216 and the club's athletics. The Montevideo city sports agenda, published in January, places it on Saturday 24 October 2026 as "Correcaminata Jardín 216 y Defensor Sporting Club". The 2025 edition, the second, was at Parque Rodó at 9:00, with registration on RedTickets.
