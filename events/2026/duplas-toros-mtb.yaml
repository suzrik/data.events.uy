description:
  es: Carrera de mountain bike solo en duplas, corrida el domingo 5 de abril de 2026 en Paso de los Toros, Tacuarembó, con largada a las 9:00 desde el camping junto al río Negro y 45 km. Hubo categorías de duplas masculinas, femeninas y mixtas por suma de edades, y una de padre o madre con hijo. Encarrera tuvo la inscripción y publicó los resultados.
  en: A pairs-only mountain bike race, held on Sunday 5 April 2026 in Paso de los Toros, Tacuarembó, starting at 9:00 from the campsite by the Río Negro, over 45 km. There were men's, women's and mixed pair categories by combined age, and a parent-and-child one. Encarrera handled registration and published the results.
