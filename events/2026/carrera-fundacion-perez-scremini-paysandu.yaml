description:
  es: Carrera solidaria de 5K de la Fundación Pérez Scremini, que atiende a niños y adolescentes con cáncer, el domingo 4 de octubre de 2026 en Paysandú, con apoyo de la Intendencia de Paysandú. Según la Fundación, corrieron más de 450 personas; la Intendencia la dio por un éxito. El lugar y la hora de largada no quedaron publicados en las páginas que siguen en línea.
  en: 5K charity race of the Pérez Scremini Foundation, which treats children and adolescents with cancer, on Sunday 4 October 2026 in Paysandú, with the support of the Intendencia de Paysandú. According to the Foundation, more than 450 people took part; the Intendencia called it a success. The start venue and time are not on the pages still online.
