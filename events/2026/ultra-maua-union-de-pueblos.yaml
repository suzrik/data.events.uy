description:
  es: Carrera de fondo de Plácido Rosas al Gimnasio Municipal de Río Branco, en Cerro Largo, el domingo 6 de diciembre. Según Cronometra Mauá, que la organiza y la inscribe, el 48 km larga a las 5:30, el intermedio a las 7:00 y el 7 km a las 8:30; la página de inscripción le da 25 km al intermedio y la publicación del 19 de octubre, 24 km. No se indica dónde largan las distancias cortas. Hay premios por categorías de edad y los mayores de 60 años pagan la mitad.
  en: Long-distance race from Plácido Rosas to the Río Branco municipal gym, in Cerro Largo, on Sunday 6 December. According to Cronometra Mauá, which organizes it and takes registrations, the 48 km starts at 5:30, the middle distance at 7:00 and the 7 km at 8:30; the registration page gives the middle distance as 25 km and the 19 October post as 24 km. Where the shorter distances start is not stated. There are age-group prizes and runners over 60 pay half.
