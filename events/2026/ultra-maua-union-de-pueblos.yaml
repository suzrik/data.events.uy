description:
  es: Carrera de fondo de Plácido Rosas a Río Branco, en Cerro Largo, el domingo 6 de diciembre, con distancias de 48, 25 y 7 km. La publica e inscribe Cronometra Mauá, empresa de organización y cronometraje de eventos deportivos. Hay premios generales y por categorías de edad del primero al quinto puesto, y los mayores de 60 años pagan la mitad de la inscripción. Las horas y los lugares de largada de cada distancia no figuran en la página.
  en: Long-distance race from Plácido Rosas to Río Branco, in Cerro Largo, on Sunday 6 December, over 48, 25 and 7 km. It is published and registered by Cronometra Mauá, a company that organizes and times sports events. There are overall and age-group prizes for first to fifth place, and runners over 60 pay half the entry fee. The start times and start places of each distance are not on the page.
