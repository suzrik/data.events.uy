description:
  es: Séptima edición de esta carrera de MTB por etapas, del viernes 13 al domingo 15 de noviembre en la Chacra Team Fierro, Balneario Iporá, Tacuarembó. Son tres etapas, de 42, 83 y 58 km, en categoría individual o en duplas. La inscripción incluye zona de camping, cenas del 13 y 14, almuerzos del 14 y 15 y remera. Los horarios de largada están a confirmar. Se anota en Crono MTB y el precio sube el 1 de noviembre.
  en: Seventh edition of this MTB stage race, from Friday 13 to Sunday 15 November at Chacra Team Fierro, Balneario Iporá, Tacuarembó. There are three stages, of 42, 83 and 58 km, raced solo or in pairs. The entry includes a camping area, dinners on the 13th and 14th, lunches on the 14th and 15th and a T-shirt. Start times are to be confirmed. You sign up on Crono MTB and the price goes up on 1 November.
