description:
  es: Desafío de mountain bike en Migues, Canelones, el domingo 4 de octubre, con largada a las 8:00 en la Plaza de Migues. Había 57 km y 25 km. Organizó Al Palo Eventos Deportivos, con el apoyo del Municipio de Migues, y la inscripción se anunció en Punto de Control. La fecha sale del afiche que Punto de Control publicó en agosto; no encontramos resultados publicados.
  en: Mountain bike challenge in Migues, Canelones, on Sunday 4 October, starting at 8:00 from the Plaza de Migues. There were 57 km and 25 km courses. It was organized by Al Palo Eventos Deportivos with the support of the Municipio de Migues, and registration was announced on Punto de Control. The date comes from the poster Punto de Control published in August; we found no published results.
