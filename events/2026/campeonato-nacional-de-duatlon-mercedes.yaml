description:
  es: Primera fecha del Campeonato Nacional de Duatlón 2026 de la Unión de Triatlón del Uruguay, anunciada para el domingo 31 de mayo de 2026 en el Club Remeros Mercedes, con categorías Sprint, Promocional y Postas. Los no federados corrían con licencia por el día, sin sumar puntos. La temporada siguió en Atlántida, Florida, Durazno, Fray Bentos y Carmelo. No encontramos resultados publicados, así que no consta que se haya corrido.
  en: First date of the 2026 Campeonato Nacional de Duatlón of the Unión de Triatlón del Uruguay, announced for Sunday 31 May 2026 at Club Remeros Mercedes, with Sprint, Promocional and relay (Postas) categories. Non-federated athletes could race on a one-day licence without scoring points. The season went on in Atlántida, Florida, Durazno, Fray Bentos and Carmelo. We found no published results, so there is no record that it was held.
