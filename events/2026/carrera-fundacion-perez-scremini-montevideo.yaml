description:
  es: Carrera solidaria de 5K y 10K de la Fundación Pérez Scremini, que atiende a niños y adolescentes con cáncer, el domingo 13 de setiembre de 2026 a las 9:00 en la Plaza España del Barrio Sur. Según las bases de la fundación, la inscripción costaba $800 por Redtickets o Abitab, y en Montevideo hubo chip y fiscalización de la Agrupación de Atletas del Uruguay. Ese mismo mes y en octubre la carrera se corrió también en otros departamentos.
  en: Charity 5K and 10K race of the Pérez Scremini Foundation, which treats children and adolescents with cancer, on Sunday 13 September 2026 at 9:00 at Plaza España in Barrio Sur. According to the foundation's rules, entry cost $800 via Redtickets or Abitab, and in Montevideo the race was chip-timed and overseen by the Agrupación de Atletas del Uruguay. That month and in October the race was also held in other departments.
