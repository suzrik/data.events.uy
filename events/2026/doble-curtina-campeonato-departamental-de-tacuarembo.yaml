description:
  es: Cancelado en esta fecha; la Doble Curtina se corre el domingo 15 de noviembre de 2026, como quinta fecha del campeonato departamental de Tacuarembó. Un afiche de la federación departamental la había anunciado para el domingo 18 de octubre, con largada a las 08:30 desde Maderas Gularte, en la ruta 5, y la Intendencia para el 25 de octubre; el calendario de la FCU no tuvo ninguna fecha en Tacuarembó el 18 de octubre.
  en: Cancelled on this date; the Doble Curtina is raced on Sunday 15 November 2026, as the fifth round of the Tacuarembó departmental championship. A poster of the departmental federation had announced it for Sunday 18 October, starting at 08:30 from Maderas Gularte on Route 5, and the city government for 25 October; the FCU calendar had no Tacuarembó round on 18 October.
