description:
  es: Fecha de ruta del campeonato departamental de la Federación Ciclista Departamental de Tacuarembó, fiscalizada por la FCU, cuyo calendario la lista como «Fecha 2». Se corre el domingo 18 de octubre con largada a las 08:30 desde Maderas Gularte, en la ruta 5; inscripción desde las 08:00, costo $400. Categorías Élite, Junior, Sub-23, Máster y Damas. Un afiche anterior la daba para el 25 de octubre; el afiche nuevo y el calendario de la FCU coinciden en el 18. Distancias sin publicar.
  en: Road round of the departmental championship of the Federación Ciclista Departamental de Tacuarembó, supervised by the FCU, whose calendar lists it as «Fecha 2». It is held on Sunday 18 October, starting at 08:30 from Maderas Gularte on Route 5; registration from 08:00, price $400. Categories Elite, Junior, Under-23, Máster and Women. An earlier poster gave it for 25 October; the new poster and the FCU calendar agree on the 18th. Distances not published.
