description:
  es: Prueba de ruta del campeonato departamental de la Federación Ciclista Departamental de Tacuarembó. Un afiche de la federación la anunciaba para el domingo 18 de octubre, con largada a las 08:30 desde Maderas Gularte, en la ruta 5; la Intendencia la había anunciado para el 25 de octubre. El calendario de la FCU no tiene ninguna fecha en Tacuarembó el 18 de octubre (pasa de la del 11 a la del sábado 24) y no se publicaron resultados, así que no consta que se haya corrido.
  en: Road race of the departmental championship of the Federación Ciclista Departamental de Tacuarembó. A federation poster announced it for Sunday 18 October, starting at 08:30 from Maderas Gularte on Route 5; the city government had announced it for 25 October. The FCU calendar has no Tacuarembó round on 18 October (it goes from the one on the 11th to the one on Saturday 24th) and no results were published, so there is no record that it was held.
