name: Navidad Trail Young
date: 2026-12-19
sport: trail
city: Young
venue: Parque Ciudad de Young
distances: [8K, 4K]
links:
  site: https://cronomtb.uy/trail-navideno-2026/
  register: https://cronomtb.uy/trail-navideno-2026/
description:
  es: Segunda edición de este trail en el Parque Ciudad de Young, Río Negro, el sábado 19 de diciembre. Los 4K y 8K largan a las 19:00 y hay una carrera de niños de 800 m a las 18:30. Organizan el Club Atlético Peñarol de Young y Peñarol Atletismo. Hay premios por categorías de edad en las dos distancias y medalla finisher para todos. La inscripción se hace hasta el 18 de diciembre en la web de Crono MTB, donde figura como Trail Navideño; los kits se entregan el mismo día desde las 15:00.
  en: Second edition of this trail race at the Parque Ciudad de Young, Río Negro, on Saturday 19 December. The 4K and 8K start at 19:00 and there is an 800 m kids' race at 18:30. Organized by Club Atlético Peñarol de Young and Peñarol Atletismo. There are age-group prizes in both distances and a finisher medal for everyone. Registration is open until 18 December on the Crono MTB website, where it is listed as Trail Navideño; kits are handed out on the day from 15:00.
