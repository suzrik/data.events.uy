description:
  es: Cuarta fecha del Campeonato de Invierno de Rivera 2026, llamada «Club Sarandí», carrera de ruta de la Liga de Ciclismo Departamental de Rivera en el calendario regional de la Federación Ciclista Uruguaya, corrida el sábado 8 de agosto en Rivera. Corrieron ciclistas con licencia en élite, sub-23, junior y máster A a D. La FCU la da por finalizada y publicó la clasificación.
  en: Fourth round of the 2026 Campeonato de Invierno de Rivera, named "Club Sarandí", a road race of the Liga de Ciclismo Departamental de Rivera on the regional calendar of the Uruguayan Cycling Federation, held on Saturday 8 August in Rivera. Licensed riders raced in the elite, under-23, junior and master A to D categories. The FCU lists it as finished and published the classification.
