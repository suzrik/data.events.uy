description:
  es: Séptima edición de la correcaminata solidaria de Correo Uruguayo, a beneficio de Granja La Esperanza Sabalera. Sale a las 9:00 de la Rambla República de Gran Bretaña y Misiones, con recorridos de 5K y 10K; a las 8:30 corre la carrera infantil. Inscripción en locales de Correo Uruguayo o por Tickantel.
  en: Seventh edition of Correo Uruguayo's charity fun run, in aid of Granja La Esperanza Sabalera. It starts at 9:00 at Rambla República de Gran Bretaña and Misiones, with 5K and 10K courses; a children's race runs at 8:30. Register at Correo Uruguayo branches or through Tickantel.
