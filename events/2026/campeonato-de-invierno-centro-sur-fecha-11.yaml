description:
  es: Fecha 11 del Campeonato de Invierno Centro Sur 2026, carrera de ruta del calendario regional de la Federación Ciclista Uruguaya, corrida el domingo 2 de agosto en Trinidad y organizada por la Federación Ciclista Trinitaria Departamental de Flores. Corrieron ciclistas con licencia en élite, sub-23, junior, máster A a C y cadetes. La FCU la da por finalizada y publicó la clasificación.
  en: Round 11 of the 2026 Campeonato de Invierno Centro Sur, a road race on the regional calendar of the Uruguayan Cycling Federation, held on Sunday 2 August in Trinidad and organized by the Federación Ciclista Trinitaria Departamental de Flores. Licensed riders raced in the elite, under-23, junior, master A to C and cadet categories. The FCU lists it as finished and published the classification.
