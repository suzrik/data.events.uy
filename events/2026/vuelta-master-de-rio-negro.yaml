description:
  es: "5.ª Vuelta Máster de Río Negro, carrera máster por etapas del calendario regional de la Federación Ciclista Uruguaya (FCU), corrida el sábado 18 y el domingo 19 de abril de 2026 en Fray Bentos. El sábado hubo una etapa de 80 km y una contrarreloj individual de 5 km; el domingo, otra etapa de 80 km, para ciclistas con licencia máster A a E y promocional. La FCU la da por finalizada y publicó la clasificación general de máster A a E."
  en: "The 5th Vuelta Máster de Río Negro, a masters stage race on the regional calendar of the Uruguayan Cycling Federation (FCU), held on Saturday 18 and Sunday 19 April 2026 in Fray Bentos. Saturday had an 80 km stage and a 5 km individual time trial; Sunday, another 80 km stage, for licensed master A to E and promotional riders. The FCU lists it as finished and published the overall classification for master A to E."
