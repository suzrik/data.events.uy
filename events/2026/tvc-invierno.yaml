description:
  es: Edición de invierno del Trail Valizas Cabo Polonio, corrida el sábado 22 de agosto de 2026 con largada y llegada en Valizas, Rocha. Hubo tres distancias con largadas escalonadas por la tarde, 37 km a las 16:00, 14 km a las 16:20 y 23 km a las 16:40, con premios del 1.º al 3.º en damas y caballeros por distancia y categoría, y medalla y taza finisher. Punto de Control tuvo la inscripción y publicó los resultados de las tres distancias; las novedades salían en el Instagram del UTVC.
  en: Winter edition of the Trail Valizas Cabo Polonio, held on Saturday 22 August 2026, starting and finishing in Valizas, Rocha. There were three distances with staggered afternoon starts, 37 km at 16:00, 14 km at 16:20 and 23 km at 16:40, with prizes for the top three women and men per distance and age group, and a finisher medal and mug. Punto de Control handled registration and published the results of all three distances; news went out on the UTVC Instagram.
