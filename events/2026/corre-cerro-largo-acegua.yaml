description:
  es: "Cuarta fecha del campeonato Corre Cerro Largo, anunciada para el sábado 22 de agosto de 2026 en Aceguá, con largada a las 15:30: 10K y 5K por categorías de edad y 3 km para niños de 7 a 11 años. La inscripción, en el sitio de Cronometra Mauá con pago por Abitab, costaba $550 en 5K y 10K con camiseta, $350 sin camiseta y $350 la de niños. No encontramos resultados publicados."
  en: "Fourth round of the Corre Cerro Largo championship, announced for Saturday 22 August 2026 in Aceguá, starting at 15:30: 10K and 5K by age group and 3 km for children aged 7 to 11. Registration, on the Cronometra Mauá site with payment through Abitab, cost $550 for 5K and 10K with a T-shirt, $350 without, and $350 for the kids' race. We found no published results."
