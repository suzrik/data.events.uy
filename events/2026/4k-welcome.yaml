sport: run
city: Montevideo
venue: Plaza República Española
distances: [4K]
links:
  instagram: https://www.instagram.com/cawelcomeuy/
description:
  es: Corre caminata de 4 km del Club Atlético Welcome por sus 100 años, en el marco del Patrimonio Deportivo de Montevideo. Según la publicación del club del 27 de setiembre, es el sábado 24 de octubre a las 9:00, con punto de encuentro en la Plaza República Española, abierta a todo público. Inscripción en la secretaría del club o por WhatsApp 092 934 924, $600 con remera y $400 sin remera; menores de 10 años gratis. El recorrido se anuncia más adelante. Hay feria, food trucks, música e inflables.
  en: 4 km run and walk of Club Atlético Welcome for its 100th anniversary, as part of Montevideo's sports heritage day. According to the club's post of 27 September, it is on Saturday 24 October at 9:00, meeting at Plaza República Española, open to everyone. Registration at the club's office or by WhatsApp 092 934 924, $600 with shirt and $400 without; children under 10 free. The route will be announced later. There is a fair, food trucks, music and inflatables.
