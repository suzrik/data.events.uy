description:
  es: Trail de Mil Horizontes anunciado para el domingo 27 de setiembre de 2026 a las 9:00 en el Establecimiento La Serena, un predio privado en la Sierra de Carapé, Maldonado, con 15K y 9K por senderos, vados y cruces de arroyo. La noche anterior, sábado 26, se ofrecía acampe en el predio con trekking nocturno, cena y fogón. No encontramos resultados publicados, así que no consta que se haya corrido.
  en: Mil Horizontes trail race announced for Sunday 27 September 2026 at 9:00 at Establecimiento La Serena, a private estate in the Sierra de Carapé, Maldonado, with 15K and 9K over trails, fords and stream crossings. Camping on the estate was offered the night before, Saturday 26, with a night trek, dinner and a campfire. We found no published results, so there is no record that it was held.
