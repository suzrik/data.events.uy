description:
  es: Carrera con largada a las 8:30 en el Parque Artigas, Ciudad de Canelones, con 21K, 10K y 5K. Todas las distancias tienen medalla finisher y cronometraje con chip, y la remera es opcional hasta el 20 de noviembre. Las inscripciones cierran el 9 de diciembre. Organiza RMR Eventos y gestión deportiva.
  en: Race starting at 8:30 at Parque Artigas, Ciudad de Canelones, with 21K, 10K and 5K. All distances have a finisher medal and chip timing, and the shirt is optional until 20 November. Registration closes on 9 December. Organized by RMR Eventos y gestión deportiva.
