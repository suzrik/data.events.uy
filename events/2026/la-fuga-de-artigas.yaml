description:
  es: Primera edición de La Fuga de Artigas, el sábado 14 de noviembre en Colonia del Sacramento, con un recorrido de unos 30 km. Se hace a tu ritmo, caminando o trotando, solo o con amigos. El afiche lleva el logo de Viento a Favor. La agenda de la Intendencia de Colonia publica el evento con datos del organizador; la hora, el lugar de largada y la inscripción no figuran.
  en: First edition of La Fuga de Artigas, on Saturday 14 November in Colonia del Sacramento, over about 30 km. You go at your own pace, walking or jogging, alone or with friends. The poster carries the Viento a Favor logo. The Intendencia de Colonia agenda lists the event with details supplied by the organizer; start time, start place and registration are not given.
