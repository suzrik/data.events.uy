description:
  es: Columbia Hike Society Fest, el domingo 6 de diciembre en Punta Ballena. Tras el calentamiento de las 10:00 en el Arboretum Lussich, a las 10:15 salen el hike de 7K y el trail run hacia Solanas, donde a las 12:30 hay brunch en el bosque, sorteo y música en vivo. Hay buses opcionales desde Montevideo a las 8:00. La entrada costaba $1150 y la venta en ticketfacil está cerrada. Con lluvia se reprograma.
  en: Columbia Hike Society Fest, on Sunday 6 December in Punta Ballena. After a warm-up at 10:00 at the Arboretum Lussich, the 7K hike and the trail run set off at 10:15 towards Solanas, where at 12:30 there is a brunch in the woods, a raffle and live music. Optional buses leave Montevideo at 8:00. Entry cost $1,150 and sales on ticketfacil are closed. If it rains, it is rescheduled.
