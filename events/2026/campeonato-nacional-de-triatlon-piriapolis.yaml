description:
  es: Tercera fecha del Campeonato Nacional de Triatlón 2025-2026, organizada por la Asociación Ciclista y Social Punta del Este y la Unión de Triatlón del Uruguay, corrida el domingo 1 de marzo de 2026 en Piriápolis, con natación frente al Hotel Argentino y ciclismo y carrera en vueltas por la rambla. Hubo distancia sprint (750 m, 20 km y 5 km) individual y en postas y una prueba promocional. SUCA publicó los resultados.
  en: Third date of the 2025-2026 Campeonato Nacional de Triatlón, organized by the Asociación Ciclista y Social Punta del Este and the Unión de Triatlón del Uruguay, held on Sunday 1 March 2026 in Piriápolis, with the swim in front of the Hotel Argentino and the bike and run in laps along the rambla. There was a sprint distance (750 m, 20 km and 5 km), individual and relay, plus a promotional race. SUCA published the results.
