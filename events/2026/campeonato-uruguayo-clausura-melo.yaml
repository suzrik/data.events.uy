description:
  es: Segunda fecha del Campeonato Uruguayo Clausura 2026 de la Federación Ciclista Uruguaya, el domingo 20 de setiembre en Melo, organizada por la Federación Ciclista de Cerro Largo, con categorías élite, sub-23 y junior de hombres y mujeres. La FCU la da por finalizada. Para el público fue una carrera para ir a ver.
  en: Second round of the 2026 Campeonato Uruguayo Clausura of the Uruguayan Cycling Federation, on Sunday 20 September in Melo, organized by the Federación Ciclista de Cerro Largo, with men's and women's elite, under-23 and junior categories. The FCU lists it as finished. For the public it was one to go and watch.
