  en: Road cycling race on Avenida de los Argentinos, La Paloma, Rocha, on Sunday 15 November, organized by the Federación Ciclista de Rocha with support from the Gobierno de Rocha and the Municipio de La Paloma, on the regional calendar of the Uruguayan Cycling Federation. Schedule per Turismo Rocha. 9:00 categories D and E; 10:00 category C and women; 11:30 elite, under-23, junior, master A and master B. For licensed riders.
