description:
  es: Carrera de ciclismo de ruta en La Paloma, Rocha, el domingo 15 de noviembre, organizada por la Federación Ciclista Departamental de Rocha y fiscalizada por la Federación Ciclista Uruguaya en su calendario regional. Según la página de la FCU es para las categorías Élite, Sub-23 y Junior masculinas; para el público es una carrera para ir a ver. La hora, el recorrido y las distancias no están publicados.
  en: Road cycling race in La Paloma, Rocha, on Sunday 15 November, organized by the Federación Ciclista Departamental de Rocha and supervised by the Uruguayan Cycling Federation on its regional calendar. According to the FCU page it is for the men's Elite, Under-23 and Junior categories; for the public it is one to go and watch. The time, course and distances are not published.
