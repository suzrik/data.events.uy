description:
  es: Carrera de 5 km del Instituto Nacional de la Juventud (INJU) en Cardona, el jueves 12 de noviembre con largada en el Parque Caseux; estaba prevista para el viernes 30 de octubre y el comunicado del MIDES la marca como nueva fecha. Inicio de actividad a las 15:00 y largada a las 16:00. Para mayores de 13 años; los menores de 18 necesitan permiso firmado y todos un certificado médico. Hay inscripción en línea y también el día de la carrera. Las fechas pueden cambiar.
  en: 5 km race of the Instituto Nacional de la Juventud (INJU) in Cardona, on Thursday 12 November, starting at Parque Caseux; it was planned for Friday 30 October and the MIDES notice marks this as the new date. Activity starts at 15:00 and the race starts at 16:00. For people over 13; under-18s need a signed permission and everyone a medical certificate. Registration is online and also on race day. Dates may change.
