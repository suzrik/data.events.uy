description:
  es: Carrera de trail de Mil Horizontes en los Cerros Azules, Maldonado, corrida el domingo 26 de julio de 2026, con 9, 18 y 30 km. La fecha y el lugar figuran en las páginas de inscripción de Ticketfácil y lolograste; la hora de largada no se da porque las páginas no coinciden (8:00 y 8:45). Encarrera publicó los resultados de las tres distancias.
  en: Trail race by Mil Horizontes in the Cerros Azules, Maldonado, held on Sunday 26 July 2026, over 9, 18 and 30 km. The date and place are on the Ticketfácil and lolograste registration pages; the start time is left out because the pages disagree (8:00 and 8:45). Encarrera published the results of all three distances.
