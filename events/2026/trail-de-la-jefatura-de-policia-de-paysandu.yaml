name: Trail de la Jefatura de Policía de Paysandú
date: 2026-12-13
sport: trail
city: Paysandú
venue: Parque Policial
distances: [15K, 7K]
links:
  site: https://www.cronofrancolini.com.ar/traildelapolicia.html
  register: https://www.cronofrancolini.com.ar/traildelapolicia.html
description:
  es: Tercera edición del trail que organiza la Jefatura de Policía de Paysandú, el domingo 13 de diciembre, con largada a las 8:30 en el Parque Policial. Hay 15 km competitivos, 7 km participativos y 1 km para niños, por campo, arena, pendientes y agua. Tiene premios generales y por categorías, una clasificación aparte para policías y medalla finisher. La inscripción se hace en la página de Crono Francolini, la empresa que cronometra la carrera.
  en: Third edition of the trail race organized by the Paysandú police headquarters, on Sunday 13 December, starting at 8:30 at the Parque Policial. There is a competitive 15 km, a participatory 7 km and a 1 km kids' race, over fields, sand, slopes and water. It has overall and category prizes, a separate classification for police officers and a finisher medal. Registration is on the page of Crono Francolini, the company that times the race.
