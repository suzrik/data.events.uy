description:
  es: Primera edición de esta carrera de MTB y gravel en Paysandú, el domingo 11 de octubre, con largada a las 9:00 en la Asociación Rural. Tiene dos distancias, 82 km (larga) y 38 km (corta). Los cupos están agotados; Punto de Control, la plataforma de inscripción, ya no toma anotados.
  en: First edition of this MTB and gravel race in Paysandú, on Sunday 11 October, starting at 9:00 at the Asociación Rural. It has two distances, 82 km (long) and 38 km (short). It is sold out; Punto de Control, the registration platform, no longer takes entries.
