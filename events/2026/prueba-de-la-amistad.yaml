description:
  es: Carrera por etapas del calendario regional de la Federación Ciclista Uruguaya, el sábado 15 y el domingo 16 de agosto en Trinidad. El sábado se corrió una contrarreloj individual de 10 km y una etapa de 30 km en la Pista José Asconeguy; el domingo, una de 60 km en la misma pista. Corrieron ciclistas con licencia cadetes y junior hombres y élite, sub-23 y junior mujeres. La FCU la da por finalizada y publicó la clasificación.
  en: A stage race on the regional calendar of the Uruguayan Cycling Federation, on Saturday 15 and Sunday 16 August in Trinidad. On Saturday there was a 10 km individual time trial and a 30 km stage at the Pista José Asconeguy; on Sunday, a 60 km stage at the same track. Licensed riders raced in men's cadet and junior and women's elite, under-23 and junior. The FCU lists it as finished and published the classification.
