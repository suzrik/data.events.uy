description:
  es: Carrera de MTB anunciada para el sábado 28 de marzo de 2026 a las 9:30 en Miguelete, Colonia, con 42 km competitivos (damas A a C, open élite y máster A a D), 25 km promocionales y 10 km recreativos sin competencia para locales. Premios hasta el 5.º puesto; la inscripción costaba $800 hasta el 25 de marzo y $1000 después. La organizaba CDF, con apoyo de Trek Américas. No encontramos resultados publicados, así que no consta que se haya corrido.
  en: MTB race announced for Saturday 28 March 2026 at 9:30 in Miguelete, Colonia, with a 42 km competitive race (women's A to C, open elite and Master A to D), a 25 km promotional race and a non-competitive 10 km ride for locals. Prizes down to 5th place; entry cost $800 until 25 March and $1000 after. Organized by CDF with support from Trek Américas. We found no published results, so there is no record that it was held.
