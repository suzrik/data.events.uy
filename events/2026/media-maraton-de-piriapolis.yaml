description:
  es: Media maratón frente al mar en Piriápolis, organizada por RS Eventos Deportivos, corrida el domingo 12 de abril de 2026 con 5, 10 y 21 km. Encarrera publicó los resultados de las tres distancias con esa fecha, y la página del organizador muestra las fotos de la edición 2026.
  en: A seaside half marathon in Piriápolis, organized by RS Eventos Deportivos, held on Sunday 12 April 2026 over 5, 10 and 21 km. Encarrera published the results of all three distances under that date, and the organizer's page shows photos of the 2026 edition.
