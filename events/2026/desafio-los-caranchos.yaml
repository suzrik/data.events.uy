description:
  es: "14ª edición del Desafío Los Caranchos, trail en la Sierra de las Cañas, Maldonado, que se corrió el domingo 4 de octubre de 2026. Salió del salón de la Sociedad Rural en el Paraje Las Cañas, sobre la ruta 39: 25K y 16K a las 8:30 y 8K a las 9:15. El cupo era de 500 corredores y la inscripción incluía almuerzo y medalla finisher. Organizó Toros Eventos Deportivos, que publicó los resultados por distancia."
  en: "14th edition of the Desafío Los Caranchos, a trail race in the Sierra de las Cañas, Maldonado, held on Sunday 4 October 2026. It started from the Sociedad Rural hall at Paraje Las Cañas, on Route 39: 25K and 16K at 8:30 and 8K at 9:15. The field was capped at 500 runners and entry included lunch and a finisher medal. Organized by Toros Eventos Deportivos, which published the results by distance."
