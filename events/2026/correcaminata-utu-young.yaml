description:
  es: 10ª edición de la correcaminata de UTU Young, en Young, Río Negro, el sábado 17 de octubre de 2026. Hay distancias de 4K y 8K con largada a las 17 hs desde la UTU; los kits se entregan ese día desde las 14 hs. Las categorías van por edad desde los 16 años, iguales para damas y caballeros, con premios del 1.º al 3.º por categoría, premios en dinero en la general de cada distancia y medalla finisher para todos. La inscripción se hace en el sitio de Crono MTB.
  en: 10th edition of the UTU Young run/walk, in Young, Río Negro, on Saturday 17 October 2026. There are 4K and 8K distances starting at 5 pm from the UTU school; kits are handed out that day from 2 pm. Categories are by age from 16, the same for women and men, with prizes for the top 3 in each category, cash prizes in the overall standings of each distance and a finisher medal for everyone. Registration is on the Crono MTB site.
