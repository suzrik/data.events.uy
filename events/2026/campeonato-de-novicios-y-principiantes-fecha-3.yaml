name: Campeonato de Novicios y Principiantes, fecha 3
date: 2026-11-14
time: "14:00"
sport: road
city: Maldonado
venue: Pista Walter Moyano
links:
  facebook: https://www.facebook.com/groups/1643507965905671/
description:
  es: Competencia para novicios y principiantes sin licencia, el sábado 14 de noviembre de 14:00 a 15:00, con horario puntual, en la Pista Walter Moyano de Maldonado. Tercera carrera de la serie amateur que siguió a las fechas del 17 y el 31 de octubre; el afiche no la numera y lleva los logos de Maldonado Deportes y «Evento amateur». Inscripción 400 pesos y seguro del Banco de Seguros del Estado. Se puede ir con el equipo.
  en: Race for novices and beginners without a license, on Saturday 14 November from 14:00 to 15:00, starting on time, at the Pista Walter Moyano in Maldonado. Third race of the amateur series that followed the rounds of 17 and 31 October; the poster does not number it and carries the Maldonado Deportes and «Evento amateur» logos. Entry 400 pesos and insurance by the Banco de Seguros del Estado. Riders are welcome to come with their team.
