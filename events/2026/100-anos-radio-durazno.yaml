description:
  es: Carrera participativa por los 100 años de Radio Durazno, corrida el martes 25 de agosto de 2026 en Durazno con largada a las 16:00. Kronos Sports, que cronometró, publicó los tiempos; por ser participativa, la organización decidió publicarlos sin nombres de corredores ni distancias.
  en: A participative run for the 100th anniversary of Radio Durazno, held on Tuesday 25 August 2026 in Durazno with a 16:00 start. Kronos Sports, which did the timing, published the times; since it was participative, the organizers chose to publish them without runners' names or distances.
