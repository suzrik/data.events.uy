description:
  es: Cuarta edición de la Frisona Run, con el lema «Castellanos se mueve», el sábado 28 de noviembre en Castellanos, Ruta 6 km 69, Canelones, con largada a las 18:00. Hay 3K, 5K y 10K. Premian a los cinco primeros de la general de 5K y 10K, damas y caballeros. El kit se entrega el mismo día hasta las 17:30. La inscripción es en lolograste.uy.
  en: Fourth edition of the Frisona Run, under the motto "Castellanos se mueve", on Saturday 28 November in Castellanos, Ruta 6 km 69, Canelones, starting at 18:00. There are 3K, 5K and 10K. The first five overall in the 5K and the 10K, women and men, get prizes. Race kits are handed out on race day until 17:30. Registration is on lolograste.uy.
