description:
  es: Primera edición de la Media Maratón de Rocha, organizada por Glajesa Eventos con apoyo de la Dirección de Deportes de Rocha, corrida el domingo 31 de mayo de 2026 con largada general a las 10:00 en el Parque Zelmar Michelini. Hubo 5, 10 y 21 km; las inscripciones con kit se agotaron. Encarrera tuvo la inscripción y publicó los resultados.
  en: First edition of the Media Maratón de Rocha, organized by Glajesa Eventos with support from the Rocha Sports Directorate, held on Sunday 31 May 2026 with a single start at 10:00 in Parque Zelmar Michelini. There were 5, 10 and 21 km; entries with a kit sold out. Encarrera handled registration and published the results.
