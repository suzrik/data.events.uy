description:
  es: Trail de La Sierra Eventos Deportivos en las Sierras de Mahoma, San José, corrido el domingo 30 de agosto de 2026 a las 9:00 desde Finca Piedra. Fue fecha del circuito de trail de la Confederación Atlética del Uruguay y sede de la Copa Uruguaya Master de trail. Encarrera publicó los resultados de 7, 15 y 21 km.
  en: Trail race by La Sierra Eventos Deportivos in the Sierras de Mahoma, San José, held on Sunday 30 August 2026 at 9:00 from Finca Piedra. It was a round of the trail circuit of the Confederación Atlética del Uruguay and hosted the Uruguayan Masters Trail Cup. Encarrera published the results of the 7, 15 and 21 km.
