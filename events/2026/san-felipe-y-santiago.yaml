description:
  es: Carrera tradicional de la Intendencia de Montevideo por la rambla, el sábado 14 de noviembre a las 19:00. Inscripción por Tickantel, a $1.100 y gratis para personas con discapacidad. El recorrido nuevo larga en la rambla bajo la Plaza Virgilio y llega a unos 100 m de Bulevar Artigas y la Rambla Gandhi, con la subida de Luis Alberto de Herrera y circuito certificado por World Athletics. Es de 10 km y la 5.ª fecha del Campeonato Clausura de ruta 2026 de la Confederación Atlética del Uruguay.
  en: Traditional race organized by the Montevideo city government along the waterfront, on Saturday 14 November at 19:00. Registration on Tickantel, at $1,100 and free for people with disabilities. The new course starts on the waterfront below Plaza Virgilio and finishes about 100 m from Bulevar Artigas and Rambla Gandhi, keeping the Luis Alberto de Herrera climb, certified by World Athletics. It is 10 km and round 5 of the Confederación Atlética del Uruguay's 2026 Campeonato Clausura road series.
