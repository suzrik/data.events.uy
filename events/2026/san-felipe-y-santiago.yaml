description:
  es: Carrera tradicional de la Intendencia de Montevideo por la rambla, edición 2026 el sábado 14 de noviembre a las 19:00. Inscripción por Tickantel, con costo de $1.100 y gratis para personas con discapacidad. En 2026 cambia el recorrido, que larga en la rambla bajo la Plaza Virgilio y llega a unos 100 m de Bulevar Artigas y la Rambla Gandhi, con la subida de Luis Alberto de Herrera y circuito certificado por World Athletics. No se publicó la distancia.
  en: Traditional race organized by the Montevideo city government along the waterfront, 2026 edition on Saturday 14 November at 19:00. Registration through Tickantel, at $1,100 and free for people with disabilities. In 2026 the course changes; it starts on the waterfront below Plaza Virgilio and finishes about 100 m from Bulevar Artigas and Rambla Gandhi, keeping the Luis Alberto de Herrera climb, on a course certified by World Athletics. The distance has not been published.
