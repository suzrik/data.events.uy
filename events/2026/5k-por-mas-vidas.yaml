description:
  es: Primera edición de esta 5K de La Asistencial Médica de Maldonado y Suca Sports, en el mes de concientización sobre el cáncer de mama. Es el sábado 24 de octubre de 2026 a las 16 hs, desde Rambla Circunvalación Playa Mansa y calle 30, Punta del Este, con recorrido por la rambla. Se puede correr, trotar o caminar. Para mayores de 13 años; los menores de 18 necesitan autorización de un adulto. Los cupos son limitados y la inscripción en línea pide certificado médico o carné de salud.
  en: First edition of this 5K by La Asistencial Médica de Maldonado and Suca Sports, held in breast cancer awareness month. It is on Saturday 24 October 2026 at 4 pm, from Rambla Circunvalación Playa Mansa and Calle 30, Punta del Este, on a course along the waterfront. You can run, jog or walk. For people over 13; under-18s need an adult's authorization. Places are limited and online registration asks for a medical certificate or health card.
