description:
  es: Etapa 2 de Combo Colonia 2026/2027, campeonato de running por localidades del departamento de Colonia, que se corrió el sábado 5 de setiembre en Miguelete con 10K y 5K. La largada fue a las 16:00 frente a la sede del Club Independiente, donde se retiraba el kit desde las 14:00. Hubo premios para los cinco primeros de la general en damas, caballeros y capacidades diferentes, categorías cada 15 años y medallas. Los resultados están en Cronometraje Instantáneo.
  en: Stage 2 of Combo Colonia 2026/2027, a running championship through towns of the Colonia department, held on Saturday 5 September in Miguelete over 10K and 5K. The start was at 16:00 in front of the Club Independiente, where kits were handed out from 14:00. The top five overall among women, men and differently-abled runners won prizes, with 15-year age categories and medals. Results are on Cronometraje Instantáneo.
