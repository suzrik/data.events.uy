description:
  es: Quinta etapa de la serie Recorre Maldonado 2026, organizada por SUCA Sports, corrida el sábado 11 de julio de 2026 a las 15 hs en Pan de Azúcar, con largada y llegada en el centro de la ciudad y recorrido por los alrededores, con el cerro de fondo. Hubo 10K y 5K; SUCA publicó los resultados de las dos distancias.
  en: Fifth stage of the 2026 Recorre Maldonado series, organized by SUCA Sports, held on Saturday 11 July 2026 at 3 pm in Pan de Azúcar, starting and finishing in the town centre and running through the surroundings, with the hill in the background. There were 10K and 5K races; SUCA published the results of both.
