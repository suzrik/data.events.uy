name: Uniendo los Pueblos de Rivera, etapa 1
date: 2026-02-07
sport: mtb
city: Tranqueras
links:
  instagram: https://www.instagram.com/uniendopueblosmtb/
description:
  es: Primera etapa de Uniendo los Pueblos de Rivera, carrera de MTB por etapas en el departamento; se corrió el sábado 7 de febrero de 2026 en Tranqueras, según el afiche de la cuarta etapa, que la marca como cumplida. Le siguieron Corrales (31 de mayo), Vichadero (6 de setiembre) y la final en la ciudad de Rivera (13 de diciembre). La hora, el lugar de largada y las distancias de esta etapa no figuran en lo que publicó el organizador.
  en: First stage of Uniendo los Pueblos de Rivera, a stage MTB race around the department; it was held on Saturday 7 February 2026 in Tranqueras, according to the poster of the fourth stage, which marks it as done. It was followed by Corrales (31 May), Vichadero (6 September) and the final in the city of Rivera (13 December). The start time, start place and distances of this stage are not in what the organizer published.
