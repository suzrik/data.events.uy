description:
  es: Carrera de ruta de un día en Colonia del Sacramento, en el calendario de la Federación Ciclista Uruguaya. La organizan el Cycles Club Douglas R. Gilles y la Federación Ciclista de Colonia. Corren las categorías élite, sub-23 y junior de hombres y mujeres. El recorrido, las distancias y la hora de largada todavía no están publicados. Para el público es una carrera para ir a ver.
  en: One-day road race in Colonia del Sacramento, on the calendar of the Uruguayan Cycling Federation. It is organized by Cycles Club Douglas R. Gilles and the Federación Ciclista de Colonia. The men's and women's elite, under-23 and junior categories race. The route, distances and start time are not published yet. For the public it is one to go and watch.
