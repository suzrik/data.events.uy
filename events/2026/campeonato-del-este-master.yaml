description:
  es: Competencia de ruta de tres días en Melo, Cerro Largo, del viernes 16 al domingo 18 de octubre, para las categorías Máster A a E (hombres). Figura en el calendario regional de la Federación Ciclista Uruguaya, cuya página no indica quién la organiza. El programa, las distancias y la inscripción no están publicados. Es para ciclistas con licencia de la federación en categoría máster.
  en: Three-day road competition in Melo, Cerro Largo, from Friday 16 to Sunday 18 October, for the men's Master A to E categories. It is on the regional calendar of the Uruguayan Cycling Federation, whose page does not say who organizes it. The programme, distances and registration are not published. It is for riders holding a federation licence in a masters category.
