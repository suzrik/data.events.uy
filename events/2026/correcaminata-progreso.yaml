description:
  es: "Octava edición de esta correcaminata en Progreso, Canelones, corrida el sábado 18 de abril de 2026 con largada a las 18:00 desde el municipio. Hubo 10K y 5K, con premios generales y para personas con discapacidad, y gratis para los niños; la inscripción costaba $250 hasta el 16 de marzo y $300 después. Crono MTB, que cronometró, publicó los resultados."
  en: "Eighth edition of this run-walk in Progreso, Canelones, held on Saturday 18 April 2026, starting at 18:00 from the municipal building. There were 10K and 5K, with overall prizes and prizes for athletes with disabilities, free for children; entry cost $250 until 16 March and $300 after. Crono MTB, which did the timing, published the results."
