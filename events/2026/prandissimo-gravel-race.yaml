name: Prandissimo Gravel Race
date: 2026-02-15
sport: gravel
city: La Barra
distances: [120 km, 60 km]
organizer: Prandissimo Café Ciclista
links:
  site: https://www.prandissimo.com/prandissimo-gravel-race-2026
description:
  es: Tercera edición de la carrera de gravel de Prandissimo Café Ciclista, corrida el domingo 15 de febrero de 2026 en La Barra, Maldonado, con recorridos de 120 y 60 km por viñedos, chacras y rutas costeras. SUCA Timing publicó los resultados de las dos distancias. La página del organizador ya anuncia la cuarta edición, en febrero de 2027.
  en: Third edition of Prandissimo Café Ciclista's gravel race, held on Sunday 15 February 2026 in La Barra, Maldonado, with 120 and 60 km courses through vineyards, farms and coastal roads. SUCA Timing published the results of both distances. The organizer's page already announces the fourth edition, in February 2027.
