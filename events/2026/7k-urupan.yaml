  en: 7 km race of Club Social y Deportivo Urupan, on Saturday 5 December 2026 at 18:00, starting from the club's premises. Entry includes a shirt and kit and is taken at the club reception or by phone; it costs $500 for members, $700 in advance and $850 on race day. The poster does not name the town; Pando is taken from another race of the club.
