description:
  es: Cuarta edición de la carrera de 5 km de Running Baltasar Brum, en Baltasar Brum, Artigas, el domingo 13 de diciembre. Según el organizador hay carrera para grandes y chicos, premios generales y por categoría, kit completo con remera, chip y medalla, hidratación y sorteos. Según el formulario de inscripción, la largada es a las 7:30 frente al Galpón del Norte, con 5 km competitivos y 2,5 km participativos a $900 con kit; la carrera kids se anota en el lugar.
  en: Fourth edition of the 5 km race of Running Baltasar Brum, in Baltasar Brum, Artigas, on Sunday 13 December. According to the organizer there are races for adults and children, overall and category prizes, a full kit with shirt, chip and medal, hydration and raffles. According to the registration form, the start is at 7:30 in front of the Galpón del Norte, with a competitive 5 km and a participative 2.5 km at $900 with kit; the kids' race is entered on site.
