name: "3K x el Liceo 3: tres liceos, un compromiso por la convivencia"
date: 2026-10-24
time: "16:30"
sport: run
city: Colonia del Sacramento
venue: Plaza del Reloj (plazoleta Alberto Boerger)
distances: [3K]
organizer: Fenapes, Filial Colonia Departamental
links:
  site: https://ladiaria.com.uy/colonia/articulo/2026/10/este-sabado-se-realizara-una-correcaminata-para-apoyar-construccion-del-liceo-3-de-colonia-del-sacramento/
description:
  es: Segunda edición de esta correcaminata de 3 km, anunciada para el sábado 24 de octubre de 2026 en la Plaza del Reloj de Colonia del Sacramento por Fenapes Filial Colonia, con los centros de estudiantes de los liceos 1 y 2 y el Centro Regional de Profesores. Su objetivo era celebrar que el liceo 3 entró en el presupuesto educativo. Según el anuncio, la inscripción, gratuita, abría a las 14:30 y la largada era a las 16:30, con sorteos y remera para las primeras 100 inscripciones.
  en: Second edition of this 3 km run-walk, announced for Saturday 24 October 2026 at the Plaza del Reloj in Colonia del Sacramento by the teachers' union Fenapes (Colonia branch), with the student centres of liceos 1 and 2 and the Centro Regional de Profesores. Its aim was to celebrate that liceo 3 made it into the education budget. According to the announcement, free registration opened at 14:30 and the start was at 16:30, with prize draws and a T-shirt for the first 100 entries.
