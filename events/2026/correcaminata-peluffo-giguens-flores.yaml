description:
  es: Correcaminata solidaria de 5 km a beneficio de la Fundación Peluffo Giguens, que brinda alojamiento, alimentación y acompañamiento gratis a pacientes oncológicos del interior que viajan a Montevideo para tratarse. Es el domingo 25 de octubre a las 10:00, con largada en el Parque Centenario de Trinidad, para todas las edades; se puede correr, trotar o caminar. Inscripciones en Fondar 555, de 13:30 a 18:00. Organiza la Comisión Departamental Peluffo Giguens de Flores; apoya Grupete Running.
  en: Charity 5 km run and walk for Fundación Peluffo Giguens, which gives free lodging, meals and support to cancer patients from the interior who travel to Montevideo for treatment. It is on Sunday 25 October at 10:00, starting at Parque Centenario in Trinidad, open to all ages; you can run, jog or walk. Registration at Fondar 555, from 13:30 to 18:00. Organized by the Comisión Departamental Peluffo Giguens de Flores, supported by Grupete Running.
