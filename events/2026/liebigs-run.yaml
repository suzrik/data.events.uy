name: Liebigs Run, La Carrera del Patrimonio
date: 2026-10-11
sport: run
city: Fray Bentos
venue: Teatro de Verano, Rambla de Fray Bentos
distances: [10K, 5K]
links:
  instagram: https://www.instagram.com/liebigs_run
  register: https://lolograste.uy/liebigs-run
description:
  es: 5ª edición de la carrera por el sitio Patrimonio de la Humanidad de Fray Bentos, con 5K y 10K, largada a las 10:00 en el Teatro de Verano. Recorre la rambla costanera, el Barrio Histórico Anglo y la Ruta Panorámica. Hay 200 cupos con remera técnica y las inscripciones cierran el 10 de octubre o antes si se agotan.
  en: 5th edition of the race through the Fray Bentos World Heritage site, with 5K and 10K, starting at 10:00 at the Teatro de Verano. It follows the waterfront, the Anglo Historic Quarter and the Panoramic Route. There are 200 places with a technical shirt, and registration closes on 10 October or earlier if they sell out.
