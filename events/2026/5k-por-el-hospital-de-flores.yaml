description:
  es: Correcaminata de 5K a beneficio del Hospital de Flores, en Trinidad, el viernes 20 de noviembre de 2026; los menores largan a las 18:30 y los adultos a las 19:00, desde el hospital. Organiza la Comisión de Apoyo del Hospital de Flores. La inscripción cuesta $250 y se paga en Redpagos, colectivo 88326; con ella se participa también en un sorteo.
  en: 5K run and walk in aid of the Hospital de Flores, in Trinidad, on Friday 20 November 2026; children start at 18:30 and adults at 19:00, from the hospital. Organized by the hospital's support committee, the Comisión de Apoyo del Hospital de Flores. Entry costs $250, paid at Redpagos, collective account 88326, and also enters you in a raffle.
