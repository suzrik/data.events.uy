description:
  es: Edición inaugural de una carrera de 5K y 10K en Sauce de Portezuelo, Maldonado, el domingo 13 de diciembre a las 9:00, con largada en la sede de la Asociación de Fomento y Turismo. La organiza MOOV Uruguay como un movimiento por los 672 km de costa uruguaya y su ecosistema, y se puede correr o caminar. La página de venta en RedTickets es la única del evento; la inscripción se hace ahí.
  en: Inaugural edition of a 5K and 10K race in Sauce de Portezuelo, Maldonado, on Sunday 13 December at 9:00, starting at the Asociación de Fomento y Turismo clubhouse. It is organized by MOOV Uruguay as a movement for Uruguay's 672 km of coastline and its ecosystem, and can be run or walked. The RedTickets sales page is the only page of the event; registration is there.
