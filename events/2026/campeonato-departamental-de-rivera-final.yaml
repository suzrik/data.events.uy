description:
  es: Fecha final del campeonato departamental de ruta de la Liga de Ciclismo Departamental de Rivera (LICIDERI), fiscalizada por la Federación Ciclista Uruguaya, el domingo 20 de diciembre en Rivera, según la página de la FCU; el afiche de la temporada de la liga ponía la última fecha el 6 de diciembre. El lugar y la hora de largada y las distancias no están publicados.
  en: Final round of the departmental road championship of the Liga de Ciclismo Departamental de Rivera (LICIDERI), supervised by the Uruguayan Cycling Federation, on Sunday 20 December in Rivera, according to the FCU page; the league's season poster had put the last round on 6 December. The start place, start time and distances are not published.
