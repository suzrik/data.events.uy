name: MTB Fraile Muerto, 5ª fecha del Campeonato Departamental de Cerro Largo
date: 2026-10-25
time: "10:00"
sport: mtb
city: Fraile Muerto
distances: [45 km, 35 km]
links:
  instagram: https://www.instagram.com/comisiondemtbcerrolargo/
description:
  es: Carrera de MTB en Fraile Muerto, Cerro Largo, el domingo 25 de octubre de 2026, quinta fecha del Campeonato Departamental de MTB de Cerro Largo, a beneficio de la Escuelita de Ciclismo de Fraile Muerto. La concentración fue a las 9:00 y la largada a las 10:00. Hubo 45 km (élite, máster A a C, máster A y B damas, promocional masculino +35) y 35 km (junior, máster D y E, máster C damas, promocionales). La inscripción costó $500; premios en efectivo al podio general.
  en: MTB race in Fraile Muerto, Cerro Largo, on Sunday 25 October 2026, the fifth round of the Cerro Largo departmental MTB championship, in aid of the Fraile Muerto children's cycling school. Riders gathered at 9:00 and started at 10:00. There were 45 km (elite, Master A to C, women's Master A and B, men's promotional over 35) and 35 km (junior, Master D and E, women's Master C, promotional). Entry was $500; cash prizes for the overall podium.
