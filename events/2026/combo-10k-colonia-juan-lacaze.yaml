description:
  es: Etapa 3 de Combo Colonia 2026/2027, campeonato de running por localidades del departamento de Colonia, que se corrió el sábado 3 de octubre en Juan Lacaze con 10K y 5K. La largada fue a las 16:00 en la Plaza de Deportes y el kit se retiraba allí desde las 14:00. Hubo premios para los cinco primeros de la general en damas, caballeros y capacidades diferentes, categorías cada 15 años y medallas. Los resultados están publicados en Cronometraje Instantáneo.
  en: Stage 3 of Combo Colonia 2026/2027, a running championship through towns of the Colonia department, held on Saturday 3 October in Juan Lacaze with 10K and 5K. The start was at 16:00 at the Plaza de Deportes, where kits were handed out from 14:00. The top five overall among women, men and differently-abled runners won prizes, with 15-year age groups and medals. Results are published on Cronometraje Instantáneo.
