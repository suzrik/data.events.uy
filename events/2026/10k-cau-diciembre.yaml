description:
  es: Fecha de la Confederación Atlética del Uruguay en su calendario de ruta 2026, publicado en enero como tentativo, que la llamaba Fecha CAU y Fecha Clausura 10K, con el 5 de diciembre; la agenda de la Intendencia de Montevideo la lista como «10K CAU» el sábado 5. El calendario del Campeonato Clausura que la CAU publicó el 26 de octubre ya no incluye esa fecha; tiene seis carreras y la última es La Gardeliana, el 13 de diciembre en Tacuarembó.
  en: Round of the Confederación Atlética del Uruguay in its 2026 road calendar, published in January as tentative, which called it Fecha CAU and Fecha Clausura 10K, dated 5 December; the Montevideo city agenda lists it as "10K CAU" on Saturday 5. The Clausura championship calendar the CAU posted on 26 October no longer includes this date; it has six races and the last one is La Gardeliana, on 13 December in Tacuarembó.
