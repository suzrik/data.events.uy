name: 10K CAU, diciembre
date: 2026-12
status: tentative
sport: run
city: Montevideo
distances: [10K]
links:
  site: https://confederacionatletica.org/calendario-2026-atletismo-uruguay/
  instagram: https://www.instagram.com/atletismocau/
description:
  es: "Cancelado; no figura en el calendario oficial. La Confederación Atlética del Uruguay la había anunciado en enero, en su calendario de ruta 2026 tentativo, como Fecha Clausura 10K del 5 de diciembre, y la agenda de la Intendencia de Montevideo la lista como «10K CAU» el sábado 5. El calendario del Campeonato Clausura que la CAU publicó el 26 de octubre ya no la incluye: tiene seis carreras y la última es La Gardeliana, el 13 de diciembre en Tacuarembó."
  en: "Cancelled; not in the official calendar. The Confederación Atlética del Uruguay had announced it in January, in its tentative 2026 road calendar, as the Fecha Clausura 10K of 5 December, and the Montevideo city agenda lists it as \"10K CAU\" on Saturday 5. The Clausura calendar the CAU posted on 26 October no longer includes it: it has six races and the last one is La Gardeliana, on 13 December in Tacuarembó."
