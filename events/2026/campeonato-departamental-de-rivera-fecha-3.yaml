name: Campeonato Departamental de Rivera, fecha 3
date: 2026-11-08
sport: road
city: Rivera
entry: license
links:
  site: https://federacionciclista.com.uy/ruta/WDLXMPHWGU/
description:
  es: Tercera fecha del campeonato departamental de ruta de la Liga de Ciclismo Departamental de Rivera (LICIDERI), fiscalizada por la Federación Ciclista Uruguaya, el domingo 8 de noviembre en Rivera. Según la página de la FCU admite las categorías Máster A a E y Promocional; el afiche de la temporada atribuye la organización de esta fecha al Club Atlético Chacarita. El lugar y la hora de largada y las distancias no están publicados.
  en: Third round of the departmental road championship of the Liga de Ciclismo Departamental de Rivera (LICIDERI), supervised by the Uruguayan Cycling Federation, on Sunday 8 November in Rivera. According to the FCU page it admits the Máster A to E and Promocional categories; the season poster credits the organization of this round to Club Atlético Chacarita. The start place, start time and distances are not published.
