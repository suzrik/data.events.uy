name: Recorre Maldonado, etapa Punta del Este
date: 2026-03-14
time: "17:00"
sport: run
city: Punta del Este
venue: Comienzo de la Rambla Circunvalación, Península
distances: [10K, 5K]
organizer: Suca Sports
links:
  site: https://recorremaldonado.com/las-etapas/
  instagram: https://www.instagram.com/sucasports/
description:
  es: Primera etapa de la serie Recorre Maldonado 2026, organizada por SUCA Sports, corrida el sábado 14 de marzo de 2026 a las 17 hs en la Península de Punta del Este, con salida donde comienza la Rambla Circunvalación y recorrido junto al mar, por la zona del puerto y hacia la Playa Brava. Hubo 10K y 5K; SUCA publicó los resultados de las dos distancias.
  en: First stage of the 2026 Recorre Maldonado series, organized by SUCA Sports, held on Saturday 14 March 2026 at 5 pm on the Punta del Este peninsula, starting where the Rambla Circunvalación begins and running along the sea, past the port and towards Playa Brava. There were 10K and 5K races; SUCA published the results of both.
