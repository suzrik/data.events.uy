name: Reto al Mataojo
date: 2026-01-31
sport: trail
city: Pueblo Edén
distances: [15K, 7K]
organizer: Toros Eventos Deportivos
links:
  site: https://www.toroseventosdeportivos.com.uy/carreras/reto-al-mataojo
description:
  es: 11.ª edición de este trail nocturno de Toros Eventos Deportivos en Pueblo Edén, Maldonado, el 31 de enero de 2026, con 7K (170 m de desnivel positivo) y 15K (460 m) por sierra, monte y empedrados, corrido con linterna frontal entre cintas reflectivas. Los cupos se agotaron y el organizador la da como «edición realizada».
  en: 11th edition of this night trail race by Toros Eventos Deportivos in Pueblo Edén, Maldonado, on 31 January 2026, with 7K (170 m of climbing) and 15K (460 m) courses over hills, woodland and cobbled tracks, run with head torches between reflective tapes. It sold out and the organizer lists it as a past edition ("edición realizada").
