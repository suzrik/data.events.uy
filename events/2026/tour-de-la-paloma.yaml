description:
  es: "12.º Tour de La Paloma, carrera máster del calendario regional de la Federación Ciclista Uruguaya (FCU), corrida el sábado 21 y el domingo 22 de marzo de 2026 en La Paloma, Rocha. Era para ciclistas con licencia de las categorías máster A a E y promocional. La FCU la da por finalizada y publicó la clasificación general de máster A a E."
  en: "The 12th Tour de La Paloma, a masters race on the regional calendar of the Uruguayan Cycling Federation (FCU), held on Saturday 21 and Sunday 22 March 2026 in La Paloma, Rocha. It was for licensed riders in the master A to E and promotional categories. The FCU lists it as finished and published the overall classification for master A to E."
