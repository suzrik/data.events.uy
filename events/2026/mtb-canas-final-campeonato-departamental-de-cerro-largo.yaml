name: MTB Cañas, 7ª fecha y final del Campeonato Departamental de Cerro Largo
date: 2026-12-13
sport: mtb
city: Cañas
organizer: Comisión de MTB Cerro Largo
links:
  instagram: https://www.instagram.com/comisiondemtbcerrolargo/
description:
  es: Séptima fecha y final del Campeonato Departamental de MTB de Cerro Largo, el domingo 13 de diciembre de 2026 en Cañas (el organizador escribe «Las Cañas»), Cerro Largo. La Comisión de MTB Cerro Largo lo anunció el 6 de noviembre, tras la sexta fecha en Sarandí de Barceló. La hora, las distancias, el precio y la inscripción todavía no están publicados por el organizador.
  en: Seventh round and final of the Cerro Largo departmental MTB championship, on Sunday 13 December 2026 in Cañas (the organizer writes "Las Cañas"), Cerro Largo. The Comisión de MTB Cerro Largo announced it on 6 November, after the sixth round in Sarandí de Barceló. The start time, distances, price and registration are not published by the organizer yet.
