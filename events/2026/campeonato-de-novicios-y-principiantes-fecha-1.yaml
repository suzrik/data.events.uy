description:
  es: Carrera de ciclismo para principiantes y novicios sin licencia, el sábado 17 de octubre de 14:00 a 15:00 en la Pista Walter Moyano de Maldonado. Es la primera fecha de una serie amateur; el afiche, publicado en el grupo de Facebook «Ciclistas de Ruta & MTB (Uruguay)», no nombra al organizador. Inscripción 400 pesos, seguro del Banco de Seguros del Estado y premios del 1.º al 5.º puesto.
  en: Cycling race for beginners and novices without a license, on Saturday 17 October from 14:00 to 15:00 at the Pista Walter Moyano in Maldonado. It is the first round of an amateur series; the poster, posted in the Facebook group «Ciclistas de Ruta & MTB (Uruguay)», does not name the organizer. Entry 400 pesos, insurance by the Banco de Seguros del Estado, and prizes for places 1 to 5.
