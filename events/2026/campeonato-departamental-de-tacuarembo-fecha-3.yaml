name: Campeonato Departamental de Tacuarembó, fecha 3
date: 2026-10-11
sport: road
city: Tacuarembó
venue: Av. Secco Aparicio, de Laguna de las Lavanderas a Los Molles
entry: license
links:
  site: https://federacionciclista.com.uy/ruta/HFCSS9D7XP/
description:
  es: Tercera fecha del campeonato departamental de ruta de la Federación Ciclista de Tacuarembó, fiscalizado por la Federación Ciclista Uruguaya, cuyo calendario la lista como «Fecha 1». Circuito en la avenida Secco Aparicio. Inscripción el día de la carrera a las 08:00; a las 08:30 largan Montaña, Novicios, Damas y Máster, y a las 10:00 Élite, Junior y Sub-23. El afiche no aclara si los novicios necesitan licencia federativa. Las distancias no están publicadas.
  en: Third round of the departmental road championship of the Federación Ciclista de Tacuarembó, supervised by the Uruguayan Cycling Federation, whose calendar lists it as «Fecha 1». Circuit on Avenida Secco Aparicio. Registration on race day at 08:00; Montaña (MTB), Novicios, Damas and Máster start at 08:30, and Elite, Junior and Under-23 at 10:00. The poster does not say whether novices need a federation licence. Distances are not published.
