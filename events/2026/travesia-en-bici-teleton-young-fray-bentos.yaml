name: Travesía en bici Teletón, Young - Fray Bentos
date: 2026-11-14
sport: road
city: Young
organizer: Cono Team
links:
  site: https://www.rionegro.gub.uy/teleton-2026-rio-negro-se-prepara-para-una-nueva-jornada-de-solidaridad/
description:
  es: Travesía solidaria en bicicleta por la Teletón, organizada por Cono Team, desde Young hasta Fray Bentos pasando por Nuevo Berlín, el sábado 14 de noviembre de 2026, dentro de la jornada de Teletón en Río Negro, según la Intendencia. La hora de salida y la distancia no se publicaron.
  en: A charity bike ride for the Teletón, organized by Cono Team, from Young to Fray Bentos via Nuevo Berlín, on Saturday 14 November 2026, part of the Teletón day in Río Negro, according to the Intendencia. The start time and distance were not published.
