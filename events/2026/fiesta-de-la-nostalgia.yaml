description:
  es: Carrera de ruta por etapas de la Liga de Ciclismo Departamental de Rivera en el calendario regional de la Federación Ciclista Uruguaya, el sábado 22 y el domingo 23 de agosto en Rivera. El programa de la FCU indicaba una etapa de 50 km cada día; la clasificación publicada incluye además un prólogo. Corrieron ciclistas con licencia en élite, sub-23, junior, máster A a D y damas. La FCU la da por finalizada.
  en: A road stage race of the Liga de Ciclismo Departamental de Rivera on the regional calendar of the Uruguayan Cycling Federation, on Saturday 22 and Sunday 23 August in Rivera. The FCU programme listed a 50 km stage each day; the published classification also includes a prologue. Licensed riders raced in the elite, under-23, junior, master A to D and women's categories. The FCU lists it as finished.
