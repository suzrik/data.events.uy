description:
  es: Correcaminata del Centro Somos Iguales, centro interdisciplinario de Tarariras, Colonia, el sábado 21 de noviembre de 2026; hora sin publicar. Hay un recorrido de 4K para adultos y uno de 1K para niños, para personas de todas las edades, con sorteos durante la jornada. Según la convocatoria, el punto de encuentro es el Escenario AFE y la inscripción se hace en la sede del centro o por WhatsApp al 098 886 653, a $300 adultos y $100 niños, o $600 y $400 con la remera del evento.
  en: Run/walk organized by Centro Somos Iguales, an interdisciplinary therapy centre in Tarariras, Colonia, on Saturday 21 November 2026; start time not published. There is a 4K course for adults and a 1K for children, for people of all ages, with raffles during the day. According to the announcement, the meeting point is the Escenario AFE and registration is at the centre or by WhatsApp on 098 886 653, at $300 for adults and $100 for children, or $600 and $400 with the event shirt.
