description:
  es: "54.ª edición de Rutas de América, carrera por etapas para élite y sub-23 masculinos del calendario regional de la Federación Ciclista Uruguaya (FCU), corrida del lunes 16 al domingo 22 de febrero de 2026. Empezó con una contrarreloj individual y siguió por Fray Bentos–Mercedes, José Enrique Rodó–Santa Lucía, Canelones–Cascada del Penitente, Minas–Rocha y La Paloma–Maldonado, con final Maldonado–Montevideo. La FCU la da por finalizada y publicó la clasificación general."
  en: "The 54th Rutas de América, a stage race for men's elite and under-23 riders on the regional calendar of the Uruguayan Cycling Federation (FCU), held from Monday 16 to Sunday 22 February 2026. It opened with an individual time trial and went on through Fray Bentos–Mercedes, José Enrique Rodó–Santa Lucía, Canelones–Cascada del Penitente, Minas–Rocha and La Paloma–Maldonado, finishing Maldonado–Montevideo. The FCU lists it as finished and published the overall classification."
