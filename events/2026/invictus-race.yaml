description:
  es: Quinta edición de Invictus Race, última fecha del Trail Series Uruguay Natural, el domingo 11 de octubre con largada en el Castillo de Piria. Hay Classic 15K, Promocional 7K, Kids y un Vertical de 1.900 m con +335 m de desnivel que sale de la Reserva de Fauna. Incluye pruebas Double Challenger y Team Challenger.
  en: Fifth edition of Invictus Race, the last round of the Trail Series Uruguay Natural, on Sunday 11 October starting at Castillo de Piria. It has a Classic 15K, a Promotional 7K, Kids and a 1,900 m Vertical with +335 m of climbing starting at the Reserva de Fauna. It includes Double Challenger and Team Challenger contests.
