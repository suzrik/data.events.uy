description:
  es: Edición 2026 del gran fondo de la Asociación Española, el domingo 13 de setiembre, con largada a las 8:00 desde la explanada frente al hotel Sofitel, en la rambla de Carrasco. Hubo Gran Fondo de 138 km y Medio Fondo de 60,7 km. El sábado 12 se entregaron los kits y a las 15:30 largó el Gran Fondo Kids, en circuito cerrado. El organizador publicó álbumes de fotos de la edición.
  en: The 2026 edition of the Asociación Española gran fondo, on Sunday 13 September, starting at 8:00 from the esplanade in front of the Sofitel hotel on the Carrasco seafront. There was a 138 km Gran Fondo and a 60.7 km Medio Fondo. Kits were handed out on Saturday 12, and the Gran Fondo Kids started at 15:30 on a closed circuit. The organizer published photo albums of the edition.
