description:
  es: Carrera nocturna de calle en Piriápolis, el sábado 5 de diciembre, con distancias de 5 km y 9,6 km. Largada y llegada en Avda. Piria y Rambla de los Ingleses, frente a Prefectura. Los niños largan a las 19:30 y los adultos a las 20:00. La inscripción cuesta más a medida que se acerca la fecha. Organiza RS Eventos Deportivos.
  en: Night road race in Piriápolis on Saturday 5 December, over 5 km and 9.6 km. Start and finish at Avda. Piria and Rambla de los Ingleses, in front of the Prefectura. Children start at 19:30 and adults at 20:00. The entry fee rises as the date approaches. Organized by RS Eventos Deportivos.
