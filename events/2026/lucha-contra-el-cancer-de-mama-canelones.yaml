description:
  es: Carrera de ruta solidaria de la Federación Canaria de Ciclismo en el mes de la lucha contra el cáncer de mama, corrida el domingo 4 de octubre de 2026 en Canelones. En el calendario de la Federación Ciclista Uruguaya hubo 64 km para Máster A y B, 56 km para Máster C y damas, 24 km para Máster D y 16 km para Máster E. La Federación Canaria publicó los podios; la FCU la da por finalizada.
  en: Charity road race by the Federación Canaria de Ciclismo during Breast Cancer Awareness Month, held on Sunday 4 October 2026 in Canelones. In the Uruguayan Cycling Federation calendar there were 64 km for Masters A and B, 56 km for Masters C and women, 24 km for Masters D and 16 km for Masters E. The Federación Canaria published the podiums; the FCU lists it as finished.
