description:
  es: Cancelado; MTB Rosario anunció el 7 de noviembre que la carrera queda suspendida y que devolverá las inscripciones pagas. Iba a ser una carrera de MTB por Colonia Cosmopolita, con largada a las 16:00 en el Centro Ecuestre El Tornado. Tenía una promocional de 28K y una competitiva de 47K, con premiación del 1.º al 5.º puesto por categoría y carrera kids. Organiza MTB Rosario.
  en: Cancelled; on 7 November MTB Rosario announced that the race is suspended and that paid entries will be refunded. It was to be an MTB race through Colonia Cosmopolita, starting at 16:00 at the Centro Ecuestre El Tornado. It had a 28K promotional course and a 47K competitive one, with prizes for 1st to 5th in each category and a kids race. Organized by MTB Rosario.
