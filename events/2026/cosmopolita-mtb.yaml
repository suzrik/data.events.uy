description:
  es: Carrera de MTB por Colonia Cosmopolita, con largada a las 16:00 en el Centro Ecuestre El Tornado. Hay una promocional de 28K y una competitiva de 47K, con premiación del 1.º al 5.º puesto por categoría y carrera kids. El precio sube por franjas y hay descuento del 5% a grupos. Organiza MTB Rosario.
  en: MTB race through Colonia Cosmopolita, starting at 16:00 at the Centro Ecuestre El Tornado. There is a 28K promotional course and a 47K competitive one, with prizes for 1st to 5th in each category and a kids race. The price rises in stages and groups get a 5% discount. Organized by MTB Rosario.
