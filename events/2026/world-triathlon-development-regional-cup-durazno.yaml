description:
  es: Copa regional de desarrollo de World Triathlon, en distancia sprint. La página de World Triathlon la fija para el 5 de diciembre de 2026 en Durazno, todavía sin lugar ni horario. La edición 2025 fue el 13 de diciembre, con natación en el río Yi desde Playa El Sauzal, ciclismo por el Camping 33 Orientales y la avenida Churchill y pedestrismo dentro del camping; corrieron la Copa de Desarrollo y categorías Youth, con atletas de toda la región.
  en: World Triathlon regional development cup over the sprint distance. The World Triathlon page sets it for 5 December 2026 in Durazno, with no venue or start time yet. The 2025 edition was on 13 December, swimming in the Yi river from Playa El Sauzal, cycling around Camping 33 Orientales and Avenida Churchill and running inside the camping; it had Development Cup and Youth races, with athletes from across the region.
