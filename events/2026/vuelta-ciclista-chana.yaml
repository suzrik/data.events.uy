description:
  es: "35.ª edición de la Vuelta Ciclista Chaná, carrera por etapas del Campeonato Uruguayo de la Federación Ciclista Uruguaya (FCU) para élite y sub-23 masculinos, corrida del jueves 12 al domingo 15 de marzo de 2026 con base en Mercedes, Soriano. Fueron cuatro etapas: Cardona–Mercedes (93 km), Mercedes–Mercedes (163 km), una contrarreloj individual de 25 km en Villa Soriano y Mercedes–Mercedes (146 km). La FCU la da por finalizada y publicó la clasificación."
  en: "The 35th Vuelta Ciclista Chaná, a stage race of the Campeonato Uruguayo of the Uruguayan Cycling Federation (FCU) for men's elite and under-23 riders, held from Thursday 12 to Sunday 15 March 2026, based in Mercedes, Soriano. There were four stages: Cardona–Mercedes (93 km), Mercedes–Mercedes (163 km), a 25 km individual time trial in Villa Soriano and Mercedes–Mercedes (146 km). The FCU lists it as finished and published the classification."
