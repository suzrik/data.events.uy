description:
  es: Quinta edición del Desafío Rosario MTB, corrida el domingo 1 de marzo de 2026 en Rosario, Colonia, con largada a las 9:30 desde la cancha del Club Rosario Atlético. Hubo 50 km competitivos y 30 km promocionales, con categorías por edad; la inscripción costaba de $950 a $1500. Encarrera tuvo la inscripción y publicó los resultados.
  en: Fifth edition of the Desafío Rosario MTB, held on Sunday 1 March 2026 in Rosario, Colonia, starting at 9:30 from the Club Rosario Atlético ground. There were 50 km competitive and 30 km promotional courses, with age categories; entry cost $950 to $1500. Encarrera handled registration and published the results.
