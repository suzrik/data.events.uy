description:
  es: Segunda edición del Desafío Rebollo de Trillo, un trail de fin de año en Rincón de Rebollo, Durazno, el sábado 19 de diciembre, con largada a las 18:30 desde La Chacra Super Fútbol. Son 5 km por trillos y monte nativo, sin desnivel. No hay competencia ni podio; se invita a correr disfrazado y hay sorteos, medalla finisher y show musical después. La inscripción, en lolograste, cuesta $870 individual hasta el 30 de noviembre, con descuento para grupos; cupo de 400.
  en: Second edition of Trillo's Desafío Rebollo, an end-of-year trail run at Rincón de Rebollo, Durazno, on Saturday 19 December, starting at 18:30 from La Chacra Super Fútbol. It is 5 km on trails through native woodland, with no climbing. There is no competition or podium; costumes are encouraged and there are prize draws, a finisher medal and live music afterwards. Registration, on lolograste, costs $870 individually until 30 November, with group discounts; 400 places.
