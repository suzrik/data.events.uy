description:
  es: Segunda edición del Desafío Rebollo de Trillo, un trail de fin de año en Rincón de Rebollo, Durazno, el sábado 19 de diciembre. Es un circuito de 5 km por trillos y monte nativo, con obstáculos naturales. El organizador lo presenta como «una carrera que no es carrera»; no hay ganadores, pero sí sorteos y premios «al equipo que más onda le ponga con los disfraces», y medalla finisher. La hora todavía no se publicó; las inscripciones abren próximamente.
  en: Second edition of Desafío Rebollo by Trillo, an end-of-year trail run at Rincón de Rebollo, Durazno, on Saturday 19 December. It is a 5 km loop on trails through native woodland, with natural obstacles. The organizer calls it "a race that is not a race"; there are no winners, but there are prize draws, prizes for the team that puts the most spirit into its costumes, and a finisher medal. The start time is not published yet; registration opens soon.
