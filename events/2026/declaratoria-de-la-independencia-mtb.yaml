description:
  es: Carrera de mountain bike en Florida, el domingo 13 de setiembre de 2026, organizada por el Club Ciclista San Antonio de Florida como fecha única del calendario de la Federación Ciclista Uruguaya. La federación publicó la lista de federados inscriptos, élite y sub-23 de hombres y élite de mujeres, y la clasificación masculina y femenina.
  en: Mountain bike race in Florida, on Sunday 13 September 2026, organized by Club Ciclista San Antonio de Florida as a one-off date on the calendar of the Uruguayan Cycling Federation. The federation published the list of licensed riders entered, men's elite and under-23 and women's elite, and the men's and women's classifications.
