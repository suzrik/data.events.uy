name: Festival de Ciclismo «Juntos x Valentino»
date: 2026-11-07
time: "10:00"
sport: [road, mtb]
city: Maldonado
venue: Pista de Ciclismo Walter Moyano
organizer: Federación Ciclista de Maldonado
links:
  instagram: https://www.instagram.com/federacionciclistamaldonado/
description:
  es: Festival solidario de ciclismo «Juntos x Valentino», el sábado 7 de noviembre en la Pista de Ciclismo Walter Moyano de Maldonado. El afiche, publicado por la Federación Ciclista de Maldonado, lo presenta como «Carrera oficial» con el logo de la FCU y da este horario. 10:00 MTB, todas las categorías; 11:00 ciclismo recreativo para niños; 12:00 Novatos; 14:00 Máster D y E (50 min); 15:00 Máster C y Damas (60 min); 16:30 Vale todo (80 min). Inscripción 400 pesos; premiación del 50 %; cantina.
  en: Charity cycling festival «Juntos x Valentino», on Saturday 7 November at the Walter Moyano cycling track in Maldonado. The poster, posted by the Federación Ciclista de Maldonado, calls it an «official race» with the FCU logo and gives this schedule. 10:00 MTB, all categories; 11:00 recreational riding for children; 12:00 Novices; 14:00 Masters D and E (50 min); 15:00 Masters C and Women (60 min); 16:30 Vale todo (80 min). Entry 400 pesos; 50% prize payout; canteen.
