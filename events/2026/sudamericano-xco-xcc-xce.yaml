description:
  es: Campeonato Sudamericano de mountain bike en Rocha, del 25 al 27 de setiembre de 2026, con cross country olímpico (XCO), de circuito corto (XCC) y eliminatorio (XCE). Prueba UCI clase 2 organizada por la Federación Ciclista Departamental de Rocha; el calendario de la Federación Ciclista Uruguaya lo da por finalizado, con XCC y XCE élite y XCO élite y junior de hombres y mujeres.
  en: South American mountain bike championship in Rocha, from 25 to 27 September 2026, with Olympic cross-country (XCO), short track (XCC) and eliminator (XCE). A UCI class 2 event organized by the Federación Ciclista Departamental de Rocha; the Uruguayan Cycling Federation calendar marks it as finished, with men's and women's elite XCC and XCE and elite and junior XCO.
