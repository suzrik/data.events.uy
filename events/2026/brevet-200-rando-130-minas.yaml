description:
  es: Brevet de 200 km y Rando de 130 km de Randonneurs Uruguay, con salida y llegada en Minas. Son paseos no competitivos con tiempo límite (13 h 30 min para el brevet de 200 km), a elegir en versión ruta o gravel/MTB. Pasan por lugares como Salto del Penitente y Villa Serrana.
  en: A 200 km brevet and a 130 km rando by Randonneurs Uruguay, starting and finishing in Minas. These are non-competitive rides with a time limit (13 h 30 min for the 200 km brevet), available on a road or gravel/MTB route. They pass places such as Salto del Penitente and Villa Serrana.
