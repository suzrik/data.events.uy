description:
  es: Carrera de ruta del calendario regional de la Federación Ciclista Uruguaya por el aniversario del Club Social y Deportivo El Monte, corrida el martes 25 de agosto en Soca, Canelones. Corrieron ciclistas con licencia en élite, sub-23, junior, máster A a C y damas; hubo clasificación general y femenina. La FCU la da por finalizada y publicó la clasificación.
  en: A road race on the regional calendar of the Uruguayan Cycling Federation for the anniversary of Club Social y Deportivo El Monte, held on Tuesday 25 August in Soca, Canelones. Licensed riders raced in the elite, under-23, junior, master A to C and women's categories; there were overall and women's classifications. The FCU lists it as finished and published the classification.
