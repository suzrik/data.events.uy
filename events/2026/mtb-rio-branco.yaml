description:
  es: Tercera edición de Río Branco MTB, organizada por Guerreros del Pedal con apoyo del Municipio de Río Branco, el domingo 22 de marzo de 2026, segunda fecha del Campeonato Departamental de MTB de Cerro Largo. Largada a las 9:30 desde MamaYinga, con 62 km y 28 km y categorías élite, máster, junior, damas y promocionales. Inscripción de $400 en el lugar. La comisión departamental publicó los resultados el 25 de marzo.
  en: Third edition of Río Branco MTB, organized by Guerreros del Pedal with support from the Municipio de Río Branco, on Sunday 22 March 2026, the second round of the Cerro Largo departmental MTB championship. Start at 9:30 from MamaYinga, over 62 km and 28 km, with elite, master, junior, women's and promotional categories. Entry was $400 on site. The departmental committee published the results on 25 March.
