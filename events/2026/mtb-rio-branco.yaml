name: Río Branco MTB, 2ª fecha del Campeonato Departamental de Cerro Largo
date: 2026-03-22
time: "09:30"
sport: mtb
city: Río Branco
venue: MamaYinga
distances: [62 km, 28 km]
organizer: Guerreros del Pedal
links:
