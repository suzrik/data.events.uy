description:
  es: Carrera de calle de 5 y 10 km en Sarandí del Yí, Durazno, el sábado 12 de diciembre, con largada a las 18:30 en el Parque Elías Regules; los kits se entregan desde las 16:30. El afiche la llama «5K y 10K Profesor Romeo Borreani». Hasta el 15 de noviembre cuesta $600 (5K) o $700 (10K) sin remera y $900 o $1.000 con remera; después, $700 y $800 sin remera. Premios del 1.º al 3.º por categoría y en la general, y medalla finisher. Organiza Sarandí del Yí Running; inscripción en Crono MTB.
  en: A 5 and 10 km road race in Sarandí del Yí, Durazno, on Saturday 12 December, starting at 18:30 at Parque Elías Regules; kits are handed out from 16:30. The poster calls it «5K y 10K Profesor Romeo Borreani». Until 15 November it costs $600 (5K) or $700 (10K) without a T-shirt and $900 or $1,000 with one; after that, $700 and $800 without. Prizes for 1st to 3rd by category and overall, and a finisher medal. Organized by Sarandí del Yí Running; registration on Crono MTB.
