description:
  es: Carrera de calle a beneficio de los Bomberos Voluntarios – Brigada 17, que también la organizan, el sábado 12 de diciembre a las 17:30 en la rambla de Fray Bentos. Hay 10K competitiva, con categorías por edad, y 5K participativa, y premios para los ganadores. La inscripción es por formulario, con pago en un colectivo de Red Pagos. La difunde la plataforma Sportiva.
  en: Road race in aid of the Bomberos Voluntarios – Brigada 17 volunteer firefighters, who also organize it, on Saturday 12 December at 17:30 on the Fray Bentos waterfront. There is a competitive 10K, with age groups, and a participatory 5K, with prizes for the winners. Registration is by form, with payment through a Red Pagos collective account. It is published by the Sportiva platform.
