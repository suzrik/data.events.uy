description:
  es: Ultramaratón de la Asociación Uruguaya de Ultramaratón en la Rambla de Mercedes, Soriano, corrida el domingo 12 de julio de 2026. Los 25 y 50 km largaron a las 7:00 y los 5 y 10 km a las 12:00, todos con premiación general y por categoría. Encarrera publicó los resultados de las cuatro distancias.
  en: Ultramarathon of the Asociación Uruguaya de Ultramaratón on the Mercedes waterfront, Soriano, held on Sunday 12 July 2026. The 25 and 50 km started at 7:00 and the 5 and 10 km at 12:00, all with overall and age-group prizes. Encarrera published the results of all four distances.
