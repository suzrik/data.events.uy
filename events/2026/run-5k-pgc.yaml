description:
  es: Primera carrera de 5 km del Paysandú Golf Club, exclusiva para socios del club. Según la publicación del club del 2 de octubre, es el sábado 24 de octubre a las 9:00, con punto de encuentro en la sede del club, y una carrerita de 800 metros para niños a las 8:45. La inscripción se hace en el polideportivo del club.
  en: First 5 km race of the Paysandú Golf Club, for club members only. According to the club's post of 2 October, it is on Saturday 24 October at 9:00, meeting at the club house, with an 800-metre kids' race at 8:45. Registration is at the club's sports centre.
