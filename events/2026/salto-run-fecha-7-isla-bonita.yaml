description:
  es: Séptima y última fecha del campeonato de running Salto Run, en la ciudad de Salto, con 6 km en Isla Bonita. Hay distancia competitiva y distancia participativa. La hora y el lugar exactos se avisan en las redes antes de cada fecha, y las fechas pueden cambiar por imprevistos. Hay que presentar ficha médica y deslinde firmado.
  en: Seventh and last round of the Salto Run running championship, in the city of Salto, with 6 km at Isla Bonita. There is a competitive and a participative distance. The exact time and place are announced on social media before each round, and dates may change due to unforeseen events. A medical certificate and a signed waiver are required.
