name: Run Trail Be Fit & La India
date: 2026-11-21
sport: trail
city: Florida
venue: Bioparque La India, Camino a La Macana km 3.7
distances: [8K, 4K]
links:
  instagram: https://www.instagram.com/befit_florida_/
description:
  es: Primera edición de un run trail del gimnasio Be Fit de Florida en el Bioparque La India, a 3,7 km de la ciudad por el Camino a La Macana, el sábado 21 de noviembre a las 17:00, con distancias de 4K y 8K. Según la publicación del organizador del 1 de octubre, hay solo 200 cupos y el kit incluye número y remera. Inscripciones por el Instagram del gimnasio.
  en: First edition of a run trail by the Be Fit gym of Florida at the Bioparque La India, 3.7 km from the city along Camino a La Macana, on Saturday 21 November at 17:00, with 4K and 8K distances. According to the organizer's post of 1 October, there are only 200 places and the kit includes a bib and a shirt. Registration through the gym's Instagram.
