description:
  es: Etapa final de la temporada 2026 del Tour Uruguay, de eSport, con Gran Fondo de 110 km y Medio Fondo de 60 km abiertos a quienes se inscriban. El recorrido pasa por Punta Ballena y Las Cumbres, con viento costero. La largada es a las 8:00 y hay una Expo Feria.
  en: Final stage of the 2026 Tour Uruguay season, run by eSport, with a 110 km Gran Fondo and a 60 km Medio Fondo open to anyone who registers. The course includes Punta Ballena and Las Cumbres, with coastal wind. The start is at 8:00 and there is an expo fair.
