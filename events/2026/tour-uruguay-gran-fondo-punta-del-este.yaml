description:
  es: Etapa final de la temporada 2026 del Tour Uruguay, de eSport, con Gran Fondo de 110 km y Medio Fondo de 60 km abiertos a quienes se inscriban; eSport anuncia también un Medio Fondo MTB de la misma distancia, fuera del asfalto, con la misma largada. El recorrido pasa por Punta Ballena y Las Cumbres, con viento costero. La largada es a las 7:00, para todas las categorías; los kits se entregan el sábado 5 de 13:00 a 20:00. Hay una Expo Feria.
  en: Final stage of the 2026 Tour Uruguay season, run by eSport, with a 110 km Gran Fondo and a 60 km Medio Fondo open to anyone who registers; eSport also announces an MTB Medio Fondo of the same distance, off the asphalt, with the same start. The course includes Punta Ballena and Las Cumbres, with coastal wind. The start is at 7:00 for all categories; kits are handed out on Saturday 5th from 13:00 to 20:00. There is an expo fair.
