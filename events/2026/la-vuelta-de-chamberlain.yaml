description:
  es: Carrera de MTB con largada a las 9:00 en el Camping El Sauce, Parque Batlle, Paso de los Toros. Hay una competitiva de 48K y una promocional de 32K, con recorridos nuevos que pasan por parte de la histórica Toros Misión. Organiza Toros Eventos Deportivos. El precio sube el 1 de noviembre.
  en: MTB race starting at 9:00 at Camping El Sauce, Parque Batlle, Paso de los Toros. There is a 48K competitive course and a 32K promotional one, with new routes through part of the historic Toros Misión. Organized by Toros Eventos Deportivos. The price rises on 1 November.
