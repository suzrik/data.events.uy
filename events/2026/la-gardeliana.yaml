description:
  es: Vigésimo cuarta edición de La Gardeliana, carrera de calle en Tacuarembó, el domingo 13 de diciembre de 2026, con 5K y 10K. La organizan la Intendencia Departamental de Tacuarembó y equipos de atletas de Tacuarembó, con aval de la Confederación Atlética del Uruguay; la cronometra Kronos Sports. La inscripción cuesta $650; se paga en Redpagos y se completa en el formulario del perfil. Hora y lugar de largada todavía no publicados.
  en: Twenty-fourth edition of La Gardeliana, a road race in Tacuarembó, on Sunday 13 December 2026, with 5K and 10K. It is organized by the Intendencia Departamental de Tacuarembó and local athletics teams, endorsed by the Confederación Atlética del Uruguay; timing is by Kronos Sports. Entry costs $650; you pay at Redpagos and fill in the form linked from the profile. Start time and venue not published yet.
