description:
  es: Vigésimo cuarta edición de La Gardeliana, carrera de calle en Tacuarembó, el domingo 13 de diciembre de 2026, con 5K y 10K, según el perfil del organizador y su afiche. La cronometra Kronos Sports, según su publicación del 15 de octubre. Hora, lugar de largada y precios todavía no publicados; la inscripción es por mensaje directo al perfil.
  en: Twenty-fourth edition of La Gardeliana, a road race in Tacuarembó, on Sunday 13 December 2026, with 5K and 10K, according to the organizer's profile and poster. Timing is by Kronos Sports, according to its post of 15 October. Start time, venue and prices not published yet; registration is by direct message to the profile.
