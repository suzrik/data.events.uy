description:
  es: 24.ª edición de La Gardeliana, carrera de calle en Tacuarembó, el domingo 13 de diciembre de 2026 a las 7:00, con largada y llegada frente al Teatro Escayola; 5K y 10K (el 21K queda para el año próximo). La organizan la Intendencia de Tacuarembó y equipos locales, con aval de la Confederación Atlética del Uruguay, que pone el 10K como 6.ª fecha de su Campeonato Clausura de ruta. Chip de Kronos, premios en efectivo en el 10K y carrera infantil. Inscripción $650 en Redpagos y formulario.
  en: Twenty-fourth edition of La Gardeliana, a road race in Tacuarembó, on Sunday 13 December 2026 at 7:00, starting and finishing in front of Teatro Escayola; 5K and 10K (the 21K is left for next year). It is organized by the Intendencia de Tacuarembó and local teams, endorsed by the Confederación Atlética del Uruguay, which lists the 10K as round 6 of its Campeonato Clausura road series. Kronos chip timing, cash prizes in the 10K and a kids' race. Entry $650 at Redpagos plus the online form.
