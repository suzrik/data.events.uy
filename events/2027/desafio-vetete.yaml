name: Desafío Vetete
date: 2027-04-11
sport: mtb
city: Gregorio Aznárez
links:
  site: https://federacionciclista.com.uy/mountain-bike/97ZK4NL47B/
description:
  es: Carrera de mountain bike en Gregorio Aznárez, Maldonado, del Club Ciclista Los Magos. La Federación Ciclista Uruguaya la anuncia para el domingo 11 de abril como «Desafío Vetete» y lista solo categorías élite, sub-23, junior y máster. Las distancias y las condiciones de inscripción de 2027 no están publicadas. La edición de 2026 se anunció en Crono MTB como 6.º Desafío Cerro Betete, el 12 de abril en el Parque Gregorio Aznárez, con 35 y 65 km de MTB, 70 km de gravel y categorías por edad.
  en: Mountain bike race in Gregorio Aznárez, Maldonado, organized by Club Ciclista Los Magos. The Uruguayan Cycling Federation lists it for Sunday 11 April as «Desafío Vetete», with elite, under-23, junior and masters categories only. The 2027 distances and registration terms are not published. The 2026 edition was announced on Crono MTB as the 6th Desafío Cerro Betete, on 12 April at Parque Gregorio Aznárez, with 35 and 65 km MTB courses, a 70 km gravel course and age-group categories.
