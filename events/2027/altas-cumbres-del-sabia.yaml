description:
  es: Carrera de mountain bike por etapas de tres días (3 Days Marathon) entre sierras y olivares de Lavalleja, con base en el establecimiento olivícola Sabiá, sobre la Ruta 12 cerca de Minas. Viernes 19, prólogo de 10 km con 400 m de desnivel; sábado 20, 50 km y 1000 m; domingo 21, 54 km y 1300 m. El domingo también hay una One Day Bike Race de 54 o 42 km. Edad mínima 18 años. La inscripción es por RedTickets, donde figura Punto de Control como productor.
  en: Three-day mountain bike stage race (3 Days Marathon) among the hills and olive groves of Lavalleja, based at the Sabiá olive estate on Route 12 near Minas. Friday 19, a 10 km prologue with 400 m of climbing; Saturday 20, 50 km and 1,000 m; Sunday 21, 54 km and 1,300 m. On Sunday there is also a One Day Bike Race of 54 or 42 km. Minimum age 18. Registration is through RedTickets, where Punto de Control is listed as the producer.
