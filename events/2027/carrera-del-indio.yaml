description:
  es: Tercera edición de esta carrera recreativa de 5K en Kiyú, San José, el sábado 20 de febrero de 2027 a las 17:00, frente a la Prefectura, por barrancas y playa. La organizan el parador El Quincho y Moving, con apoyo de la Intendencia de San José. La inscripción cuesta $950 con remera y $700 sin remera, en RedTickets. El organizador no tiene sitio ni cuenta propia enlazada; los datos salen de la página y el afiche de RedTickets.
  en: Third edition of this recreational 5K in Kiyú, San José, on Saturday 20 February 2027 at 17:00, in front of the Prefectura, over the cliffs and the beach. It is organized by the El Quincho beach bar and Moving, with support from the Intendencia de San José. Entry costs $950 with a shirt and $700 without, on RedTickets. The organizer has no site or account of its own linked; the details come from the RedTickets page and poster.
