description:
  es: Trail por el balneario Kiyú, en San José, el domingo 28 de noviembre de 2027, según el calendario 2027 de trail running de La Sierra Eventos Deportivos. La hora, las distancias y la inscripción todavía no están publicadas; la edición 2026 es el 29 de noviembre con 5K, 10K y 15K.
  en: Trail race at Kiyú beach resort, in San José, on Sunday 28 November 2027, per the 2027 trail running calendar of La Sierra Eventos Deportivos. Time, distances and registration are not published yet; the 2026 edition is on 29 November with 5K, 10K and 15K.
