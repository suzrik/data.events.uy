description:
  es: Segunda etapa del Campeonato de Verano 2027 de Deporte Urbano, el sábado 20 de febrero en Costa Azul, Canelones, con 3 y 6 km sobre arena. El campeonato tiene tres etapas, La Floresta el 16 de enero, Costa Azul el 20 de febrero y Atlántida el 20 de marzo, según el anuncio del organizador del 24 de noviembre de 2026; horario, lugar de largada y precio todavía no se publicaron.
  en: Second stage of Deporte Urbano's 2027 Summer Championship, on Saturday 20 February in Costa Azul, Canelones, with 3 and 6 km on sand. The championship has three stages, La Floresta on 16 January, Costa Azul on 20 February and Atlántida on 20 March, according to the organizer's announcement of 24 November 2026; start time, start point and price are not published yet.
