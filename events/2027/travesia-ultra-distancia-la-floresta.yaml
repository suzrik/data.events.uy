description:
  es: Travesía de natación en aguas abiertas de 6 km y 12 km, ambas competitivas, en La Floresta, Canelones, el sábado 6 de febrero de 2027. Larga primero la de 12 km y enseguida la de 6 km; la boya de seguridad es obligatoria y el tiempo límite es de 5 horas. Quien nade con traje o aletas recibe medalla pero no entra en la clasificación. Cuesta $1200 hasta el 31 de diciembre y $1500 después. Horario y lugar exacto todavía no se publicaron.
  en: Open-water swim of 6 km and 12 km, both competitive, in La Floresta, Canelones, on Saturday 6 February 2027. The 12 km starts first and the 6 km right after; a safety buoy is compulsory and the time limit is 5 hours. Swimmers in a wetsuit or fins get a medal but are not ranked. It costs $1,200 until 31 December and $1,500 after. Start time and exact venue are not published yet.
