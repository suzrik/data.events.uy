description:
  es: Carrera de 5 y 10 km en la Unidad Agroalimentaria Metropolitana, organizada por la UAM y la Agrupación de Atletas del Uruguay; en 2025 fue la 12ª etapa del calendario de la agrupación. La edición 2027 todavía no fue anunciada; la última, según el calendario de la Intendencia de Montevideo, fue el 2 de agosto de 2026.
  en: A 5 and 10 km race at the Unidad Agroalimentaria Metropolitana, organized by the UAM and the Agrupación de Atletas del Uruguay; in 2025 it was the 12th stage of the association's calendar. The 2027 edition has not been announced yet; the latest one, according to the Montevideo city calendar, was held on 2 August 2026.
