description:
  es: Carrera de trail por etapas de Mileu Aventura Todo Terreno, el sábado 30 y el domingo 31 de octubre de 2027, según el calendario 2027 que el organizador publicó el 31 de octubre de 2026. El lugar de 2027 no está anunciado; la ciudad se toma de la edición 2026, corrida el 24 y 25 de octubre en Punta Ballena, el Arboretum Lussich y el Cerro Pan de Azúcar. Etapas, distancias e inscripción no están publicadas.
  en: Stage trail race by Mileu Aventura Todo Terreno, on Saturday 30 and Sunday 31 October 2027, according to the 2027 calendar the organizer published on 31 October 2026. The 2027 venue is not announced; the town is taken from the 2026 edition, run on 24 and 25 October in Punta Ballena, the Arboretum Lussich and Cerro Pan de Azúcar. Stages, distances and registration are not published.
