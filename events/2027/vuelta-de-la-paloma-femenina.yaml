description:
  es: Primera edición de esta carrera de ruta de tres días en La Paloma, Rocha, del viernes 12 al domingo 14 de marzo, organizada por el Club Deportivo y Social La Aguada; figura en el calendario regional de la Federación Ciclista Uruguaya. La página de la federación lista las categorías élite, sub-23 y junior de mujeres y también Máster A a E de hombres y Promocional, todas con licencia de la federación. Las etapas, las distancias y la inscripción todavía no están publicadas.
  en: First edition of this three-day road race in La Paloma, Rocha, from Friday 12 to Sunday 14 March, organized by Club Deportivo y Social La Aguada; it is on the regional calendar of the Uruguayan Cycling Federation. The federation's page lists the women's elite, under-23 and junior categories and also the men's Master A to E and Promocional, all with a federation licence. The stages, distances and registration are not published yet.
