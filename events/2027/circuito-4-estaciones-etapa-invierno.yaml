description:
  es: Etapa Invierno del Circuito de las 4 Estaciones 2027, serie de carreras de calle de 7K de La Sierra Eventos Deportivos, el sábado 19 de junio de 2027. El calendario que publicó el organizador el 10 de setiembre de 2026 dice solo «San José», sin el lugar exacto; la hora y la inscripción todavía no se publicaron.
  en: The winter stage (Invierno) of the 2027 Circuito de las 4 Estaciones, a 7K street race series by La Sierra Eventos Deportivos, on Saturday 19 June 2027. The calendar the organizer published on 10 September 2026 says only «San José», with no exact venue; start time and registration are not published yet.
