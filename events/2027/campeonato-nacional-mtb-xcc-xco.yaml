name: Campeonato Nacional de MTB (XCC y XCO)
date: 2027-07
status: tentative
sport: bike
city: Rocha
entry: elite
links:
  site: https://federacionciclista.com.uy/rocha-sera-sede-del-campeonato-nacional-de-xcc-y-xco/
description:
  es: Campeonato nacional de mountain bike de la Federación Ciclista Uruguaya, con short track (XCC) y cross country olímpico (XCO). La edición 2027 todavía no fue anunciada; las de 2025 y 2026 se corrieron en julio en el predio La Encantada, sobre la ruta 9, km 220, en Rocha. En 2025 hubo categorías desde infantiles hasta máster.
  en: National mountain bike championship of the Uruguayan Cycling Federation, with short track (XCC) and Olympic cross-country (XCO). The 2027 edition has not been announced yet; the 2025 and 2026 editions were held in July at La Encantada, on Route 9, km 220, in Rocha. In 2025 there were categories from children to masters.
