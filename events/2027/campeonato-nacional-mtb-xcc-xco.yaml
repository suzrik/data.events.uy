name: Campeonato Nacional de MTB (XCC y XCO)
date: 2027-07
status: tentative
sport: bike
city: Rocha
entry: elite
links:
  site: https://federacionciclista.com.uy/rocha-sera-sede-del-campeonato-nacional-de-xcc-y-xco/
description:
  es: Campeonato nacional de mountain bike de la Federación Ciclista Uruguaya, con short track (XCC) y cross country olímpico (XCO). La edición 2027 todavía no fue anunciada; las dos últimas se corrieron en julio en el predio La Encantada, sobre la ruta 9, km 220, en Rocha. Corren ciclistas federados.
  en: National mountain bike championship of the Uruguayan Cycling Federation, with short track (XCC) and Olympic cross-country (XCO). The 2027 edition has not been announced yet; the last two were held in July at La Encantada, on Route 9, km 220, in Rocha. Federated riders race.
