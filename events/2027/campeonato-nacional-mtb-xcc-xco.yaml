name: Campeonato Nacional de MTB (XCC y XCO)
date: 2027-07
status: tentative
sport: mtb
city: Rocha
entry: license
links:
  site: https://federacionciclista.com.uy/rocha-sera-sede-del-campeonato-nacional-de-xcc-y-xco/
description:
  es: Campeonato nacional de mountain bike de la Federación Ciclista Uruguaya; en 2026 tuvo short track (XCC) y cross country olímpico (XCO). La edición 2027 todavía no fue anunciada. La de 2025 se corrió el 20 de julio en el predio La Encantada, sobre la ruta 9, km 220, en Rocha; la de 2026 estaba prevista allí para el 18 y 19 de julio, pero el XCO se suspendió dos veces por mal tiempo y el calendario de la FCU lo tiene el 17 de octubre de 2026. En 2025 hubo categorías desde infantiles hasta máster.
  en: National mountain bike championship of the Uruguayan Cycling Federation; in 2026 it had short track (XCC) and Olympic cross-country (XCO). The 2027 edition has not been announced yet. The 2025 edition was held on 20 July at La Encantada, on Route 9, km 220, in Rocha; the 2026 one was planned there for 18 and 19 July, but its XCO was suspended twice because of the weather and the FCU calendar has it on 17 October 2026. In 2025 there were categories from children to masters.
