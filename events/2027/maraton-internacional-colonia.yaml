name: Maratón Internacional Colonia del Sacramento
date: 2027-03-14
sport: run
city: Colonia del Sacramento
venue: Frontón del Real de San Carlos, Av. Mihanovich y Alfredo Zitarrosa
distances: [42K, 15K, 8K]
links:
  site: https://solocarreras.com/maraton-internacional-colonia-del-sacramento-uruguay/
  instagram: https://www.instagram.com/solocarreras.latam/
  register: https://cronometrajeinstantaneo.com/inscripciones/maraton-interncional-de-colinia
description:
  es: Maratón de 42,195 km en Colonia del Sacramento, el domingo 14 de marzo de 2027, con largada y llegada en el Frontón del Real de San Carlos. También hay 15K y 8K. Organiza Solo Carreras. Las horas de largada se anunciarán 30 días antes; los kits se retiran el sábado 13 y no se entregan el día de la carrera. Edad mínima de 18 años para 42K y 15K y de 14 para 8K; hay que enviar un certificado médico. La inscripción se hace en la plataforma de cronometraje; el organizador aún no publica precios.
  en: A 42.195 km marathon in Colonia del Sacramento, on Sunday 14 March 2027, starting and finishing at the Frontón of Real de San Carlos. There are also 15K and 8K races. Organized by Solo Carreras. Start times will be announced 30 days ahead; kits are collected on Saturday 13 and are not handed out on race day. The minimum age is 18 for the 42K and 15K and 14 for the 8K, and a medical certificate must be sent in. Registration is on the timing platform; the organizer has not published prices yet.
