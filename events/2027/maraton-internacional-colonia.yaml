description:
  es: Maratón de 42,195 km en Colonia del Sacramento, el domingo 14 de marzo de 2027, con largada y llegada en el Frontón del Real de San Carlos. También hay 15K y 8K. Organiza Solo Carreras. El 42K larga a las 7:00 y el 15K y el 8K a las 9:00; los kits se retiran el sábado 13 y no se entregan el día de la carrera. Hay que enviar un certificado médico. En RedTickets la inscripción cuesta $2.400 (42K) y $1.900 (15K y 8K).
  en: A 42.195 km marathon in Colonia del Sacramento, on Sunday 14 March 2027, starting and finishing at the Frontón of Real de San Carlos. There are also 15K and 8K races. Organized by Solo Carreras. The 42K starts at 7:00 and the 15K and 8K at 9:00; kits are collected on Saturday 13 and are not handed out on race day. A medical certificate must be sent in. On RedTickets, entry costs $2,400 (42K) and $1,900 (15K and 8K).
