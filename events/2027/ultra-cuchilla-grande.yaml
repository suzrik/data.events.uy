description:
  es: Ultra trail sin fines de lucro en Santa Clara de Olimar, Treinta y Tres, el 27 y 28 de febrero de 2027; organiza el Municipio de Santa Clara. Los 115 km se corren en dos etapas, sábado y domingo, con noche en Arévalo (Cerro Largo). Los 54, 36 y 10 km son el domingo, con largadas a las 4:00, 5:00 y 8:30. El terreno mezcla asfalto, tierra, pasto, barro, cañadas y monte. Cupos limitados; la inscripción se compra en RedTickets y luego se completa el formulario del sitio. El cronograma puede cambiar.
  en: Non-profit ultra trail in Santa Clara de Olimar, Treinta y Tres, on 27 and 28 February 2027; organized by the Municipio de Santa Clara. The 115 km is run in two stages, Saturday and Sunday, with a night in Arévalo (Cerro Largo). The 54, 36 and 10 km are on Sunday, starting at 4:00, 5:00 and 8:30. The terrain mixes asphalt, dirt, grass, mud, streams and woodland. Places are limited; you buy the entry on RedTickets and then fill in the form on the site. The schedule may change.
