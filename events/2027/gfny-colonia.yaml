description:
  es: Carrera de la serie GFNY en Colonia del Sacramento. La edición 2027 todavía no fue anunciada; la de 2026 tenía fecha el 6 de setiembre, con distancia larga competitiva de 125 km (900 m de ascenso) y media de 87 km (670 m). El recorrido usa la ruta 21 y la subida del río San Juan.
  en: Race of the GFNY series in Colonia del Sacramento. The 2027 edition has not been announced yet; the 2026 one was scheduled for 6 September, with a competitive 125 km long course (900 m of climbing) and an 87 km medium course (670 m). The route uses Route 21 and the Río San Juan climb.
