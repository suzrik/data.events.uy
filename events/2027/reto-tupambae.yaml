name: Reto Tupambaé
date: 2027-02-27
sport: trail
city: Piriápolis
organizer: Desnivel Eventos Deportivos
links:
  instagram: https://www.instagram.com/p/Dep_U3ER6MX/
description:
  es: Trail con el que Desnivel Eventos Deportivos abre su calendario 2027, el sábado 27 de febrero. El organizador todavía no publicó el lugar; la ciudad es provisoria y se toma por el Ecoparque Tupambaé de Piriápolis, por el nombre de la carrera. Las distancias, la hora y la inscripción tampoco figuran en el afiche.
  en: Trail race that opens the 2027 calendar of Desnivel Eventos Deportivos, on Saturday 27 February. The organizer has not published the venue yet; the town is provisional, taken from the Ecoparque Tupambaé in Piriápolis because of the race's name. Distances, time and registration are not on the poster either.
