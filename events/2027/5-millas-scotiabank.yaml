description:
  es: Carrera de verano de Suca Sports, de 5 millas (8 km). El calendario de Suca Sports la ubica en enero de 2027 en Punta del Este, sin día confirmado; antes figuraba el domingo 3 de enero. La inscripción todavía no está abierta y el sitio de la carrera sigue mostrando la edición 2026, que se corrió el 1 de febrero desde la parada 36½ de Playa Brava, en la desembocadura de La Barra, mitad por asfalto y mitad por la playa, desde los 15 años. La hora y el recorrido de 2027 no están publicados.
  en: Summer race by Suca Sports over 5 miles (8 km). The Suca Sports calendar places it in January 2027 in Punta del Este, with no confirmed day; it previously showed Sunday 3 January. Registration is not open yet and the race site still shows the 2026 edition, which was run on 1 February from stop 36½ of Playa Brava, at the river mouth in La Barra, half on asphalt and half on the beach, for runners aged 15 and over. The start time and course for 2027 are not published.
