description:
  es: Primera etapa del Campeonato de Verano 2027 de Deporte Urbano, el sábado 16 de enero en La Floresta, Canelones, con 4 y 7 km sobre calle. El campeonato tiene tres etapas, La Floresta el 16 de enero, Costa Azul el 20 de febrero y Atlántida el 20 de marzo, según el anuncio del organizador del 24 de noviembre de 2026; horario, lugar de largada y precio todavía no se publicaron.
  en: First stage of Deporte Urbano's 2027 Summer Championship, on Saturday 16 January in La Floresta, Canelones, with 4 and 7 km on the road. The championship has three stages, La Floresta on 16 January, Costa Azul on 20 February and Atlántida on 20 March, according to the organizer's announcement of 24 November 2026; start time, start point and price are not published yet.
