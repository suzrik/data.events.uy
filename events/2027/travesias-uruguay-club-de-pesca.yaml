description:
  es: Fecha de la Travesías Uruguay Open Water Series 2027, temporada de aguas abiertas que va de diciembre a marzo, el domingo 14 de febrero de 2027, en el Club de Pesca de la parada 3, Punta del Este (el calendario de la Federación Uruguaya de Natación todavía dice 13 de febrero). La hora de largada, las distancias y la inscripción todavía no están publicadas.
  en: A date of the Travesías Uruguay Open Water Series 2027, an open-water season running from December to March, on Sunday 14 February 2027, at the Club de Pesca at stop 3, Punta del Este (the Uruguayan Swimming Federation calendar still says 13 February). The start time, distances and registration are not published yet.
