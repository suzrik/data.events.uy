description:
  es: Única fecha uruguaya del Circuito Binacional de Triatlón Jeep 2026/2027, el sábado 20 de febrero de 2027 en Salto. Es un sprint de 750 m de natación, 20 km de bici y 5 km a pie. El circuito lo organiza la Asociación Concordiense de Pruebas Combinadas (ACPC), de Concordia, y sus otras cinco fechas son en Entre Ríos, Argentina. Lugar exacto, horario e inscripción no anunciados todavía.
  en: The only Uruguayan date of the 2026/2027 Circuito Binacional de Triatlón Jeep, on Saturday 20 February 2027 in Salto. It is a sprint of 750 m swim, 20 km bike and 5 km run. The circuit is organized by the Asociación Concordiense de Pruebas Combinadas (ACPC), from Concordia, and its other five dates are in Entre Ríos, Argentina. Exact venue, times and registration not announced yet.
