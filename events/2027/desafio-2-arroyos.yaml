description:
  es: Carrera costera entre los arroyos Carrasco y Pando. Organiza Halcones Uruguay. La 12.ª edición es el domingo 28 de febrero de 2027, con 5K, 10K y 19K, según el afiche que el organizador publicó en Instagram el 6 de octubre de 2026; es solidario, con Fundación Pérez Scremini y EMUR. Hay tres largadas, la de 19K a las 6:40 en Rambla Costanera y Niteroi (bajada 4), la de 10K a las 7:30 en la bajada 22 y la de 5K a las 8:00 en la bajada 33. Inscripción en street.com.uy.
  en: Coastal race between the Carrasco and Pando streams. Organized by Halcones Uruguay. The 12th edition is on Sunday 28 February 2027, with 5K, 10K and 19K, according to the poster the organizer posted on Instagram on 6 October 2026; a charity race, with Fundación Pérez Scremini and EMUR. There are three starts, the 19K at 6:40 at Rambla Costanera and Niteroi (ramp 4), the 10K at 7:30 at ramp 22 and the 5K at 8:00 at ramp 33. Registration on street.com.uy.
