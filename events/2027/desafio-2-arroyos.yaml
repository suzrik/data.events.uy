description:
  es: Carrera costera entre los arroyos Carrasco y Pando, con largadas en distintos puntos. Organiza Halcones Uruguay. La edición 2027 todavía no fue anunciada; la de 2026 se hizo el domingo 22 de febrero, con 19K, 10K y 5K.
  en: Coastal race between the Carrasco and Pando streams, with starts at different points. Organized by Halcones Uruguay. The 2027 edition has not been announced yet; the 2026 one was held on Sunday 22 February, with 19K, 10K and 5K.
