name: Desafío 2 Arroyos
date: 2027-02-28
sport: trail
city: Ciudad de la Costa
distances: [19K, 10K, 5K]
organizer: Halcones Uruguay
links:
  site: https://desafio2arroyos.com/
  instagram: https://instagram.com/desafio2arroyos
description:
  es: Carrera costera entre los arroyos Carrasco y Pando, con largadas en distintos puntos. Organiza Halcones Uruguay. La 12.ª edición es el domingo 28 de febrero de 2027, con 5K, 10K y 19K, según el afiche que el organizador publicó en Instagram el 6 de octubre de 2026; es un desafío solidario, con Fundación Pérez Scremini y EMUR. El afiche no da horarios, lugares de largada ni inscripción.
  en: Coastal race between the Carrasco and Pando streams, with starts at different points. Organized by Halcones Uruguay. The 12th edition is on Sunday 28 February 2027, with 5K, 10K and 19K, according to the poster the organizer posted on Instagram on 6 October 2026; it is a charity race, with Fundación Pérez Scremini and EMUR. The poster gives no start times, start points or registration.
