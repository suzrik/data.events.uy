description:
  es: Carrera de trail por los médanos del Calabrés, en Colonia del Sacramento, organizada por Colonia Aventura Corre (CAC). La edición 2026 se corrió el domingo 5 de julio como segunda fecha de la Triple Corona CAC, con 6K, 12K y 21K. La de 2027 aún no fue anunciada; el mes es una estimación a partir de 2026. Solo Carreras publica en su ciclo Colonia Run un Desafío Colonia Médanos del Calabrés de 6, 11 y 21 km, del casco histórico al complejo +Colonia; su página dice «junio 2026», sin fecha nueva.
  en: Trail race over the Calabrés dunes, in Colonia del Sacramento, organized by Colonia Aventura Corre (CAC). The 2026 edition was run on Sunday 5 July as the second round of the CAC Triple Corona, over 6K, 12K and 21K. The 2027 one is not announced yet; the month is an estimate based on 2026. Solo Carreras publishes in its Colonia Run series a Desafío Colonia Médanos del Calabrés of 6, 11 and 21 km, from the historic quarter to the +Colonia complex; its page says "June 2026" and gives no new date.
