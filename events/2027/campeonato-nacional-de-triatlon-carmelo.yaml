  es: Fecha del Campeonato Nacional de Triatlón 2026-2027 de la Unión de Triatlón del Uruguay, el sábado 13 de febrero en Carmelo, Colonia. Según el calendario de la Unión tiene modalidades Sprint, Promocional y Olímpico. Los no federados pueden correr con un permiso por el día, pero solo los federados suman puntos para el ranking. Los detalles todavía no están publicados y la página no muestra el lugar de largada. La Unión remite a sus redes sociales.
  en: A date of the 2026-2027 Campeonato Nacional de Triatlón of the Unión de Triatlón del Uruguay, on Saturday 13 February in Carmelo, Colonia. According to the union's calendar it has Sprint, Promocional and Olympic formats. Non-federated athletes may race on a one-day permit, but only federated ones score ranking points. Details are not published yet and the page does not show the start venue. The union refers to its social media.
