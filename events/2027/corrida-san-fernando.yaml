name: Corrida San Fernando
date: 2027-01-07
status: tentative
sport: run
city: Maldonado
venue: Parada 17 de la Rambla Claudio Williman, Playa Mansa
distances: [5K, 10K]
links:
  site: https://maldonado.gub.uy/san-fernando
description:
  es: Clásica corrida de verano organizada por la Intendencia de Maldonado junto a Suca Sports, con 5K participativa y 10K competitiva, de tarde y noche, y llegada frente a la Intendencia. El calendario de Suca Sports la fija para el jueves 7 de enero de 2027, el mismo día del mes que en 2026. La Intendencia todavía no la anunció y el sitio de la carrera está en mantenimiento. También hay una prueba gratuita para niños, la San Fernandito.
  en: Classic summer race organized by the Intendencia de Maldonado together with Suca Sports, with a participatory 5K and a competitive 10K, in the evening, finishing in front of the Intendencia. The Suca Sports calendar sets it for Thursday 7 January 2027, the same day of the month as in 2026. The Intendencia has not announced it yet and the race site is in maintenance mode. There is also a free children's race, the San Fernandito.
