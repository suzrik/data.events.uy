name: Corrida San Fernando
date: 2027-01-07
time: "19:30"
sport: run
city: Maldonado
venue: Parada 17 de la Rambla Claudio Williman, Playa Mansa
distances: [5K, 10K]
organizer: Intendencia de Maldonado y Suca Sports
links:
  site: https://corridadesanfernando.com/
  instagram: https://www.instagram.com/sucasports/
  register: https://corridadesanfernando.com/inscripciones-2/
description:
  es: Clásica corrida nocturna de Maldonado, 53.ª edición, el jueves 7 de enero de 2027. La 5K participativa larga a las 19:30 y la 10K competitiva a las 21:00, las dos desde la parada 17 de Playa Mansa, con llegada en la avenida Acuña de Figueroa frente a la Intendencia. El cupo es de 5500 corredores, con remera, número con chip y medalla finisher. También hay una prueba para niños, la San Fernandito.
  en: Classic evening race in Maldonado, 53rd edition, on Thursday 7 January 2027. The participatory 5K starts at 19:30 and the competitive 10K at 21:00, both from stop 17 on Playa Mansa, finishing on Avenida Acuña de Figueroa in front of the Intendencia. The field is capped at 5,500 runners, with a shirt, a chip bib and a finisher medal. There is also a children's race, the San Fernandito.
