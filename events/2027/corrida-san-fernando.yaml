name: Corrida San Fernando
date: 2027-01
status: tentative
sport: run
city: Maldonado
venue: Parada 17 de la Rambla Claudio Williman, Playa Mansa
distances: [5K, 10K]
links:
  site: https://maldonado.gub.uy/san-fernando
description:
  es: Clásica corrida de verano organizada por la Intendencia de Maldonado junto a Suca Sports, con 5K participativa y 10K competitiva, de tarde y noche, y llegada frente a la Intendencia. La edición 2027 todavía no fue anunciada; la de 2026 se hizo el 7 de enero. También hay una prueba gratuita para niños, la San Fernandito.
  en: Classic summer race organized by the Intendencia de Maldonado together with Suca Sports, with a participatory 5K and a competitive 10K, in the evening, finishing in front of the Intendencia. The 2027 edition has not been announced yet; the 2026 one was held on 7 January. There is also a free children's race, the San Fernandito.
