name: MTB en Parejas Kiyú
date: 2027-02-28
sport: bike
city: Kiyú
venue: Club Estrella del Sur
distances: [38 km, 12 km]
links:
  site: https://cronomtb.uy/12o-edicion-mtb-en-parejas-kiyu-2027/
  register: https://cronomtb.uy/12o-edicion-mtb-en-parejas-kiyu-2027/
description:
  es: Duodécima edición de esta carrera de mountain bike en parejas en Kiyú, San José, con largada a las 9:00 desde el Club Estrella del Sur. Los 38 km son para duplas de damas, caballeros, mixtas y padre-hijo; la categoría sale de la suma de las edades de la pareja. Hay 12 km para menores de 12 años acompañados por un mayor responsable. Los kits se entregan el día de la carrera desde las 7:00 y hay medalla finisher para todos. La inscripción es por Crono MTB.
  en: Twelfth edition of this mountain bike race for pairs in Kiyú, San José, starting at 9:00 from Club Estrella del Sur. The 38 km course is for women's, men's, mixed and parent-child pairs; the category is set by the combined age of the pair. There is a 12 km course for children under 12 riding with a responsible adult. Race kits are handed out on race day from 7:00 and everyone gets a finisher medal. Registration is through Crono MTB.
