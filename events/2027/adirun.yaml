description:
  es: Carrera de calle de La Sierra Eventos Deportivos por la rambla de Montevideo, con largada y llegada en el Dique Mauá y distancias de 5 K y 10 K. La edición 2027 todavía no fue anunciada; la de 2026 fue el 7 de junio, a las 8 de la mañana, con 1800 competidores.
  en: Road race by La Sierra Eventos Deportivos along the Montevideo waterfront, starting and finishing at Dique Mauá, over 5 K and 10 K. The 2027 edition has not been announced yet; the 2026 one was held on 7 June, at 8 am, with 1800 competitors.
