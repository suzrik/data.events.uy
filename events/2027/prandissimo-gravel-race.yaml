name: Prandissimo Gravel Race
date: 2027-02-28
sport: bike
city: Punta del Este
venue: Prandissimo Café Ciclista, La Barra
distances: [120 km, 60 km]
links:
  site: https://www.prandissimo.com/prandissimo-gravel-race-2027
  register: https://redtickets.uy/evento/PRANDISSIMO-GRAVEL-RACE-2027/33593/
description:
  es: Cuarta edición de una carrera de gravel con recorridos de 120 km y 60 km por viñedos, chacras y rutas costeras. Se recomienda bicicleta gravel, también se admite mountain bike con cubiertas de al menos 35 mm; no se permiten bicicletas asistidas. La largada es a las 7:30.
  en: Fourth edition of a gravel race with 120 km and 60 km courses through vineyards, farmland and coastal roads. A gravel bike is recommended, and mountain bikes with tyres of at least 35 mm are also allowed; e-bikes are not permitted. The start is at 7:30.
