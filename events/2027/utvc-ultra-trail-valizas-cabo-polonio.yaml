name: UTVC - Ultra Trail Valizas Cabo Polonio
date: 2027-01-24
time: "04:00"
sport: trail
city: Valizas
venue: Valizas Hostel Boutique & Suites
distances: [48K, 23K, 14K]
links:
  instagram: https://www.instagram.com/ultra_trail_valizas_cabo
description:
  es: Trail por arena, dunas y senderos costeros, con largada y llegada en el Valizas Hostel Boutique & Suites, en Valizas, Rocha, el domingo 24 de enero de 2027. Hay 48 km individual y en duplas (largada a las 4:00), 23 km (6:00) y 14 km (7:00), y además un trekking de 6 km a las 8:00. Además del podio hay menciones especiales al grupo más numeroso, al último en llegar y al atleta de mayor edad. Horarios publicados por la organización en Instagram en octubre de 2026.
  en: Trail race over sand, dunes and coastal paths, starting and finishing at the Valizas Hostel Boutique & Suites in Valizas, Rocha, on Sunday 24 January 2027. There is a 48 km race, solo or in pairs (start at 4:00), a 23 km (6:00) and a 14 km (7:00), plus a 6 km trek at 8:00. Besides the podium there are special awards for the largest group, the last finisher and the oldest athlete. Start times posted by the organizers on Instagram in October 2026.
