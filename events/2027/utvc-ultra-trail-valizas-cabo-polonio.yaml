description:
  es: Trail con largada y llegada en Valizas, Rocha, por arena, dunas y senderos costeros. Hay 50k, 21k y 10k, y en 2026 el 50k también se corrió en duplas. La organización anuncia en su Instagram la edición del 24 de enero de 2027.
  en: Trail race starting and finishing in Valizas, Rocha, over sand, dunes and coastal paths. There are 50k, 21k and 10k courses, and in 2026 the 50k could also be run in pairs. The organizers announce the 24 January 2027 edition on their Instagram.
