description:
  es: Trail por arena, dunas y senderos costeros, con largada y llegada en el Valizas Hostel Boutique & Suites, en Valizas, Rocha, el domingo 24 de enero de 2027. Hay 48 km individual y en duplas (largada a las 4:00), 23 km (6:00) y 14 km (7:00), y además un trekking de 6 km a las 8:00. La inscripción está abierta en Ticketfácil. Cuesta 1.450 pesos el trekking, 2.250 los 14 km, 2.850 los 23 km, 4.400 los 48 km y 8.000 la dupla; el kit es opcional, 1.400 pesos.
  en: Trail race over sand, dunes and coastal paths, starting and finishing at the Valizas Hostel Boutique & Suites in Valizas, Rocha, on Sunday 24 January 2027. There is a 48 km race, solo or in pairs (start at 4:00), a 23 km (6:00) and a 14 km (7:00), plus a 6 km trek at 8:00. Registration is open on Ticketfácil. It costs 1,450 pesos for the trek, 2,250 for 14 km, 2,850 for 23 km, 4,400 for 48 km and 8,000 for a pair; the kit is optional, 1,400 pesos.
