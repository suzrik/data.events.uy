description:
  es: Trail con largada y llegada en Valizas, Rocha, por arena, dunas y senderos costeros. Hay 50k, 21k y 10k, y el 50k también se corre en duplas. La edición 2027 todavía no fue anunciada; la de 2026 se corrió el domingo 25 de enero.
  en: Trail race starting and finishing in Valizas, Rocha, over sand, dunes and coastal paths. There are 50k, 21k and 10k courses, and the 50k can also be run in pairs. The 2027 edition has not been announced yet; the 2026 one was run on Sunday 25 January.
