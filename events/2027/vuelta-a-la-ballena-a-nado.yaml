name: Vuelta a la Ballena a nado
date: 2027-01-31
time: "08:00"
sport: swim
city: Punta Ballena
venue: Playa Las Grutas
distances: [4500 m]
organizer: NAF Maldonado
links:
  instagram: https://www.instagram.com/p/DfhsM2LBrj0/
description:
  es: Quinta edición de este nado solidario de NAF Maldonado (Nadadores de Aguas Frías) alrededor de Punta Ballena, el domingo 31 de enero de 2027, este año a beneficio de Valentino. Son 4500 metros desde la playa Las Grutas, con encuentro a las 7:00 y largada a las 8:00, hasta la playa La Rinconada. Los cupos para nadar son limitados y también se puede colaborar sin nadar. La inscripción se hace en Eventrack.
  en: Fifth edition of this charity swim by NAF Maldonado (cold-water swimmers) around Punta Ballena, on Sunday 31 January 2027, this year in support of Valentino. It is 4,500 metres from Las Grutas beach, meeting at 7:00 and starting at 8:00, to La Rinconada beach. Places to swim are limited and you can also contribute without swimming. Registration is on Eventrack.
