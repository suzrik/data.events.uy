name: Travesía a nado Isla Gorriti, 6 de febrero
date: 2027-02-06
sport: swim
city: Punta del Este
organizer: Intendencia de Maldonado
links:
  site: https://maldonado.gub.uy/noticias/temporada-2027-travesias-tendra-6-fechas-entre-enero-marzo
description:
  es: Travesía a nado Isla Gorriti, en Punta del Este, el sábado 6 de febrero de 2027. Es una de las tres travesías a nado de la temporada 2027 de la Intendencia de Maldonado, junto con las del 9 de enero y el 28 de febrero. La inscripción abre el 1 de diciembre en Acceso Fácil; recorrido, horario, distancia y precio todavía no se publicaron.
  en: Isla Gorriti open-water swim, in Punta del Este, on Saturday 6 February 2027. It is one of the three swims of the Intendencia de Maldonado's 2027 season, with those on 9 January and 28 February. Registration opens on 1 December on Acceso Fácil; course, start time, distance and price are not published yet.
