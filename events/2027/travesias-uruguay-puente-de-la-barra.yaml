description:
  es: Fecha de la Travesías Uruguay Open Water Series 2027, temporada de aguas abiertas que va de diciembre a marzo, el sábado 20 de febrero de 2027, junto al puente de La Barra, Maldonado. La fecha también figura en el calendario de aguas abiertas de la Federación Uruguaya de Natación. La hora de largada, las distancias y la inscripción todavía no están publicadas.
  en: A date of the Travesías Uruguay Open Water Series 2027, an open-water season running from December to March, on Saturday 20 February 2027, by the La Barra bridge, Maldonado. The date is also on the Uruguayan Swimming Federation's open-water calendar. The start time, distances and registration are not published yet.
