name: Vuelta Ciclista Chaná
date: 2027-02-25
end_date: 2027-02-28
sport: bike
city: Mercedes
entry: elite
links:
  site: https://federacionciclista.com.uy/calendario/
description:
  es: Carrera por etapas de cuatro días para ciclistas élite, con base en Mercedes, Soriano; es la 36.ª edición. Según la Federación Ciclista Uruguaya, es la antesala de la Vuelta Ciclista del Uruguay. Para el público es una carrera para ir a ver.
  en: Four-day stage race for elite riders based in Mercedes, Soriano; this is the 36th edition. According to the Uruguayan Cycling Federation, it is the warm-up for the Vuelta Ciclista del Uruguay. For the public it is one to go and watch.
