name: Vuelta Ciclista Chaná
date: 2027-02-25
end_date: 2027-02-28
sport: bike
city: Mercedes
entry: elite
links:
  site: https://federacionciclista.com.uy/ruta/NTTEVFR6GN/
description:
  es: Carrera por etapas de cuatro días para ciclistas élite (hombres), con base en Mercedes, Soriano, organizada por la Federación Ciclista de Soriano; es la 36.ª edición. La Federación Ciclista Uruguaya describió la edición 2026 como la antesala de la Vuelta Ciclista del Uruguay. Para el público es una carrera para ir a ver.
  en: Four-day stage race for elite men based in Mercedes, Soriano, organized by the Federación Ciclista de Soriano; this is the 36th edition. The Uruguayan Cycling Federation described the 2026 edition as the warm-up for the Vuelta Ciclista del Uruguay. For the public it is one to go and watch.
