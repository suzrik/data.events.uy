description:
  es: Campeonato nacional de ciclismo de ruta de la Federación Ciclista Uruguaya, tres días en Maldonado. Compiten las categorías élite, sub-23 y junior de hombres y mujeres. La federación indica solo «Maldonado» como sede, sin aclarar si es la ciudad o el departamento; el programa y los recorridos todavía no están publicados. En 2026, en Rocha, el primer día fue de contrarreloj individual y los otros dos de pruebas de ruta. Para el público es una carrera para ir a ver.
  en: National road cycling championships of the Uruguayan Cycling Federation, three days in Maldonado. The men's and women's elite, under-23 and junior categories compete. The federation gives only «Maldonado» as the host, without saying whether it means the city or the department; the programme and courses are not published yet. In 2026, in Rocha, the first day was for individual time trials and the other two for road races. For the public it is one to go and watch.
