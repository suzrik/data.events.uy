description:
  es: Carrera de calle por la rambla de Colonia del Sacramento, con largada en la Av. Mianovich frente a la Plaza de Toros. La edición 2027 todavía no fue anunciada; la de 2026 se corrió el 14 de marzo, con una 5K participativa y una 10K que fue la quinta fecha del campeonato CAU.
  en: Road race along the Colonia del Sacramento waterfront, starting on Av. Mianovich in front of the Plaza de Toros. The 2027 edition has not been announced yet; the 2026 one was run on 14 March, with a participatory 5K and a 10K that was the fifth round of the CAU championship.
