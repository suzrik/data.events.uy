description:
  es: Carrera de trail run en el Arboretum Lussich, organizada por Mileu Aventura Todo Terreno (MATT). Según la Intendencia de Maldonado, la sexta edición, en julio de 2024, formó parte del Circuito Nacional de Trail Run de la CAU. Las dos últimas se corrieron a fines de junio, el 29 de junio de 2025 y el 28 de junio de 2026, esta con 32K, 15K y 7,5K, según los resultados de Suca Sports, que las cronometró. No encontramos la fecha de 2027; el mes es una estimación a partir de esas ediciones.
  en: Trail run race in the Arboretum Lussich, organized by Mileu Aventura Todo Terreno (MATT). According to the Maldonado city government, the sixth edition, in July 2024, was part of the CAU National Trail Run Circuit. The last two were run in late June, on 29 June 2025 and 28 June 2026, the latter over 32K, 15K and 7.5K, according to the results of Suca Sports, which timed them. We did not find the date of the 2027 edition; the month is an estimate based on those editions.
