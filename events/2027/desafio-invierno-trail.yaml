name: Desafío Invierno Trail
date: 2027-06-27
sport: trail
city: Punta Ballena
venue: Arboretum Lussich
distances: [32K, 15K, "7,5K"]
organizer: Mileu Aventura Todo Terreno
links:
  site: https://www.maldonado.gub.uy/noticias/llega-sexta-edicion-desafio-invierno-trail
  instagram: https://www.instagram.com/mileuaventura/
description:
  es: Carrera de trail run en el Arboretum Lussich, organizada por Mileu Aventura Todo Terreno (MATT). El calendario 2027 que publicó el organizador el 31 de octubre de 2026 la fija para el 27 de junio. Según la Intendencia de Maldonado, la sexta edición, en julio de 2024, formó parte del Circuito Nacional de Trail Run de la CAU. Las dos últimas se corrieron el 29 de junio de 2025 y el 28 de junio de 2026, esta con 32K, 15K y 7,5K; las distancias de 2027 todavía no se anunciaron.
  en: Trail run race in the Arboretum Lussich, organized by Mileu Aventura Todo Terreno (MATT). The 2027 calendar the organizer posted on 31 October 2026 sets it for 27 June. According to the Maldonado city government, the sixth edition, in July 2024, was part of the CAU National Trail Run Circuit. The last two were run on 29 June 2025 and 28 June 2026, the latter over 32K, 15K and 7.5K; the 2027 distances have not been announced yet.
