description:
  es: Carrera de trail run en el Arboretum Lussich, organizada por Mileu Aventura Todo Terreno (MATT). Según la Intendencia de Maldonado, la sexta edición fue el domingo 21 de julio de 2024, con distancias de 32K, 15K y 7,5K, y formó parte del Circuito Nacional de Trail Run de la CAU. No encontramos la fecha de la edición 2027; el mes es una estimación a partir de esa edición.
  en: Trail run race in the Arboretum Lussich, organized by Mileu Aventura Todo Terreno (MATT). According to the Maldonado city government, the sixth edition was held on Sunday 21 July 2024, over 32K, 15K and 7.5K, as part of the CAU National Trail Run Circuit. We did not find the date of the 2027 edition; the month is an estimate based on that edition.
