description:
  es: Carrera de Prodeporte para probarse antes de la maratón, con distancias de 15K y 30K. La edición 2027 es el domingo 14 de marzo, según el calendario 2027 que Prodeporte publicó en Instagram el 22 de noviembre de 2026; horario e inscripción todavía no se anunciaron. En 2026 figuraba en el calendario de Prodeporte el 19 de abril.
  en: Prodeporte race to test yourself ahead of the marathon, with 15K and 30K distances. The 2027 edition is on Sunday 14 March, according to the 2027 calendar Prodeporte posted on Instagram on 22 November 2026; start time and registration have not been announced yet. In 2026 it appeared on the Prodeporte calendar on 19 April.
