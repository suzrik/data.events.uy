description:
  es: Carrera solidaria 5K y 10K de la Fundación Peluffo Giguens por la rambla de Montevideo, que según la fundación se hace cada abril. La edición 2027 todavía no fue anunciada; la de 2026, la quinta, fue el domingo 26 de abril, con largada a las 9:00 en Av. Arocena y Rambla República de México.
  en: Charity 5K and 10K race of the Fundación Peluffo Giguens along the Montevideo waterfront, which the foundation says is held every April. The 2027 edition has not been announced yet; the 2026 one, the fifth, was on Sunday 26 April, starting at 9:00 at Av. Arocena and Rambla República de México.
