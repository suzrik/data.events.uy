description:
  es: Campeonato de la Agrupación de Atletas del Uruguay para sus asociados, con etapas de 10 y 5 km los domingos de mañana o los sábados de tarde. El reglamento de 2026 prevé 19 etapas; la primera fue el domingo 1 de marzo en Villa Española, según la agenda deportiva de la Intendencia de Montevideo. El calendario de 2027 todavía no está publicado.
  en: Championship of the Agrupación de Atletas del Uruguay for its members, with 10 and 5 km stages on Sunday mornings or Saturday afternoons. The 2026 rules provide for 19 stages; the first was on Sunday 1 March in Villa Española, according to the sports calendar of the Montevideo city government. The 2027 calendar has not been published yet.
