name: Gran Fondo Círculo Católico
date: 2027-03-14
sport: road
city: Santa Lucía
entry: license
organizer: Club Ciclista Alas Rojas de Santa Lucía
links:
  site: https://federacionciclista.com.uy/ruta/35E9LLS8LU/
description:
  es: Gran fondo de ciclismo en Santa Lucía, Canelones, el domingo 14 de marzo de 2027, organizado por el Club Ciclista Alas Rojas de Santa Lucía y fiscalizado por la Federación Ciclista Uruguaya en su calendario regional. Según la página de la FCU admite aficionados con licencia por el día, además de las categorías élite, sub-23 y junior de hombres y mujeres. El recorrido, las distancias, la hora y la inscripción no están publicados.
  en: Cycling gran fondo in Santa Lucía, Canelones, on Sunday 14 March 2027, organized by the Club Ciclista Alas Rojas de Santa Lucía and supervised by the Uruguayan Cycling Federation on its regional calendar. According to the FCU page it admits amateurs with a one-day licence as well as the men's and women's elite, under-23 and junior categories. The course, distances, start time and registration are not published.
