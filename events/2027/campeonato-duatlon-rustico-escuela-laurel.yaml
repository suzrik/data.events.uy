description:
  es: "Duatlón rústico de carrera y MTB, tercera fecha de la 7.ª edición del Campeonato Duatlón Rústico, en la Escuela Laurel, paraje Laurel, San José, el sábado 17 de abril de 2027. Según el afiche de la temporada 2027 hay categorías individual y duplas, con recorridos nuevos; distancias, horario y precios todavía no se publicaron. La última fecha de 2026, el 16 de mayo en el Parque Rodó, combinó 5 km de carrera y 25 km en MTB o gravel, con largada a las 15:00. Informes: 098 346 221 y 099 867 320."
  en: "An off-road run and mountain bike duathlon, the third stage of the 7th Campeonato Duatlón Rústico, at the Escuela Laurel school, in the Laurel area of San José, on Saturday 17 April 2027. The 2027 season poster announces solo and pairs categories on new courses; distances, start time and prices are not published yet. The last stage of 2026, on 16 May in Parque Rodó, combined 5 km of running and 25 km on a mountain or gravel bike, starting at 15:00. Information: 098 346 221 and 099 867 320."
