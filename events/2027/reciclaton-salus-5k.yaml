description:
  es: Correcaminata familiar de Prodeporte con Salus y la Intendencia de Montevideo. No tiene costo; para inscribirse hay que entregar 10 botellas de plástico PET limpias y compactadas o más en el Ecocentro Buceo-Prado. La edición 2027 todavía no fue anunciada; la de 2026, la tercera, se corrió el 6 de setiembre.
  en: Family run and walk by Prodeporte with Salus and the Montevideo city government. It is free; to register you hand in 10 or more clean, compacted PET plastic bottles at the Buceo-Prado Ecocentro. The 2027 edition has not been announced yet; the 2026 one, the third, was held on 6 September.
