name: Ultra Trail de las Sierras
date: 2027-05-23
sport: trail
city: Gregorio Aznárez
distances: [45K, 16K, 9K]
organizer: Desnivel Eventos Deportivos
links:
  site: https://accesofacil.com/UTDS/info
  instagram: https://www.instagram.com/desniveluy/
description:
  es: Trail de montaña en las Sierras de las Ánimas, Maldonado, de Desnivel Eventos Deportivos. Su calendario 2027, publicado el 18 de octubre de 2026, lo fija para el domingo 23 de mayo, con 9K, 16K y 45K. El lugar de largada de 2027 todavía no se anunció; la edición de 2025, del 25 de mayo y con las mismas distancias, tuvo sede en Gregorio Aznárez, y la de 2026 figura como cancelada en la base de carreras de ITRA.
  en: Mountain trail race in the Sierras de las Ánimas, Maldonado, by Desnivel Eventos Deportivos. Its 2027 calendar, posted on 18 October 2026, sets it for Sunday 23 May, over 9K, 16K and 45K. The 2027 start venue has not been announced yet; the 2025 edition, on 25 May over the same distances, was based in Gregorio Aznárez, and the 2026 edition is listed as cancelled in the ITRA race database.
