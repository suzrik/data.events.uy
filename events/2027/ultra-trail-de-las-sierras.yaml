description:
  es: Trail de montaña en las Sierras de las Ánimas, con sede en Gregorio Aznárez, Maldonado. Todavía no encontramos el anuncio de una nueva edición. La página de inscripción de 2025 la fechaba el 25 de mayo, con 45, 16 y 9 km, y la edición 2026 figura como cancelada en la base de carreras de ITRA.
  en: Mountain trail race in the Sierras de las Ánimas, based in Gregorio Aznárez, Maldonado. We have not found an announcement of a new edition yet. The 2025 registration page dated it 25 May, with 45, 16 and 9 km, and the 2026 edition is listed as cancelled in the ITRA race database.
