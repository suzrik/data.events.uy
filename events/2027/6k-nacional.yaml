description:
  es: Tradicional carrera de 6 km del Club Nacional de Football por La Blanqueada, con largada y llegada en el Gran Parque Central e ida y vuelta por 8 de Octubre y 18 de Julio hasta Arenal Grande. La edición 2027 todavía no fue anunciada; el mes es el de la edición 2026, que se corrió el domingo 31 de mayo a las 9:00.
  en: Traditional 6 km race of Club Nacional de Football through La Blanqueada, starting and finishing at Gran Parque Central, out and back along 8 de Octubre and 18 de Julio to Arenal Grande. The 2027 edition has not been announced yet; the month is that of the 2026 edition, held on Sunday 31 May at 9:00.
