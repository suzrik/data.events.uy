name: La Sierra Trail
date: 2027-08
status: tentative
sport: trail
city: Mal Abrigo
venue: Finca Piedra, Ruta 23 Km 125
distances: [7 km, 15 km, 21 km]
links:
  site: https://lasierra.uy/
  instagram: https://www.instagram.com/la_sierra_eventos_deportivos/
description:
  es: Trail de La Sierra Eventos Deportivos en las Sierras de Mahoma, departamento de San José, con largada en Finca Piedra. Es fecha del circuito de trail de la Confederación Atlética del Uruguay. La edición 2027 todavía no fue anunciada; la de 2026 fue el domingo 30 de agosto, a las 9 de la mañana, con recorridos de 7 y 15 km y un tercero de 21 km.
  en: Trail race by La Sierra Eventos Deportivos in the Sierras de Mahoma, San José department, starting at Finca Piedra. It is a date of the trail circuit of the Confederación Atlética del Uruguay. The 2027 edition has not been announced yet; the 2026 one was held on Sunday 30 August, at 9 am, with 7 and 15 km courses and a third one of 21 km.
