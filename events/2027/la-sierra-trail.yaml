name: La Sierra Trail
date: 2027-08-29
sport: trail
city: Mal Abrigo
venue: Finca Piedra, Ruta 23 Km 125
organizer: La Sierra Eventos Deportivos
links:
  site: https://lasierra.uy/
  instagram: https://www.instagram.com/la_sierra_eventos_deportivos/
description:
  es: Trail de La Sierra Eventos Deportivos en las Sierras de Mahoma, departamento de San José, con largada en Finca Piedra. La edición 2027 es el domingo 29 de agosto, según el calendario 2027 de La Sierra; la hora y las distancias todavía no están publicadas. La de 2026 fue el domingo 30 de agosto, a las 9 de la mañana, con recorridos de 7 y 15 km y un tercero de 21 km, y fue fecha del circuito de trail de la Confederación Atlética del Uruguay.
  en: Trail race by La Sierra Eventos Deportivos in the Sierras de Mahoma, San José department, starting at Finca Piedra. The 2027 edition is on Sunday 29 August, per the La Sierra 2027 calendar; time and distances are not published yet. The 2026 one was held on Sunday 30 August, at 9 am, with 7 and 15 km courses and a third one of 21 km, and was a date of the trail circuit of the Confederación Atlética del Uruguay.
