description:
  es: Carreras de cross country en el calendario de la Confederación Atlética del Uruguay. La agenda 2026 de la Intendencia de Montevideo lista tres fechas de cross country, el 14 y el 21 de junio y el 4 de julio. La edición 2027 no está anunciada; el mes es una estimación. No encontramos fechas, lugar ni condiciones de participación.
  en: Cross country races on the calendar of the Confederación Atlética del Uruguay. The 2026 agenda of the Montevideo city government lists three cross country dates, 14 and 21 June and 4 July. The 2027 edition is not announced; the month is an estimate. We found no dates, venue or entry conditions.
