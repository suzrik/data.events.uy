description:
  es: Carrera de trail dentro del Parque Nacional Aarón de Anchorena, organizada por Colonia Aventura Corre (CAC). La edición 2027 aún no fue anunciada; el mes es una estimación a partir de la de 2026, que se corrió el domingo 2 de agosto como tercera y última fecha de la Triple Corona CAC, con 6K, 12K y 21K. Solo Carreras publica, junto a CAC, un Desafío Anchorena Trail en el mismo parque; su página sigue con «fecha a confirmar 2026» y las distancias de la edición de octubre de 2025 (5, 10 y 20 km).
  en: Trail race inside Parque Nacional Aarón de Anchorena, organized by Colonia Aventura Corre (CAC). The 2027 edition is not announced yet; the month is an estimate based on the 2026 one, which was run on Sunday 2 August as the third and last round of the CAC Triple Corona, over 6K, 12K and 21K. Solo Carreras publishes, together with CAC, a Desafío Anchorena Trail in the same park; its page still says "date to be confirmed 2026" and gives the distances of the October 2025 edition (5, 10 and 20 km).
