description:
  es: La principal carrera por etapas del país, organizada por la Federación Ciclista Uruguaya; es la 82.ª edición. El recorrido de 2027 todavía no fue anunciado. En 2026 tuvo 11 etapas y más de 1700 km, con largada y llegada en Montevideo. Corren equipos élite y sub-23 masculinos; para el público es una carrera para ir a ver.
  en: The country's main stage race, organized by the Uruguayan Cycling Federation; this is the 82nd edition. The 2027 route has not been announced yet. In 2026 it had 11 stages and more than 1,700 km, starting and finishing in Montevideo. Men's elite and under-23 teams race; for the public it is one to go and watch.
