description:
  es: Carrera de trail en Carmelo (Colonia), el domingo 10 de octubre de 2027, con 5K, 10K y carrera para niños, según el afiche que Carmelo Eventos Deportivos publicó el 30 de octubre de 2026. El lugar, la hora y la inscripción todavía no están anunciados. La edición 2026 se corrió el 11 de octubre en Playa Seré.
  en: Trail race in Carmelo (Colonia) on Sunday 10 October 2027, with 5K, 10K and a kids' race, according to the poster Carmelo Eventos Deportivos posted on 30 October 2026. Venue, start time and registration are not announced yet. The 2026 edition was run on 11 October at Playa Seré.
