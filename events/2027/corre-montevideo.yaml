description:
  es: Carrera de Prodeporte que abre la temporada de carreras de largo aliento, con distancias de 5K, 10K y 21K. La edición 2027 todavía no fue anunciada; la de 2026 se corrió el 29 de marzo a las 8 hs, con largada en Kibón Avanza, en Pocitos.
  en: Race by Prodeporte that opens the long-distance racing season, with 5K, 10K and 21K distances. The 2027 edition has not been announced yet; the 2026 one was run on 29 March at 8 am, starting at Kibón Avanza in Pocitos.
