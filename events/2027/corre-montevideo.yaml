description:
  es: Carrera de Prodeporte en Montevideo, con distancias de 5K, 10K y 21K. La edición 2027 es el domingo 9 de mayo, según el calendario 2027 que Prodeporte publicó en Instagram el 22 de noviembre de 2026; horario e inscripción todavía no se anunciaron; la de 2026 se corrió el 29 de marzo a las 8 hs, con largada en Kibón Avanza, en Pocitos.
  en: Race by Prodeporte in Montevideo, with 5K, 10K and 21K distances. The 2027 edition is on Sunday 9 May, according to the 2027 calendar Prodeporte posted on Instagram on 22 November 2026; start time and registration have not been announced yet; the 2026 one was run on 29 March at 8 am, starting at Kibón Avanza in Pocitos.
