description:
  es: Etapa 5 de Combo Colonia 2026/2027, campeonato de running de cinco etapas por localidades del departamento de Colonia, con 5K y 10K, categorías por edad y categoría de capacidades diferentes. Largada a las 16:00 en el balneario Santa Ana; el kit se retira allí desde las 14:00. Las etapas anteriores fueron en Nueva Helvecia, Miguelete y Juan Lacaze. La inscripción está en Ticketfácil; en la web de Cronometraje Instantáneo figuraba cerrada.
  en: Stage 5 of Combo Colonia 2026/2027, a five-stage running championship through towns of the Colonia department, with 5K and 10K, age categories and a differently-abled category. The start is at 16:00 at the Santa Ana beach resort; kits are picked up there from 14:00. Earlier stages were in Nueva Helvecia, Miguelete and Juan Lacaze. Registration is on Ticketfácil; on the Cronometraje Instantáneo website it was shown as closed.
