  es: Etapa 5 de Combo Colonia 2026/2027, campeonato de running de cinco etapas por localidades del departamento de Colonia, con 5K y 10K, categorías por edad y categoría de capacidades diferentes. Las etapas anteriores fueron en Nueva Helvecia, Miguelete y Juan Lacaze. Al consultar la página, la inscripción figuraba cerrada.
  en: Stage 5 of Combo Colonia 2026/2027, a five-stage running championship through towns of the Colonia department, with 5K and 10K, age categories and a differently-abled category. Earlier stages were in Nueva Helvecia, Miguelete and Juan Lacaze. When the page was checked, registration was shown as closed.
