name: Triatlón Solidario La Paloma
date: 2027-01-09
sport: tri
city: La Paloma
venue: Museo de La Paloma
distances: [Sprint, Olímpico]
organizer: Triatlón Solidario
links:
  site: https://lolograste.uy/triatlon-solidario
  register: https://lolograste.uy/triatlon-solidario
description:
  es: Triatlón frente a la bahía de La Paloma, Rocha, el sábado 9 de enero de 2027, con largada y llegada en el Museo de La Paloma; el comienzo figura a las 16:00, a confirmar. Sprint (700 m de natación, 20 km de ciclismo y 5,6 km a pie) por U$S 120 y Olímpico (el doble de cada circuito) por U$S 150; también se puede hacer solo natación o solo pedestrismo por U$S 30. Ciclismo con drafting permitido, sin bicicletas de contrarreloj. Retiro de kit en Montevideo, Punta del Este y La Paloma.
  en: A triathlon on the bay of La Paloma, Rocha, on Saturday 9 January 2027, starting and finishing at the La Paloma Museum; the start is listed at 16:00, to be confirmed. Sprint (700 m swim, 20 km bike, 5.6 km run) for US$120 and Olympic (each circuit twice) for US$150; you can also do only the swim or only the run for US$30. Drafting is allowed on the bike, so time-trial bikes are not. Kit pickup in Montevideo, Punta del Este and La Paloma.
