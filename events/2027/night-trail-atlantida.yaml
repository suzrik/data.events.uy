description:
  es: Fecha de la Night Trail 2027 en Balneario Atlántida, Canelones, el sábado 24 de abril. Es una serie de carreras de 7 km que largan al atardecer, corren por la playa y terminan de noche, con tercer tiempo, food trucks y cierre musical. Las fechas las anunció la organización el 15 de octubre; las inscripciones abren pronto. Organiza La Sierra Eventos Deportivos.
  en: Night Trail 2027 stage at Balneario Atlántida, Canelones, on Saturday 24 April. It is a series of 7 km races that start at sunset, run along the beach and finish after dark, with food trucks and live music afterwards. The organizer announced the dates on 15 October; registration opens soon. Organized by La Sierra Eventos Deportivos.
