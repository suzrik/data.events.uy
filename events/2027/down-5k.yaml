  es: Carrera familiar de la Asociación Down del Uruguay, bajo el lema cada uno a su ritmo, en torno al Día Mundial del Síndrome de Down. La edición 2027 todavía no fue anunciada; en 2026 se corrió el 21 de marzo, según la prensa.
