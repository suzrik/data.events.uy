description:
  es: Corrida de 3K en Rivera el miércoles 6 de enero de 2027, Día de Reyes, de Correr por Placer. El anuncio del organizador, de setiembre de 2026, promete remera oficial, medalla finisher y una jornada para toda la familia, y busca patrocinadores. La hora, el lugar y la inscripción todavía no fueron anunciados.
  en: A 3K run in Rivera on Wednesday 6 January 2027, Three Kings' Day, by Correr por Placer. The organizer's announcement of September 2026 promises an official shirt, a finisher medal and a family day, and seeks sponsors. Time, venue and registration have not been announced yet.
