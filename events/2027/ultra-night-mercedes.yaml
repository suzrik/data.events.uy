description:
  es: Ultramaratón nocturno en Mercedes, Soriano, el 20 y 21 de febrero de 2027, que se presenta como internacional, con corredores de Uruguay, Argentina y Brasil. El 100K y el 50K largan el sábado 20 a las 21:00; el 21K el domingo 21 a las 7:00 y el 7K a las 7:30. Hay tres tramos de precio, hasta el 15 de noviembre, el 15 de enero y el 15 de febrero; el 100K y el 50K incluyen remera y vincha. Inscripción en Encarrera.
  en: A night ultramarathon in Mercedes, Soriano, on 20 and 21 February 2027, billed as international, with runners from Uruguay, Argentina and Brazil. The 100K and 50K start on Saturday 20 at 21:00; the 21K on Sunday 21 at 7:00 and the 7K at 7:30. There are three price bands, until 15 November, 15 January and 15 February; the 100K and 50K include a shirt and a headband. Registration on Encarrera.
