name: Tour Uruguay Gran Fondo Canelones
date: 2027-04
status: tentative
sport: bike
city: Ciudad de la Costa
links:
  site: https://toururuguay.uy/
  instagram: https://www.instagram.com/esporturuguay/
description:
  es: Etapa de Canelones del Tour Uruguay, el circuito de gran fondos de eSport. La edición 2027 todavía no fue anunciada. En 2026 la etapa se corrió en abril en Ciudad de la Costa, con Gran Fondo de 117 km y Medio Fondo de 60 km según el organizador.
  en: Canelones stage of the Tour Uruguay, the gran fondo circuit run by eSport. The 2027 edition has not been announced yet. In 2026 the stage was held in April in Ciudad de la Costa, with a 117 km Gran Fondo and a 60 km Medio Fondo according to the organizer.
