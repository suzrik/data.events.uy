name: GFNY Punta del Este
date: 2027-03-14
sport: bike
city: Punta del Este
distances: [146 km, 86 km]
links:
  site: https://puntadeleste.gfny.com/
  instagram: https://www.instagram.com/gfnyuruguay/
  facebook: https://www.facebook.com/GFNYUruguay/
  register: https://puntadeleste.gfny.com/register/?lang=en
description:
  es: Carrera de la serie GFNY con distancia larga de 146 km (1700 m de ascenso) y media de 86 km (715 m). Solo quienes terminan la larga entran en las clasificaciones; la media se cronometra sin ranking. El recorrido tiene subidas fuertes por las rutas 60 y 12, y la llegada pasa por Punta Ballena a unos 10 km de la meta.
  en: Race of the GFNY series with a 146 km long course (1,700 m of climbing) and an 86 km medium course (715 m). Only long-course finishers are ranked; the medium course is timed without a ranking. The route has serious climbs on Routes 60 and 12, and passes Punta Ballena about 10 km from the finish.
