description:
  es: Carrera al amanecer en Piriápolis, organizada por RS Eventos Deportivos. La edición 2027 todavía no fue anunciada; la de 2026 tuvo un Vertical el 31 de enero a las 18:30 en el Ecoparque Tupambaé y carreras de 8K y 15K el 1 de febrero a las 5:30 con largada en Plaza Armenia.
  en: Sunrise race in Piriápolis, organized by RS Eventos Deportivos. The 2027 edition has not been announced yet; the 2026 one had a Vertical on 31 January at 18:30 at Ecoparque Tupambaé and 8K and 15K races on 1 February at 5:30 starting at Plaza Armenia.
