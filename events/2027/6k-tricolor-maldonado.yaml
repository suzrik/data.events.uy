description:
  es: Carrera de 6 km del Club Nacional de Football en Punta del Este, abierta a socios, hinchas y público en general. La edición 2027 todavía no fue anunciada; el mes es el de la edición 2026, la segunda, que se corrió el sábado 19 de setiembre con largada y llegada en la Parada 1.
  en: 6 km race of Club Nacional de Football in Punta del Este, open to members, fans and the general public. The 2027 edition has not been announced yet; the month is that of the 2026 edition, the second, held on Saturday 19 September, starting and finishing at Parada 1.
