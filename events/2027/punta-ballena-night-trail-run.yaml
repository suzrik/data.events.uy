name: Punta Ballena Night Trail Run
date: 2027-03-20
sport: trail
city: Punta Ballena
venue: Arboretum Lussich
organizer: Mileu Aventura Todo Terreno
links:
  instagram: https://www.instagram.com/p/DfK3EvvBv_K/
description:
  es: Trail nocturno de Mileu Aventura Todo Terreno en Punta Ballena, el sábado 20 de marzo de 2027, para despedir el verano. El organizador lo presenta como el regreso de un clásico y abre con él su calendario 2027, publicado el 31 de octubre de 2026, que sigue con el Desafío Invierno (27 de junio) y la MATT Stage Trail (30 y 31 de octubre). Según la publicación lo recibe otra vez el Arboretum Lussich. La hora, las distancias y la inscripción no están publicadas.
  en: Night trail race by Mileu Aventura Todo Terreno in Punta Ballena, on Saturday 20 March 2027, to see off the summer. The organizer calls it the return of a classic and opens with it its 2027 calendar, published on 31 October 2026, which goes on with the Desafío Invierno (27 June) and the MATT Stage Trail (30 and 31 October). According to the post the Arboretum Lussich hosts it once more. Time, distances and registration are not published.
