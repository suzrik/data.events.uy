description:
  es: Brevets de 200, 300, 400 y 600 km de Randonneurs Uruguay en Gregorio Aznárez, Maldonado, el sábado 3 de abril. Son salidas de larga distancia no competitivas, homologables por el Audax Club Parisien. Por ahora el calendario de la organización solo indica la fecha y las distancias; faltan el punto de partida, los horarios y la apertura de inscripciones.
  en: 200, 300, 400 and 600 km brevets by Randonneurs Uruguay in Gregorio Aznárez, Maldonado, on Saturday 3 April. These are non-competitive long-distance rides, eligible for homologation by the Audax Club Parisien. So far the organizer's calendar only gives the date and the distances; the start point, the times and the opening of registration are still to come.
