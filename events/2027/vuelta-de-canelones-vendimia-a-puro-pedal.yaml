description:
  es: Carrera de ruta de dos días en Canelones, el sábado 6 y el domingo 7 de marzo, organizada por la Federación Canaria de Ciclismo; es fecha del Campeonato Uruguayo de la Federación Ciclista Uruguaya. Admite élite y sub-23 de hombres, Máster A a E de hombres y élite, sub-23 y junior de mujeres, con licencia de la federación. La federación indica solo «Canelones» como lugar; las etapas, las localidades, las distancias y la inscripción todavía no están publicadas.
  en: Two-day road race in Canelones, on Saturday 6 and Sunday 7 March, organized by the Federación Canaria de Ciclismo; it is a round of the Campeonato Uruguayo of the Uruguayan Cycling Federation. It admits men's elite and under-23, the men's Master A to E and women's elite, under-23 and junior, with a federation licence. The federation gives only «Canelones» as the place; the stages, towns, distances and registration are not published yet.
