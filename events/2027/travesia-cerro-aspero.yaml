description:
  es: 18.ª edición de la Travesía Cerro Áspero, carrera de MTB del Club Peñarol de Ciclismo de Rocha, el domingo 2 de mayo de 2027 en Rocha. Figura en el calendario regional de la Federación Ciclista Uruguaya, con categorías élite, sub-23, junior y máster y una promocional. El lugar, la hora, las distancias y la inscripción todavía no están publicados.
  en: 18th edition of the Travesía Cerro Áspero, an MTB race by Club Peñarol de Ciclismo de Rocha, on Sunday 2 May 2027 in Rocha. It is on the regional calendar of the Uruguayan Cycling Federation, with elite, under-23, junior and master categories and a promotional one. The place, start time, distances and registration are not published yet.
