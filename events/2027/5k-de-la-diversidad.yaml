description:
  es: Correcaminata gratuita de la Secretaría de la Diversidad de la Intendencia de Montevideo, para correr, caminar y divertirse. La primera edición fue el domingo 23 de marzo de 2025 en el parque Batlle, con inscripción por formulario web. La edición 2027 no está anunciada todavía; el mes es una estimación y la fecha cambió entre ediciones. Aún no encontramos la página de la edición 2026.
  en: Free fun run by the Diversity Secretariat of the Montevideo city government, for running, walking and having fun. The first edition took place on Sunday 23 March 2025 in Parque Batlle, with registration through a web form. The 2027 edition has not been announced yet; the month is an estimate and the date has moved between editions. We have not found a page for the 2026 edition yet.
