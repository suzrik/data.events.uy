description:
  es: Correcaminata gratuita de la Secretaría de la Diversidad de la Intendencia de Montevideo, para correr, caminar y divertirse. La página de la Intendencia anuncia una edición un domingo 23 de marzo en el parque Batlle, con inscripción por formulario web. La edición 2027 no está anunciada todavía y el mes es una estimación; tampoco encontramos la página de la edición 2026.
  en: Free fun run by the Diversity Secretariat of the Montevideo city government, for running, walking and having fun. The city government page announces an edition on a Sunday 23 March in Parque Batlle, with registration through a web form. The 2027 edition has not been announced yet and the month is an estimate; we have not found a page for the 2026 edition either.
