name: 101k San Carlos
date: 2027-01-24
sport: mtb
city: San Carlos
links:
  site: https://federacionciclista.com.uy/mountain-bike/RXFK7HSHRL/
description:
  es: Carrera de mountain bike de larga distancia en San Carlos, Maldonado, organizada por Ciclistas Carolinos. La Federación Ciclista Uruguaya la anuncia en su calendario regional para el domingo 24 de enero, con categorías desde cadete hasta máster y promocional. Las distancias, el lugar de largada y la inscripción de 2027 todavía no están publicados. En la edición de 2026, el 25 de enero, hubo recorridos de 101, 77 y 47 km y una prueba de gravel de 111 km.
  en: Long-distance mountain bike race in San Carlos, Maldonado, organized by Ciclistas Carolinos. The Uruguayan Cycling Federation lists it on its regional calendar for Sunday 24 January, with categories from cadet to masters and promotional. The 2027 distances, start venue and registration are not published yet. The 2026 edition, on 25 January, had 101, 77 and 47 km courses and a 111 km gravel race.
