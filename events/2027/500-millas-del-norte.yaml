description:
  es: Carrera por etapas de la Federación Ciclista Departamental de Artigas, del miércoles 24 al domingo 28 de marzo de 2027, en el calendario regional de la Federación Ciclista Uruguaya. Según la página de la FCU admite las categorías élite, sub-23 y máster A a E masculinas. La FCU todavía no publica la sede ni las etapas; Artigas es provisorio, porque allí se corrió la edición de 2026.
  en: Stage race of the Federación Ciclista Departamental de Artigas, from Wednesday 24 to Sunday 28 March 2027, on the regional calendar of the Uruguayan Cycling Federation. According to the FCU page it admits the men's elite, under-23 and Master A to E categories. The FCU has not yet published the host town or the stages; Artigas is provisional, because the 2026 edition was held there.
