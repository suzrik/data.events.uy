description:
  es: Carrera solidaria de 5 km del Hospital de Canelones, en el Mes de Sensibilización sobre el Cáncer de Mama; lo recaudado va a equipamiento y asistencia a los pacientes. La edición 2027 no tiene fecha; el sitio del hospital dice «¡Nos vemos el año que viene!». La última, por el 98.º aniversario, fue el 4 de octubre de 2026 en el Parque Artigas, con corredores y caminantes; el mes es una estimación a partir de ella.
  en: Charity 5 km race of the Hospital de Canelones, held during Breast Cancer Awareness Month; the money raised goes to equipment and patient care. The 2027 edition has no date yet; the hospital's site says "See you next year!". The last one, for the 98th anniversary, was on 4 October 2026 at Parque Artigas, with runners and walkers; the month is an estimate based on it.
