name: Rocha Corre, etapa Santa Teresa
date: 2027-01-16
sport: run
city: Santa Teresa
distances: [10K, 5K]
links:
  site: https://rochacorre.uy/
  instagram: https://instagram.com/direcciondedeportesrocha
description:
  es: Etapa 6 de Rocha Corre, campeonato de running de la Intendencia de Rocha y su Dirección de Deportes, con siete etapas por el departamento entre agosto de 2026 y febrero de 2027. La 5K es participativa y la 10K competitiva, con cronometraje oficial con chip y medalla finisher. Se puede correr una etapa suelta o el campeonato completo.
  en: Stage 6 of Rocha Corre, a running championship run by the Rocha city government and its Sports Directorate, with seven stages across the department between August 2026 and February 2027. The 5K is participatory and the 10K competitive, with official chip timing and a finisher medal. You can run a single stage or the whole championship.
