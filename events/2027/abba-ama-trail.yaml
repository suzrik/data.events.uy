description:
  es: Primera edición de un trail en Abba Ama, un refugio de vida salvaje en el paraje Las Cañas, Maldonado, el domingo 21 de febrero de 2027, con un recorrido nuevo de cerros y senderos. Hay 14K competitiva y 8K participativa. Según la publicación del organizador del 8 de octubre, las preinscripciones abren la semana siguiente; la página de encarrera.uy ya muestra la fecha y precios de $1.600 a $2.000 según distancia y franja. Teléfono de la organización 099 971 457.
  en: First edition of a trail race at Abba Ama, a wildlife refuge in the Las Cañas area of Maldonado, on Sunday 21 February 2027, on a new course of hills and trails. There is a competitive 14K and a participatory 8K. According to the organizer's post of 8 October, pre-registration opens the following week; the encarrera.uy page already shows the date and prices from $1,600 to $2,000 depending on distance and period. Organization phone 099 971 457.
