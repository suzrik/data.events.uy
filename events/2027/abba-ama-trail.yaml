name: Abba Ama Trail
date: 2027-02-21
sport: trail
city: Maldonado
venue: Abba Ama – Refugio de Vida Salvaje, Las Cañas
distances: [14K, 8K]
links:
  instagram: https://www.instagram.com/maxisastre46/
