description:
  es: Ultramaratón en la Rambla de Mercedes, organizada por la Asociación Uruguaya de Ultramaratón, con distancias de 5, 10, 25 y 50 km. La edición 2027 todavía no fue anunciada; la de 2026 se corrió el domingo 12 de julio. El mes es una estimación.
