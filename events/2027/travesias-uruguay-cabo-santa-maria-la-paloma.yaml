description:
  es: Fecha de la Travesías Uruguay Open Water Series 2027, temporada de aguas abiertas que va de diciembre a marzo, el domingo 7 de febrero de 2027, en el Cabo Santa María, La Paloma, Rocha (el calendario de la Federación Uruguaya de Natación todavía dice 23 de enero). La hora de largada, las distancias y la inscripción todavía no están publicadas.
  en: A date of the Travesías Uruguay Open Water Series 2027, an open-water season running from December to March, on Sunday 7 February 2027, at Cabo Santa María, La Paloma, Rocha (the Uruguayan Swimming Federation calendar still says 23 January). The start time, distances and registration are not published yet.
