description:
  es: Fecha del Campeonato Nacional de Triatlón 2026-2027 de la Unión de Triatlón del Uruguay, el domingo 31 de enero en la Prefectura de Atlántida, sobre la rambla, en Canelones. Según el calendario de la Unión tiene modalidades Sprint, Promocional y Olímpico. Los no federados pueden correr con un permiso por el día, pero solo los federados suman puntos para el ranking. La página no da horarios ni distancias y la Unión remite a sus redes sociales.
  en: A date of the 2026-2027 Campeonato Nacional de Triatlón of the Unión de Triatlón del Uruguay, on Sunday 31 January at the Prefectura in Atlántida, on the seafront, in Canelones. According to the union's calendar it has Sprint, Promocional and Olympic formats. Non-federated athletes may race on a one-day permit, but only federated ones score ranking points. The page gives no start times or distances, and the union refers to its social media.
