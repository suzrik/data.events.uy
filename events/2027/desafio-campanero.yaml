description:
  es: Trail de Trail Running Uruguay el domingo 18 de abril en el Campamento Sagrada Familia, km 125,5 de la Ruta 8, primera entrada al Penitente, Minas. Es selectivo directo para la Sierre-Zinal 2027. La larga es de unos 27 km con 1760 m de ascenso (largada 8:00), la media de 17,9 km con 1119 m (8:30) y la corta de 9 km con 590 m (9:00). Inscripciones abiertas en la web, con certificado médico.
  en: Trail race by Trail Running Uruguay on Sunday 18 April at Campamento Sagrada Familia, km 125.5 of Route 8, first turn-off to El Penitente, Minas. It is a direct qualifier for Sierre-Zinal 2027. The long course is about 27 km with 1760 m of climbing (start 8:00), the medium one 17.9 km with 1119 m (8:30) and the short one 9 km with 590 m (9:00). Registration is open on the website, with a medical certificate.
