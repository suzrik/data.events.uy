description:
  es: Trail de Trail Running Uruguay cerca de Aguas Blancas, Lavalleja, con punto de encuentro en la Estancia Andorra. Hay tres recorridos aproximados de 9, 16 y 26 km, que cuentan para el Campeonato de Trail Running. La edición 2027 todavía no fue anunciada; la de 2026 fue el domingo 16 de agosto.
  en: Trail race by Trail Running Uruguay near Aguas Blancas, Lavalleja, meeting at Estancia Andorra. There are three approximate courses of 9, 16 and 26 km, which count for the Trail Running Championship. The 2027 edition has not been announced yet; the 2026 one was held on Sunday 16 August.
