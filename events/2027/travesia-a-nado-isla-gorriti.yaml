description:
  es: Travesía a nado de 2500 m desde la Isla Gorriti hasta la Playa Deportiva de la parada 9 de la Playa Mansa, en Punta del Este, el sábado 9 de enero de 2027. Los nadadores se concentran a las 5:45 en el muelle del puerto y la largada es a las 7:15 desde el muelle de la isla. Organiza la Intendencia de Maldonado. Cuesta $1800, que van a la ONG Maestra Juana Guerra; hay 200 cupos y se exige certificado de aptitud física y deslinde firmado.
  en: A 2,500 m open-water swim from Isla Gorriti to the Playa Deportiva at stop 9 of Playa Mansa, in Punta del Este, on Saturday 9 January 2027. Swimmers gather at 5:45 at the harbour pier and the start is at 7:15 from the island's pier. Organized by the Intendencia de Maldonado. It costs $1,800, which goes to the NGO Maestra Juana Guerra; there are 200 places and a fitness certificate and signed waiver are required.
