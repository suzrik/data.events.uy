description:
  es: Trail solo para mujeres de Mil Horizontes, edición 2027 en El Cañadón de la Palma, el domingo 19 de setiembre. El organizador lo anunció el 17 de octubre como «un nuevo escenario» después de la edición 2026 en la Sierra de Carapé. Todavía no se publicaron distancias ni inscripción.
  en: Women-only trail race by Mil Horizontes, 2027 edition at El Cañadón de la Palma, on Sunday 19 September. The organizer announced it on 17 October as a new setting after the 2026 edition in the Sierra de Carapé. Distances and registration have not been published yet.
