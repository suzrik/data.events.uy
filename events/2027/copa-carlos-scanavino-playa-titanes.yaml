name: Copa Carlos Scanavino, aguas abiertas en Playa Titanes
date: 2027-01-09
sport: swim
city: Los Titanes
venue: Playa Titanes
organizer: Liga Nacional de Natación Máster
links:
  site: https://natacionmasteruruguay.com/
description:
  es: Prueba de aguas abiertas de la Liga Nacional de Natación Máster en la Playa Titanes, Canelones, el sábado 9 de enero de 2027. El sitio de la Liga la anuncia en «Próximos eventos» como «Sábado 9 de enero, Copa Carlos Scanavino»; el año no figura, pero el 9 de enero cae en sábado en 2027 y la edición de enero de 2026 ya se nadó. Distancias, horario e inscripción todavía no se publicaron.
  en: Open-water event of the Liga Nacional de Natación Máster at Playa Titanes, Canelones, on Saturday 9 January 2027. The league's site lists it under "Próximos eventos" as "Sábado 9 de enero, Copa Carlos Scanavino"; it gives no year, but 9 January falls on a Saturday in 2027 and the January 2026 edition has already been swum. Distances, start time and registration are not published yet.
