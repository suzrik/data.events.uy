description:
  es: 55.ª edición de Rutas de América, carrera por etapas del Club Ciclista Fénix, del domingo 7 al domingo 14 de febrero de 2027, para élite y sub-23 masculinos según la página de la Federación Ciclista Uruguaya. La FCU todavía no publica las etapas ni las ciudades; Montevideo es provisorio, porque la edición de 2026 terminó allí. Para el público es una carrera para ir a ver.
  en: The 55th Rutas de América, a stage race run by Club Ciclista Fénix, from Sunday 7 to Sunday 14 February 2027, for men's elite and under-23 riders according to the Uruguayan Cycling Federation page. The FCU has not yet published the stages or the towns; Montevideo is provisional, because the 2026 edition finished there. For the public it is one to go and watch.
