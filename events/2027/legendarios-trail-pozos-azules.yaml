description:
  es: Trail de cierre de año de Desnivel Eventos Deportivos, el sábado 11 de diciembre de 2027, con 9K y 16K, según el calendario 2027 que el organizador publicó en octubre de 2026 con el logo de Legendarios Trail Pozos Azules. El lugar no está anunciado; la ciudad se toma de la edición 2026, el 12 de diciembre en la Estancia Pozos Azules (Gerona, Maldonado). La hora y la inscripción no están publicadas.
  en: Year-end trail race by Desnivel Eventos Deportivos, on Saturday 11 December 2027, over 9K and 16K, according to the 2027 calendar the organizer published in October 2026 with the Legendarios Trail Pozos Azules logo. The venue is not announced; the town is taken from the 2026 edition, on 12 December at Estancia Pozos Azules (Gerona, Maldonado). Time and registration are not published.
