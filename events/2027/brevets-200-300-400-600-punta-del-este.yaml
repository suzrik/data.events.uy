description:
  es: Brevets de 200, 300, 400 y 600 km de Randonneurs Uruguay en Punta del Este, el sábado 1 de mayo. Son salidas de larga distancia no competitivas, homologables por el Audax Club Parisien. Por ahora el calendario de la organización solo indica la fecha y las distancias; faltan el punto de partida, los horarios y la apertura de inscripciones.
  en: 200, 300, 400 and 600 km brevets by Randonneurs Uruguay in Punta del Este, on Saturday 1 May. These are non-competitive long-distance rides, eligible for homologation by the Audax Club Parisien. So far the organizer's calendar only gives the date and the distances; the start point, the times and the opening of registration are still to come.
