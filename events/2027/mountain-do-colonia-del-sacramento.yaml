description:
  es: Etapa uruguaya del circuito Elements de la organizadora brasileña Mountain Do, el domingo 14 de marzo de 2027 en Colonia del Sacramento. Los 15 km y 8 km largan juntos a las 8:00, con largada y llegada en la zona céntrica, por caminos de tierra, senderos, empedrado del Barrio Histórico y playa. Edad mínima 18 años; tiempo máximo de 2h45 en 15 km. El kit se entrega el 13 de marzo de 15 a 20; inscripción en reales en la web del organizador.
  en: Uruguayan stage of the Elements circuit of the Brazilian organizer Mountain Do, on Sunday 14 March 2027 in Colonia del Sacramento. The 15 km and 8 km start together at 8:00, starting and finishing in the town centre, over dirt roads, trails, the cobbles of the Barrio Histórico and beach. Minimum age 18; 2h45 cut-off on the 15 km. Kits on 13 March from 15:00 to 20:00; registration in Brazilian reais on the organizer's site.
