name: Mountain Do Colonia del Sacramento
date: 2027-03-14
time: "07:00"
sport: trail
city: Colonia del Sacramento
distances: [18K, 10K]
organizer: Mountain Do
links:
  site: https://mountaindo.com.br/elements/mountain-do-colonia-de-sacramento/
  instagram: https://www.instagram.com/mountaindo.sports/
description:
  es: Etapa uruguaya del circuito Elements de la organizadora brasileña Mountain Do, el domingo 14 de marzo de 2027 en Colonia del Sacramento. Los 18 km y 10 km largan juntos a las 7:00, junto con la Maratón de Colonia, con largada y llegada en la zona céntrica, por tierra, senderos, empedrado del Barrio Histórico y playa. Edad mínima 18 años; el bloque de precios de la web todavía habla de 15 y 8 km. El kit se entrega el 13 de marzo de 15 a 19; inscripción en reales en la web del organizador.
  en: Uruguayan stage of the Elements circuit of the Brazilian organizer Mountain Do, on Sunday 14 March 2027 in Colonia del Sacramento. The 18 km and 10 km start together at 7:00, at the same time as the Colonia marathon, starting and finishing in the town centre, over dirt roads, trails, the cobbles of the Barrio Histórico and beach. Minimum age 18; the price block on the site still mentions 15 and 8 km. Kits on 13 March from 15:00 to 19:00; registration in Brazilian reais on the organizer's site.
