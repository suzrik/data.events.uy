name: Vuelta Ciclista de la Juventud
date: 2027-02-18
end_date: 2027-02-21
sport: road
city: Montevideo
entry: elite
organizer: Federación Ciclista Uruguaya
links:
  site: https://federacionciclista.com.uy/ruta/EG957R2GBG/
description:
  es: Carrera juvenil por etapas de la Federación Ciclista Uruguaya, del jueves 18 al domingo 21 de febrero de 2027. Es solo para corredores federados de las categorías Cadete y Junior, es decir, menores de 19 años; los adultos no pueden inscribirse y para el público es una carrera para ir a ver. La FCU todavía no publicó etapas ni ciudades; Montevideo es provisorio. La edición 2026 se suspendió.
  en: Youth stage race of the Uruguayan Cycling Federation, from Thursday 18 to Sunday 21 February 2027. It is only for federated riders in the Cadet and Junior categories, that is, under 19; adults cannot enter, and for the public it is one to go and watch. The FCU has not published the stages or towns yet; Montevideo is provisional. The 2026 edition was suspended.
