name: Reto al Mataojo
date: 2027-01
status: tentative
sport: trail
city: Pueblo Edén
distances: [15K, 7K]
organizer: Toros Eventos Deportivos
links:
  site: https://www.toroseventosdeportivos.com.uy/carreras/reto-al-mataojo
description:
  es: Trail nocturno de Toros Eventos Deportivos en Pueblo Edén, Maldonado, con 7K y 15K por sierra, monte y empedrados, hasta 460 metros de desnivel positivo, corrido con linterna frontal entre cintas reflectivas. La 11.ª edición se corrió el 31 de enero de 2026; la edición 2027 todavía no fue anunciada y el mes es el de la edición anterior.
  en: Night trail race by Toros Eventos Deportivos in Pueblo Edén, Maldonado, with 7K and 15K courses over hills, woodland and cobbled tracks, up to 460 metres of climbing, run with head torches between reflective tapes. The 11th edition was run on 31 January 2026; the 2027 edition has not been announced yet and the month is that of the previous edition.
