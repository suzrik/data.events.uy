description:
  es: Trail nocturno de Toros Eventos Deportivos en Pueblo Edén, Maldonado, con 7K y 15K por sierra, monte y empedrados, hasta 460 m de desnivel y con linterna frontal. La edición 2027 es el sábado 30 de enero, con largada a las 19:30 en la Ruta 12 km 30, cupo de 500 corredores y cena incluida. La inscripción está abierta en Lolo Graste, con preventa del 11 al 18 de noviembre; el 7K cuesta $1700 sin remera y $2100 con remera, el 15K $1900 y $2400.
  en: Night trail race by Toros Eventos Deportivos in Pueblo Edén, Maldonado, with 7K and 15K courses over hills, woodland and cobbled tracks, with up to 460 m of climbing, run with head torches. The 2027 edition is on Saturday 30 January, starting at 19:30 at Ruta 12 km 30, capped at 500 runners with dinner included. Registration is open on Lolo Graste, with a presale from 11 to 18 November; the 7K costs $1,700 without a shirt and $2,100 with one, the 15K $1,900 and $2,400.
