description:
  es: Trail nocturno de Toros Eventos Deportivos en Pueblo Edén, Maldonado, con 7K y 15K por sierra, monte y empedrados, hasta 460 metros de desnivel positivo, corrido con linterna frontal entre cintas reflectivas. La edición 2027 es el 30 de enero, según el calendario oficial del organizador; la 11.ª edición se corrió el 31 de enero de 2026. Hora e inscripción de 2027 sin publicar.
  en: Night trail race by Toros Eventos Deportivos in Pueblo Edén, Maldonado, with 7K and 15K courses over hills, woodland and cobbled tracks, up to 460 metres of climbing, run with head torches between reflective tapes. The 2027 edition is on 30 January, according to the organizer's official calendar; the 11th edition was run on 31 January 2026. Time and registration for 2027 are not published.
