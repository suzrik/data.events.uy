description:
  es: Campeonato departamental de running que recorre varias localidades de Soriano, con clasificaciones de 5K y 10K. Según su sitio, lo organizan instituciones locales y la Secretaría de Deportes de Soriano. En 2026 tuvo ocho fechas, según los resultados de la empresa de cronometraje Crono MTB. El sitio del campeonato está desactualizado y el calendario de 2027 no está publicado; el mes de inicio es una estimación.
  en: Departmental running championship that visits several towns of Soriano, with 5K and 10K standings. According to its site, it is organized by local institutions and the Secretaría de Deportes de Soriano. In 2026 it had eight rounds, according to the results of the timing company Crono MTB. The championship site is out of date and the 2027 calendar is not published; the starting month is an estimate.
