description:
  es: Campeonato departamental de running que recorre varias localidades de Soriano, con carreras de 5K y 10K y puntaje por categoría en cada fecha. En 2026 tuvo ocho fechas, según Crono MTB, la empresa que lo cronometra y gestiona las inscripciones. La primera fue el sábado 24 de enero en el balneario La Concordia y la última el 26 de setiembre en la Represa de Palmar. El calendario de 2027 no está publicado; el mes y el lugar de inicio son una estimación a partir de 2026.
  en: Departmental running championship that visits several towns of Soriano, with 5K and 10K races and category points at each round. In 2026 it had eight rounds, according to Crono MTB, the company that times it and handles registration. The first was on Saturday 24 January at the La Concordia resort and the last on 26 September at the Palmar dam. The 2027 calendar is not published; the starting month and place are an estimate based on 2026.
