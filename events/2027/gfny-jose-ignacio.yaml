description:
  es: Primera edición de esta carrera de la serie GFNY, con largada y llegada en Pueblo Garzón. Distancia larga competitiva de 130 km (954 m de ascenso), con 34 km junto al océano por la ruta 10, y media recreativa de 77 km (622 m). GFNY anunció el 3 de enero de 2027 como fecha, pero el sitio de la carrera todavía muestra «4 de enero de 2028»; confirmala antes de viajar.
  en: First edition of this GFNY series race, starting and finishing in Pueblo Garzón. A competitive 130 km long course (954 m of climbing) with 34 km along the ocean on Route 10, and a recreational 77 km medium course (622 m). GFNY announced 3 January 2027 as the date, but the race site still shows "January 4, 2028"; check before you travel.
