description:
  es: Primera edición de esta carrera de la serie GFNY, con largada y llegada en Pueblo Garzón. Distancia larga competitiva de 130 km (954 m de ascenso), con 34 km junto al océano por la ruta 10, y media recreativa de 77 km (622 m).
  en: First edition of this GFNY series race, starting and finishing in Pueblo Garzón. A competitive 130 km long course (954 m of climbing) with 34 km along the ocean on Route 10, and a recreational 77 km medium course (622 m).
