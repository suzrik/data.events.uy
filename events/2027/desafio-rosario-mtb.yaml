description:
  es: Sexta edición del Desafío Rosario MTB, carrera de mountain bike del grupo Rosario MTB de Rosario, Colonia, el domingo 11 de abril de 2027. El organizador anunció la fecha en junio de 2026; recorridos, horario e inscripciones todavía no se publicaron.
  en: Sixth edition of Desafío Rosario MTB, a mountain bike race by the Rosario MTB group from Rosario, Colonia, on Sunday 11 April 2027. The organizer announced the date in June 2026; courses, start time and registration have not been published yet.
