description:
  es: Carrera por etapas de tres días en San Carlos, Maldonado, organizada por Ciclistas Carolinos; es la 8.ª edición y figura en el calendario de la Federación Ciclista Uruguaya. Corren las categorías élite, sub-23 y junior masculinas. Las etapas de 2027 todavía no están publicadas; en 2026 hubo una contrarreloj individual de 10 km y dos etapas en ruta de 147 y 148 km. Para el público es una carrera para ir a ver.
  en: Three-day stage race in San Carlos, Maldonado, organized by Ciclistas Carolinos; this is the 8th edition and it is on the calendar of the Uruguayan Cycling Federation. The men's elite, under-23 and junior categories race. The 2027 stages are not published yet; in 2026 there was a 10 km individual time trial and two road stages of 147 and 148 km. For the public it is one to go and watch.
