name: Swimrun Uruguay
date: 2027-02-14
sport: tri
city: La Paloma
organizer: Ti Len Eventos Deportivos
links:
  site: https://tileneventosdeportivos.com/swimrun/
  instagram: https://www.instagram.com/uruguayswimrun/
description:
  es: Décima edición de Swimrun Uruguay, el domingo 14 de febrero de 2027 en La Paloma, Rocha. En el swimrun se alternan, sin transiciones, natación en aguas abiertas y trail running. Es el primer swimrun del país y de América Latina, desde 2018, según Ti Len Eventos Deportivos. La edición 2026 se anunció para el 1 de febrero con 17 y 8 km; distancias, hora e inscripción de 2027 no están publicadas y el organizador dice que abre inscripciones próximamente.
  en: Tenth edition of Swimrun Uruguay, on Sunday 14 February 2027 in La Paloma, Rocha. Swimrun alternates open-water swimming and trail running with no transitions. It is the first swimrun in the country and in Latin America, held since 2018, according to Ti Len Eventos Deportivos. The 2026 edition was announced for 1 February over 17 and 8 km; distances, time and registration for 2027 are not published and the organizer says registration opens soon.
