description:
  es: Media maratón por la rambla portuaria de Montevideo, con distancias de 21, 10 y 5 km. La edición 2027 todavía no fue anunciada; la 15ª, en 2026, fue el domingo 9 de agosto y formó parte del Campeonato Nacional de la distancia.
  en: Half marathon along the Montevideo port waterfront, with 21, 10 and 5 km distances. The 2027 edition has not been announced yet; the 15th, in 2026, was held on Sunday 9 August and was part of the National Championship of the distance.
