description:
  es: Fecha de la Travesías Uruguay Open Water Series 2027, temporada de aguas abiertas que va de diciembre a marzo, el sábado 16 de enero de 2027, en Punta del Este; el calendario de la Federación Uruguaya de Natación la ubica en la parada 9 de la Playa Mansa. La hora de largada, las distancias y la inscripción todavía no están publicadas.
  en: A date of the Travesías Uruguay Open Water Series 2027, an open-water season running from December to March, on Saturday 16 January 2027, in Punta del Este; the Uruguayan Swimming Federation calendar places it at stop 9 of Playa Mansa. The start time, distances and registration are not published yet.
