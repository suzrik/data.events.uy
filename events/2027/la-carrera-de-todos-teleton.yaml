name: La Carrera de Todos - Teletón
date: 2027-04
status: tentative
sport: run
city: Montevideo
distances: [5K, 10K]
links:
  site: https://www.teleton.org.uy/lacarreradetodos/
description:
  es: Carrera solidaria de Fundación Teletón en el Prado de Montevideo, con 5K y 10K presenciales y una modalidad virtual de kilómetros acumulados. La edición 2027 todavía no fue anunciada. La de 2025 fue el 12 de octubre y la de 2026 fue el domingo 12 de abril, por lo que el mes es una estimación.
  en: Charity race by Fundación Teletón at the Prado in Montevideo, with in-person 5K and 10K plus a virtual mode of accumulated kilometres. The 2027 edition has not been announced yet. The 2025 one was on 12 October and the 2026 one was on Sunday 12 April, so the month is an estimate.
