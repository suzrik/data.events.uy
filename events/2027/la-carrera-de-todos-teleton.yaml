name: La Carrera de Todos - Teletón
date: 2027-04
status: tentative
sport: run
city: Montevideo
distances: [5K, 10K]
links:
  site: https://www.teleton.org.uy/lacarreradetodos/
description:
  es: Carrera solidaria de Fundación Teletón en el Prado de Montevideo, con 5K y 10K presenciales y una modalidad virtual de kilómetros acumulados. La edición 2027 todavía no fue anunciada. Según la prensa y la agenda de la Intendencia de Montevideo, la de 2025 fue en octubre y la de 2026 en abril, por lo que el mes es una estimación.
  en: Charity race by Fundación Teletón at the Prado in Montevideo, with in-person 5K and 10K plus a virtual mode of accumulated kilometres. The 2027 edition has not been announced yet. According to the press and the Montevideo city calendar, the 2025 one was in October and the 2026 one in April, so the month is an estimate.
