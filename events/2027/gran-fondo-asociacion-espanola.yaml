description:
  es: Gran fondo de eSport con largada en la rambla de Carrasco, con más de 1800 ciclistas según el organizador. La edición 2027 está anunciada sin fecha; la de 2026 se corrió el 13 de setiembre, con Gran Fondo de 138 km, Medio Fondo de 60,7 km y un Gran Fondo Kids el día anterior. Para 2027 el organizador indica 130 y 61 km.
  en: Gran fondo run by eSport, starting on the Carrasco seafront, with more than 1,800 riders according to the organizer. The 2027 edition is announced without a date; the 2026 one was held on 13 September, with a 138 km Gran Fondo, a 60.7 km Medio Fondo and a Gran Fondo Kids the day before. For 2027 the organizer lists 130 and 61 km.
