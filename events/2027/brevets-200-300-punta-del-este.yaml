description:
  es: Brevets de Randonneurs Uruguay en Punta del Este, el sábado 9 y el domingo 10 de enero. El calendario de la organización anuncia seis recorridos, un BRM de 300 km, tres BRM de 200 km (uno de ruta, uno de gravel/MTB y uno sin aclaración) y dos randos de 100 km, de ruta y de gravel/MTB. Son salidas de larga distancia no competitivas. Faltan el punto de partida, los horarios, qué recorrido sale cada día y la apertura de inscripciones.
  en: Brevets by Randonneurs Uruguay in Punta del Este, on Saturday 9 and Sunday 10 January. The organizer's calendar lists six routes, a 300 km BRM, three 200 km BRMs (one on road, one on gravel/MTB and one not specified) and two 100 km randos, on road and on gravel/MTB. These are non-competitive long-distance rides. The start point, the times, which route runs on which day and the opening of registration are still to come.
