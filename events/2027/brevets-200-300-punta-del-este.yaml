description:
  es: Brevets de Randonneurs Uruguay en Punta del Este, el sábado 9 y el domingo 10 de enero. El calendario de la organización anuncia tres recorridos BRM, dos de 200 km y uno de 300 km. Son salidas de larga distancia no competitivas, homologables por el Audax Club Parisien. Por ahora solo se publicaron las fechas y las distancias; faltan el punto de partida, los horarios, qué recorrido sale cada día y la apertura de inscripciones.
  en: Brevets by Randonneurs Uruguay in Punta del Este, on Saturday 9 and Sunday 10 January. The organizer's calendar lists three BRM routes, two of 200 km and one of 300 km. These are non-competitive long-distance rides, eligible for homologation by the Audax Club Parisien. So far only the dates and the distances are published; the start point, the times, which route runs on which day and the opening of registration are still to come.
