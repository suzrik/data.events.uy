description:
  es: Vuelta a Uruguay de 1500 km en modalidad randonneur. No es una carrera; se completa a ritmo propio dentro de un límite de 125 horas. Larga el 5 de febrero a las 7:00 desde Chuy y la llegada límite es el 10 de febrero a las 12:00. Organiza Randonneurs Uruguay. El recorrido pasa por Rocha, Minas, Colonia del Sacramento, Mercedes, Trinidad y Florida. Incluye jersey y servicio de dropbag.
  en: A 1,500 km loop of Uruguay in randonneur format. It is not a race; riders go at their own pace within a 125-hour limit. It starts on 5 February at 7:00 in Chuy, and the cut-off at the finish is 10 February at 12:00. Run by Randonneurs Uruguay. The route passes Rocha, Minas, Colonia del Sacramento, Mercedes, Trinidad and Florida. A jersey and a drop-bag service are included.
