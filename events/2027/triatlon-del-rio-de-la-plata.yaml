description:
  es: Tercera edición de este triatlón de La Sierra Eventos en el balneario Boca del Cufré, San José, el domingo 17 de enero con largada a las 7:00. Hay distancia Sprint y Olímpica, sobre circuitos de 750 m de natación, 20 km de ciclismo y 2,5 km de carrera por vuelta. El cupo es de 200 participantes y la inscripción cierra el 20 de diciembre, o antes si se agotan los lugares. Categorías por edad de 10 en 10 años, con cronometraje por chip y medalla finisher.
  en: Third edition of this triathlon by La Sierra Eventos at the Boca del Cufré beach resort, San José, on Sunday 17 January, starting at 7:00. It offers Sprint and Olympic distances, on laps of 750 m swimming, 20 km cycling and 2.5 km running. It is capped at 200 participants and registration closes on 20 December, or earlier if places run out. Age categories in 10-year bands, with chip timing and a finisher medal.
