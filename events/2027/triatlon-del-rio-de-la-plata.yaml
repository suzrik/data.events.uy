name: Triatlón del Río de la Plata
date: 2027-01-17
sport: tri
city: Boca del Cufré
distances: [Sprint, Olímpico]
links:
  site: https://lasierra.uy/
  instagram: https://www.instagram.com/la_sierra_eventos_deportivos/
