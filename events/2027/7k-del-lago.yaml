description:
  es: Carrera de 7 km en el balneario Lago Merín, Cerro Largo, el sábado 30 de enero de 2027 a las 20:00, con largada en la calle 1 frente al Shop del Lago. La organiza Cronometra Mauá con el Municipio de Laguna Merín, el Municipio de Río Branco y la Intendencia de Cerro Largo. Cuesta $780 con kit completo (remera, mochila, visera y medalla) o $500 sin kit, por colectivo de Abitab; categorías desde 11 años. La inscripción se hace en la web de Cronometra Mauá.
  en: 7 km race at the Lago Merín resort, Cerro Largo, on Saturday 30 January 2027 at 20:00, starting on Calle 1 in front of the Shop del Lago. It is organized by Cronometra Mauá with the Laguna Merín and Río Branco municipalities and the Cerro Largo departmental government. It costs $780 with the full kit (shirt, bag, visor and medal) or $500 without, paid through an Abitab collective account; categories from age 11. Registration is on the Cronometra Mauá website.
