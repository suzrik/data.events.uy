description:
  es: Carrera de ruta de un día en Dolores, Soriano, el sábado 23 de enero, organizada por el Centro Ciclista Velox de Dolores y el Dolores Cycles Club; figura en el calendario regional de la Federación Ciclista Uruguaya. La edición 2027 admite élite de hombres y mujeres y Máster A a E de hombres, con licencia de la federación. El recorrido, las distancias y la inscripción todavía no están publicados.
  en: One-day road race in Dolores, Soriano, on Saturday 23 January, organized by Centro Ciclista Velox de Dolores and Dolores Cycles Club; it is on the regional calendar of the Uruguayan Cycling Federation. The 2027 edition admits men's and women's elite and the men's Master A to E, with a federation licence. The course, distances and registration are not published yet.
