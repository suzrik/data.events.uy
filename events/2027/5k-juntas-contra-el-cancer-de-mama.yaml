description:
  es: Carrera de 5 km por la rambla organizada por Suca Sports, a beneficio de la Comisión Honoraria de Lucha Contra el Cáncer. La edición 2026 fue el sábado 3 de octubre a las 16:00, con largada en las Canteras del Parque Rodó. La edición 2027 todavía no fue anunciada; el mes es una estimación.
  en: 5 km waterfront race organized by Suca Sports, supporting the Comisión Honoraria de Lucha Contra el Cáncer. The 2026 edition was on Saturday 3 October at 16:00, starting at the Canteras del Parque Rodó. The 2027 edition has not been announced yet; the month is an estimate.
