description:
  es: Carrera de Prodeporte en Montevideo. La fecha de la edición 2027, el domingo 28 de noviembre, sale del calendario 2027 que Prodeporte publicó en Instagram el 22 de noviembre de 2026; distancias, horario, lugar e inscripción todavía no se anunciaron. La edición 2026 fue el 29 de noviembre en el Dique Mauá, con 15K y 5K.
  en: Prodeporte race in Montevideo. The 2027 date, Sunday 28 November, comes from the 2027 calendar Prodeporte posted on Instagram on 22 November 2026; distances, start time, venue and registration have not been announced yet. The 2026 edition was on 29 November at Dique Mauá, with 15K and 5K.
