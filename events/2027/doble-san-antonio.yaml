name: Doble San Antonio
date: 2027-02-13
sport: run
city: Piriápolis
venue: Rambla de los Argentinos
distances: [4k, 8k]
links:
  site: https://doblesanantonio.com/
description:
  es: Carrera nocturna en Piriápolis, ida y vuelta desde la Rambla de los Argentinos hasta la cima del cerro San Antonio, con 4k participativa y 8k competitiva. Organiza Suca Sports, cuyo calendario la fija para el sábado 13 de febrero de 2027. La inscripción todavía no está abierta; el sitio de la carrera sigue mostrando la edición 2026, que se hizo el 7 de febrero con cupos agotados.
  en: Evening race in Piriápolis, out and back from the Rambla de los Argentinos to the top of Cerro San Antonio, with a participatory 4k and a competitive 8k. Organized by Suca Sports, whose calendar sets it for Saturday 13 February 2027. Registration is not open yet; the race site still shows the 2026 edition, which was held on 7 February and sold out.
