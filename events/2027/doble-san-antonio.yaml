description:
  es: Carrera nocturna en Piriápolis, ida y vuelta desde la Rambla de los Argentinos hasta la cima del cerro San Antonio, con 4k participativa y 8k competitiva. Organiza Suca Sports. La edición 2027 todavía no fue anunciada; la de 2026 se hizo el 7 de febrero.
  en: Evening race in Piriápolis, out and back from the Rambla de los Argentinos to the top of Cerro San Antonio, with a participatory 4k and a competitive 8k. Organized by Suca Sports. The 2027 edition has not been announced yet; the 2026 one was held on 7 February.
