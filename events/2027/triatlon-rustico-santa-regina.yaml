description:
  es: Triatlón rústico (natación, carrera y bicicleta) el domingo 10 de enero de 2027 desde las 8:00 en el balneario Santa Regina, Colonia, en la 12.ª edición del Festival Agua, Arena y Sol (8 al 10 de enero, entrada libre). La agenda de la Intendencia de Colonia publica el festival con datos del organizador; las distancias, la inscripción y quién organiza la prueba no figuran.
  en: Rustic triathlon (swim, run and bike) on Sunday 10 January 2027 from 8:00 at the Santa Regina beach resort, Colonia, during the 12th Festival Agua, Arena y Sol (8 to 10 January, free entry). The Intendencia de Colonia agenda lists the festival with details supplied by the organizer; distances, registration and who runs the race are not given.
