description:
  es: Etapa 2 de 3 de la Copa Invierno de mountain bike de La Sierra Eventos Deportivos, el domingo 27 de junio de 2027. El calendario 2027 que publicó el organizador el 10 de setiembre de 2026 dice solo «San José», sin el lugar exacto; recorridos, horario e inscripción todavía no se publicaron. En 2026 esta etapa fue el 28 de junio en la cancha de Juincan, Puntas de Valdez.
  en: Round 2 of 3 of La Sierra Eventos Deportivos' Copa Invierno mountain bike series, on Sunday 27 June 2027. The 2027 calendar the organizer published on 10 September 2026 says only «San José», with no exact venue; courses, start time and registration are not published yet. In 2026 this round was on 28 June at the Juincan ground, Puntas de Valdez.
