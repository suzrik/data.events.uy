description:
  es: Primera fecha del Campeonato Salteño de Running (Salto Run) de 2027, en la ciudad de Salto. El calendario 2027 todavía no fue publicado; el mes es el del arranque de la temporada 2026, cuya primera fecha fue el 12 de abril (6 km, Rowing, Costa Norte). La temporada 2026 tuvo siete fechas entre abril y octubre.
  en: First round of the 2027 Salto running championship (Salto Run), in the city of Salto. The 2027 calendar has not been published yet; the month is that of the 2026 season start, whose first round was on 12 April (6 km, Rowing, Costa Norte). The 2026 season had seven rounds between April and October.
