description:
  es: Travesía a nado en la bahía de Pocitos, Montevideo, el sábado 6 de marzo de 2027, que figura en el calendario de aguas abiertas de la Federación Uruguaya de Natación como pendiente de confirmación. La hora de largada, la distancia, el club organizador y la inscripción todavía no están publicados.
  en: An open-water swim in the bay of Pocitos, Montevideo, on Saturday 6 March 2027, listed on the Uruguayan Swimming Federation's open-water calendar as pending confirmation. The start time, distance, host club and registration are not published yet.
