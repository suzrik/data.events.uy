description:
  es: Carrera de mountain bike en la Sierra de Mahoma, San José, el domingo 3 de octubre de 2027, según el calendario de eventos MTB 2027 que publicó La Sierra Eventos Deportivos el 10 de setiembre de 2026. Las distancias, la hora y la inscripción todavía no están publicadas; en 2026 hubo una competitiva de 50 km y una promocional de 25 km.
  en: Mountain bike race in the Sierra de Mahoma, San José, on Sunday 3 October 2027, according to the 2027 MTB events calendar that La Sierra Eventos Deportivos published on 10 September 2026. Distances, start time and registration are not published yet; in 2026 there was a 50 km competitive course and a 25 km promotional one.
