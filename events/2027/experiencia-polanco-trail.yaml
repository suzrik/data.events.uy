description:
  es: Trail por monte nativo en las asperezas de Polanco, Lavalleja, que se presenta como el trail más campero del Uruguay. Hay una distancia competitiva de 14 km y una participativa de 7 km. La edición 2027 todavía no fue anunciada; la 6.ª se corrió el domingo 17 de mayo de 2026.
  en: Trail race through native woodland in the rugged hills of Polanco, Lavalleja, billed as the most countryside trail in Uruguay. It has a competitive 14 km distance and a participatory 7 km one. The 2027 edition has not been announced yet; the 6th one was held on Sunday 17 May 2026.
