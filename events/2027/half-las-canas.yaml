description:
  es: Triatlón media distancia «Half Las Cañas», el domingo 25 de abril de 2027 en el balneario Las Cañas, Fray Bentos, Río Negro, según el portal de los organizadores de Colonia, con 1,9 km de natación, 90 km de ciclismo y 21 km de carrera. La hora y la inscripción todavía no están publicadas.
  en: «Half Las Cañas» middle-distance triathlon, on Sunday 25 April 2027 at the Las Cañas beach resort, Fray Bentos, Río Negro, according to the Colonia organizers' portal, with 1.9 km swim, 90 km bike and 21 km run. Start time and registration are not published yet.
