description:
  es: Carrera de ruta de dos días en Treinta y Tres, organizada por el Club Ciclista y Social Barrio Artigas, en el calendario de la Federación Ciclista Uruguaya. Corren las categorías élite, sub-23 y junior de hombres y mujeres. El programa de 2027 todavía no está publicado; en 2026 tuvo una etapa en circuito y otra en ruta de 170 km. Para el público es una carrera para ir a ver.
  en: Two-day road race in Treinta y Tres, organized by Club Ciclista y Social Barrio Artigas, on the calendar of the Uruguayan Cycling Federation. The men's and women's elite, under-23 and junior categories race. The 2027 programme is not published yet; in 2026 it had a circuit stage and a 170 km road stage. For the public it is one to go and watch.
