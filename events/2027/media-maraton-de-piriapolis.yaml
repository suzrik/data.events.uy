description:
  es: Media maratón en Piriápolis con distancias de 5, 10 y 21 km, organizada por RS Eventos Deportivos. La edición 2027 todavía no fue anunciada; la de 2026 se corrió el domingo 12 de abril, con largada a las 9:00 en Plaza Armenia y todas las distancias partiendo juntas.
  en: Half marathon in Piriápolis over 5, 10 and 21 km, organized by RS Eventos Deportivos. The 2027 edition has not been announced yet; the 2026 one was run on Sunday 12 April, starting at 9:00 at Plaza Armenia with all distances setting off together.
