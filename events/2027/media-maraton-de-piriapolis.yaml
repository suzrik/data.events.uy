description:
  es: Media maratón en Piriápolis con distancias de 5K, 10K y 21K, organizada por RS Eventos Deportivos, que anuncia la próxima edición para el 11 de abril de 2027. La de 2026 se corrió el domingo 12 de abril, con largada a las 9:00 en Plaza Armenia y todas las distancias partiendo juntas.
  en: Half marathon in Piriápolis over 5K, 10K and 21K, organized by RS Eventos Deportivos, which announces the next edition for 11 April 2027. The 2026 one was run on Sunday 12 April, starting at 9:00 at Plaza Armenia with all distances setting off together.
