description:
  es: Segunda edición del Kasike Trail, carrera de trail por el monte en Paysandú, el domingo 11 de julio de 2027, en el mismo escenario que la primera. Hay 7 km y 15 km, con obstáculos naturales del monte. La hora de largada, el lugar exacto y la inscripción todavía no están publicados.
  en: Second edition of the Kasike Trail, a trail race through the woods in Paysandú, on Sunday 11 July 2027, on the same ground as the first. There are 7 km and 15 km courses, with the natural obstacles of the woods. The start time, exact place and registration are not published yet.
