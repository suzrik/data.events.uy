description:
  es: Brevets de 200, 300 y 400 km de Randonneurs Uruguay en Montevideo, el sábado 6 de marzo. Son salidas de larga distancia no competitivas, homologables por el Audax Club Parisien. Por ahora el calendario de la organización solo indica la fecha y las distancias; faltan el punto de partida, los horarios y la apertura de inscripciones.
  en: 200, 300 and 400 km brevets by Randonneurs Uruguay in Montevideo, on Saturday 6 March. These are non-competitive long-distance rides, eligible for homologation by the Audax Club Parisien. So far the organizer's calendar only gives the date and the distances; the start point, the times and the opening of registration are still to come.
