name: La Carrera del Laberinto
date: 2027-05
status: tentative
sport: run
city: Trinidad
venue: Establecimiento La Crinera
links:
  site: https://lacrinerauy.com/
  instagram: https://www.instagram.com/la_crinera_laberinto_uruguay
description:
  es: Carrera dentro del laberinto de maíz ancestral La Crinera, a 4 km de Trinidad. Hay que encontrar 9 centros con sellos y luego la salida; el recorrido óptimo es de 5 km. Se corre en modalidad individual o en dupla. La edición 2027 todavía no fue anunciada; la última se corrió un 17 de mayo, con largada a las 10:00.
  en: Race inside the La Crinera ancestral maize maze, 4 km from Trinidad. Runners must find 9 stamped centres and then the exit; the optimal route is 5 km. It is run solo or in pairs. The 2027 edition has not been announced yet; the latest one was held on 17 May, starting at 10:00.
