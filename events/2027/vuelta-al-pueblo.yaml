description:
  es: Carrera de ruta de un día en Mercedes, Soriano, organizada por el Club Ciclista Atenas; es fecha del Campeonato Uruguayo de la Federación Ciclista Uruguaya. Corren las categorías élite, sub-23 y junior de hombres y mujeres. La edición de 2026 fue la 89.ª. El recorrido, las distancias y la hora de largada todavía no están publicados. Para el público es una carrera para ir a ver.
  en: One-day road race in Mercedes, Soriano, organized by Club Ciclista Atenas; it is a round of the Campeonato Uruguayo of the Uruguayan Cycling Federation. The men's and women's elite, under-23 and junior categories race. The 2026 edition was the 89th. The route, distances and start time are not published yet. For the public it is one to go and watch.
