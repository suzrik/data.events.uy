name: IRONMAN 70.3 Punta del Este
date: 2027-03-07
sport: tri
city: Punta del Este
venue: OVO Beach, frente al hotel Enjoy Punta del Este
distances: [Half]
links:
  site: https://www.ironman.com/races/im703-punta-del-este
  instagram: https://www.instagram.com/ironmantri
  facebook: https://www.facebook.com/IRONMANtri/
  register: https://www.ironman.com/races/im703-punta-del-este/register
description:
  es: Triatlón de media distancia del circuito IRONMAN 70.3, con 1,9 km de natación en la bahía de Maldonado, 90 km de ciclismo en dos vueltas hasta Punta Ballena y 21,1 km de carrera hacia la península. Según el programa provisorio, la largada es el domingo 7 de marzo a las 7:00 en OVO Beach y el registro de atletas, obligatorio, el 5 y 6 de marzo en el hotel Enjoy. Se corre individual o en postas de dos o tres personas. La inscripción está abierta. Otorga cupos al Mundial IRONMAN 70.3.
  en: Half-distance triathlon of the IRONMAN 70.3 series, with a 1.9 km swim in Maldonado Bay, a 90 km two-lap bike course out to Punta Ballena and a 21.1 km run towards the peninsula. According to the provisional schedule, the start is on Sunday 7 March at 7:00 at OVO Beach, and mandatory athlete check-in is on 5 and 6 March at the Enjoy hotel. You can race solo or in relay teams of two or three. Registration is open. It awards slots for the IRONMAN 70.3 World Championship.
