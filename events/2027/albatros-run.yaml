description:
  es: Carrera del Club Deportivo Albatros por los 5 años de Albatros Fitness, con distancias de 5K y 10K en el Circuito del Prado. La edición 2026 estaba anunciada para el sábado 3 de octubre a las 10:00. El club no anunció una próxima edición; el mes es una estimación a partir de la anterior.
  en: Race by Club Deportivo Albatros to celebrate 5 years of Albatros Fitness, with 5K and 10K distances on the Prado circuit. The 2026 edition was announced for Saturday 3 October at 10:00. The club has not announced a next edition; the month is an estimate based on the previous one.
