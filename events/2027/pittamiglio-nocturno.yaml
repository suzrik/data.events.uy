description:
  es: Trail nocturno de Mil Horizontes en Las Flores (Maldonado), el sábado 23 de enero. El afiche del organizador del 25 de noviembre anuncia 6K y 13K con inscripciones abiertas; horario y lugar de largada todavía no se publicaron. La edición 2026 fue el 24 de enero en el Balneario Las Flores, con 7 y 13 km y largada a las 20:00.
  en: Night trail race by Mil Horizontes in Las Flores (Maldonado), on Saturday 23 January. The organizer's poster of 25 November announces 6K and 13K with registration open; start time and start point are not published yet. The 2026 edition was on 24 January at Balneario Las Flores, with 7 and 13 km and a start at 20:00.
