name: Pittamiglio Nocturno
date: 2027-01-23
sport: trail
city: Las Flores
organizer: Mil Horizontes
links:
  instagram: https://www.instagram.com/grupo_mil_horizontes/
description:
  es: Trail nocturno de Mil Horizontes en Las Flores (Maldonado), el sábado 23 de enero. La fecha sale del calendario de trail 2027 que publicó el organizador; distancias, horario e inscripción todavía no se anunciaron. La edición 2026 fue el 24 de enero en el Balneario Las Flores, con 7 y 13 km y largada a las 20:00.
  en: Night trail race by Mil Horizontes in Las Flores (Maldonado), on Saturday 23 January. The date comes from the organizer's 2027 trail calendar; distances, start time and registration have not been announced yet. The 2026 edition was on 24 January at Balneario Las Flores, with 7 and 13 km and a start at 20:00.
