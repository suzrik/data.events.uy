description:
  es: Última fecha del calendario del Campeonato Nacional de Triatlón 2026-2027 de la Unión de Triatlón del Uruguay, el domingo 21 de marzo en la rambla de Fray Bentos, Río Negro. Según el calendario de la Unión tiene modalidades Sprint, Promocional y Olímpico. Los no federados pueden correr con un permiso por el día, pero solo los federados suman puntos para el ranking. La página indica un horario de 10:00 a 20:00; para horas de largada y distancias la Unión remite a sus redes sociales.
  en: Last date on the calendar of the 2026-2027 Campeonato Nacional de Triatlón of the Unión de Triatlón del Uruguay, on Sunday 21 March on the Fray Bentos riverfront, Río Negro. According to the union's calendar it has Sprint, Promocional and Olympic formats. Non-federated athletes may race on a one-day permit, but only federated ones score ranking points. The page gives a time window of 10:00 to 20:00; for start times and distances the union refers to its social media.
