name: Gran Fondo Punta del Este
date: 2027-01-10
sport: bike
city: Manantiales
venue: Museo de Arte Contemporáneo Atchugarry (MACA), Ruta 104 km 4,5
distances: [115 km, 62 km]
links:
  site: https://granfondoargentina.com/pde/
  instagram: https://www.instagram.com/granfondoargentina/
  facebook: https://www.facebook.com/profile.php?id=100087528425570
  register: https://go.granfondoargentina.com/
description:
  es: Primera edición del gran fondo de ruta de Gran Fondo Argentina en Punta del Este, el domingo 10 de enero. Largada a las 7:00 y llegada en el museo MACA, sobre la Ruta 104 en Manantiales. Hay 115 km (desde 17 años) y 62 km (desde 16), con chip, puestos de asistencia y controles de paso con tiempo límite. El recorrido usa las rutas 104, 9 y 10; el largo cruza el puente de la Laguna Garzón y pasa por José Ignacio. La acreditación es el viernes 8 y el sábado 9, de 9 a 19 h, en el MACA.
  en: First edition of the road gran fondo run by Gran Fondo Argentina in Punta del Este, on Sunday 10 January. It starts at 7:00 and finishes at the MACA museum, on Route 104 in Manantiales. There are 115 km (age 17 and over) and 62 km (16 and over), with chip timing, aid stations and checkpoints with cut-off times. The course uses Routes 104, 9 and 10; the long one crosses the Laguna Garzón bridge and passes José Ignacio. Rider check-in is on Friday 8 and Saturday 9, 9:00 to 19:00, at MACA.
