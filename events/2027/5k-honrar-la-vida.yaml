description:
  es: Carrera de 5K de la Fundación Honrar la Vida, que acompaña a mujeres con cáncer en el Hospital de la Mujer del Pereira Rossell, en las Canteras del Parque Rodó. La edición 2027 todavía no fue anunciada; según el calendario de la Intendencia de Montevideo, la de 2026 fue el sábado 19 de setiembre.
  en: 5K race of the Honrar la Vida Foundation, which supports women with cancer at the Women's Hospital of Pereira Rossell, at the Canteras del Parque Rodó. The 2027 edition has not been announced yet; according to the Montevideo city calendar, the 2026 one was on Saturday 19 September.
