description:
  es: Etapa Otoño del Circuito de las 4 Estaciones 2027, serie de carreras de calle de 7K de La Sierra Eventos Deportivos, el sábado 20 de marzo de 2027. El calendario que publicó el organizador el 10 de setiembre de 2026 dice solo «San José», sin el lugar exacto; la hora y la inscripción todavía no se publicaron.
  en: The autumn stage (Otoño) of the 2027 Circuito de las 4 Estaciones, a 7K street race series by La Sierra Eventos Deportivos, on Saturday 20 March 2027. The calendar the organizer published on 10 September 2026 says only «San José», with no exact venue; start time and registration are not published yet.
