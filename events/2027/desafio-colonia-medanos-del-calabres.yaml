description:
  es: Carrera de trail running organizada por Solo Carreras, parte de su ciclo Colonia Run. Largada en el casco histórico de Colonia del Sacramento, con recorrido por parques, senderos, médanos y playa hasta el complejo +Colonia. La edición 2027 todavía no fue anunciada; la página del organizador ubicaba la de 2026 en junio. El mes es una estimación.
  en: Trail running race organized by Solo Carreras as part of its Colonia Run series. It starts in the historic quarter of Colonia del Sacramento and runs through parks, trails, dunes and beach to the +Colonia complex. The 2027 edition has not been announced yet; the organizer's page placed the 2026 one in June. The month is an estimate.
