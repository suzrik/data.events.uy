description:
  es: Trail de la Sierra de las Cañas, en Maldonado, organizado por Toros Eventos Deportivos. La edición 2027 es el 3 de octubre, según el calendario oficial del organizador; la hora y la inscripción no están publicadas. La 14ª edición se corrió el domingo 4 de octubre de 2026, con distancias de 8K, 16K y 25K.
  en: Trail race in the Sierra de las Cañas, Maldonado, run by Toros Eventos Deportivos. The 2027 edition is on 3 October, according to the organizer's official calendar; time and registration are not published. The 14th edition was held on Sunday 4 October 2026, with 8K, 16K and 25K distances.
