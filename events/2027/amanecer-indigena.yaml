name: Amanecer Indígena
date: 2027-03-14
sport: trail
city: Gregorio Aznárez
organizer: Mil Horizontes
links:
  instagram: https://www.instagram.com/grupo_mil_horizontes/
description:
  es: Carrera de trail de Mil Horizontes, el domingo 14 de marzo de 2027, según el calendario de trail 2027 que publicó el organizador. El lugar, las distancias, la hora y la inscripción de esta edición todavía no se anunciaron. La edición de 2025 fue el 16 de marzo en el cerro El Betete, con 24, 16 y 9 km; los 24 y 16 km largaron a las 5:30 y los 9 km a las 6:00.
  en: Trail race by Mil Horizontes on Sunday 14 March 2027, according to the 2027 trail calendar published by the organizer. The venue, distances, start time and registration for this edition have not been announced yet. The 2025 edition was on 16 March at cerro El Betete, over 24, 16 and 9 km; the 24 and 16 km started at 5:30 and the 9 km at 6:00.
