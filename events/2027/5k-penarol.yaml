description:
  es: Carrera de 5K del Club Atlético Peñarol en el Estadio Campeón del Siglo. La edición 2027 todavía no fue anunciada; según las noticias de la Agrupación de Atletas del Uruguay, la de 2026 se corrió el 27 de setiembre.
  en: 5K race of Club Atlético Peñarol at the Campeón del Siglo stadium. The 2027 edition has not been announced yet; according to the news of the Agrupación de Atletas del Uruguay, the 2026 one was held on 27 September.
