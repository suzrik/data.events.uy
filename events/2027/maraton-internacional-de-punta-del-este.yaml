description:
  es: Maratón con medio maratón, 10K y 5K en Punta del Este. La edición 2026 se corrió el 6 de setiembre, con largada en la rambla Artigas y calle 31. La edición 2027 todavía no está anunciada en la página de la organización; el mes es una estimación a partir de la edición anterior.
  en: Marathon with half marathon, 10K and 5K races in Punta del Este. The 2026 edition was run on 6 September, starting at Rambla Artigas and Calle 31. The 2027 edition is not yet announced on the organizer's page; the month is an estimate based on the previous edition.
