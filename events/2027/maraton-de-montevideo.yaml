description:
  es: Maratón internacional de calle organizada por la Intendencia de Montevideo, el domingo 18 de abril de 2027 a las 7:00, con 42K, 21K y 10K y largada y llegada en la Av. 18 de Julio, frente a la explanada de la Intendencia. Para corredores nacionales cuesta $1100 el 10K, $1500 el 21K y $1800 el 42K. La inscripción es en Tickantel; las personas con discapacidad se inscriben gratis. Se pide certificado de aptitud física. La 11.ª edición se corrió el 10 de mayo de 2026.
  en: International road marathon organized by the Intendencia de Montevideo, on Sunday 18 April 2027 at 7:00, with 42K, 21K and 10K courses starting and finishing on Av. 18 de Julio, in front of the Intendencia esplanade. For Uruguayan runners it costs $1,100 for the 10K, $1,500 for the 21K and $1,800 for the 42K. Registration is on Tickantel; people with disabilities register free. A physical fitness certificate is required. The 11th edition was held on 10 May 2026.
