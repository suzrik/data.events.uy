name: Maratón de Montevideo
date: 2027-05
status: tentative
sport: run
city: Montevideo
venue: Av. 18 de Julio, frente a la explanada de la Intendencia de Montevideo
distances: [42K, 21K, 10K]
links:
  site: https://maratonmontevideo.uy/
description:
  es: Maratón internacional de calle organizada por la Intendencia de Montevideo, con distancias de 42K, 21K y 10K. La edición 2027 todavía no fue anunciada; la 11.ª se corrió el domingo 10 de mayo de 2026, con largada y llegada en la Av. 18 de Julio. Se pide certificado de aptitud física.
  en: International road marathon organized by the Intendencia de Montevideo, with 42K, 21K and 10K distances. The 2027 edition has not been announced yet; the 11th one was held on Sunday 10 May 2026, starting and finishing on Av. 18 de Julio. A physical fitness certificate is required.
