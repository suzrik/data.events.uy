description:
  es: Trail de Toros Eventos Deportivos en la Sierra de los Caracoles, cerca de San Carlos (Maldonado), el 11 de abril de 2027, según su calendario oficial 2027. Según el organizador, el recorrido pasa por sierras, empedrados y molinos, con unos 1.050 metros de desnivel positivo en la distancia principal; en 2026 fue la 5.ª edición. Distancias, hora e inscripción de 2027 sin publicar.
  en: Trail race by Toros Eventos Deportivos in the Sierra de los Caracoles, near San Carlos (Maldonado), on 11 April 2027, according to its official 2027 calendar. According to the organizer, the course crosses hills, cobbled tracks and wind turbines, with about 1,050 metres of climbing on the main distance; 2026 was the 5th edition. Distances, time and registration for 2027 are not published.
