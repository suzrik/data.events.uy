name: Cruce de la Bahía
date: 2027-02-28
time: "10:00"
sport: swim
city: Colonia del Sacramento
venue: Playa Real de San Carlos (La Boya)
distances: [3600 m]
organizer: Cruce de la Bahía Colonia
links:
  site: https://lolograste.uy/cruce-de-la-bahia
  register: https://lolograste.uy/cruce-de-la-bahia
description:
  es: Travesía a nado de 3600 m por la bahía de Colonia del Sacramento, el domingo 28 de febrero de 2027, con largada a las 10:00 desde la playa Real de San Carlos (La Boya). Los kits se entregan de 7:30 a 9:00 en la playa del Rowing y la premiación, con almuerzo, es a las 12:00. Cuesta US$ 30 hasta el 31 de diciembre y US$ 35 desde el 1 de enero. Se exige boya y carné de salud vigente; quien nade con traje de neopreno o aletas queda fuera de las categorías.
  en: A 3,600 m open-water swim across the bay of Colonia del Sacramento, on Sunday 28 February 2027, starting at 10:00 from Real de San Carlos beach (La Boya). Kits are handed out from 7:30 to 9:00 at the Rowing beach and the prize-giving, with lunch, is at 12:00. It costs US$30 until 31 December and US$35 from 1 January. A buoy and a valid health card are required; swimmers in a wetsuit or fins race outside the categories.
