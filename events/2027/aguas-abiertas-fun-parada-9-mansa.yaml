description:
  es: Fecha del calendario de aguas abiertas de la Federación Uruguaya de Natación, en la parada 9 de la Playa Mansa, Punta del Este, el sábado 16 de enero de 2027. El calendario de la federación la muestra como pendiente de confirmación; la hora de largada, las distancias y la inscripción todavía no están publicadas.
  en: A date on the Uruguayan Swimming Federation's open-water calendar, at stop 9 of Playa Mansa, Punta del Este, on Saturday 16 January 2027. The federation's calendar lists it as pending confirmation; the start time, distances and registration are not published yet.
