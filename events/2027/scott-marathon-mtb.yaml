description:
  es: Décima edición de la carrera de mountain bike por etapas de eSport en las sierras de Minas, Lavalleja, con base en el Parque de Minas. La Marathon (Scott 3 Días) suma 186 km en tres etapas, del viernes 12 al domingo 14 de marzo, y se define por tiempo acumulado. El mismo fin de semana hay Gravel de 110 km en dos días, viernes 12 y sábado 13, entre Minas y Villa Serrana y Short de 60 km y Short Mini de 33 km el domingo 14. Todas las inscripciones están abiertas y piden apto médico vigente.
  en: Tenth edition of eSport's mountain bike stage race in the hills of Minas, Lavalleja, based at Parque de Minas. The Marathon (Scott 3 Días) totals 186 km over three stages, from Friday 12 to Sunday 14 March, decided on cumulative time. The same weekend has a two-day 110 km Gravel race on Friday 12 and Saturday 13, between Minas and Villa Serrana and the 60 km Short and 33 km Short Mini on Sunday 14. Registration is open for every race and requires a valid medical certificate.
