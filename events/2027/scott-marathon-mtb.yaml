description:
  es: Décima edición de la carrera de mountain bike por etapas de eSport en las sierras de Minas, Lavalleja, con base en el Parque de Minas – Hotel Vacacional. La Marathon (Scott 3 Días) suma 186 km en tres etapas, del viernes 12 al domingo 14 de marzo, y se define por tiempo acumulado. El mismo fin de semana hay Gravel de 110 km el sábado 13 y Short de 60 km y Short Mini de 33 km el domingo 14. La inscripción a la Marathon está abierta y exige apto médico; las de Short y Gravel aún no abrieron.
  en: Tenth edition of eSport's mountain bike stage race in the hills of Minas, Lavalleja, based at Parque de Minas – Hotel Vacacional. The Marathon (Scott 3 Días) totals 186 km over three stages, from Friday 12 to Sunday 14 March, decided on cumulative time. The same weekend has a 110 km Gravel race on Saturday 13 and the 60 km Short and 33 km Short Mini on Sunday 14. Registration for the Marathon is open and requires a valid medical certificate; Short and Gravel registration has not opened yet.
