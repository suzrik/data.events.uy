description:
  es: Sexta edición de esta carrera de verano en San Gregorio de Polanco, Tacuarembó, el sábado 23 de enero de 2027, con largada a las 18:00 y llegada en el Parador Municipal. Hay 5K y 10K, con cupo de 300 corredores. Hasta el 10 de enero cuesta $850 sin remera o $1250 con remera; hasta el 20 de enero, cuando cierra la inscripción, $1000. En 2027 se suma una categoría para niños, con detalles a confirmar. Inscripción en Encarrera.
  en: Sixth edition of this summer race in San Gregorio de Polanco, Tacuarembó, on Saturday 23 January 2027, starting at 18:00 and finishing at the Parador Municipal. There are 5K and 10K courses, capped at 300 runners. Until 10 January it costs $850 without a shirt or $1,250 with one; until 20 January, when registration closes, $1,000. A children's category is added in 2027, details to be confirmed. Registration on Encarrera.
