name: Trail Run Punta Ballena
date: 2027-01-17
sport: trail
city: Punta Ballena
distances: [18K, 10K]
links:
  site: https://adventurerace.com.uy/
  instagram: https://www.instagram.com/sucasports/
description:
  es: Trail de Suca Sports en Punta Ballena, con 18K y 10K. El calendario de Suca Sports lo fija para el domingo 17 de enero de 2027. La inscripción todavía no está abierta y el sitio de la carrera sigue mostrando la edición pasada (18 de enero de 2026, según los resultados de Suca Sports), que largó en la playa Solanas y pasó por el mirador de Punta Ballena y Las Grutas; los 18K entraron además al Arboretum Lussich, con 403 m de desnivel acumulado. La hora y el recorrido de 2027 no están publicados.
  en: Trail race by Suca Sports in Punta Ballena, with 18K and 10K. The Suca Sports calendar sets it for Sunday 17 January 2027. Registration is not open yet and the race site still shows the last edition (18 January 2026, per the Suca Sports results), which started at Solanas beach and went past the Punta Ballena lookout and Las Grutas; the 18K also went into the Arboretum Lussich, with 403 m of total climbing. The start time and course for 2027 are not published.
