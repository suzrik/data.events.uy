name: Trail Run Punta Ballena
date: 2027-01-24
sport: trail
city: Punta Ballena
distances: [18K, 10K]
organizer: Suca Sports
links:
  site: https://www.sucaweb.com/calendario
  instagram: https://www.instagram.com/sucasports/
description:
  es: Trail de Suca Sports en Punta Ballena, con 18K y 10K. El calendario de Suca Sports lo fija para el domingo 24 de enero de 2027; antes lo ubicaba en enero sin día. El sitio propio de la carrera está en construcción y la inscripción no está abierta. La edición pasada (18 de enero de 2026) largó en la playa Solanas y pasó por el mirador de Punta Ballena y Las Grutas; los 18K entraron además al Arboretum Lussich. La hora y el recorrido de 2027 no están publicados.
  en: Trail race by Suca Sports in Punta Ballena, with 18K and 10K. The Suca Sports calendar sets it for Sunday 24 January 2027; it previously placed it in January with no day. The race's own site is under construction and registration is not open yet. The last edition (18 January 2026) started at Solanas beach and went past the Punta Ballena lookout and Las Grutas; the 18K also went into the Arboretum Lussich. The start time and course for 2027 are not published.
