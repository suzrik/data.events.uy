description:
  es: 19.ª edición de este trail en Punta Ballena, el domingo 24 de enero de 2027 a las 9:00, con largada y llegada en Playa Solanas. El 18K Endurance pasa por el cerro Punta Ballena, el mirador, Las Grutas y el Arboretum Lussich hasta el mirador El Patriarca; el 10K Short hace la arena, los senderos y la subida al cerro. La inscripción cuesta $1.900 hasta el 15 de diciembre, $2.300 hasta el 10 de enero y $2.700 después.
  en: 19th edition of this trail race in Punta Ballena, on Sunday 24 January 2027 at 9:00, starting and finishing at Playa Solanas. The 18K Endurance takes in Cerro Punta Ballena, the lookout, Las Grutas and the Arboretum Lussich up to the El Patriarca lookout; the 10K Short covers the sand, the trails and the climb up the hill. Entry costs $1,900 until 15 December, $2,300 until 10 January and $2,700 after that.
