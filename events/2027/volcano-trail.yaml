description:
  es: Carrera de trail de Mil Horizontes, el domingo 25 de julio de 2027, según el calendario de trail 2027 que publicó el organizador. El lugar de esta edición todavía no se anunció; la de 2026 fue el 26 de julio en Cerros Azules (Maldonado), con 9, 18 y 30 km. Distancias, hora e inscripción de 2027, por confirmar.
  en: Trail race by Mil Horizontes on Sunday 25 July 2027, according to the 2027 trail calendar published by the organizer. The venue of this edition has not been announced yet; the 2026 one was on 26 July in Cerros Azules (Maldonado), over 9, 18 and 30 km. Distances, start time and registration for 2027 are still to be confirmed.
