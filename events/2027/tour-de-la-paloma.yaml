name: Tour de La Paloma
date: 2027-04-03
end_date: 2027-04-04
sport: road
city: La Paloma
entry: license
links:
  site: https://federacionciclista.com.uy/ruta/B7LXSBTLVZ/
description:
  es: Carrera de ruta de dos días en La Paloma, Rocha, el sábado 3 y el domingo 4 de abril, para las categorías Máster A a E de hombres y Promocional, con licencia de la federación; figura en el calendario regional de la Federación Ciclista Uruguaya. La federación la anuncia como 7.ª edición, sin indicar organizador; a la de 2026 la llamó «12.º Tour de La Paloma» y la organizó la Asociación Ciclistas Veteranos de Rocha. Las etapas, las distancias y la inscripción de 2027 todavía no están publicadas.
  en: Two-day road race in La Paloma, Rocha, on Saturday 3 and Sunday 4 April, for the men's Master A to E and Promocional categories, with a federation licence; it is on the regional calendar of the Uruguayan Cycling Federation. The federation lists it as the 7th edition, without naming an organizer; it called the 2026 one the «12.º Tour de La Paloma», organized by the Asociación Ciclistas Veteranos de Rocha. The 2027 stages, distances and registration are not published yet.
