name: GFNY José Ignacio
date: 2028-01-04
sport: road
city: Pueblo Garzón
distances: [130 km, 77 km]
links:
  site: https://joseignacio.gfny.com/
  instagram: https://www.instagram.com/gfnyuruguay/
  facebook: https://www.facebook.com/GFNYUruguay/
  register: https://joseignacio.gfny.com/register/?lang=en
description:
  es: Primera edición de esta carrera de la serie GFNY, con largada y llegada en Pueblo Garzón. El sitio y la inscripción de GFNY la ubican el 4 de enero de 2028, un martes; el Instagram de GFNY Uruguay todavía dice 3 de enero de 2027. Distancia larga competitiva de 130 km (954 m de ascenso), con 34 km junto al océano por la ruta 10, y media recreativa de 77 km (622 m).
  en: First edition of this GFNY series race, starting and finishing in Pueblo Garzón. The GFNY site and registration place it on 4 January 2028, a Tuesday; the GFNY Uruguay Instagram still says 3 January 2027. A competitive 130 km long course (954 m of climbing) with 34 km along the ocean on Route 10, and a recreational 77 km medium course (622 m).
