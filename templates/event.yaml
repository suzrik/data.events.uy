# Plantilla de evento / Event template
# Guía / Guide: docs/add-event.es.md · docs/add-event.en.md
#
# Nombre del archivo / File name: events/<año>/<nombre-del-evento>.yaml
# Solo minúsculas, números y guiones / Lowercase letters, digits and hyphens only.
#
# Si un texto contiene ": " o " #", o empieza con "@", escribilo entre comillas dobles: name: "Vuelta Ciclista: Etapa 1"
# If a text contains ": " or " #", or starts with "@", put it in double quotes: name: "Vuelta Ciclista: Etapa 1"
# Borrá las líneas opcionales que no uses. / Delete the optional lines you do not use.

# Nombre del evento / Event name
name: Corrida Rambla 10K

# Fecha: año-mes-día. Si el día todavía no se anunció, solo año-mes: 2026-10
# Date: year-month-day. If the day is not announced yet, year-month only: 2026-10
date: 2026-10-11

# end_date, status y entry son opcionales. Para usar una de esas líneas, borrá el "#" que tiene adelante; si no la usás, dejala o borrala.
# end_date, status and entry are optional. To use one of those lines, delete the "#" in front of it; if you do not use it, leave it or delete it.

# Último día de un evento de varios días / Last day of a multi-day event
#end_date: 2026-10-12

# Fecha todavía sin confirmar por el organizador / Date not confirmed by the organizer yet
#status: tentative

# Quién puede participar / Who can take part: open | license | elite
#   open: cualquiera que se inscriba (por defecto) / anyone who registers (default)
#   license: aficionados que cumplan un requisito (licencia, ser socio de un club) / amateurs who meet a condition (a license, club membership)
#   elite: solo deportistas federados o profesionales; el público va a mirar / federated or professional athletes only; the public comes to watch
#entry: open

# Deporte / Sport: bike | run | roll | trail | tri (triatlón y duatlón / triathlon and duathlon)
sport: run

# Ciudad, igual que en cities.yaml / City, exactly as in cities.yaml
city: Montevideo

# Lugar de largada (opcional) / Start venue (optional)
venue: Rambla de Pocitos

# Distancias (opcional, hasta 6) / Distances (optional, up to 6)
distances: [10K, 5K]

# Enlaces oficiales del organizador, con https://. Al menos uno de site, instagram o facebook.
# Official organizer links, with https://. At least one of site, instagram or facebook.
links:
  site: https://example.org
  instagram: https://instagram.com/example
  facebook: https://facebook.com/example
  # Inscripción (opcional) / Registration (optional)
  register: https://example.org/inscripcion

# Descripción breve. Obligatorio es o en; el otro es opcional.
# Short description. Either es or en is required; the other is optional.
description:
  es: Recorrido plano por la Rambla de Pocitos a Punta Carretas.
  en: Flat course along the Pocitos waterfront to Punta Carretas.
